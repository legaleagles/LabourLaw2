<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scam-Ed Moderation | LawSticker AI</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--navy:#0D1117;--gold:#C9A227;--gold-l:#F5D76E;--cream:#FEFCF5;--ink:#111827;--border:#E5E7EB;--muted:#6B7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);padding:16px;}
h1{font-size:18px;margin-bottom:14px;}
#loginBox{max-width:340px;margin:60px auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;}
#loginBox input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;font-size:14px;}
#loginBox button{width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.card-cat{display:inline-block;background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:8px;}
.card-title{font-weight:800;margin-bottom:6px;}
.card-story{font-size:13px;color:#374151;line-height:1.5;margin-bottom:10px;}
.card-label{font-size:10.5px;font-weight:700;color:#6B7280;margin-bottom:3px;text-transform:uppercase;}
.card-original{background:#FEF2F2;padding:8px;border-radius:6px;border:1px solid #FECACA;}
.card-actions{display:flex;gap:8px;}
.card-actions button{flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;}
.btn-approve{background:#059669;color:#fff;}
.btn-reject{background:#DC2626;color:#fff;}
.btn-takedown{background:#B45309;color:#fff;}
.btn-restore{background:#1D4ED8;color:#fff;}
#status{font-size:12px;color:var(--muted);margin-bottom:14px;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;}
.tab-row{display:flex;gap:8px;margin-bottom:14px;}
.tab-btn{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:9px;
font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);}
.tab-btn.active{background:var(--navy);color:var(--gold-l);border-color:var(--navy);}
.card-archived-note{font-size:11px;color:#B45309;margin-bottom:8px;}
</style>
</head>
<body>

<div id="loginBox">
  <h1>🛡️ Scam-Ed Moderation</h1>
  <input type="password" id="pwInput" placeholder="Moderator password" onkeydown="if(event.key==='Enter')login();">
  <button onclick="login()">Enter</button>
  <div id="loginError" style="color:#DC2626;font-size:12px;margin-top:8px;"></div>
</div>

<div id="modPanel" style="display:none;max-width:640px;margin:0 auto;">
  <h1>🛡️ Scam-Ed Moderation <a href="#" onclick="logout();return false;" style="font-size:11px;font-weight:400;float:right;color:var(--muted);">Log out</a></h1>
  <div class="tab-row">
    <button class="tab-btn active" id="tabPending" onclick="switchTab('pending')">Pending</button>
    <button class="tab-btn" id="tabPublished" onclick="switchTab('published')">Published</button>
    <button class="tab-btn" id="tabArchived" onclick="switchTab('archived')">Archived</button>
  </div>
  <div id="status">Loading...</div>
  <div id="list"></div>
</div>

<script>
var savedPassword = localStorage.getItem('scamedModPw') || '';
var currentTab = 'pending';

function logout(){
  localStorage.removeItem('scamedModPw');
  location.reload();
}

function login(){
  var pw = document.getElementById('pwInput').value;
  savedPassword = pw;
  fetchTab();
}

var TAB_ACTIONS = {pending: 'list', published: 'list_published', archived: 'list_archived'};

// Auto-login on page load if this browser session already has a working
// password saved — avoids re-typing it on every refresh, which is the
// whole point of a moderation workflow you'll come back to repeatedly.
if (savedPassword) {
  fetchTab();
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  fetchTab();
}

var requestInFlight = false; // prevents two overlapping calls from stepping on each other's results

function dlog(msg){
  try { console.log('[Scam-Ed Mod]', msg); } catch(e) {}
}

function fetchTab(){
  try {
    if (requestInFlight) { dlog('already in flight, skipped'); return; }
    requestInFlight = true;
    document.getElementById('loginError').textContent = 'Connecting...';
    dlog('starting request, action=' + TAB_ACTIONS[currentTab]);

    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ dlog('8s timeout fired, aborting'); controller.abort(); }, 8000);

    dlog('calling fetch() now');
    fetch('https://lawsticker-backend-494996217030.europe-west1.run.app/api/scam-moderate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      signal: controller.signal,
      body: JSON.stringify({password: savedPassword, action: TAB_ACTIONS[currentTab]})
    })
      .then(function(r){
        dlog('got HTTP response, status=' + r.status);
        clearTimeout(timeoutId);
        return r.json().then(function(data){ return {status: r.status, data: data}; });
      })
      .then(function(result){
        dlog('parsed response body ok=' + result.data.ok);
        requestInFlight = false;
        var data = result.data;
        if (!data.ok) {
          if (result.status === 401) {
            localStorage.removeItem('scamedModPw');
            document.getElementById('loginError').textContent = data.error || 'Incorrect password.';
          } else {
            document.getElementById('loginError').innerHTML = (data.error || 'Could not load') +
              ' — <a href="#" onclick="fetchTab();return false;" style="color:var(--navy);font-weight:800;">Tap to retry</a>';
          }
          document.getElementById('loginBox').style.display = 'block';
          document.getElementById('modPanel').style.display = 'none';
          return;
        }
        localStorage.setItem('scamedModPw', savedPassword);
        document.getElementById('loginError').textContent = '';
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('modPanel').style.display = 'block';
        renderList(data.items);
      })
      .catch(function(err){
        dlog('fetch failed/aborted: ' + (err && err.name) + ' — ' + (err && err.message));
        clearTimeout(timeoutId);
        requestInFlight = false;
        var msg = (err && err.name === 'AbortError') ? 'Timed out — the server took too long to respond' : 'Could not reach the server';
        document.getElementById('loginError').innerHTML = msg + ' — ' +
          '<a href="#" onclick="fetchTab();return false;" style="color:var(--navy);font-weight:800;">Tap to retry</a>';
        document.getElementById('loginBox').style.display = 'block';
      });
  } catch (syncErr) {
    // Catches any synchronous error that would otherwise silently stop
    // execution before the fetch even starts, which "Connecting..." never
    // updating could also mean.
    dlog('SYNC ERROR before fetch even started: ' + syncErr.message);
    requestInFlight = false;
    document.getElementById('loginError').textContent = 'Script error: ' + syncErr.message;
  }
}

function renderList(items){
  var status = document.getElementById('status');
  var list = document.getElementById('list');
  var labels = {pending: 'pending report(s)', published: 'published stor(y/ies)', archived: 'archived (taken-down) stor(y/ies)'};
  status.textContent = items.length + ' ' + labels[currentTab];
  if (!items.length) {
    var emptyMsgs = {pending: 'Nothing pending right now.', published: 'Nothing published yet.', archived: 'Nothing archived — anything taken down will appear here.'};
    list.innerHTML = '<div class="empty">' + emptyMsgs[currentTab] + '</div>';
    return;
  }
  list.innerHTML = items.map(renderCard).join('');
}

function renderCard(item){
  if (currentTab === 'pending') {
    return '<div class="card">' +
      '<div class="card-cat">' + escapeHtml(item.category || 'Uncategorized') + '</div>' +
      '<div class="card-title">' + escapeHtml(item.title || '(no title)') + '</div>' +
      '<div class="card-label">📝 Original (private, never public):</div>' +
      '<div class="card-story card-original">' + escapeHtml(item.original_story || '') + '</div>' +
      '<div class="card-label">✅ Anonymized (this is what goes public if approved):</div>' +
      '<div class="card-story">' + escapeHtml(item.anonymized_story || '') + '</div>' +
      '<div class="card-actions">' +
        '<button class="btn-approve" onclick="moderate(\'' + item.id + '\',\'approve\')">✓ Approve</button>' +
        '<button class="btn-reject" onclick="moderate(\'' + item.id + '\',\'reject\')">✕ Reject</button>' +
      '</div>' +
    '</div>';
  }
  if (currentTab === 'published') {
    var vidInputId = 'vid-' + item.id;
    return '<div class="card">' +
      '<div class="card-cat">' + escapeHtml(item.category || 'Uncategorized') + '</div>' +
      (item.ref_number ? '<div class="card-label">' + escapeHtml(item.ref_number) + '</div>' : '') +
      '<div class="card-title">' + escapeHtml(item.title || '') + '</div>' +
      '<div class="card-story">' + escapeHtml(item.anonymized_story || '') + '</div>' +
      '<div class="card-label" style="margin-top:10px;">🎬 YouTube video URL (optional):</div>' +
      '<div style="display:flex;gap:6px;margin-top:4px;">' +
        '<input type="text" id="' + vidInputId + '" value="' + escapeHtml(item.video_url || '') + '" placeholder="https://youtu.be/..." style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px;">' +
        '<button class="btn-approve" onclick="setVideoUrl(\'' + item.id + '\',\'' + vidInputId + '\')">💾 Save</button>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn-takedown" onclick="moderate(\'' + item.id + '\',\'takedown\')">🗄️ Take Down</button>' +
      '</div>' +
    '</div>';
  }
  // archived
  return '<div class="card">' +
    '<div class="card-cat">' + escapeHtml(item.category || 'Uncategorized') + '</div>' +
    '<div class="card-archived-note">🗄️ Taken down ' + (item.taken_down_at ? escapeHtml(new Date(item.taken_down_at).toLocaleDateString()) : '') + ' — not visible on the public site</div>' +
    '<div class="card-title">' + escapeHtml(item.title || '') + '</div>' +
    '<div class="card-story">' + escapeHtml(item.anonymized_story || '') + '</div>' +
    '<div class="card-actions">' +
      '<button class="btn-restore" onclick="moderate(\'' + item.id + '\',\'restore\')">↩️ Restore to Public</button>' +
    '</div>' +
  '</div>';
}

var moderateInFlight = false;

function moderate(id, action){
  if (moderateInFlight) return; // prevents exactly the double-click duplication bug
  moderateInFlight = true;
  document.querySelectorAll('.card-actions button').forEach(function(b){ b.disabled = true; b.style.opacity = '0.5'; });

  fetch('https://lawsticker-backend-494996217030.europe-west1.run.app/api/scam-moderate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: savedPassword, action: action, id: id})
  })
    .then(function(r){ return r.json(); })
    .then(function(data){
      moderateInFlight = false;
      if (data.ok) fetchTab();
      else {
        alert(data.error || 'Action failed.');
        document.querySelectorAll('.card-actions button').forEach(function(b){ b.disabled = false; b.style.opacity = '1'; });
      }
    })
    .catch(function(){
      moderateInFlight = false;
      alert('Could not reach the server — please try again.');
      document.querySelectorAll('.card-actions button').forEach(function(b){ b.disabled = false; b.style.opacity = '1'; });
    });
}

function setVideoUrl(id, inputId){
  var val = document.getElementById(inputId).value.trim();
  var btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Saving…';

  fetch('https://lawsticker-backend-494996217030.europe-west1.run.app/api/scam-moderate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: savedPassword, action: 'set_video_url', id: id, video_url: val})
  })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.ok) {
        btn.textContent = '✅ Saved';
        setTimeout(function(){ btn.textContent = '💾 Save'; btn.disabled = false; }, 1200);
      } else {
        alert(data.error || 'Could not save video URL.');
        btn.textContent = '💾 Save';
        btn.disabled = false;
      }
    })
    .catch(function(){
      alert('Could not reach the server — please try again.');
      btn.textContent = '💾 Save';
      btn.disabled = false;
    });
}

function escapeHtml(str){
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
</script>
</body>
</html>

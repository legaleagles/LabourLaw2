  steps:{en:['Ask for the enrollment number and the State Bar Council name.','Verify with that State Bar Council (office/website) — Telangana: barcounciloftelangana.org.','Check their appearance record on the eCourts app — search by advocate name in the relevant court.','Insist on a written fee agreement and receipts for all payments.','Never hand over original documents — give attested copies; originals only against written acknowledgment.'],
   te:['నమోదు సంఖ్య మరియు రాష్ట్ర బార్ కౌన్సిల్ పేరు అడగండి.','ఆ బార్ కౌన్సిల్‌తో ధృవీకరించండి — తెలంగాణ: barcounciloftelangana.org.','eCourts యాప్‌లో వారి హాజరు రికార్డు తనిఖీ చేయండి.','లిఖిత ఫీజు ఒప్పందం మరియు అన్ని చెల్లింపులకు రసీదులు పట్టుబట్టండి.','అసలు పత్రాలు ఇవ్వవద్దు — ధృవీకరించిన కాపీలు ఇవ్వండి.'],
   hi:['नामांकन संख्या और राज्य बार काउंसिल का नाम पूछें।','उस बार काउंसिल से सत्यापित करें।','eCourts ऐप पर उनकी पेशी रिकॉर्ड जांचें।','लिखित फीस समझौता और सभी भुगतान की रसीदें लें।','मूल दस्तावेज़ न दें — सत्यापित प्रतियां दें।']},
  acts:[['https://ecourts.gov.in','🌐 eCourts',0]]},

 {icon:'🧭',
  title:{en:'Choosing Well — Questions That Save You Lakhs',te:'బాగా ఎంచుకోవడం — లక్షలు ఆదా చేసే ప్రశ్నలు',hi:'सही चुनाव — लाखों बचाने वाले सवाल'},
  meta:{en:'Specialisation · Fees in writing · Realistic timelines',te:'ప్రత్యేకత · లిఖిత ఫీజులు · వాస్తవిక గడువులు',hi:'विशेषज्ञता · लिखित फीस · यथार्थ समयसीमा'},
  body:{en:'The right questions in the first meeting reveal everything: <strong>"How many cases like mine have you handled in this court?"</strong> (specialisation and local practice matter more than fame), <strong>"What is your fee structure — lump sum or per hearing?"</strong> (get it in writing), <strong>"What is the realistic timeline and worst case?"</strong> (anyone promising a guaranteed win or a fixed judgment date is a red flag), and <strong>"Can we settle this without court?"</strong> (good lawyers explore Lok Adalat and settlement first).',
   te:'మొదటి సమావేశంలో సరైన ప్రశ్నలు అన్నీ వెల్లడిస్తాయి: <strong>"ఈ కోర్టులో నా లాంటి కేసులు ఎన్ని చూశారు?"</strong>, <strong>"మీ ఫీజు నిర్మాణం ఏమిటి — మొత్తం లేదా విచారణకు?"</strong> (లిఖితంగా తీసుకోండి), <strong>"వాస్తవిక గడువు ఎంత?"</strong> (గెలుపు హామీ ఇచ్చేవారు ప్రమాద సంకేతం), <strong>"కోర్టు లేకుండా పరిష్కరించవచ్చా?"</strong>.',
   hi:'पहली मुलाकात में सही सवाल सब बता देते हैं: <strong>"इस कोर्ट में मेरे जैसे कितने केस देखे हैं?"</strong>, <strong>"फीस संरचना क्या है?"</strong> (लिखित लें), <strong>"यथार्थ समयसीमा क्या है?"</strong> (जीत की गारंटी देने वाला खतरे का संकेत), <strong>"क्या बिना कोर्ट सुलझ सकता है?"</strong>।'},
  eligs:null,
  steps:{en:['Prepare a one-page written summary of facts with dates before the meeting.','Carry copies (not originals) of all documents.','Note the advice given and fee quoted — email it back to confirm in writing.','Compare 2 lawyers for big matters; consultation fees are worth it.','Track your own case on the eCourts app — never depend solely on updates from anyone.'],
   te:['సమావేశానికి ముందు తేదీలతో ఒక పేజీ వాస్తవాల సారాంశం సిద్ధం చేయండి.','అన్ని పత్రాల కాపీలు తీసుకెళ్ళండి (అసలువి కాదు).','ఇచ్చిన సలహా, చెప్పిన ఫీజు నోట్ చేసుకోండి — ఇమెయిల్ ద్వారా లిఖితంగా నిర్ధారించండి.','పెద్ద విషయాలకు 2 న్యాయవాదులను పోల్చండి.','eCourts యాప్‌లో మీ కేసును మీరే ట్రాక్ చేయండి.'],
   hi:['मुलाकात से पहले तारीखों सहित एक पेज का सारांश तैयार करें।','सभी दस्तावेज़ों की प्रतियां ले जाएं (मूल नहीं)।','दी गई सलाह और फीस नोट करें — ईमेल से लिखित पुष्टि करें।','बड़े मामलों में 2 वकीलों की तुलना करें।','eCourts ऐप पर खुद केस ट्रैक करें।']},
  acts:[]},

 {icon:'⚠️',
  title:{en:'When a Lawyer Wrongs You — Complaint Process',te:'న్యాయవాది తప్పు చేస్తే — ఫిర్యాదు ప్రక్రియ',hi:'वकील गलत करे तो — शिकायत प्रक्रिया'},
  meta:{en:'State Bar Council · Professional misconduct · Fee disputes',te:'రాష్ట్ర బార్ కౌన్సిల్ · వృత్తిపరమైన దుష్ప్రవర్తన',hi:'राज्य बार काउंसिल · पेशेवर कदाचार'},
  body:{en:'Advocates are accountable. For <strong>professional misconduct</strong> — abandoning your case, acting against your interest, misappropriating money, demanding fees for work not done — file a complaint with the <strong>State Bar Council</strong> under Section 35 of the Advocates Act. The Disciplinary Committee can reprimand, suspend, or remove an advocate from the rolls. Deficiency of service claims may also lie in Consumer Commissions in certain circumstances.',
   te:'న్యాయవాదులు జవాబుదారీ. <strong>వృత్తిపరమైన దుష్ప్రవర్తనకు</strong> — కేసు వదిలేయడం, మీ ప్రయోజనానికి వ్యతిరేకంగా వ్యవహరించడం, డబ్బు దుర్వినియోగం — Advocates Act Section 35 కింద <strong>రాష్ట్ర బార్ కౌన్సిల్‌కు</strong> ఫిర్యాదు చేయండి. క్రమశిక్షణ కమిటీ మందలించవచ్చు, సస్పెండ్ చేయవచ్చు, తొలగించవచ్చు.',
   hi:'वकील जवाबदेह हैं। <strong>पेशेवर कदाचार</strong> — केस छोड़ना, आपके हित के विरुद्ध काम, पैसे का गबन — के लिए Advocates Act धारा 35 के तहत <strong>राज्य बार काउंसिल</strong> में शिकायत करें। अनुशासन समिति फटकार, निलंबन या निष्कासन कर सकती है।'},
  eligs:null,
  steps:{en:['Document everything: engagement letter, receipts, case status, communication.','Written complaint to the State Bar Council with the advocate\'s enrollment number.','The Disciplinary Committee issues notice and hears both sides.','No action in 1 year → the complaint transfers to the Bar Council of India.','For money recovery — separate civil remedy; keep receipts of every payment.'],
   te:['అన్నీ డాక్యుమెంట్ చేయండి: నియామక లేఖ, రసీదులు, కేసు స్థితి.','న్యాయవాది నమోదు సంఖ్యతో రాష్ట్ర బార్ కౌన్సిల్‌కు లిఖిత ఫిర్యాదు.','క్రమశిక్షణ కమిటీ నోటీసు జారీ చేసి రెండు వైపులా వింటుంది.','1 సంవత్సరంలో చర్య లేకపోతే → ఫిర్యాదు BCIకి బదిలీ.','డబ్బు వసూలుకు — విడిగా సివిల్ మార్గం; ప్రతి చెల్లింపు రసీదు ఉంచుకోండి.'],
   hi:['सब दस्तावेज़ करें: नियुक्ति पत्र, रसीदें, केस स्थिति।','वकील की नामांकन संख्या सहित राज्य बार काउंसिल को लिखित शिकायत।','अनुशासन समिति नोटिस जारी कर दोनों पक्ष सुनती है।','1 साल में कार्रवाई नहीं → शिकायत BCI को स्थानांतरित।','पैसे की वसूली — अलग सिविल उपाय; हर भुगतान की रसीद रखें।']},
  acts:[]},
];

let L='en';
function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}
function render(){
 const U=UI[L];
 ['navBrand','navBack','heroEye','heroTitle','heroSub'].forEach(id=>{document.getElementById(id).textContent=U[id];});
 document.getElementById('secList').innerHTML=SECS.map((s,i)=>{
  const steps=s.steps[L].map((st,j)=>`<div class="step-row"><div class="step-n">${j+1}</div><div class="step-text">${st}</div></div>`).join('');
  const elig=s.eligs?`<div class="elig-box"><div class="elig-title">${U.elig}</div>${s.eligs[L].map(e=>`<div class="elig-item">✓ ${e}</div>`).join('')}</div>`:'';
  const acts=s.acts.map(([u,t,p])=>`<a class="act-btn${p?' primary':''}" href="${u}" ${u.startsWith('http')?'target="_blank"':''}>${t}</a>`).join('');
  return `<div class="sec-card">
   <div class="sec-header" onclick="toggle(${i})">
    <div class="sec-icon">${s.icon}</div>
    <div class="sec-hdr-body"><div class="sec-title">${s.title[L]}</div><div class="sec-meta">${s.meta[L]}</div></div>
    <div class="sec-chev${i===0?' open':''}" id="chev${i}">▼</div>
   </div>
   <div class="sec-body${i===0?' open':''}" id="body${i}">
    <div class="item-body">${s.body[L]}</div>${elig}
    <div class="steps-box"><div class="steps-title">${U.steps}</div>${steps}</div>
    <div class="act-row">${acts}</div>
   </div></div>`;}).join('');
}
function toggle(i){document.getElementById('body'+i).classList.toggle('open');
 document.getElementById('chev'+i).classList.toggle('open');}
document.addEventListener('DOMContentLoaded',render);
</script>

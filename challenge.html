:root{--navy:#0D1117;--ink:#111827;--ink2:#374151;--cream:#FEFCF5;--muted:#6B7280;--border:#D1D5DB;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans','Noto Sans Telugu','Noto Sans Devanagari',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}
nav{background:var(--navy);position:sticky;top:0;z-index:200;}
.nav-r1{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;}
.nav-back{color:rgba(255,255,255,.5);text-decoration:none;font-size:12px;font-weight:600;}
.nav-brand{font-family:'Playfair Display',serif;font-size:14px;font-weight:900;color:var(--gold-l);}
.nav-langs{display:flex;gap:5px;}
.nav-lang{padding:4px 10px;border-radius:14px;border:1px solid rgba(201,162,39,.2);background:transparent;
color:rgba(255,255,255,.35);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}
.nav-lang.active{border-color:var(--gold);color:var(--navy);background:var(--gold);}
.hero{background:linear-gradient(145deg,#0D1117,#241c08,#0D1117);padding:26px 20px;text-align:center;}

.page{max-width:640px;margin:0 auto;padding:16px 14px 90px;}
.progress{display:flex;gap:4px;margin-bottom:16px;}
.p-dot{flex:1;height:6px;border-radius:3px;background:var(--border);}
.p-dot.done-right{background:var(--jade);}
.p-dot.done-wrong{background:var(--rose);}
.p-dot.current{background:var(--gold);}
.q-card{background:#fff;border:2px solid var(--gold);border-radius:18px;padding:20px 18px;box-shadow:0 6px 20px rgba(201,162,39,.12);}
.q-num{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--gold-d);text-transform:uppercase;margin-bottom:8px;}
.q-text{font-size:16px;font-weight:800;line-height:1.5;margin-bottom:16px;}
.q-opt{display:block;width:100%;background:var(--light);border:2px solid var(--border);border-radius:12px;
padding:13px 14px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;
text-align:left;margin-bottom:8px;transition:all .15s;}
.q-opt:active{transform:scale(.98);}
.q-opt.correct{background:var(--jade-bg);border-color:var(--jade);color:#065F46;}
.q-opt.wrong{background:var(--rose-bg);border-color:var(--rose);color:#991B1B;}
.q-expl{display:none;background:var(--gold-pale);border:1px solid rgba(201,162,39,.35);border-radius:12px;
padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--ink2);margin-top:6px;}
.q-expl.show{display:block;}
.q-expl b{color:var(--gold-d);}
.next-btn{display:none;width:100%;padding:13px;background:var(--navy);color:var(--gold-l);border:none;
border-radius:12px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-top:12px;}
.next-btn.show{display:block;}
/* RESULT */
.result{display:none;text-align:center;}
.result.show{display:block;}
.r-score{font-family:'Playfair Display',serif;font-size:56px;font-weight:900;color:var(--gold-d);}
.r-title{font-size:20px;font-weight:900;margin:6px 0 4px;}
.r-sub{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:18px;}
.name-input{width:100%;padding:13px;border:2px solid var(--gold);border-radius:12px;font-family:inherit;
font-size:15px;font-weight:700;text-align:center;margin-bottom:10px;}
.cert-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),#A88420);color:var(--navy);
border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:8px;}
.share-btn{width:100%;padding:13px;background:#25D366;color:#fff;border:none;border-radius:12px;
font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;margin-bottom:8px;}
.retry-btn{width:100%;padding:12px;background:var(--light);color:var(--ink2);border:1.5px solid var(--border);
border-radius:12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
#certCanvas{display:none;}
.cert-preview{width:100%;border-radius:12px;border:1px solid var(--border);margin:12px 0;display:none;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,17,30,.98);border-top:1px solid rgba(255,255,255,.08);
padding:8px 0 12px;display:flex;justify-content:space-around;z-index:100;}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 10px;}
.bn-icon{font-size:20px;}
.bn-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.5px;text-transform:uppercase;}
</style>

let L='en', qi=0, score=0, answered=false, results=[];

function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');renderShell();renderQ();}

function renderShell(){
 const U=UI[L];
 document.getElementById('navBrand').textContent=U.navBrand;
 document.getElementById('navBack').textContent=U.navBack;
 document.getElementById('heroTitle').textContent=U.heroTitle;
 document.getElementById('heroSub').textContent=U.heroSub;
}

function renderProgress(){
 document.getElementById('progress').innerHTML=QS.map((_,i)=>{
  let cls='p-dot';
  if(i<results.length)cls+=results[i]?' done-right':' done-wrong';
  else if(i===qi)cls+=' current';
  return `<div class="${cls}"></div>`;}).join('');
}

function renderQ(){
 if(qi>=QS.length){showResult();return;}
 answered=false;
 const U=UI[L],Q=QS[qi];
 renderProgress();
 document.getElementById('qNum').textContent=U.qNum(qi+1);
 document.getElementById('qText').textContent=Q.q[L];
 document.getElementById('qOpts').innerHTML=Q.o[L].map((o,i)=>
  `<button class="q-opt" id="opt${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('');
 document.getElementById('qExpl').classList.remove('show');
 document.getElementById('nextBtn').classList.remove('show');
}

function answer(i){
 if(answered)return;answered=true;
 const Q=QS[qi],U=UI[L];
 const win=(i===Q.a);
 if(win)score++;
 results.push(win);
 Q.o[L].forEach((_,j)=>{
  const b=document.getElementById('opt'+j);b.disabled=true;
  if(j===Q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong');});
 const ex=document.getElementById('qExpl');
 ex.innerHTML=Q.e[L];ex.classList.add('show');
 const nb=document.getElementById('nextBtn');
 nb.textContent=qi===QS.length-1?U.finish:U.next;
 nb.classList.add('show');
 renderProgress();
}

function nextQ(){qi++;renderQ();}

function showResult(){
 const U=UI[L];
 document.getElementById('qCard').style.display='none';
 document.getElementById('progress').style.display='none';
 const r=document.getElementById('result');r.classList.add('show');
 document.getElementById('rScore').textContent=score;
 const tier=score>=7?'high':score>=4?'mid':'low';
 document.getElementById('rTitle').textContent=U.titles[tier];
 document.getElementById('rSub').textContent=U.subs[tier];
 const nameEl=document.getElementById('certName');
 nameEl.placeholder=U.namePh;
 nameEl.style.display=score>=7?'block':'none';
 document.getElementById('certBtn').style.display=score>=7?'block':'none';
 document.getElementById('certBtn').textContent=U.certBtn;
 document.getElementById('shareBtn').textContent=U.share;
 document.getElementById('retryBtn').textContent=U.retry;
}

function makeCert(){
 const U=UI[L];
 const name=(document.getElementById('certName').value||'').trim();
 if(!name){document.getElementById('certName').focus();return;}
 const cv=document.getElementById('certCanvas'),x=cv.getContext('2d');
 // background
 const g=x.createLinearGradient(0,0,1200,675);
 g.addColorStop(0,'#0D1117');g.addColorStop(.5,'#1a2436');g.addColorStop(1,'#0D1117');
 x.fillStyle=g;x.fillRect(0,0,1200,675);
 // gold border
 x.strokeStyle='#C9A227';x.lineWidth=10;x.strokeRect(25,25,1150,625);
 x.strokeStyle='rgba(201,162,39,.4)';x.lineWidth=2;x.strokeRect(45,45,1110,585);
 // laurels
 x.font='90px serif';x.textAlign='center';x.fillText('🏆',600,150);
 x.fillStyle='#F5D76E';x.font='900 54px Georgia, serif';
 x.fillText(U.cert.t1,600,225);
 x.fillStyle='rgba(255,255,255,.65)';x.font='26px Georgia, serif';
 x.fillText(U.cert.t2,600,285);
 // name
 x.fillStyle='#FFFFFF';x.font='900 64px Georgia, serif';
 x.fillText(name,600,370);
 x.strokeStyle='#C9A227';x.lineWidth=3;
 x.beginPath();x.moveTo(320,395);x.lineTo(880,395);x.stroke();
 x.fillStyle='rgba(255,255,255,.75)';x.font='28px Georgia, serif';
 x.fillText(U.cert.t3.replace('{s}',score),600,450);
 x.fillStyle='#C9A227';x.font='italic 24px Georgia, serif';
 x.fillText(U.cert.t4,600,530);
 x.fillStyle='#F5D76E';x.font='900 32px Georgia, serif';
 x.fillText(U.cert.t5,600,600);
 // to preview img (long-press save works better than download on mobile)
 const img=document.getElementById('certPreview');
 img.src=cv.toDataURL('image/png');
 img.style.display='block';
 // also try download
 try{const a=document.createElement('a');a.download='rights-champion-certificate.png';a.href=img.src;a.click();}catch(e){}
 document.getElementById('rSub').textContent=U.certDownloaded;
}

function shareResult(){
 window.open('https://wa.me/?text='+encodeURIComponent(UI[L].shareTpl(score)),'_blank');
}

function restart(){qi=0;score=0;results=[];answered=false;
 document.getElementById('qCard').style.display='block';
 document.getElementById('progress').style.display='flex';
 document.getElementById('result').classList.remove('show');
 document.getElementById('certPreview').style.display='none';
 renderQ();}

document.addEventListener('DOMContentLoaded',()=>{renderShell();renderQ();});
</script>

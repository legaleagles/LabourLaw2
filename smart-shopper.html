<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Shopper — Daily Consumer Tricks | LawSticker AI</title>
<meta name="description" content="Every day, AI uncovers one everyday commercial trick businesses use in India — and the exact smart response to push back. Browse the full archive.">
<meta name="author" content="Durga Sankar Pedagopu">
<link rel="canonical" href="https://lawsticker-ai.com/smart-shopper.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token":"e09fd067f6fa48feb2687141fcada9b0"}'></script>
<style>
:root{--navy:#0D1117;--gold:#C9A227;--gold-l:#F5D76E;--cream:#FEFCF5;--ink:#111827;--muted:#6B7280;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);}
nav{background:rgba(13,17,23,.97);padding:12px 16px;position:sticky;top:0;z-index:10;
display:flex;align-items:center;justify-content:space-between;}
.nav-langs{display:flex;gap:5px;}
.nav-lang{padding:5px 11px;border-radius:14px;border:1px solid rgba(201,162,39,.3);background:transparent;
color:rgba(255,255,255,.55);font-size:11px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;}
.nav-lang.active{background:var(--gold-l);border-color:var(--gold-l);color:#1a1030;}
.nav-brand{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--gold-l);text-decoration:none;}
.hero{background:linear-gradient(150deg,#241505 0%,#3d2308 55%,#241100 100%);padding:30px 20px 26px;text-align:center;}
.hero-icon{font-size:38px;margin-bottom:8px;}
.hero-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:900;color:#FCD34D;}
.hero-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:8px;line-height:1.6;max-width:440px;margin-left:auto;margin-right:auto;}
.ai-line{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:10px;font-weight:700;}
.wrap{max-width:600px;margin:0 auto;padding:18px 16px 40px;}
.count-note{font-size:11px;color:var(--muted);text-align:center;margin-bottom:16px;}
.card{background:#fff;border:1px solid #EEE7D6;border-left:4px solid #F59E0B;border-radius:14px;
padding:16px 15px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.card-cat{font-size:9.5px;font-weight:900;color:#B45309;text-transform:uppercase;letter-spacing:.6px;
background:#FEF3C7;padding:3px 9px;border-radius:8px;}
.card-date{font-size:10px;color:var(--muted);}
.card-where{font-size:10.5px;color:#0369A1;font-weight:700;margin-bottom:6px;}
.card-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--ink);line-height:1.35;margin-bottom:8px;}
.card-explain{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:10px;white-space:pre-line;}
.card-watch{background:#FEF2F2;border:1px solid #FECACA;border-radius:9px;padding:9px 11px;margin-bottom:10px;}
.card-watch-label{font-size:9px;font-weight:900;color:#B91C1C;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.card-watch-item{font-size:11px;color:#7A1F1F;line-height:1.55;padding-left:13px;position:relative;margin-bottom:3px;}
.card-watch-item::before{content:'⚠';position:absolute;left:0;top:0;font-size:9px;}
.card-response{background:#FFFBEB;border:1px solid #FDE68A;border-left:3px solid #F59E0B;border-radius:9px;
padding:10px 12px;margin-bottom:9px;}
.card-response-label{font-size:9px;font-weight:900;color:#B45309;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.card-response-text{font-size:12px;color:var(--ink);font-weight:600;font-style:italic;line-height:1.55;}
.card-legal{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:10px;}
.card-actions{display:flex;gap:8px;}
.card-share-btn{flex:1;background:#F3F4F6;border:1px solid #E5E7EB;color:var(--ink);
font-size:11px;font-weight:800;padding:9px;border-radius:9px;cursor:pointer;}
.card-share-btn.wa{background:#25D366;border-color:#25D366;color:#fff;}
.card-share-btn:active{transform:scale(.97);}
.card-legal-note{font-size:9px;color:#9CA3AF;font-style:italic;margin-top:2px;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;}
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">⚖️ LawSticker AI</a>
  <div class="nav-langs">
    <button class="nav-lang active" id="langEn" onclick="setLang('en')">EN</button>
    <button class="nav-lang" id="langTe" onclick="setLang('te')">తె</button>
    <button class="nav-lang" id="langHi" onclick="setLang('hi')">हि</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-icon">🛍️</div>
  <div class="hero-title" id="heroTitle">Smart Shopper Archive</div>
  <div class="hero-sub" id="heroSub">Every everyday commercial trick we've exposed so far — with the exact smart response to push back, every time.</div>
  <div class="ai-line" id="aiLine">🤖 Powered by Gemini · one new card published automatically, daily</div>
</div>

<div class="wrap">
  <div class="count-note" id="countNote"></div>
  <div id="cardsContainer"><div class="empty">Loading…</div></div>
</div>

<script>
var L = 'en';
var UI = {
  en: {
    heroTitle: 'Smart Shopper Archive',
    heroSub: "Every everyday commercial trick we've exposed so far — with the exact smart response to push back, every time.",
    aiLine: '🤖 Powered by Gemini · one new card published automatically, daily',
    watchLabel: '🚩 Watch For',
    sayLabel: '💬 Say This',
    shareWa: '📱 WhatsApp',
    shareImg: '🖼️ Get Image Card',
    loading: 'Loading…',
    empty: 'No tricks published yet — check back tomorrow.',
    errorMsg: "Couldn't load the archive right now — try again shortly.",
    countSuffix: function(n){ return n + ' trick' + (n===1?'':'s') + ' published so far'; },
    legalNote: 'Legal citations are provided in English for accuracy.'
  },
  te: {
    heroTitle: 'స్మార్ట్ షాపర్ ఆర్కైవ్',
    heroSub: 'ఇప్పటివరకు మేము బహిర్గతం చేసిన ప్రతి రోజువారీ వాణిజ్య ఉపాయం — ఎదురుతిరగడానికి ఖచ్చితమైన స్మార్ట్ సమాధానంతో సహా.',
    aiLine: '🤖 Gemini ద్వారా శక్తివంతం · ప్రతిరోజూ ఆటోమేటిక్‌గా ఒక కొత్త కార్డు ప్రచురించబడుతుంది',
    watchLabel: '🚩 వీటిని గమనించండి',
    sayLabel: '💬 ఇలా చెప్పండి',
    shareWa: '📱 వాట్సాప్',
    shareImg: '🖼️ ఇమేజ్ కార్డు పొందండి',
    loading: 'లోడ్ అవుతోంది…',
    empty: 'ఇంకా ఉపాయాలు ప్రచురించబడలేదు — రేపు మళ్ళీ చూడండి.',
    errorMsg: 'ఆర్కైవ్‌ను ఇప్పుడు లోడ్ చేయలేకపోయాము — త్వరలో మళ్ళీ ప్రయత్నించండి.',
    countSuffix: function(n){ return n + ' ఉపాయాలు ఇప్పటివరకు ప్రచురించబడ్డాయి'; },
    legalNote: 'ఖచ్చితత్వం కోసం చట్టపరమైన ఉల్లేఖనలు ఇంగ్లీష్‌లో అందించబడ్డాయి.'
  },
  hi: {
    heroTitle: 'स्मार्ट शॉपर आर्काइव',
    heroSub: 'अब तक हमने उजागर की हर रोज़मर्रा की व्यावसायिक तरकीब — साथ में पलटवार करने का सटीक स्मार्ट जवाब।',
    aiLine: '🤖 Gemini द्वारा संचालित · हर दिन अपने आप एक नया कार्ड प्रकाशित होता है',
    watchLabel: '🚩 इन बातों पर ध्यान दें',
    sayLabel: '💬 यह कहें',
    shareWa: '📱 व्हाट्सएप',
    shareImg: '🖼️ इमेज कार्ड लें',
    loading: 'लोड हो रहा है…',
    empty: 'अभी तक कोई ट्रिक प्रकाशित नहीं हुई — कल फिर देखें।',
    errorMsg: 'आर्काइव अभी लोड नहीं हो सका — कृपया थोड़ी देर बाद फिर कोशिश करें।',
    countSuffix: function(n){ return n + ' ट्रिक अब तक प्रकाशित हुई हैं'; },
    legalNote: 'सटीकता के लिए कानूनी उद्धरण अंग्रेज़ी में दिए गए हैं।'
  }
};

var latestEntries = [];

function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function shareText(t){
  var title = t['title_' + L] || t.title_en || '';
  return (t.share_line || t.title_en || '') + '\n\n' + title +
    '\n\nMore daily tricks & smart comebacks at https://lawsticker-ai.com/smart-shopper.html';
}

function renderCard(t){
  var u = UI[L];
  var watch = t['watch_for_' + L] || t.watch_for_en || [];
  var watchHtml = watch.length ? (
    '<div class="card-watch"><div class="card-watch-label">' + u.watchLabel + '</div>' +
    watch.map(function(w){ return '<div class="card-watch-item">' + esc(w) + '</div>'; }).join('') +
    '</div>'
  ) : '';
  var dateStr = t.origin_date ? new Date(t.origin_date + 'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '';
  var title = t['title_' + L] || t.title_en || '';
  var explain = t['explain_' + L] || t.explain_en || '';
  var response = t['response_' + L] || t.response_en || '';
  return '<div class="card">' +
    '<div class="card-top"><span class="card-cat">' + esc(t.category||'') + '</span><span class="card-date">' + esc(dateStr) + '</span></div>' +
    (t.where ? '<div class="card-where">📍 ' + esc(t.where) + '</div>' : '') +
    '<div class="card-title">' + esc(title) + '</div>' +
    '<div class="card-explain">' + esc(explain) + '</div>' +
    watchHtml +
    '<div class="card-response"><div class="card-response-label">' + u.sayLabel + '</div><div class="card-response-text">' + esc(response) + '</div></div>' +
    (t.legal_note ? '<div class="card-legal">⚖️ ' + esc(t.legal_note) + (L !== 'en' ? '<div class="card-legal-note">(' + u.legalNote + ')</div>' : '') + '</div>' : '') +
    '<div class="card-actions">' +
      '<button class="card-share-btn wa" data-share-id="' + esc(t.id) + '">' + u.shareWa + '</button>' +
      '<button class="card-share-btn" onclick=\'window.open("https://lawsticker-backend-494996217030.europe-west1.run.app/api/trick-card-image?id=' + encodeURIComponent(t.id) + '", "_blank")\'>' + u.shareImg + '</button>' +
    '</div>' +
  '</div>';
}

function renderAll(){
  var u = UI[L];
  document.getElementById('heroTitle').textContent = u.heroTitle;
  document.getElementById('heroSub').textContent = u.heroSub;
  document.getElementById('aiLine').textContent = u.aiLine;
  document.getElementById('langEn').classList.toggle('active', L==='en');
  document.getElementById('langTe').classList.toggle('active', L==='te');
  document.getElementById('langHi').classList.toggle('active', L==='hi');

  var container = document.getElementById('cardsContainer');
  if (!latestEntries.length) {
    container.innerHTML = '<div class="empty">' + u.empty + '</div>';
    document.getElementById('countNote').textContent = '';
    return;
  }
  document.getElementById('countNote').textContent = u.countSuffix(latestEntries.length);
  container.innerHTML = latestEntries.map(renderCard).join('');
  // Wire WhatsApp buttons properly now that markup is in the DOM (avoids
  // fragile inline-JSON escaping across three languages/scripts).
  Array.prototype.forEach.call(container.querySelectorAll('[data-share-id]'), function(btn){
    var entry = latestEntries.find(function(e){ return e.id === btn.getAttribute('data-share-id'); });
    if (!entry) return;
    btn.onclick = function(){
      window.open('https://wa.me/?text=' + encodeURIComponent(shareText(entry)), '_blank');
    };
  });
}

function setLang(lang){
  L = lang;
  try { localStorage.setItem('lsLang', lang); } catch(e){}
  renderAll();
}

try {
  var saved = localStorage.getItem('lsLang');
  if (saved === 'te' || saved === 'hi') L = saved;
} catch(e){}

fetch('marketing-tricks.json?t=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(data){
    latestEntries = (data.entries || []).slice().reverse(); // newest first
    renderAll();
  })
  .catch(function(){
    document.getElementById('cardsContainer').innerHTML = '<div class="empty">' + UI[L].errorMsg + '</div>';
  });
</script>

</body>
</html>

:root{

  --navy:#0B1220;--navy2:#141E33;--gold:#C9A227;--gold-l:#F5D76E;--gold-ink:#7A5A00;
  --up:#059669;--down:#DC2626;--flat:#D97706;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
  --radius:20px;--tabh:68px;
}
@media (prefers-color-scheme:dark){

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans','Noto Sans Telugu','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabh) + 24px)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* NAV */
nav.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--navy) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}

.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:#fff;letter-spacing:-.2px}

.brand small{font-weight:600;font-size:11px;color:rgba(255,255,255,.5)}

.langs button{border:0;background:transparent;color:rgba(255,255,255,.6);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;min-height:30px}
.langs button.on{background:var(--gold);color:var(--navy)}

/* HERO */
.hero{background:radial-gradient(900px 380px at 85% -10%,rgba(201,162,39,.28),transparent 60%),radial-gradient(700px 300px at -10% 110%,rgba(56,189,248,.14),transparent 60%),var(--navy);color:#fff;padding:30px 0 34px;position:relative;overflow:hidden}
.hero .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--gold-l);background:rgba(245,215,110,.1);border:1px solid rgba(245,215,110,.25);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.hero h1{font-size:clamp(30px,7.4vw,52px);line-height:1.08;font-weight:800;letter-spacing:-1px;max-width:14em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold-l),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{margin-top:12px;color:rgba(255,255,255,.72);font-size:15px;max-width:34em}
.ask{margin-top:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px;max-width:640px;backdrop-filter:blur(6px)}
.ask-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--gold-l);margin-bottom:10px}
.ask-top .ai{background:var(--gold);color:var(--navy);border-radius:6px;padding:1px 6px;font-size:10px;font-weight:800}
.ask form{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:0;border-radius:14px;padding:14px 14px;font-size:15px;font-family:inherit;background:#fff;color:#0F172A;outline:none}
.ask input::placeholder{color:#7B8699}
.ask button.go{border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--navy);font-weight:800;font-size:14px;padding:0 20px;cursor:pointer;min-height:48px}
.ask .eg{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.ask .eg button{border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.85);border-radius:999px;font-size:12px;padding:6px 12px;cursor:pointer}
.ask .eg button:hover{background:rgba(255,255,255,.1)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
.facts b{color:var(--gold-l);font-weight:800}

/* SECTIONS */
section{margin-top:34px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.sh p{font-size:13px;color:var(--muted);margin-top:2px}
.sh a.more{font-size:12.5px;font-weight:700;color:var(--gold-ink);white-space:nowrap}

/* TRENDING */
.trend{margin-top:-18px;position:relative;z-index:2}
.trend-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 6px 12px 14px}
.trend h2{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin-bottom:9px}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-right:14px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill i{font-style:normal;font-size:16px}
.pill:hover{border-color:var(--gold)}

/* SITUATIONS */
.sits{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:560px){.sits{grid-template-columns:repeat(4,1fr)}}
@media(min-width:820px){.sits{grid-template-columns:repeat(6,1fr)}}
.sit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;text-align:center;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s}
.sit i{font-style:normal;font-size:26px;line-height:1}
.sit:hover,.sit:active{transform:translateY(-2px);border-color:var(--gold);box-shadow:var(--shadow)}

/* TILES */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 15px;min-height:118px;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--gold));opacity:.9}
.tile:hover,.tile:active{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--c,var(--gold))}
.tile .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c,var(--gold)) 14%,transparent)}
.tile .tt{font-weight:800;font-size:14.5px;letter-spacing:-.2px;line-height:1.2;margin-top:3px}
.tile .td{font-size:12px;color:var(--muted);line-height:1.35}
.tile .new{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--c,var(--gold));padding:2px 7px;border-radius:999px}
.tile.hero-tile{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-color:transparent}
.tile.hero-tile .td{color:rgba(255,255,255,.7);font-size:12.5px}
.tile.hero-tile .ti{width:52px;height:52px;font-size:28px;flex:none;background:rgba(245,215,110,.14)}
.tile.hero-tile .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile.hero-tile .tt{font-size:17px;margin:0}
.tile.hero-tile .go{margin-left:auto;font-weight:800;color:var(--gold-l);font-size:20px}

/* CHIPS (calculators) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:700}
.chip i{font-style:normal;font-size:17px}
.chip:hover{border-color:var(--gold);box-shadow:var(--shadow)}

/* TODAY */
.today{display:grid;gap:10px}
@media(min-width:700px){.today{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card .kick{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card .kick .live{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px rgba(5,150,105,.18)}
.card h3{font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.3}
.card p{font-size:13.5px;color:var(--ink2);margin-top:6px}
.leans{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.lean{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--surface2)}
.lean.up{color:var(--up)}.lean.down{color:var(--down)}.lean.flat{color:var(--flat)}
.say{margin-top:10px;background:var(--surface2);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.say b{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--gold-ink);margin-bottom:3px}
.card .lnk{display:inline-block;margin-top:12px;font-size:13px;font-weight:800;color:var(--gold-ink)}
.skel{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* STUDY */
details.lc{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px}
details.lc summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:14.5px;padding:12px 0}
details.lc summary::-webkit-details-marker{display:none}
details.lc summary::after{content:"＋";color:var(--gold-ink);font-size:18px}
details.lc[open] summary::after{content:"－"}
details.lc .chips{padding:0 0 14px}

/* HELP + SHARE */
.help{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hbtn{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.hbtn b{font-size:19px;font-weight:800;color:var(--down)}
.hbtn span{font-size:11px;color:var(--muted);font-weight:700}
.help-more{display:block;margin-top:9px;text-align:center;font-size:13px;font-weight:800;color:var(--gold-ink)}
.sharebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--radius);padding:16px}
.sharebar b{font-size:15px}.sharebar span{display:block;font-size:12.5px;color:rgba(255,255,255,.65);margin-top:2px}
.sharebar button{border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--navy);font-weight:800;padding:12px 18px;font-size:14px;cursor:pointer}

/* FOOTER */
footer{margin-top:40px;padding:26px 0 8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
footer .fb{font-weight:800;color:var(--ink);font-size:15px;margin-bottom:6px}
footer .links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin:12px 0;font-weight:700}
footer .links a{color:var(--ink2)}
footer p{max-width:44em;margin:0 auto;line-height:1.55}

/* TAB BAR */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;height:var(--tabh);padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--navy) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 8px;color:rgba(255,255,255,.55);font-size:10px;font-weight:700;letter-spacing:.3px}

.tab.on{color:var(--gold-l)}
.tab.fab{margin-top:-22px;color:var(--navy)}
.tab.fab i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-l),var(--gold));box-shadow:0 6px 18px rgba(201,162,39,.45);font-size:22px}
.tab.fab span{color:var(--gold-l);margin-top:2px}
@media(min-width:900px){.tabbar{display:none}body{padding-bottom:24px}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function nm(slug){return C[slug][2][IDX[L]]||C[slug][2][0];}
function ds(slug){var d=C[slug][3];return (d&&(d[IDX[L]]||d[0]))||'';}
function tile(slug,big){
  var c=C[slug],a=el('a','tile'+(big?' hero-tile':''));
  a.href=slug+'.html';a.style.setProperty('--c',c[1]);a.dataset.slug=slug;
  var d=ds(slug);
  if(big){a.innerHTML='<span class="ti">'+c[0]+'</span><span class="tx"><span class="tt">'+esc(nm(slug))+'</span><span class="td">'+esc(d)+'</span></span><span class="go">→</span>';}
  else{a.innerHTML=(c[4]?'<span class="new">'+c[4]+'</span>':'')+'<span class="ti">'+c[0]+'</span><span class="tt">'+esc(nm(slug))+'</span>'+(d?'<span class="td">'+esc(d)+'</span>':'');}
  return a;
}
function chip(slug){var c=C[slug],a=el('a','chip','<i>'+c[0]+'</i>'+esc(nm(slug)));a.href=slug+'.html';a.dataset.slug=slug;return a;}

/* ---------- hits (GA4 via backend) with last-known cache so ordering never jumps ---------- */
var HITS=null; // array of slugs, most viewed first
var live=false;
try{var cc=JSON.parse(localStorage.getItem('lsTop')||'null');if(cc&&Date.now()-cc.t<2*864e5&&cc.s&&cc.s.length){HITS=cc.s;live=true;}}catch(e){}
function rank(list){
  if(!HITS)return list.slice();
  return list.map(function(s,i){var h=HITS.indexOf(s);return {s:s,k:h<0?1e6+i:h};}).sort(function(a,b){return a.k-b.k;}).map(function(x){return x.s;});
}
function loadHits(){
  var ctl=('AbortController' in window)?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},5000);
  fetch(BACKEND+'/api/top-pages?days=7',ctl?{signal:ctl.signal}:{}).then(function(r){return r.json();}).then(function(d){
    clearTimeout(tm);
    if(!d||!d.ok||!d.pages)return;
    var s=d.pages.map(function(p){return p.slug;}).filter(function(x){return C[x]&&x!=='calculators';});
    if(s.length>=3){HITS=s;live=true;try{localStorage.setItem('lsTop',JSON.stringify({t:Date.now(),s:s}));}catch(e){}renderTrend();}
  }).catch(function(){});
}

/* ---------- render ---------- */
function renderTrend(){
  var U=UI[L],rail=$('trendRail');rail.innerHTML='';
  var list=live&&HITS?HITS.slice(0,7):FALLBACK_TREND;
  $('trendT').textContent=(live?'🔥 ':'⭐ ')+(live?U.trendLive:U.trendFb);
  list.forEach(function(s){if(!C[s])return;var c=C[s],a=el('a','pill','<i>'+c[0]+'</i>'+esc(nm(s)));a.href=s+'.html';rail.appendChild(a);});
}
function renderAll(){
  var U=UI[L];
  document.documentElement.lang=L;
  document.querySelectorAll('[data-k]').forEach(function(n){var v=U[n.dataset.k];if(v==null)return;if(n.hasAttribute('data-html'))n.innerHTML=v;else n.textContent=v;});
  document.querySelectorAll('.langs button').forEach(function(b){b.classList.toggle('on',b.dataset.l===L);});
  $('askQ').placeholder=U.askPh;
  var eg=$('askEg');eg.innerHTML='';
  U.egs.forEach(function(e){var b=el('button',null,e[0]+' '+esc(e[1]));b.type='button';b.onclick=function(){$('askQ').value=e[2];go(e[2]);};eg.appendChild(b);});
  renderTrend();
  var s=$('sits');s.innerHTML='';
  SITS.forEach(function(x){var a=el('a','sit','<i>'+x[0]+'</i>'+esc(x[1+IDX[L]]));a.href=x[4]+'.html';s.appendChild(a);});
  var gc=$('gCheck');gc.innerHTML='';
  var order=rank(G.check);
  order.forEach(function(sl,i){gc.appendChild(tile(sl,i===0));});
  var gcal=$('gCalc');gcal.innerHTML='';G.calc.forEach(function(sl){gcal.appendChild(chip(sl));});
  var ga=$('gAct');ga.innerHTML='';rank(G.act).forEach(function(sl){ga.appendChild(tile(sl));});
  var gs=$('gStudy');gs.innerHTML='';G.study.forEach(function(sl){gs.appendChild(tile(sl));});
  var gl=$('gLawcet');gl.innerHTML='';LAWCET.forEach(function(x){var a=el('a','chip',esc(x[1]));a.href=x[0]+'.html';gl.appendChild(a);});
  renderToday();
}
function setLang(l){L=l;try{localStorage.setItem('lsLang',l);}catch(e){}renderAll();try{gtag('event','home_lang',{lang:l});}catch(e){}}
document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.l);});});

/* ---------- Ask Vidura ---------- */
function go(q){
  q=(q||$('askQ').value||'').trim();
  try{gtag('event','home_ask',{lang:L,has_q:!!q});}catch(e){}
  location.href='ask-ai.html'+(q?'?q='+encodeURIComponent(q)+'&lang='+L:'');
}
$('askForm').addEventListener('submit',function(e){e.preventDefault();go();});

/* ---------- Fresh-or-hidden daily cards ---------- */
var TD={gold:null,trick:null},todayLoaded=false;
function ageDays(iso){var t=Date.parse(iso);return isNaN(t)?1e9:(Date.now()-t)/864e5;}
function loadToday(){
  if(todayLoaded)return;todayLoaded=true;
  var p1=fetch('metal-direction.json?t='+Math.floor(Date.now()/36e5)).then(function(r){return r.json();}).then(function(d){
    var h=d.history||{},ks=Object.keys(h).sort(),e=ks.length?h[ks[ks.length-1]]:null;
    if(e&&ageDays(e.generated_at)<=3)TD.gold=e;
  }).catch(function(){});
  var p2=fetch('marketing-tricks.json?t='+Math.floor(Date.now()/36e5)).then(function(r){return r.json();}).then(function(d){
    var en=(d.entries||[]).filter(function(x){return x.origin_date;}).sort(function(a,b){return a.origin_date<b.origin_date?-1:1;}),e=en[en.length-1];
    if(e&&ageDays(e.origin_date+'T00:00:00')<=7)TD.trick=e;
  }).catch(function(){});
  Promise.all([p1,p2]).then(renderToday);
}
function renderToday(){
  if(!todayLoaded)return;
  var U=UI[L],box=$('todayCards'),sec=$('today');box.innerHTML='';
  if(!TD.gold&&!TD.trick){sec.hidden=true;return;}
  sec.hidden=false;
  var k=IDX[L]===0?'en':L;
  if(TD.gold){
    var g=TD.gold,lean=function(v){return v==='up'?['up','▲ '+U.up]:v==='down'?['down','▼ '+U.down]:['flat','▬ '+U.flat];},gl=lean(g.gold_lean),sl=lean(g.silver_lean);
    var c=el('a','card');c.href='metal-direction.html';
    c.innerHTML='<div class="kick"><span class="live"></span>'+esc(U.gold)+'</div><h3>'+esc(g['headline_'+k]||g.headline_en||'')+'</h3>'+
      '<div class="leans"><span class="lean '+gl[0]+'">'+esc(U.gld)+' '+gl[1]+'</span><span class="lean '+sl[0]+'">'+esc(U.slv)+' '+sl[1]+'</span></div>'+
      '<span class="lnk">'+esc(U.seeMore)+'</span>';
    box.appendChild(c);
  }
  if(TD.trick){
    var t=TD.trick,c2=el('a','card');c2.href='smart-shopper.html';
    c2.innerHTML='<div class="kick"><span class="live"></span>'+esc(U.trick)+'</div><h3>'+esc(t['title_'+k]||t.title_en||'')+'</h3>'+
      '<p>'+esc(t.where||'')+'</p>'+
      (t['response_'+k]||t.response_en?'<div class="say"><b>'+esc(U.say)+'</b>'+esc(t['response_'+k]||t.response_en)+'</div>':'')+
      '<span class="lnk">'+esc(U.seeTrick)+'</span>';
    box.appendChild(c2);
  }
}
function armToday(){
  // The section stays hidden until fresh data exists; the two JSON feeds are
  // large, so they are only fetched once the reader scrolls near this point.
  var anchor=$('gCheck'),start=function(){loadToday();};
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){if(es.some(function(x){return x.isIntersecting;})){io.disconnect();start();}},{rootMargin:'300px'});
    io.observe(anchor);
  }else{start();}
}

/* ---------- share ---------- */
$('shareBtn').addEventListener('click',function(){
  var txt=UI[L].share,url='https://lawsticker-ai.com/';
  try{gtag('event','home_share',{lang:L});}catch(e){}
  if(navigator.share){navigator.share({text:txt,url:url}).catch(function(){});}
  else{window.open('https://wa.me/?text='+encodeURIComponent(txt+'\n'+url),'_blank');}
});

renderAll();
armToday();
loadHits();

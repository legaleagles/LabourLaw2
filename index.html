<style>
:root{
  --bg:#FAF8F2;--surface:#FFFFFF;--surface2:#F3F0E6;--ink:#0F172A;--ink2:#334155;--muted:#667085;--line:#E9E4D6;
  --navy:#0A1020;--navy2:#16203A;--gold:#C9A227;--gold-l:#F7DE85;--gold-ink:#7A5A00;
  --up:#059669;--down:#DC2626;--flat:#D97706;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.07);
  --shadow-lg:0 2px 4px rgba(15,23,42,.05),0 22px 50px rgba(15,23,42,.13);
  --radius:22px;--tabh:66px;
  --serif:'Playfair Display','Noto Sans Telugu','Noto Sans Devanagari',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#080D18;--surface:#111A2C;--surface2:#18233B;--ink:#EEF2F8;--ink2:#C3CCDB;--muted:#8D9AB0;--line:#222E48;--gold-ink:#F7DE85;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 2px 4px rgba(0,0,0,.4),0 22px 50px rgba(0,0,0,.5);}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans','Noto Sans Telugu','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabh) + 34px)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}

/* NAV */
nav.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--navy) 82%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.07)}
.nav-in{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:#fff;letter-spacing:-.2px;margin-right:auto;white-space:nowrap}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--gold-l),var(--gold));display:grid;place-items:center;font-size:15px;box-shadow:0 4px 14px rgba(201,162,39,.4)}
.brand small{font-weight:600;font-size:11px;color:rgba(255,255,255,.5)}
.navlinks{display:none;gap:4px;margin-right:6px}
.navlinks a{color:rgba(255,255,255,.72);font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:999px;transition:background .15s,color .15s}
.navlinks a:hover{background:rgba(255,255,255,.08);color:#fff}
@media(min-width:900px){.navlinks{display:flex}}
.langs{display:flex;gap:2px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px}
.langs button{border:0;background:transparent;color:rgba(255,255,255,.62);font-weight:700;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;min-height:30px;transition:background .15s,color .15s}
.langs button.on{background:var(--gold-l);color:var(--navy)}
.navfb{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;height:36px;min-width:36px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer}
.navfb span{display:none}
@media(min-width:900px){.navfb{padding:0 14px}.navfb span{display:inline}}
@media(max-width:439px){.brand small{display:none}}

/* HERO */
.hero{position:relative;overflow:hidden;color:#fff;padding:34px 0 64px;background:var(--navy);border-radius:0 0 34px 34px}
.hero::before{content:"";position:absolute;inset:-20% -10% -10% -10%;background:
  radial-gradient(520px 340px at 88% 4%,rgba(201,162,39,.42),transparent 62%),
  radial-gradient(460px 320px at 4% 96%,rgba(56,130,246,.26),transparent 62%),
  radial-gradient(420px 300px at 60% 110%,rgba(16,185,129,.16),transparent 60%);animation:drift 16s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.11) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 78%);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 78%);pointer-events:none}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2.5%,2%,0) scale(1.07)}}
.hero .wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}.hero-grid>*{min-width:0}
@media(min-width:900px){.hero{padding:56px 0 86px}.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:26px 44px}.htext{align-self:end}.hero-grid .ask{grid-column:2;grid-row:1/3;align-self:center}.hero-grid .facts{grid-column:1;grid-row:2;align-self:start}}
.hero .badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--gold-l);background:rgba(247,222,133,.1);border:1px solid rgba(247,222,133,.28);padding:6px 13px;border-radius:999px;margin-bottom:16px}
.hero .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 0 4px rgba(52,211,153,.22)}
.hero h1{font-family:var(--serif);font-size:clamp(34px,8.6vw,62px);line-height:1.06;font-weight:800;letter-spacing:-.8px}
.hero h1 em{font-style:italic;background:linear-gradient(100deg,#FBE9A6,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
html[lang=te] .hero h1,html[lang=hi] .hero h1{line-height:1.25;font-size:clamp(28px,7vw,50px)}
html[lang=te] .hero h1 em,html[lang=hi] .hero h1 em{font-style:normal}
.hero p.sub{margin-top:14px;color:rgba(255,255,255,.74);font-size:15.5px;max-width:33em;line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px}
.fact{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);border-radius:16px;padding:10px 6px 9px;text-align:center}
.fact b{display:block;font-family:var(--serif);font-size:24px;font-weight:800;line-height:1.1;color:var(--gold-l)}
.fact span{display:block;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.62);margin-top:2px;line-height:1.25}
.ask{position:relative;border-radius:26px;padding:1.5px;background:linear-gradient(140deg,rgba(247,222,133,.75),rgba(255,255,255,.1) 38%,rgba(255,255,255,.06) 62%,rgba(247,222,133,.45));box-shadow:0 24px 60px rgba(0,0,0,.38)}
.ask-in{border-radius:24.5px;background:rgba(16,24,44,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:18px 16px 16px}
.ask-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ask-top .av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--gold-l),var(--gold));flex:none}
.ask-top b{display:block;font-size:15px;font-weight:800;color:#fff;line-height:1.2}
.ask-top small{display:block;font-size:12px;color:rgba(255,255,255,.6);font-weight:500;margin-top:1px}
.ask form{display:flex;gap:8px;background:#fff;border-radius:16px;padding:5px}
.ask input{flex:1;min-width:0;border:0;border-radius:12px;padding:11px 10px;font-size:15px;font-family:inherit;background:transparent;color:#0F172A;outline:none}
.ask input::placeholder{color:#7B8699}
.ask button.go{border:0;border-radius:12px;background:linear-gradient(135deg,#1B2A4E,var(--navy));color:var(--gold-l);font-weight:800;font-size:14px;padding:0 16px;cursor:pointer;min-height:44px;white-space:nowrap}
.ask .eg{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.ask .eg button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:rgba(255,255,255,.86);border-radius:999px;font-size:12px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s}
.ask .eg button:hover{background:rgba(255,255,255,.12);border-color:rgba(247,222,133,.5)}

/* SECTIONS */
section{margin-top:40px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh h2{font-family:var(--serif);font-size:clamp(22px,5.4vw,28px);font-weight:800;letter-spacing:-.3px;line-height:1.2}
.sh p{font-size:13.5px;color:var(--muted);margin-top:3px}
.sh a.more{font-size:12.5px;font-weight:700;color:var(--gold-ink);white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px}
.rv{opacity:1}
.js-rv .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.js-rv .rv.in{opacity:1;transform:none}

/* SPOTLIGHT: most used */
.spot{margin-top:-38px;position:relative;z-index:2}
.spot-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-lg);padding:16px 14px 14px}
.spot-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.spot-h h2{font-family:var(--serif);font-size:20px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.spot-h p{font-size:12.5px;color:var(--muted);margin-top:1px}
.spot-h .fl{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#FFF3C4,#FCD9A0);flex:none}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sp{position:relative;display:flex;flex-direction:column;gap:4px;border-radius:20px;padding:13px 13px 14px;min-height:124px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--c) 13%,var(--surface)),var(--surface) 70%);transition:transform .18s,box-shadow .18s}
.sp:hover,.sp:active{transform:translateY(-3px);box-shadow:var(--shadow)}
.sp .rk{position:absolute;top:10px;right:11px;font-family:var(--serif);font-weight:800;font-size:22px;line-height:1;color:color-mix(in srgb,var(--c) 55%,var(--muted));opacity:.55}
.sp .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:var(--surface);box-shadow:0 4px 12px color-mix(in srgb,var(--c) 26%,transparent)}
.sp .tt{font-weight:800;font-size:14.5px;letter-spacing:-.2px;line-height:1.2;margin-top:5px}
.sp .td{font-size:12px;color:var(--muted);line-height:1.35}
.sp.first{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:16px;color:#fff;border-color:transparent;background:radial-gradient(260px 180px at 100% 0,color-mix(in srgb,var(--c) 65%,transparent),transparent 70%),linear-gradient(135deg,var(--navy),var(--navy2))}
.sp.first .ic{width:58px;height:58px;border-radius:18px;font-size:31px;flex:none;background:rgba(255,255,255,.1);box-shadow:none}
.sp.first .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.sp.first .top{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.7px;color:var(--navy);background:linear-gradient(135deg,var(--gold-l),var(--gold));padding:3px 9px;border-radius:999px}
.sp.first .tt{font-family:var(--serif);font-size:20px;margin-top:2px}
.sp.first .td{color:rgba(255,255,255,.72);font-size:13px}
.sp.first .cta{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--navy);font-weight:800;font-size:18px}
@media(min-width:900px){
  .spot-card{padding:22px}
  .bento{grid-template-columns:1.25fr 1fr 1fr;gap:12px}
  .sp.first{grid-column:1;grid-row:1/3;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:24px;min-height:270px}
  .sp.first .ic{width:72px;height:72px;font-size:38px;margin-bottom:auto}
  .sp.first .tt{font-size:28px}.sp.first .td{font-size:14.5px}
  .sp.first .cta{position:absolute;right:22px;bottom:22px}.sp.first .tx{padding-right:54px}
  .sp{min-height:129px}
}

/* SITUATIONS */
.sits{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:560px){.sits{grid-template-columns:repeat(4,1fr)}}
@media(min-width:820px){.sits{grid-template-columns:repeat(6,1fr);gap:12px}}
.sit{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;text-align:center;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.25;transition:transform .18s,border-color .18s,box-shadow .18s}
.sit i{font-style:normal;font-size:24px;line-height:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.sit:hover,.sit:active{transform:translateY(-3px);border-color:var(--gold);box-shadow:var(--shadow)}
.sit:hover i{background:linear-gradient(135deg,#FFF3C4,#FCE2A8)}

/* TILES */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:12px}.grid.g5{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 15px;min-height:122px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.tile::after{content:"↗";position:absolute;right:13px;bottom:10px;font-size:14px;font-weight:800;color:var(--c,var(--gold));opacity:0;transform:translate(-4px,4px);transition:opacity .18s,transform .18s}
.tile:hover,.tile:active{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c,var(--gold)) 55%,var(--line))}
.tile:hover::after{opacity:1;transform:none}
.tile .ti{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--c,var(--gold)) 20%,var(--surface)),color-mix(in srgb,var(--c,var(--gold)) 8%,var(--surface)))}
.tile .tt{font-weight:800;font-size:14.5px;letter-spacing:-.2px;line-height:1.2;margin-top:5px}
.tile .td{font-size:12px;color:var(--muted);line-height:1.35}
.tile .new{position:absolute;top:11px;right:11px;font-size:9.5px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--c,var(--gold));padding:2px 8px;border-radius:999px}
.tile.hero-tile{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0;background:radial-gradient(240px 160px at 100% 0,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-color:transparent;padding:16px}
.tile.hero-tile::after{display:none}
.tile.hero-tile .td{color:rgba(255,255,255,.72);font-size:12.5px}
.tile.hero-tile .ti{width:54px;height:54px;font-size:29px;flex:none;background:rgba(255,255,255,.1)}
.tile.hero-tile .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile.hero-tile .tt{font-family:var(--serif);font-size:18px;margin:0}
.tile.hero-tile .go{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(247,222,133,.16);font-weight:800;color:var(--gold-l);font-size:17px}

/* CHIPS (calculators) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 15px 10px 12px;font-size:13.5px;font-weight:700;transition:transform .15s,border-color .15s,box-shadow .15s}
.chip i{font-style:normal;font-size:17px}
.chip:hover{border-color:var(--gold);box-shadow:var(--shadow);transform:translateY(-2px)}

/* TODAY */
.today{display:grid;gap:10px}
@media(min-width:700px){.today{grid-template-columns:1fr 1fr;gap:12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:transform .18s}
a.card:hover{transform:translateY(-3px)}
.card .kick{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card .kick .live{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px rgba(5,150,105,.18)}
.card h3{font-family:var(--serif);font-size:18px;font-weight:800;letter-spacing:-.2px;line-height:1.3}
.card p{font-size:13.5px;color:var(--ink2);margin-top:6px}
.leans{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.lean{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--surface2)}
.lean.up{color:var(--up)}.lean.down{color:var(--down)}.lean.flat{color:var(--flat)}
.say{margin-top:10px;background:var(--surface2);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.say b{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--gold-ink);margin-bottom:3px}
.card .lnk{display:inline-block;margin-top:12px;font-size:13px;font-weight:800;color:var(--gold-ink)}
.skel{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* STUDY */
details.lc{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px}
details.lc summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:14.5px;padding:13px 0}
details.lc summary::-webkit-details-marker{display:none}
details.lc summary::after{content:"＋";color:var(--gold-ink);font-size:18px}
details.lc[open] summary::after{content:"－"}
details.lc .chips{padding:0 0 14px}

/* HELP */
.help{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hbtn{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s}
.hbtn:hover{transform:translateY(-2px);border-color:var(--down)}
.hbtn b{font-family:var(--serif);font-size:21px;font-weight:800;color:var(--down)}
.hbtn span{font-size:11px;color:var(--muted);font-weight:700}
.help-more{display:block;margin-top:10px;text-align:center;font-size:13px;font-weight:800;color:var(--gold-ink)}

/* FEEDBACK + SHARE */
.duo{display:grid;gap:12px}

.fbcard{position:relative;overflow:hidden;border-radius:26px;padding:22px 18px;color:#fff;background:radial-gradient(360px 220px at 100% 0,rgba(201,162,39,.45),transparent 65%),radial-gradient(300px 200px at 0 100%,rgba(56,130,246,.24),transparent 65%),linear-gradient(135deg,var(--navy),var(--navy2))}

.fbcard p{font-size:13.5px;color:rgba(255,255,255,.74);margin-top:6px;max-width:34em;line-height:1.5}
.qstars{display:flex;align-items:center;gap:4px;margin-top:14px;flex-wrap:wrap}
.qstars button{background:none;border:0;font-size:34px;line-height:1;color:rgba(255,255,255,.28);cursor:pointer;padding:2px 3px;transition:color .12s,transform .12s}
.qstars button:hover,.qstars button.hv{color:var(--gold-l);transform:scale(1.12)}
.qstars small{font-size:12px;color:rgba(255,255,255,.6);margin-left:8px;font-weight:600}
.btn-gold{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--navy);font-weight:800;padding:13px 20px;font-size:14.5px;cursor:pointer;box-shadow:0 8px 22px rgba(201,162,39,.35);transition:transform .15s}
.btn-gold:hover{transform:translateY(-2px)}
.fbcard .btn-gold{margin-top:14px}
.sharecard{border-radius:26px;padding:22px 18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;gap:4px}
.sharecard b{font-family:var(--serif);font-size:21px;font-weight:800}
.sharecard span{font-size:13.5px;color:var(--muted)}
.sharecard button{align-self:flex-start;margin-top:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:14px;font-weight:800;padding:11px 18px;font-size:14px;cursor:pointer}
.sharecard button:hover{background:var(--ink);color:var(--bg)}

/* FEEDBACK SHEET */
.modal{position:fixed;inset:0;background:rgba(5,8,16,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:500px;border-radius:26px 26px 0 0;padding:10px 18px 22px;max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
@media(min-width:560px){.modal{align-items:center}.sheet{border-radius:26px;padding-top:22px}.sheet::before{display:none}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:23px;font-weight:800;line-height:1.2}
.sheet .ss{font-size:13px;color:var(--muted);margin:4px 0 14px}
.sheet label.fl{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:36px;line-height:1;cursor:pointer;color:var(--line);padding:2px;transition:transform .12s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(1.2)}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cats button{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer}
.cats button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface));color:var(--gold-ink)}
.sheet textarea,.sheet input[type=text]{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
.sheet textarea:focus,.sheet input[type=text]:focus{outline:0;border-color:var(--gold)}
.sheet textarea{min-height:104px;resize:vertical;display:block}
.cnt{font-size:11px;color:var(--muted);text-align:right;margin:3px 0 0}
.priv{font-size:11.5px;color:var(--muted);margin-top:5px}
.fmsg{font-size:13.5px;margin:12px 0 0;font-weight:700;min-height:1.2em}
.fmsg.err{color:var(--down)}.fmsg.ok{color:var(--up)}
.acts{display:flex;gap:9px;margin-top:12px}
.acts button{flex:1;border-radius:14px;padding:13px;font-weight:800;font-size:14.5px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.acts button.pri{flex:1.6;border:0;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--navy)}
.acts button:disabled{opacity:.55;cursor:default}

footer{margin-top:44px;padding:28px 0 8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function nm(slug){return C[slug][2][IDX[L]]||C[slug][2][0];}
function ds(slug){var d=C[slug][3];return (d&&(d[IDX[L]]||d[0]))||'';}
function tile(slug,big){
  var c=C[slug],a=el('a','tile'+(big?' hero-tile':''));
  a.href=slug+'.html';a.style.setProperty('--c',c[1]);a.dataset.slug=slug;
  var d=ds(slug);
  if(big){a.innerHTML='<span class="ti">'+c[0]+'</span><span class="tx"><span class="tt">'+esc(nm(slug))+'</span><span class="td">'+esc(d)+'</span></span><span class="go">→</span>';}
  else{a.innerHTML=(c[4]?'<span class="new">'+c[4]+'</span>':'')+'<span class="ti">'+c[0]+'</span><span class="tt">'+esc(nm(slug))+'</span>'+(d?'<span class="td">'+esc(d)+'</span>':'');}
  return a;
}
function chip(slug){var c=C[slug],a=el('a','chip','<i>'+c[0]+'</i>'+esc(nm(slug)));a.href=slug+'.html';a.dataset.slug=slug;return a;}

/* ---------- hits (GA4 via backend) with last-known cache so ordering never jumps ---------- */
var HITS=null; // array of slugs, most viewed first
var live=false;
try{var cc=JSON.parse(localStorage.getItem('lsTop')||'null');if(cc&&Date.now()-cc.t<2*864e5&&cc.s&&cc.s.length){HITS=cc.s;live=true;}}catch(e){}
function rank(list){
  if(!HITS)return list.slice();
  return list.map(function(s,i){var h=HITS.indexOf(s);return {s:s,k:h<0?1e6+i:h};}).sort(function(a,b){return a.k-b.k;}).map(function(x){return x.s;});
}
function loadHits(){
  var ctl=('AbortController' in window)?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},5000);
  fetch(BACKEND+'/api/top-pages?days=7',ctl?{signal:ctl.signal}:{}).then(function(r){return r.json();}).then(function(d){
    clearTimeout(tm);
    if(!d||!d.ok||!d.pages)return;
    var s=d.pages.map(function(p){return p.slug;}).filter(function(x){return C[x]&&x!=='calculators';});
    if(s.length>=3){HITS=s;live=true;try{localStorage.setItem('lsTop',JSON.stringify({t:Date.now(),s:s}));}catch(e){}renderTrend();}
  }).catch(function(){});
}

/* ---------- render ---------- */
var SPOT=[];
function renderTrend(){
  var U=UI[L],g=$('spotGrid');g.innerHTML='';
  var list=SPOT=(live&&HITS?HITS:FALLBACK_TREND).filter(function(x){return C[x];}).slice(0,5);
  $('trendT').textContent=live?U.trendLive:U.trendFb;
  $('spotS').textContent=live?U.spotLive:U.spotFb;
  $('spotIc').textContent=live?'🔥':'⭐';
  list.forEach(function(sl,i){
    var c=C[sl],a=el('a','sp'+(i===0?' first':''));a.href=sl+'.html';a.style.setProperty('--c',c[1]);a.dataset.slug=sl;
    if(i===0)a.innerHTML='<span class="ic">'+c[0]+'</span><span class="tx"><span class="top">'+esc(live?U.top1Live:U.top1Fb)+'</span><span class="tt">'+esc(nm(sl))+'</span><span class="td">'+esc(ds(sl))+'</span></span><span class="cta">→</span>';
    else a.innerHTML=(live?'<span class="rk">'+(i+1)+'</span>':'')+'<span class="ic">'+c[0]+'</span><span class="tt">'+esc(nm(sl))+'</span><span class="td">'+esc(ds(sl))+'</span>';
    a.addEventListener('click',function(){try{gtag('event','home_spot',{slug:sl,pos:i+1,live:live});}catch(e){}});
    g.appendChild(a);
  });
}
function renderAll(){
  var U=UI[L];
  document.documentElement.lang=L;
  document.querySelectorAll('[data-k]').forEach(function(n){var v=U[n.dataset.k];if(v==null)return;if(n.hasAttribute('data-html'))n.innerHTML=v;else n.textContent=v;});
  document.querySelectorAll('.langs button').forEach(function(b){b.classList.toggle('on',b.dataset.l===L);});
  $('askQ').placeholder=U.askPh;$('fmMsg').placeholder=U.fmMsgPh;$('fmContact').placeholder=U.fmContactPh;buildFb();
  var eg=$('askEg');eg.innerHTML='';
  U.egs.forEach(function(e){var b=el('button',null,e[0]+' '+esc(e[1]));b.type='button';b.onclick=function(){$('askQ').value=e[2];go(e[2]);};eg.appendChild(b);});
  renderTrend();
  var s=$('sits');s.innerHTML='';
  SITS.forEach(function(x){var a=el('a','sit','<i>'+x[0]+'</i>'+esc(x[1+IDX[L]]));a.href=x[4]+'.html';s.appendChild(a);});
  var gc=$('gCheck');gc.innerHTML='';
  // The wide card goes to the best-ranked checker that is not already in the spotlight above.
  var order=rank(G.check),hi=0;
  for(var oi=0;oi<order.length;oi++){if(SPOT.indexOf(order[oi])<0){hi=oi;break;}}
  order.unshift(order.splice(hi,1)[0]);
  order.forEach(function(sl,i){gc.appendChild(tile(sl,i===0));});
  var gcal=$('gCalc');gcal.innerHTML='';G.calc.forEach(function(sl){gcal.appendChild(chip(sl));});
  var ga=$('gAct');ga.innerHTML='';rank(G.act).forEach(function(sl){ga.appendChild(tile(sl));});
  var gs=$('gStudy');gs.innerHTML='';G.study.forEach(function(sl){gs.appendChild(tile(sl));});
  var gl=$('gLawcet');gl.innerHTML='';LAWCET.forEach(function(x){var a=el('a','chip',esc(x[1]));a.href=x[0]+'.html';gl.appendChild(a);});
  renderToday();
}

/* ---------- Fresh-or-hidden daily cards ---------- */
var TD={gold:null,trick:null},todayLoaded=false;
function ageDays(iso){var t=Date.parse(iso);return isNaN(t)?1e9:(Date.now()-t)/864e5;}
function loadToday(){
  if(todayLoaded)return;todayLoaded=true;
  var p1=fetch('metal-direction.json?t='+Math.floor(Date.now()/36e5)).then(function(r){return r.json();}).then(function(d){
    var h=d.history||{},ks=Object.keys(h).sort(),e=ks.length?h[ks[ks.length-1]]:null;
    if(e&&ageDays(e.generated_at)<=3)TD.gold=e;
  }).catch(function(){});
  var p2=fetch('marketing-tricks.json?t='+Math.floor(Date.now()/36e5)).then(function(r){return r.json();}).then(function(d){
    var en=(d.entries||[]).filter(function(x){return x.origin_date;}).sort(function(a,b){return a.origin_date<b.origin_date?-1:1;}),e=en[en.length-1];
    if(e&&ageDays(e.origin_date+'T00:00:00')<=7)TD.trick=e;
  }).catch(function(){});
  Promise.all([p1,p2]).then(renderToday);
}
function renderToday(){
  if(!todayLoaded)return;
  var U=UI[L],box=$('todayCards'),sec=$('today');box.innerHTML='';
  if(!TD.gold&&!TD.trick){sec.hidden=true;return;}
  sec.hidden=false;
  var k=IDX[L]===0?'en':L;
  if(TD.gold){
    var g=TD.gold,lean=function(v){return v==='up'?['up','▲ '+U.up]:v==='down'?['down','▼ '+U.down]:['flat','▬ '+U.flat];},gl=lean(g.gold_lean),sl=lean(g.silver_lean);
    var c=el('a','card');c.href='metal-direction.html';
    c.innerHTML='<div class="kick"><span class="live"></span>'+esc(U.gold)+'</div><h3>'+esc(g['headline_'+k]||g.headline_en||'')+'</h3>'+
      '<div class="leans"><span class="lean '+gl[0]+'">'+esc(U.gld)+' '+gl[1]+'</span><span class="lean '+sl[0]+'">'+esc(U.slv)+' '+sl[1]+'</span></div>'+
      '<span class="lnk">'+esc(U.seeMore)+'</span>';
    box.appendChild(c);
  }
  if(TD.trick){
    var t=TD.trick,c2=el('a','card');c2.href='smart-shopper.html';
    c2.innerHTML='<div class="kick"><span class="live"></span>'+esc(U.trick)+'</div><h3>'+esc(t['title_'+k]||t.title_en||'')+'</h3>'+
      '<p>'+esc(t.where||'')+'</p>'+
      (t['response_'+k]||t.response_en?'<div class="say"><b>'+esc(U.say)+'</b>'+esc(t['response_'+k]||t.response_en)+'</div>':'')+
      '<span class="lnk">'+esc(U.seeTrick)+'</span>';
    box.appendChild(c2);
  }
}
function armToday(){
  // The section stays hidden until fresh data exists; the two JSON feeds are
  // large, so they are only fetched once the reader scrolls near this point.
  var anchor=$('gCheck'),start=function(){loadToday();};
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){if(es.some(function(x){return x.isIntersecting;})){io.disconnect();start();}},{rootMargin:'300px'});
    io.observe(anchor);
  }else{start();}
}

}
function openFb(rating){
  FB.last=document.activeElement;FB.rating=rating||0;FB.cat=rating>=4?'praise':'other';buildFb();
  $('fmOut').textContent='';$('fmOut').className='fmsg';$('fmSend').disabled=false;
  $('fbModal').classList.remove('hidden');document.body.style.overflow='hidden';
  try{gtag('event','home_fb_open',{rating:FB.rating});}catch(e){}
  setTimeout(function(){$('fmMsg').focus();},60);
}
function closeFb(){$('fbModal').classList.add('hidden');document.body.style.overflow='';if(FB.last&&FB.last.focus)FB.last.focus();}
function sendFb(){
  if(FB.sending)return;var U=UI[L],out=$('fmOut'),msg=$('fmMsg').value.trim();
  if(!FB.rating&&msg.length<5){out.textContent=U.fmNeed;out.className='fmsg err';return;}
  if((FB.cat==='bug'||FB.cat==='wrong_info'||FB.cat==='request')&&msg.length<5){out.textContent=U.fmNeedMsg;out.className='fmsg err';return;}
  FB.sending=true;$('fmSend').disabled=true;out.textContent=U.fmSending;out.className='fmsg';
  fetch(BACKEND+'/api/site-feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating:FB.rating,category:FB.cat,message:msg,contact:$('fmContact').value,website:$('fmWebsite').value,page:'home',lang:L})})
   .then(function(r){return r.json().then(function(j){return {ok:r.ok&&j&&j.ok,j:j||{}};});})
   .then(function(x){
     FB.sending=false;
     if(x.ok){out.textContent=U.fmThanks;out.className='fmsg ok';$('fmMsg').value='';$('fmContact').value='';$('fmCnt').textContent='0';try{gtag('event','home_fb_sent',{rating:FB.rating,cat:FB.cat});}catch(e){}setTimeout(closeFb,1800);}
     else{out.textContent=x.j.code==='need_input'?U.fmNeed:x.j.code==='need_message'?U.fmNeedMsg:x.j.code==='rate'?U.fmRateLim:U.fmFail;out.className='fmsg err';$('fmSend').disabled=false;}
   }).catch(function(){FB.sending=false;out.textContent=U.fmFail;out.className='fmsg err';$('fmSend').disabled=false;});
}
$('fmStars').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var n=+b.dataset.star;FB.rating=FB.rating===n?0:n;buildFb();});
$('fmCats').addEventListener('click',function(e){var b=e.target.closest('button');if(b){FB.cat=b.dataset.cat;buildFb();}});
$('fmMsg').addEventListener('input',function(){$('fmCnt').textContent=this.value.length;});
$('fmCancel').addEventListener('click',closeFb);$('fmSend').addEventListener('click',sendFb);
$('fbModal').addEventListener('click',function(e){if(e.target===this)closeFb();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('fbModal').classList.contains('hidden'))closeFb();});
['navFb','fbOpen','footFb'].forEach(function(id){$(id).addEventListener('click',function(){openFb(0);});});
(function(){
  var q=$('qStars'),bs=[].slice.call(q.querySelectorAll('button'));
  function paint(n){bs.forEach(function(b){b.classList.toggle('hv',+b.dataset.q<=n);});}
  q.addEventListener('mouseover',function(e){var b=e.target.closest('button');if(b)paint(+b.dataset.q);});
  q.addEventListener('mouseleave',function(){paint(0);});
  q.addEventListener('click',function(e){var b=e.target.closest('button');if(b){paint(0);openFb(+b.dataset.q);}});
})();

renderAll();
/* ---------- gentle reveal on scroll ---------- */
(function(){
  var secs=[].slice.call(document.querySelectorAll('main > section'));
  var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(calm||!('IntersectionObserver' in window))return;
  secs.forEach(function(x){x.classList.add('rv');});
  document.documentElement.classList.add('js-rv');
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}});},{rootMargin:'0px 0px -6% 0px'});
  secs.forEach(function(x){io.observe(x);});
  // Safety net: never leave content hidden if the observer does not fire.
  setTimeout(function(){secs.forEach(function(x){var r=x.getBoundingClientRect();if(r.top<innerHeight)x.classList.add('in');});},1200);
})();
armToday();
loadHits();
// If the page loaded with a hash (tab bar), make sure sections exist before scrolling.
if(location.hash){setTimeout(function(){var t=document.querySelector(location.hash);if(t)t.scrollIntoView();},60);}
})();
</script>

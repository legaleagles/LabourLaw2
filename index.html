   ['निकालने के लिए मकान मालिक का यूटिलिटी काटना आपराधिक बल है।','TP अधिनियम 1882 · IPC'],
   ['रेस्तरां सर्विस चार्ज वैकल्पिक है — देने से मना कर सकते हैं।','CCPA दिशानिर्देश 2022'],
   ['गिरफ्तार? 24 घंटे में मजिस्ट्रेट के सामने पेशी अनिवार्य।','अनुच्छेद 22 · CrPC 57'],
   ['RTI से ₹10 में 30 दिनों में कोई भी सरकारी जानकारी पाएं।','RTI अधिनियम 2005'],
   ['बिल्डर की देरी? रिफंड + ब्याज लेकर निकलें।','RERA 2016 धारा 18'],
   ['अनधिकृत बैंक लेनदेन 3 दिन में रिपोर्ट = शून्य देनदारी।','RBI सर्कुलर 2017'],
  ]},
};

let L='en', tagIdx=0, tagTimer=null;

function dayOfYear(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000);}

function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}

function render(){
 const U=UI[L];
 document.getElementById('navSub').textContent=U.navSub;
 document.getElementById('heroBadge').textContent=U.heroBadge;
 document.getElementById('heroTitle').innerHTML=U.heroTitle;
 document.getElementById('heroSub').textContent=U.heroSub;
 document.getElementById('ctaRights').textContent=U.ctaRights;
 document.getElementById('ctaRemedies').textContent=U.ctaRemedies;
 ['st1','st2','st3','st4','jEye','jTitle','jSub','j1k','j1t','j1d','j2k','j2t','j2d',
  'j3k','j3t','j3d','sEye','sTitle','sSub','tBadge','tCta','fEye','fTitle',
  'f1n','f1d','f2n','f2d','f3n','f3d','f4n','f4d','f5n','f5d',
  'hHd','h1','h2','h3','h4','ftTag','ftDisc'].forEach(id=>{
   const el=document.getElementById(id);if(el&&U[id]!==undefined)el.textContent=U[id];});
 // Situation grid
 document.getElementById('sitGrid').innerHTML=U.sits.map(([icon,name,url])=>
  `<a class="sit" href="https://lawsticker-ai.com/${url}"><span class="sit-icon">${icon}</span><span class="sit-name">${name}</span></a>`).join('');
 // Today's fact
 const f=U.facts[dayOfYear()%U.facts.length];
 document.getElementById('tFact').textContent=f[0];
 document.getElementById('tLaw').textContent='📋 '+f[1];
 // Rotating tagline
 rotateTag(true);
}

function rotateTag(reset){
 const tags=UI[L].heroTags;
 if(reset){tagIdx=0;if(tagTimer)clearInterval(tagTimer);
  tagTimer=setInterval(()=>rotateTag(false),3500);}
 const el=document.getElementById('heroTag');
 el.style.opacity=0;
 setTimeout(()=>{el.textContent=tags[tagIdx%tags.length];el.style.transition='opacity .5s';el.style.opacity=1;tagIdx++;},reset?0:400);
}

document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>

<style>
:root{--navy:#0D1117;--navy2:#131B29;--ink:#111827;--ink2:#374151;--cream:#FEFCF5;--muted:#6B7280;
--border:#D1D5DB;--light:#F3F4F6;--gold:#C9A227;--gold-l:#F5D76E;--gold-pale:#FDF6DC;--gold-d:#8B6914;
--jade:#059669;--jade-bg:#ECFDF5;--sky:#0EA5E9;--sky-bg:#F0F9FF;--rose:#DC2626;--violet:#7C3AED;--amber:#D97706;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans','Noto Sans Telugu','Noto Sans Devanagari',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* NAV */
nav{background:var(--navy);position:sticky;top:0;z-index:200;}
.nav-r1{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;}
.nav-brand{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--gold-l);}
.nav-brand span{color:rgba(255,255,255,.5);font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;}
.nav-langs{display:flex;gap:5px;}
.nav-lang{padding:5px 11px;border-radius:14px;border:1px solid rgba(201,162,39,.2);background:transparent;
color:rgba(255,255,255,.35);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;}
.nav-lang.active{border-color:var(--gold);color:var(--navy);background:var(--gold);}

/* HERO */
.hero{background:linear-gradient(135deg,#0D1117 0%,#1a2436 40%,#2a2410 75%,#0D1117 100%);
background-size:300% 300%;animation:heroShift 14s ease infinite;
padding:44px 22px 40px;text-align:center;position:relative;overflow:hidden;}
@keyframes heroShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.hero::before,.hero::after{pointer-events:none;}
.hero::before{content:'⚖️';position:absolute;left:-25px;top:-25px;font-size:150px;opacity:.05;transform:rotate(-12deg);}
.hero::after{content:'🛠️';position:absolute;right:-20px;bottom:-30px;font-size:150px;opacity:.05;transform:rotate(12deg);}
.hero-badge{display:inline-block;background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.35);
color:var(--gold-l);font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;
padding:6px 16px;border-radius:20px;margin-bottom:16px;}
.hero-title{font-family:'Playfair Display',serif;font-size:31px;font-weight:900;color:white;line-height:1.15;margin-bottom:6px;}
.hero-title .gold{color:var(--gold-l);}
.hero-tag{font-size:15px;color:rgba(255,255,255,.85);font-weight:700;margin-bottom:6px;min-height:24px;}
.hero-sub{font-size:12.5px;color:rgba(255,255,255,.45);line-height:1.75;max-width:440px;margin:0 auto 20px;}
.hero-cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero-cta{padding:13px 24px;border-radius:12px;font-family:inherit;font-size:14px;font-weight:800;
text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.hero-cta.primary{background:var(--gold);color:var(--navy);}
.hero-cta.ghost{background:rgba(255,255,255,.06);color:white;border:1px solid rgba(255,255,255,.15);}
.hero-cta:active{transform:scale(.97);}

/* STATS STRIP */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy2);
border-top:1px solid rgba(201,162,39,.2);padding:14px 8px;}
.stat{text-align:center;}
.stat-n{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--gold-l);}
.stat-l{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

.page{max-width:700px;margin:0 auto;padding:20px 14px 96px;}
.sec-eyebrow{font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px;text-align:center;}
.sec-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:900;color:var(--navy);text-align:center;margin-bottom:4px;}
.sec-sub{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;max-width:420px;margin:0 auto 18px;}

/* JOURNEY: KNOW → ACT → CALCULATE */
.journey{position:relative;margin:6px 0 30px;}
.journey::before{content:'';position:absolute;left:31px;top:28px;bottom:28px;width:3px;
background:linear-gradient(180deg,var(--gold),var(--jade),var(--sky));border-radius:2px;}
.j-step{display:flex;gap:16px;margin-bottom:14px;position:relative;text-decoration:none;}
.j-num{width:62px;height:62px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
justify-content:center;font-size:26px;border:3px solid;background:#fff;z-index:1;
box-shadow:0 4px 14px rgba(0,0,0,.1);}
.j-step:nth-child(1) .j-num{border-color:var(--gold);}
.j-step:nth-child(2) .j-num{border-color:var(--jade);}
.j-step:nth-child(3) .j-num{border-color:var(--sky);}
.j-card{flex:1;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;
box-shadow:0 2px 10px rgba(0,0,0,.05);transition:all .2s;}
.j-step:active .j-card{transform:scale(.98);}
.j-k{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;}
.j-step:nth-child(1) .j-k{color:var(--gold-d);}
.j-step:nth-child(2) .j-k{color:var(--jade);}
.j-step:nth-child(3) .j-k{color:var(--sky);}
.j-t{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:3px;}
.j-d{font-size:12px;color:var(--muted);line-height:1.6;}
.j-arr{font-size:15px;color:var(--gold);font-weight:800;float:right;margin-top:-24px;}

/* SITUATION PICKER */
.sit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:30px;}
.sit{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:13px 8px;
text-align:center;text-decoration:none;transition:all .2s;}
.sit:hover{border-color:var(--gold);background:var(--gold-pale);}
.sit:active{transform:scale(.96);}
.sit-icon{font-size:26px;display:block;margin-bottom:5px;}
.sit-name{font-size:10.5px;font-weight:800;color:var(--ink);line-height:1.3;}

/* TODAY'S RIGHT */
.today{background:linear-gradient(135deg,var(--navy),#1a2436);border-radius:20px;padding:22px 20px;
margin-bottom:30px;position:relative;overflow:hidden;border:1px solid rgba(201,162,39,.3);}
.today::before{pointer-events:none;content:'💡';position:absolute;right:-15px;bottom:-20px;font-size:120px;opacity:.07;}
.today-badge{display:inline-block;background:var(--gold);color:var(--navy);font-size:9px;font-weight:900;
letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:12px;margin-bottom:12px;}
.today-fact{font-size:16px;font-weight:700;color:white;line-height:1.6;margin-bottom:10px;}
.today-law{font-size:11px;color:var(--gold-l);font-weight:600;margin-bottom:16px;}
.today-cta{display:inline-flex;align-items:center;gap:6px;background:rgba(201,162,39,.15);
border:1px solid rgba(201,162,39,.4);color:var(--gold-l);font-size:12px;font-weight:800;
padding:9px 16px;border-radius:10px;text-decoration:none;}



/* LAWCET SEASON BANNER — self-expiring, remove after counselling window */
.lawcet-band{background:linear-gradient(90deg,#7C2D12,#C2410C,#7C2D12);background-size:200% 100%;
animation:lawcetShift 6s ease infinite;padding:10px 14px;text-align:center;position:relative;overflow:hidden;}
@keyframes lawcetShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.lawcet-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
.lawcet-badge{background:#FDE047;color:#7C2D12;font-size:9px;font-weight:900;letter-spacing:1.5px;
padding:3px 9px;border-radius:10px;text-transform:uppercase;animation:lawcetPulse 1.8s ease infinite;flex-shrink:0;}
@keyframes lawcetPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.lawcet-text{font-size:12px;font-weight:800;color:#FFF7ED;}
.lawcet-links{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;margin-top:6px;}
.lawcet-link{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);
border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:700;padding:6px 11px;
border-radius:16px;text-decoration:none;}
.lawcet-link:active{background:rgba(255,255,255,.28);}

/* LAWCET TOOLS STRIP (mid-page, richer cards) */
.lawcet-strip{background:linear-gradient(145deg,#7C2D12,#9A3412);border-radius:18px;padding:16px;margin-bottom:24px;
border:1.5px solid #FDE047;position:relative;overflow:hidden;}
.lawcet-strip::before{content:'🎓';position:absolute;right:-10px;top:-15px;font-size:110px;opacity:.08;pointer-events:none;}
.lawcet-strip-hd{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.lawcet-strip-badge{background:#FDE047;color:#7C2D12;font-size:9px;font-weight:900;letter-spacing:1.5px;
padding:3px 10px;border-radius:10px;text-transform:uppercase;}
.lawcet-strip-title{font-size:15px;font-weight:900;color:#FFF7ED;}
.lawcet-strip-sub{font-size:11.5px;color:rgba(255,247,237,.7);line-height:1.6;margin-bottom:12px;}
.lawcet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lawcet-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:12px;
padding:11px;text-decoration:none;transition:all .2s;}
.lawcet-card:active{background:rgba(255,255,255,.18);transform:scale(.97);}
.lawcet-card-icon{font-size:22px;display:block;margin-bottom:4px;}
.lawcet-card-name{font-size:12px;font-weight:800;color:#fff;line-height:1.3;}
.lawcet-card-desc{font-size:10px;color:rgba(255,247,237,.65);margin-top:2px;line-height:1.4;}
.lawcet-countdown{font-size:10px;color:#FDE047;font-weight:700;text-align:center;margin-top:10px;}

/* TICKER */
.ticker-wrap{background:var(--navy);border-top:1px solid rgba(201,162,39,.15);
border-bottom:2px solid var(--gold);overflow:hidden;position:relative;}
.ticker-label{position:absolute;left:0;top:0;bottom:0;background:var(--gold);color:var(--navy);
font-size:9px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;
padding:0 10px;z-index:2;text-transform:uppercase;}
.ticker{display:flex;white-space:nowrap;animation:tick 40s linear infinite;padding:9px 0;will-change:transform;}
@media(hover:hover){.ticker:hover{animation-play-state:paused;}}
.ticker a{color:rgba(255,255,255,.75);font-size:12px;font-weight:600;text-decoration:none;
padding:0 26px;position:relative;}
.ticker a::after{content:'•';position:absolute;right:-4px;color:var(--gold);}
.ticker a b{color:var(--gold-l);}
@keyframes tick{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}


/* DAILY QUIZ */
.quiz{background:#fff;border:2px solid var(--gold);border-radius:20px;padding:20px 18px;
margin-bottom:30px;box-shadow:0 6px 24px rgba(201,162,39,.15);}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.quiz-badge{background:var(--navy);color:var(--gold-l);font-size:9px;font-weight:900;
letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border-radius:12px;}
.quiz-streak{font-size:12px;font-weight:800;color:var(--amber);}
.quiz-q{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:14px;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{background:var(--light);border:2px solid var(--border);border-radius:12px;
padding:12px 14px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink2);
cursor:pointer;text-align:left;transition:all .2s;}
.quiz-opt:active{transform:scale(.98);}
.quiz-opt.correct{background:var(--jade-bg);border-color:var(--jade);color:var(--jade-d,#065F46);}
.quiz-opt.wrong{background:#FEF2F2;border-color:var(--rose);color:#991B1B;}
.quiz-opt:disabled{cursor:default;opacity:.85;}
.quiz-reveal{display:none;margin-top:14px;}
.quiz-reveal.show{display:block;}
.quiz-verdict{font-size:14px;font-weight:900;margin-bottom:6px;}
.quiz-verdict.win{color:var(--jade);}
.quiz-verdict.lose{color:var(--rose);}
.quiz-expl{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:10px;}
.quiz-law{font-size:11px;color:var(--gold-d);font-weight:700;margin-bottom:12px;}
.quiz-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.quiz-share{background:#25D366;color:#fff;border:none;border-radius:10px;padding:11px;
font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;}
.quiz-more{display:flex;align-items:center;justify-content:center;background:var(--gold-pale);
border:1.5px solid var(--gold);color:var(--gold-d);border-radius:10px;padding:11px;
font-size:12px;font-weight:800;text-decoration:none;}
.quiz-done-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;}

/* TODAY BUNDLE */
.tb-chips{display:grid;grid-template-columns:1fr;gap:7px;margin:14px 0 14px;}
.tb-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;text-decoration:none;transition:all .2s;}
.tb-chip:active{transform:scale(.98);}
.tb-chip-icon{font-size:19px;flex-shrink:0;}
.tb-chip-k{font-size:8.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4);}
.tb-chip-v{font-size:12px;font-weight:700;color:white;line-height:1.35;}
.tb-chip-arr{margin-left:auto;color:var(--gold-l);font-weight:800;flex-shrink:0;}
.today-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.today-share{display:flex;align-items:center;justify-content:center;gap:6px;background:#25D366;
color:white;font-size:12px;font-weight:800;padding:11px;border-radius:10px;border:none;
font-family:inherit;cursor:pointer;}
.today-share:active{transform:scale(.97);}

/* FEATURE SHOWCASE */
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:30px;}
.feat{border-radius:16px;padding:16px 14px;text-decoration:none;position:relative;overflow:hidden;
border:1px solid var(--border);background:#fff;transition:all .2s;}
.feat:active{transform:scale(.97);}
.feat.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;}
.feat-icon{font-size:30px;margin-bottom:8px;display:block;}
.feat.wide .feat-icon{margin-bottom:0;font-size:36px;flex-shrink:0;}
.feat-name{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:3px;}
.feat-desc{font-size:11px;color:var(--muted);line-height:1.55;}
.feat-new{position:absolute;top:10px;right:10px;background:var(--rose);color:white;font-size:8px;
font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:8px;}
.f-gold{border-color:rgba(201,162,39,.4);background:linear-gradient(135deg,#FDF6DC,#fff);}
.f-jade{border-color:rgba(5,150,105,.35);background:linear-gradient(135deg,#ECFDF5,#fff);}
.f-sky{border-color:rgba(14,165,233,.35);background:linear-gradient(135deg,#F0F9FF,#fff);}
.f-violet{border-color:rgba(124,58,237,.3);background:linear-gradient(135deg,#F5F3FF,#fff);}


/* STUDY CORNER */
.study-strip{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0D1117,#1a2436);
border:1px solid rgba(201,162,39,.3);border-radius:16px;padding:15px 16px;margin-bottom:30px;
text-decoration:none;}
.study-icon{font-size:32px;flex-shrink:0;}
.study-name{font-size:14px;font-weight:800;color:var(--gold-l);}
.study-desc{font-size:11px;color:rgba(255,255,255,.5);line-height:1.5;margin-top:2px;}
.study-arr{margin-left:auto;color:var(--gold-l);font-size:18px;font-weight:800;flex-shrink:0;}

/* HELPLINE STRIP */
.help-strip{background:#fff;border:1.5px solid var(--rose);border-radius:16px;padding:14px;margin-bottom:30px;}
.help-hd{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--rose);margin-bottom:10px;text-align:center;}
.help-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.help-btn{text-align:center;text-decoration:none;padding:8px 4px;border-radius:10px;background:#FEF2F2;transition:all .2s;}
.help-btn:active{transform:scale(.95);}
.help-num{font-size:15px;font-weight:900;color:var(--rose);display:block;}
.help-lbl{font-size:8.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;}

/* FOOTER */
.footer{text-align:center;padding:10px 20px 0;}
.footer-brand{font-family:'Playfair Display',serif;font-size:15px;font-weight:900;color:var(--navy);margin-bottom:4px;}
.footer-tag{font-size:11px;color:var(--gold-d);font-weight:700;margin-bottom:8px;}
.footer-disc{font-size:10px;color:var(--muted);line-height:1.7;max-width:400px;margin:0 auto;}
.footer-yt{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;font-weight:700;
color:var(--rose);text-decoration:none;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,17,30,.98);
border-top:1px solid rgba(255,255,255,.08);padding:8px 0 12px;display:flex;
justify-content:space-around;align-items:center;z-index:100;}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 10px;}
.bn-icon{font-size:20px;}
.bn-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.5px;text-transform:uppercase;}
.bn-lbl.active{color:rgba(201,162,39,.85);}

@media(min-width:520px){.sit-grid{grid-template-columns:repeat(4,1fr);}}
</style>

function renderLawcet(){
 const now = new Date();
 const band = document.getElementById('lawcetBand');
 const strip = document.getElementById('lawcetStrip');
 if(now > LAWCET_END){
  if(band) band.style.display='none';
  if(strip) strip.parentElement.style.display='none';
  return;
 }
 const U = LAWCET_UI[L] || LAWCET_UI.en;
 const daysLeft = Math.max(1, Math.ceil((LAWCET_END - now) / 86400000));
 const ids1 = {lcBadge:U.badge,lcText:U.text,lcL1:U.l1,lcL2:U.l2,lcL3:U.l3};
 for(const id in ids1){const el=document.getElementById(id);if(el)el.textContent=ids1[id];}
 const ids2 = {lsBadge:U.stripBadge,lsTitle:U.stripTitle,lsSub:U.stripSub,
  lc1n:U.c1n,lc1d:U.c1d,lc2n:U.c2n,lc2d:U.c2d,lc3n:U.c3n,lc3d:U.c3d,lc4n:U.c4n,lc4d:U.c4d};
 for(const id in ids2){const el=document.getElementById(id);if(el)el.textContent=ids2[id];}
 const cd = document.getElementById('lcCountdown');
 if(cd) cd.textContent = U.countdown(daysLeft);
}

let L='en', tagIdx=0, tagTimer=null;

function dayOfYear(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000);}

function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}

function render(){
 const U=UI[L];
 document.getElementById('navSub').textContent=U.navSub;
 document.getElementById('heroBadge').textContent=U.heroBadge;
 document.getElementById('heroTitle').innerHTML=U.heroTitle;
 document.getElementById('heroSub').textContent=U.heroSub;
 document.getElementById('ctaRights').textContent=U.ctaRights;
 document.getElementById('ctaRemedies').textContent=U.ctaRemedies;
 ['st1','st2','st3','st4','jEye','jTitle','jSub','j1k','j1t','j1d','j2k','j2t','j2d',
  'j3k','j3t','j3d','sEye','sTitle','sSub','tBadge','tCta','fEye','fTitle',
  'f1n','f1d','f2n','f2d','f3n','f3d','f4n','f4d','f5n','f5d','f6n','f6d','f7n','f7d',
  'hHd','h1','h2','h3','h4','ftTag','ftDisc','stuN','stuD','chalN','chalD','quizChip'].forEach(id=>{
   const el=document.getElementById(id);if(el&&U[id]!==undefined)el.textContent=U[id];});
 // Situation grid
 document.getElementById('sitGrid').innerHTML=U.sits.map(([icon,name,url])=>
  `<a class="sit" href="https://lawsticker-ai.com/${url}"><span class="sit-icon">${icon}</span><span class="sit-name">${name}</span></a>`).join('');
 // Today's bundle: fact + right + remedy + calc + helpline
 const B=BUNDLES[dayOfYear()%BUNDLES.length];
 document.getElementById('tFact').textContent=B.f[L];
 document.getElementById('tLaw').textContent='📋 '+B.l;
 const KB=UI[L].bundleK;
 document.getElementById('tbRight').href='https://lawsticker-ai.com/'+B.ru;
 document.getElementById('tbRightK').textContent=KB[0];
 document.getElementById('tbRightV').textContent=B.rn[L];
 document.getElementById('tbRemedyK').textContent=KB[1];
 document.getElementById('tbRemedyV').textContent=B.mn[L];
 document.getElementById('tbCalc').href='https://lawsticker-ai.com/'+B.cu;
 document.getElementById('tbCalcK').textContent=KB[2];
 document.getElementById('tbCalcV').textContent=B.cn[L];
 document.getElementById('tbHelp').href='tel:'+B.hp.replace(/-/g,'');
 document.getElementById('tbHelpK').textContent=KB[3];
 document.getElementById('tbHelpV').textContent=B.hn[L]+' · '+B.hp;
 document.getElementById('tShare').textContent=UI[L].tShare;
 // Ticker: rotate start position daily so it feels fresh every day
 const start=dayOfYear()%BUNDLES.length;
 const items=[...BUNDLES.slice(start),...BUNDLES.slice(0,start)];
 const tickerHTML=items.map(b=>`<a href="https://lawsticker-ai.com/${b.ru}"><b>${UI[L].tickPrefix}</b> ${b.f[L]}</a>`).join('');
 const tEl=document.getElementById('ticker');
 tEl.innerHTML=tickerHTML+tickerHTML; // duplicate for seamless loop
 document.getElementById('tickLabel').textContent=UI[L].tickLabel;
 // Constant speed regardless of content length: 130 px/sec
 requestAnimationFrame(()=>{
   const half=tEl.scrollWidth/2;
   if(half>0)tEl.style.animationDuration=Math.max(20,Math.round(half/130))+'s';
 });
 renderQuiz();
 // Rotating tagline
 rotateTag(true);
 renderLawcet();
}

function rotateTag(reset){
 const tags=UI[L].heroTags;
 if(reset){tagIdx=0;if(tagTimer)clearInterval(tagTimer);
  tagTimer=setInterval(()=>rotateTag(false),3500);}
 const el=document.getElementById('heroTag');
 el.style.opacity=0;
 setTimeout(()=>{el.textContent=tags[tagIdx%tags.length];el.style.transition='opacity .5s';el.style.opacity=1;tagIdx++;},reset?0:400);
}

let quizState={answered:false};
function quizKey(){const d=new Date();return 'lsq-'+d.getFullYear()+'-'+dayOfYear();}
function getStreak(){try{return parseInt(localStorage.getItem('lsq-streak')||'0');}catch(e){return 0;}}
function todayQuiz(){return QUIZ[dayOfYear()%QUIZ.length];}

function renderQuiz(){
 const U=UI[L],Q=todayQuiz();
 document.getElementById('qBadge').textContent=U.qBadge;
 document.getElementById('qQ').textContent=Q.q[L];
 const streak=getStreak();
 document.getElementById('qStreak').textContent=streak>0?('🔥 '+streak+' '+U.qStreakL):'';
 let saved=null;
 try{saved=localStorage.getItem(quizKey());}catch(e){}
 const opts=document.getElementById('qOpts');
 opts.innerHTML=Q.o[L].map((o,i)=>`<button class="quiz-opt" id="qopt${i}" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('');
 if(saved!==null){revealQuiz(parseInt(saved),true);}
 else{document.getElementById('qReveal').classList.remove('show');}
}

function answerQuiz(i){
 if(quizState.answered)return;
 try{
   if(localStorage.getItem(quizKey())!==null)return;
   localStorage.setItem(quizKey(),String(i));
   // streak: correct answer + played yesterday → +1, else reset to 1 (if correct) or 0
   const Q=todayQuiz();
   const y=new Date();y.setDate(y.getDate()-1);
   const yKey='lsq-'+y.getFullYear()+'-'+(dayOfYear()-1);
   let s=getStreak();
   if(i===Q.a){s=(localStorage.getItem(yKey)!==null)?s+1:1;}
   else{s=0;}
   localStorage.setItem('lsq-streak',String(s));
 }catch(e){}
 revealQuiz(i,false);
}

function revealQuiz(i,restored){
 quizState.answered=true;
 const U=UI[L],Q=todayQuiz();
 Q.o[L].forEach((_,j)=>{
  const b=document.getElementById('qopt'+j);
  if(!b)return;
  b.disabled=true;
  if(j===Q.a)b.classList.add('correct');
  else if(j===i)b.classList.add('wrong');
 });
 const win=(i===Q.a);
 const v=document.getElementById('qVerdict');
 v.textContent=win?U.qWin:U.qLose;
 v.className='quiz-verdict '+(win?'win':'lose');
 document.getElementById('qExpl').textContent=Q.e[L];
 document.getElementById('qLaw').textContent='📋 '+Q.l;
 document.getElementById('qShare').textContent=U.qShare;
 const more=document.getElementById('qMore');
 more.textContent=U.qMore;
 more.href='https://lawsticker-ai.com/'+Q.u;
 document.getElementById('qNote').textContent=U.qNote;
 document.getElementById('qStreak').textContent=getStreak()>0?('🔥 '+getStreak()+' '+U.qStreakL):'';
 document.getElementById('qReveal').classList.add('show');
}

function shareQuiz(){
 const U=UI[L],Q=todayQuiz();
 let mine=null;try{mine=parseInt(localStorage.getItem(quizKey()));}catch(e){}
 const win=(mine===Q.a);
 const streak=getStreak();
 const msg=U.qShareTpl
  .replace('{result}',win?'✅':'❌')
  .replace('{streak}',streak>0?('🔥'+streak):'')
  .replace('{q}',Q.q[L]);
 window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function shareToday(){
 const B=BUNDLES[dayOfYear()%BUNDLES.length];
 const U=UI[L];
 const msg=U.shareTpl
  .replace('{fact}',B.f[L]).replace('{law}',B.l)
  .replace('{right}',B.rn[L]).replace('{rurl}','lawsticker-ai.com/'+B.ru)
  .replace('{remedy}',B.mn[L])
  .replace('{calc}',B.cn[L]).replace('{curl}','lawsticker-ai.com/'+B.cu)
  .replace('{help}',B.hn[L]+' '+B.hp);
 window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

document.addEventListener('DOMContentLoaded',render);
// Fix frozen ticker/tagline when returning via back button (bfcache restore)
window.addEventListener('pageshow',e=>{
 if(e.persisted){
  const t=document.getElementById('ticker');
  if(t){t.style.animation='none';void t.offsetWidth;t.style.animation='';}
  render();
 }
});
</script>
<script>
/* Language persistence — remembers choice across all pages */
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];
  var btns=document.querySelectorAll('.nav-lang');
  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>

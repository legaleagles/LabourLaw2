ree representation.", "Domestic violence alongside → DV Act reliefs (residence, protection, monetary) run parallel."], "te": ["పరస్పర అంగీకారం: ఫ్యామిలీ కోర్టులో ఉమ్మడి పిటిషన్; కోర్టు 6 నెలలు మినహాయించవచ్చు.", "వివాదాస్పదం: కారణాలు + సాక్ష్యాలతో పిటిషన్.", "దాఖలు చేసిన వెంటనే తాత్కాలిక పోషణ దరఖాస్తు.", "న్యాయవాది భరించలేరా → NALSA 15100, ఉచిత ప్రాతినిధ్యం.", "గృహ హింస కూడా ఉంటే → DV చట్టం ఉపశమనాలు సమాంతరంగా."], "hi": ["आपसी सहमति: फैमिली कोर्ट में संयुक्त याचिका; कोर्ट 6 महीने माफ कर सकती है।", "विवादित: आधार + साक्ष्य के साथ याचिका।", "दाखिल करते ही अंतरिम भरण-पोषण का आवेदन।", "वकील नहीं रख सकते → NALSA 15100, मुफ्त प्रतिनिधित्व।", "घरेलू हिंसा साथ में → DV अधिनियम राहतें समानांतर।"]}, "law": {"en": "HMA 1955, Sections 13, 13B; SC: Amardeep Singh (2017) — 6-month waiver; Special Marriage Act 1954", "te": "HMA 1955, Sections 13, 13B; SC: Amardeep Singh (2017); ప్రత్యేక వివాహ చట్టం 1954", "hi": "HMA 1955, धारा 13, 13B; SC: अमरदीप सिंह (2017); विशेष विवाह अधिनियम 1954"}}, {"icon": "💰", "tagCls": "rtag-e", "title": {"en": "Maintenance — CrPC 125 Covers All Religions", "te": "పోషణ — CrPC 125 అన్ని మతాలకు వర్తిస్తుంది", "hi": "भरण-पोषण — CrPC 125 सभी धर्मों पर लागू"}, "meta": {"en": "Wife, children, parents · Interim within days · Jail for default", "te": "భార్య, పిల్లలు, తల్లిదండ్రులు · డిఫాల్ట్‌కి జైలు", "hi": "पत्नी, बच्चे, माता-पिता · डिफॉल्ट पर जेल"}, "tag": {"en": "ENTITLEMENT", "te": "హక్కు", "hi": "अधिकार"}, "body": {"en": "Any <strong>wife, child (legitimate or not), or parent</strong> unable to maintain themselves can claim under CrPC Section 125 — <strong>regardless of religion</strong>. Magistrate can order <strong>interim maintenance within days</strong>. Amount follows the payer's means and standard of living. Non-payment → execution petition → <strong>imprisonment of the defaulter</strong>. Under the DV Act, monetary relief additionally covers rent and medical expenses.", "te": "తమను తాము పోషించుకోలేని <strong>భార్య, పిల్లలు, తల్లిదండ్రులు</strong> ఎవరైనా CrPC Section 125 కింద క్లెయిమ్ చేయవచ్చు — <strong>మతంతో సంబంధం లేకుండా</strong>. మేజిస్ట్రేట్ <strong>కొద్ది రోజుల్లో తాత్కాలిక పోషణ</strong> ఆర్డర్ చేయవచ్చు. చెల్లించకపోతే → ఎగ్జిక్యూషన్ పిటిషన్ → <strong>డిఫాల్టర్‌కు జైలు</strong>. DV చట్టం కింద ద్రవ్య ఉపశమనం అద్దె + వైద్య ఖర్చులు కూడా కవర్ చేస్తుంది.", "hi": "खुद का भरण-पोषण न कर सकने वाले <strong>पत्नी, बच्चे, माता-पिता</strong> CrPC धारा 125 में दावा कर सकते हैं — <strong>धर्म की परवाह किए बिना</strong>। मजिस्ट्रेट <strong>कुछ दिनों में अंतरिम भरण-पोषण</strong> का आदेश दे सकते हैं। न देने पर → निष्पादन याचिका → <strong>डिफॉल्टर को जेल</strong>। DV अधिनियम में मौद्रिक राहत किराया + चिकित्सा खर्च भी कवर करती है।"}, "steps": {"en": ["File Section 125 application at Magistrate Court — minimal fee, lawyer optional.", "Simultaneously seek interim maintenance — courts grant quickly.", "Hindus can additionally claim under Hindu Adoption & Maintenance Act.", "Order unpaid → execution petition; court can attach salary or imprison.", "Custody note: welfare of child is paramount; both parents keep visitation; illegal removal → Habeas Corpus in High Court."], "te": ["మేజిస్ట్రేట్ కోర్టులో Section 125 దరఖాస్తు — తక్కువ రుసుము.", "అదే సమయంలో తాత్కాలిక పోషణ కోరండి.", "హిందువులు అదనంగా హిందూ దత్తత & పోషణ చట్టం కింద క్లెయిమ్ చేయవచ్చు.", "ఆర్డర్ చెల్లించకపోతే → ఎగ్జిక్యూషన్ పిటిషన్; జీతం జప్తు లేదా జైలు.", "సంరక్షణ గమనిక: పిల్లల సంక్షేమం అత్యంత ముఖ్యం; చట్టవిరుద్ధ తొలగింపు → హైకోర్టులో Habeas Corpus."], "hi": ["मजिस्ट्रेट कोर्ट में धारा 125 आवेदन — मामूली फीस।", "साथ में अंतरिम भरण-पोषण मांगें।", "हिंदू अतिरिक्त रूप से हिंदू दत्तक व भरण-पोषण अधिनियम में दावा कर सकते हैं।", "आदेश न माने → निष्पादन याचिका; वेतन कुर्की या जेल।", "हिरासत नोट: बच्चे का कल्याण सर्वोपरि; अवैध ले जाना → High Court में Habeas Corpus।"]}, "law": {"en": "CrPC Section 125; HAMA 1956; DV Act 2005 Section 20; Guardians & Wards Act 1890; Gaurav Nagpal (SC 2009)", "te": "CrPC Section 125; HAMA 1956; DV చట్టం 2005 Section 20; Gaurav Nagpal (SC 2009)", "hi": "CrPC धारा 125; HAMA 1956; DV अधिनियम 2005 धारा 20; गौरव नागपाल (SC 2009)"}}, {"icon": "🏠", "tagCls": "rtag-e", "title": {"en": "Inheritance — Daughters Equal, Retroactively", "te": "వారసత్వం — కూతుళ్ళు సమానం, గత కాలానికి కూడా", "hi": "विरासत — बेटियां बराबर, पूर्वव्यापी"}, "meta": {"en": "Vineeta Sharma 2020 · Partition · Heir certificates", "te": "Vineeta Sharma 2020 · విభజన · వారసత్వ పత్రాలు", "hi": "विनीता शर्मा 2020 · बंटवारा · वारिस प्रमाणपत्र"}, "tag": {"en": "LANDMARK — SC 2020", "te": "మైలురాయి — SC 2020", "hi": "ऐतिहासिक — SC 2020"}, "body": {"en": "<strong>Vineeta Sharma v. Rakesh Sharma (2020, 3-judge bench)</strong>: daughters are coparceners by birth in Hindu ancestral property — equal to sons, <strong>retroactive even if the father died before 2005</strong>, married or unmarried. Partition can be demanded any time. Excluded from a will → contest within 12 years. Legal Heir Certificate (Tehsildar) for bank/property; Succession Certificate (Civil Court) for shares/FDs.", "te": "<strong>Vineeta Sharma v. Rakesh Sharma (2020, 3 న్యాయమూర్తుల ధర్మాసనం)</strong>: హిందూ పూర్వీకుల ఆస్తిలో కూతుళ్ళు పుట్టుకతోనే సహభాగస్వాములు — కొడుకులతో సమానం, <strong>తండ్రి 2005కు ముందు చనిపోయినా గత కాలానికి వర్తిస్తుంది</strong>, పెళ్ళైనా కాకపోయినా. విభజన ఎప్పుడైనా కోరవచ్చు. వీలునామా నుండి మినహాయిస్తే → 12 సంవత్సరాల్లో సవాలు. లీగల్ హైర్ సర్టిఫికేట్ (తహసీల్దార్); వారసత్వ ధృవీకరణ (సివిల్ కోర్టు).", "hi": "<strong>विनीता शर्मा बनाम राकेश शर्मा (2020, 3-जज पीठ)</strong>: हिंदू पैतृक संपत्ति में बेटियां जन्म से सहदायिक — बेटों के बराबर, <strong>पूर्वव्यापी, भले पिता 2005 से पहले गुज़रे हों</strong>, विवाहित हों या नहीं। बंटवारा कभी भी मांग सकती हैं। वसीयत से बाहर → 12 साल में चुनौती। वारिस प्रमाणपत्र (तहसीलदार); उत्तराधिकार प्रमाणपत्र (सिविल कोर्ट)।"}, "steps": {"en": ["Ancestral property → partition suit at District Civil Court.", "Gather proof: family tree, revenue records, death certificate.", "Legal Heir Certificate from Tehsildar for bank accounts and mutation.", "Movable assets → Succession Certificate from Civil Court.", "Muslim succession: defined shares under personal law; Christians/Parsis: Indian Succession Act 1925."], "te": ["పూర్వీకుల ఆస్తి → జిల్లా సివిల్ కోర్టులో విభజన దావా.", "రుజువులు సేకరించండి: వంశవృక్షం, రెవెన్యూ రికార్డులు, మరణ ధృవీకరణ.", "బ్యాంక్ ఖాతాలు, మ్యుటేషన్‌కు తహసీల్దార్ నుండి లీగల్ హైర్ సర్టిఫికేట్.", "చరాస్తులు → సివిల్ కోర్టు నుండి వారసత్వ ధృవీకరణ.", "ముస్లిం వారసత్వం: వ్యక్తిగత చట్టం; క్రైస్తవులు/పార్సీలు: భారత వారసత్వ చట్టం 1925."], "hi": ["पैतृक संपत्ति → जिला सिविल कोर्ट में बंटवारा मुकदमा।", "प्रमाण जुटाएं: वंशावली, राजस्व रिकॉर्ड, मृत्यु प्रमाणपत्र।", "बैंक खातों, म्यूटेशन के लिए तहसीलदार से वारिस प्रमाणपत्र।", "चल संपत्ति → सिविल कोर्ट से उत्तराधिकार प्रमाणपत्र।", "मुस्लिम उत्तराधिकार: व्यक्तिगत कानून; ईसाई/पारसी: भारतीय उत्तराधिकार अधिनियम 1925।"]}, "law": {"en": "Hindu Succession Act 1956, Section 6 (2005); Vineeta Sharma (SC 2020); Indian Succession Act 1925", "te": "హిందూ వారసత్వ చట్టం 1956, Section 6; Vineeta Sharma (SC 2020); భారత వారసత్వ చట్టం 1925", "hi": "हिंदू उत्तराधिकार अधिनियम 1956, धारा 6; विनीता शर्मा (SC 2020); भारतीय उत्तराधिकार अधिनियम 1925"}}];

 document.getElementById('chev'+i).classList.toggle('open');}

<script>
/* Language persistence — remembers choice across all pages */
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];
  var btns=document.querySelectorAll('.nav-lang');
  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>

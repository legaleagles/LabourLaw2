let dlName='letter';
function showLetter(text,sendSteps,fname){
 lastLetter=text;dlName=fname;
 document.getElementById('letterText').textContent=text;
 document.getElementById('sendItems').innerHTML=sendSteps.map((s,i)=>`<div class="send-item">${i+1}. ${s}</div>`).join('');
 document.getElementById('letterWrap').classList.add('show');
 document.getElementById('letterWrap').scrollIntoView({behavior:'smooth'});
}
function copyLetter(){
 const done=()=>{const b=document.getElementById('copyBtn');b.textContent=UI[L].copied;setTimeout(()=>b.textContent=UI[L].copy,1500);};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastLetter).then(done).catch(()=>fallbackCopy(done));}
 else fallbackCopy(done);
}
function fallbackCopy(done){
 const ta=document.createElement('textarea');ta.value=lastLetter;document.body.appendChild(ta);
 ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);
}
function waLetter(){window.open('https://wa.me/?text='+encodeURIComponent(lastLetter+'\n\n— lawsticker-ai.com/letters.html'),'_blank');}
function dlLetter(){
 const blob=new Blob([lastLetter],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=dlName+'.txt';
 document.body.appendChild(a);a.click();document.body.removeChild(a);
}
document.addEventListener('DOMContentLoaded',function(){render();
 try{var g=parseInt(new URLSearchParams(window.location.search).get('g'));
  if(g>=0&&g<=5)genTab(g);}catch(e){}});
</script>
<script>
/* Language persistence — remembers choice across all pages */
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];
  var btns=document.querySelectorAll('.nav-lang');
  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>

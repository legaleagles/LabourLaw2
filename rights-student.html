const SECS=[{"icon": "🚨", "tagCls": "rtag-r", "title": {"en": "Ragging — Zero Tolerance, College MUST Act", "te": "రాగింగ్ — జీరో టాలరెన్స్, కళాశాల చర్య తీసుకోవాలి", "hi": "रैगिंग — जीरो टॉलरेंस, कॉलेज को कार्रवाई करनी होगी"}, "meta": {"en": "24/7 helpline · College must file FIR · Expulsion of raggers", "te": "24/7 హెల్ప్‌లైన్ · కళాశాల FIR దాఖలు చేయాలి", "hi": "24/7 हेल्पलाइन · कॉलेज को FIR करनी होगी"}, "tag": {"en": "URGENT — CALL 1800-180-5522", "te": "అత్యవసరం — 1800-180-5522", "hi": "तत्काल — 1800-180-5522"}, "body": {"en": "Any physical/mental harassment of a fresher is ragging — punishable by <strong>expulsion, FIR, and up to 2 years imprisonment</strong> under UGC Regulations 2009 and SC directions. The college is <strong>legally bound to act within 24 hours</strong> of a complaint and file an FIR — failure makes the institution itself liable, including UGC funding cuts. Complaints can be anonymous.", "te": "ఫ్రెషర్‌పై ఏదైనా శారీరక/మానసిక వేధింపు రాగింగ్ — UGC నిబంధనలు 2009 మరియు SC ఆదేశాల ప్రకారం <strong>బహిష్కరణ, FIR, 2 సంవత్సరాల వరకు జైలు</strong> శిక్ష. ఫిర్యాదు తర్వాత కళాశాల <strong>24 గంటల్లో చర్య తీసుకుని FIR దాఖలు చేయాలి</strong> — విఫలమైతే సంస్థే బాధ్యత వహిస్తుంది, UGC నిధుల కోతతో సహా. ఫిర్యాదులు అనామకంగా చేయవచ్చు.", "hi": "फ्रेशर का कोई भी शारीरिक/मानसिक उत्पीड़न रैगिंग है — UGC विनियम 2009 और SC निर्देशों के तहत <strong>निष्कासन, FIR, 2 साल तक जेल</strong>। शिकायत पर कॉलेज को <strong>24 घंटे में कार्रवाई कर FIR करनी होगी</strong> — विफलता पर संस्थान खुद जिम्मेदार, UGC फंडिंग कटौती सहित। शिकायत गुमनाम हो सकती है।"}, "steps": {"en": ["Call National Anti-Ragging Helpline 1800-180-5522 (24/7) or email helpline@antiragging.in.", "File online at antiragging.in — identity is kept confidential.", "Written complaint to the college Anti-Ragging Committee (mandatory in every college).", "College inactive in 24 hrs → direct FIR at police station + UGC complaint.", "Preserve evidence: messages, injuries photos, witness names."], "te": ["జాతీయ యాంటీ-రాగింగ్ హెల  తర్వాత స్లైడింగ్ స్కేల్ (90% / 80% / 50%). కళాశాలలు <strong>మీ అసలు సర్టిఫికేట్లను \"సెక్యూరిటీ\"గా ఉంచుకోలేవు</strong> — UGC స్పష్టంగా నిషేధించింది. నిష్క్రమణపై బహుళ-సంవత్సర బాండ్లు లేదా పూర్తి-కోర్సు ఫీజులు బలవంతం చేయడం అన్యాయ వాణిజ్య పద్ధతి — వినియోగదారు కమిషన్‌లో సవాలు చేయవచ్చు.", "hi": "UGC फीस रिफंड नीति 2018: कक्षाओं से <strong>15+ दिन पहले छोड़ने पर → 100% रिफंड (अधिकतम ₹1,000 प्रोसेसिंग कटौती)</strong>; बाद में स्लाइडिंग स्केल (90% / 80% / 50%)। कॉलेज <strong>मूल प्रमाणपत्र \"सिक्योरिटी\" के रूप में नहीं रख सकते</strong> — UGC ने स्पष्ट रोका है। निकलने पर बहु-वर्षीय बॉन्ड या पूरे कोर्स की फीस थोपना अनुचित व्यापार व्यवहार है — उपभोक्ता आयोग में चुनौती दें।"}, "steps": {"en": ["Written withdrawal + refund request citing UGC Fee Refund Policy 2018. Keep acknowledgment.", "Refund denied → UGC e-Samadhaan portal complaint (ugc.gov.in).", "Consumer Commission complaint — education fee disputes are regularly entertained.", "Certificates held → written demand citing UGC prohibition; then e-Samadhaan + consumer complaint.", "For professional colleges — also complain to the regulator (AICTE/state admission authority)."], "te": ["UGC ఫీజు రీఫండ్ విధానం 2018 పేర్కొంటూ లిఖిత ఉపసంహరణ + రీఫండ్ అభ్యర్థన.", "రీఫండ్ నిరాకరిస్తే → UGC e-Samadhaan పోర్టల్ ఫిర్యాదు (ugc.gov.in).", "వినియోగదారు కమిషన్ ఫిర్యాదు — విద్యా ఫీజు వివాదాలు క్రమం తప్పకుండా స్వీకరించబడతాయి.", "సర్టిఫికేట్లు నిలిపివేస్తే → UGC నిషేధం పేర్కొంటూ లిఖిత డిమాండ్; తర్వాత e-Samadhaan + వినియోగదారు ఫిర్యాదు.", "ప్రొఫెషనల్ కళాశాలలకు — నియంత్రణ సంస్థకు కూడా (AICTE/రాష్ట్ర ప్రవేశ అథారిటీ)."], "hi": ["UGC फीस रिफंड नीति 2018 का हवाला देकर लिखित निकासी + रिफंड अनुरोध।", "रिफंड मना → UGC e-Samadhaan पोर्टल शिकायत (ugc.gov.in)।", "उपभोक्ता आयोग शिकायत — शिक्षा फीस विवाद नियमित सुने जाते हैं।", "प्रमाणपत्र रोके → UGC रोक का हवाला देकर लिखित मांग; फिर e-Samadhaan + उपभोक्ता शिकायत।", "प्रोफेशनल कॉलेजों के लिए — नियामक को भी (AICTE/राज्य प्रवेश प्राधिकरण)।"]}, "law": {"en": "UGC Fee Refund Policy 2018 (updated notifications); UGC Non-Retention of Certificates Rules; CPA 2019", "te": "UGC ఫీజు రీఫండ్ విధానం 2018; UGC సర్టిఫికేట్ నిలుపుదల నిషేధ నియమాలు; CPA 2019", "hi": "UGC फीस रिफंड नीति 2018; UGC प्रमाणपत्र प्रतिधारण निषेध नियम; CPA 2019"}}, {"icon": "📝", "tagCls": "rtag-e", "title": {"en": "Exam Answer Sheets via RTI + Scholarship Rights", "te": "RTI ద్వారా జవాబు పత్రాలు + స్కాలర్‌షిప్ హక్కులు", "hi": "RTI से उत्तर पुस्तिकाएं + छात्रवृत्ति अधिकार"}, "meta": {"en": "SC 2011: answer sheets are information · Revaluation · TS ePASS", "te": "SC 2011: జవాబు పత్రాలు సమాచారం · పునర్మూల్యాంకనం", "hi": "SC 2011: उत्तर पुस्तिकाएं सूचना हैं · पुनर्मूल्यांकन"}, "tag": {"en": "ENTITLEMENT", "te": "హక్కు", "hi": "अधिकार"}, "body": {"en": "The Supreme Court in <strong>CBSE v. Aditya Bandopadhyay (2011)</strong>: evaluated answer sheets are \"information\" under RTI — you can obtain a certified copy of your own answer sheet for ~₹10 + copying charges. Universities must have revaluation/rechecking processes. Scholarships: delays or arbitrary rejections in state scholarships (TS ePASS: scholarships.telangana.gov.in) can be questioned via RTI — ask \"reason for delay + file status\" and the file starts moving.", "te": "<strong>CBSE v. Aditya Bandopadhyay (2011)</strong> లో సుప్రీంకోర్టు: మూల్యాంకనం చేసిన జవాబు పత్రాలు RTI కింద \"సమాచారం\" — మీ సొంత జవాబు పత్రం సర్టిఫైడ్ కాపీ ~₹10 + కాపీ ఛార్జీలతో పొందవచ్చు. విశ్వవిద్యాలయాలకు పునర్మూల్యాంకన ప్రక్రియలు ఉండాలి. స్కాలర్‌షిప్‌లు: రాష్ట్ర స్కాలర్‌షిప్‌లలో (TS ePASS: scholarships.telangana.gov.in) ఆలస్యాలు RTI ద్వారా ప్రశ్నించవచ్చు — \"ఆలస్యానికి కారణం + ఫైల్ స్థితి\" అడగండి, ఫైల్ కదులుతుంది.", "hi": "<strong>CBSE बनाम आदित्य बंदोपाध्याय (2011)</strong> में सुप्रीम कोर्ट: मूल्यांकित उत्तर पुस्तिकाएं RTI में \"सूचना\" हैं — अपनी उत्तर पुस्तिका की प्रमाणित कॉपी ~₹10 + कॉपी शुल्क में मिल सकती है। विश्वविद्यालयों में पुनर्मूल्यांकन प्रक्रिया अनिवार्य। छात्रवृत्ति: राज्य छात्रवृत्ति में देरी RTI से पूछें — \"देरी का कारण + फाइल स्थिति\" पूछते ही फाइल चलने लगती है।"}, "steps": {"en": ["RTI to the university/board PIO: \"certified copy of my answer sheet, roll no. X, exam Y.\"", "Apply for revaluation within the deadline (usually 15-30 days of results).", "Scholarship delayed → RTI: \"reason for delay, current file status, officer responsible.\"", "Rejected arbitrarily → First Appeal + representation to the welfare department.", "Result withheld unfairly → university grievance cell, then writ petition (education is Article 21A linked)."], "te": ["విశ్వవిద్యాలయం/బోర్డు PIOకి RTI: \"నా జవాబు పత్రం సర్టిఫైడ్ కాపీ, రోల్ నం. X, పరీక్ష Y.\"", "గడువులోపు పునర్మూల్యాంకనానికి దరఖాస్తు (సాధారణంగా ఫలితాల 15-30 రోజుల్లో).", "స్కాలర్‌షిప్ ఆలస్యం → RTI: \"ఆలస్యానికి కారణం, ప్రస్తుత ఫైల్ స్థితి, బాధ్యుడైన అధికారి.\"", "ఏకపక్షంగా తిరస్కరిస్తే → మొదటి అప్పీల్ + సంక్షేమ శాఖకు వినతి.", "ఫలితం అన్యాయంగా నిలిపివేస్తే → విశ్వవిద్యాలయ ఫిర్యాదు సెల్, తర్వాత రిట్ పిటిషన్."], "hi": ["विश्वविद्यालय/बोर्ड PIO को RTI: \"मेरी उत्तर पुस्तिका की प्रमाणित कॉपी, रोल नं. X, परीक्षा Y।\"", "समयसीमा में पुनर्मूल्यांकन आवेदन (आमतौर पर परिणाम के 15-30 दिन)।", "छात्रवृत्ति में देरी → RTI: \"देरी का कारण, फाइल स्थिति, जिम्मेदार अधिकारी।\"", "मनमाना अस्वीकार → पहली अपील + कल्याण विभाग को अभ्यावेदन।", "परिणाम अनुचित रूप से रोका → विश्वविद्यालय शिकायत सेल, फिर रिट याचिका।"]}, "law": {"en": "RTI Act 2005; CBSE v. Aditya Bandopadhyay (SC 2011); UGC Grievance Redressal Regulations 2023", "te": "RTI చట్టం 2005; CBSE v. Aditya Bandopadhyay (SC 2011); UGC ఫిర్యాదు పరిష్కార నిబంధనలు 2023", "hi": "RTI अधिनियम 2005; CBSE बनाम आदित्य बंदोपाध्याय (SC 2011); UGC शिकायत निवारण विनियम 2023"}}];

<script>
/* Language persistence — remembers choice across all pages */
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];
  var btns=document.querySelectorAll('.nav-lang');
  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>
</body>

ిత్స ప్రారంభించండి.\"", "రోడ్డు ప్రమాదం: MVA Section 162 గోల్డెన్ అవర్ ఉదహరించండి.", "ఇంకా నిరాకరిస్తే — 108కి కాల్, సమీప ప్రభుత్వ ఆసుపత్రికి తరలించండి.", "స్థిరీకరణ తర్వాత — జిల్లా కలెక్టర్ + రాష్ట్ర వైద్య మండలికి ఫిర్యాదు.", "నిరాకరణకు పరిహారం కోసం వినియోగదారు ఫిర్యాదు."], "hi": ["स्पष्ट कहें: \"आपातकालीन इलाज से इनकार अनुच्छेद 21 और परमानंद कटारा का उल्लंघन है — इलाज शुरू करें।\"", "सड़क दुर्घटना: MVA धारा 162 गोल्डन आवर का हवाला दें।", "फिर भी मना — 108 कॉल करें, नजदीकी सरकारी अस्पताल ले जाएं।", "स्थिर होने पर — जिला कलेक्टर + राज्य मेडिकल काउंसिल को शिकायत।", "इनकार के मुआवज़े के लिए उपभोक्ता शिकायत।"]}, "law": {"en": "Article 21; Parmanand Katara v. UOI (SC 1989); MVA 2019 Section 162; Clinical Establishments Act 2010", "te": "Article 21; Parmanand Katara v. UOI (SC 1989); MVA 2019 Section 162", "hi": "अनुच्छेद 21; परमानंद कटारा बनाम भारत संघ (SC 1989); MVA 2019 धारा 162"}}, {"icon": "📋", "tagCls": "rtag-e", "title": {"en": "Records in 72 Hours + Informed Consent Before Any Procedure", "te": "72 గంటల్లో రికార్డులు + ఏ ప్రక్రియకైనా ముందస్తు సమ్మతి", "hi": "72 घंटे में रिकॉर्ड + किसी भी प्रक्रिया से पहले सहमति"}, "meta": {"en": "Cannot be held for bills · Right to refuse treatment · Second opinion", "te": "బిల్లుల కోసం నిలిపివేయలేరు · తిరస్కరించే హక్కు", "hi": "बिल के लिए नहीं रोक सकते · मना करने का अधिकार"}, "tag": {"en": "ENTITLEMENT", "te": "హక్కు", "hi": "अधिकार"}, "body": {"en": "Hospitals must give your medical records <strong>within 72 hours</strong> of a written request — case sheets, operation notes, scans, discharge summaries. They <strong>cannot be withheld for unpaid bills</strong>. No surgery/procedure without <strong>informed written consent</strong> (nature, risks, alternatives explained) — operating without consent is assault + negligence (Samira Kohli, SC 2008). You always retain the right to a second opinion and to refuse treatment.", "te": "ఆసుపత్రులు లిఖిత అభ్యర్థన తర్వాత <strong>72 గంటల్లో</strong> మీ వైద్య రికార్డులు ఇవ్వాలి — కేస్ షీట్లు, n documenting the negligence.", "File Consumer Complaint at District Commission (e-Daakhil) — claim treatment cost + compensation.", "Death case → FIR under IPC 304A (cognisable).", "State Medical Council complaint for professional misconduct — parallel and free."], "te": ["ముందు అన్ని రికార్డులు సేకరించండి: కేస్ షీట్, ప్రిస్క్రిప్షన్లు, స్కాన్‌లు.", "నిర్లక్ష్యాన్ని డాక్యుమెంట్ చేసే స్వతంత్ర వైద్యుని లిఖిత అభిప్రాయం.", "జిల్లా కమిషన్‌లో వినియోగదారు ఫిర్యాదు (e-Daakhil).", "మరణ కేసు → IPC 304A కింద FIR.", "వృత్తిపరమైన దుష్ప్రవర్తనకు రాష్ట్ర వైద్య మండలి ఫిర్యాదు — సమాంతరం, ఉచితం."], "hi": ["पहले सभी रिकॉर्ड जुटाएं: केस शीट, पर्चे, स्कैन।", "लापरवाही दर्ज करती स्वतंत्र डॉक्टर की लिखित राय।", "जिला आयोग में उपभोक्ता शिकायत (e-Daakhil)।", "मृत्यु मामला → IPC 304A में FIR।", "पेशेवर कदाचार पर राज्य मेडिकल काउंसिल शिकायत — समानांतर, मुफ्त।"]}, "law": {"en": "CPA 2019; IMA v. VP Shantha (SC 1995); IPC 304A; Mental Healthcare Act 2017, Sections 18, 89, 115", "te": "CPA 2019; IMA v. VP Shantha (SC 1995); IPC 304A; MHCA 2017, Sections 18, 89, 115", "hi": "CPA 2019; IMA बनाम VP शांता (SC 1995); IPC 304A; MHCA 2017, धारा 18, 89, 115"}}];

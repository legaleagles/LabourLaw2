<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previous Year Questions — Eklavya | LawSticker AI</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1117;--ink:#111827;--cream:#FEFCF5;--muted:#6B7280;--gold:#C9A227;--gold-l:#F5D76E;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);}
nav{background:var(--navy);padding:12px 16px;}
.nav-brand{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--gold-l);text-decoration:none;}
.hero{background:linear-gradient(150deg,#0D1117 0%,#1a1030 55%,#241505 100%);padding:26px 20px 22px;text-align:center;}
.hero-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:900;color:#F5D76E;}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:8px;line-height:1.6;max-width:440px;margin-left:auto;margin-right:auto;}

.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
.subject-select{width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:11px;font-size:13px;
font-family:'DM Sans',sans-serif;background:#fff;margin-bottom:16px;}

.upload-card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:16px;margin-bottom:20px;}
.upload-card-title{font-family:'Playfair Display',serif;font-weight:900;font-size:15px;margin-bottom:12px;}
.upload-row{display:flex;gap:8px;margin-bottom:10px;}
.upload-row input[type="number"]{width:100px;padding:11px;border:1.5px solid #E5E7EB;border-radius:9px;font-size:13px;}
.file-label{flex:1;display:flex;align-items:center;justify-content:center;padding:11px;border:1.5px dashed #C9A227;
border-radius:9px;font-size:12.5px;font-weight:700;color:#8a6d1a;cursor:pointer;background:#FFFBEB;}
.file-label input{display:none;}
.upload-btn{width:100%;background:linear-gradient(135deg,#059669,#047857);color:#fff;font-weight:800;
font-size:13px;padding:13px;border:none;border-radius:11px;cursor:pointer;}
.upload-btn:disabled{opacity:.5;}
.upload-status{font-size:11.5px;margin-top:10px;text-align:center;color:var(--muted);}

.year-block{margin-bottom:22px;}
.year-hd{font-family:'Playfair Display',serif;font-weight:900;font-size:16px;color:var(--navy);
display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--gold);}
.year-count{font-size:10.5px;font-weight:700;color:var(--muted);background:#F3F4F6;padding:2px 8px;border-radius:10px;}
.q-card{background:#fff;border:1px solid #E5E7EB;border-left:3px solid var(--gold);border-radius:10px;
padding:11px 13px;margin-bottom:8px;}
.q-meta{display:flex;gap:8px;margin-bottom:5px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
.q-part{color:#0369A1;}
.q-num{color:var(--muted);}
.q-marks{color:#B45309;margin-left:auto;}
.q-text{font-size:12.5px;color:#374151;line-height:1.6;}
.q-subparts{margin-top:6px;padding-left:14px;}
.q-subparts li{font-size:12px;color:#4B5563;margin-bottom:3px;}
.empty-msg{text-align:center;color:var(--muted);padding:30px 20px;font-size:12.5px;}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TJXHVW6XCL"></script>

function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-TJXHVW6XCL');
</script>
</head>
<body>

<nav><a class="nav-brand" href="eklavya.html">⚖️ LawSticker AI</a></nav>

<div class="hero">
  <div class="hero-title">📚 Previous Year Questions Archive</div>
  <div class="hero-sub">Upload past exam papers (scanned or typed PDF) — questions get extracted and stored permanently, year by year. No prediction, no guessing — just a clean, searchable record.</div>
</div>

<div class="wrap">
  <select class="subject-select" id="subjectSelect"></select>

  <div class="upload-card">
    <div class="upload-card-title">Upload a Paper</div>
    <div class="upload-row">
      <input type="number" id="yearInput" placeholder="Year, e.g. 2023" min="2000" max="2030">
      <label class="file-label" id="fileLabel">
        📄 Choose PDF
        <input type="file" id="fileInput" accept="application/pdf">
      </label>
    </div>
    <button class="upload-btn" id="uploadBtn" onclick="doUpload()">Extract & Save</button>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <div id="questionsContainer">
    <div class="empty-msg">Select a subject to see uploaded papers.</div>
  </div>
</div>

<script>
var SUBJECTS = [
  {slug:'s1-contract1',name:'S1 — Law of Contract I'},{slug:'s1-familylaw1',name:'S1 — Family Law I'},
  {slug:'s1-constlaw1',name:'S1 — Constitutional Law I'},{slug:'s1-torts1',name:'S1 — Torts & Consumer Protection'},
  {slug:'s1-envlaw1',name:'S1 — Environmental Law'},
  {slug:'s2-contract2',name:'S2 — Law of Contract II'},{slug:'s2-familylaw2',name:'S2 — Family Law II'},
  {slug:'s2-constlaw2',name:'S2 — Constitutional Law II'},{slug:'s2-crimes1',name:'S2 — Law of Crimes'},
  {slug:'s2-evidence1',name:'S2 — Law of Evidence'},
  {slug:'s3-jurisprudence',name:'S3 — Jurisprudence'},{slug:'s3-property1',name:'S3 — Law of Property'},
  {slug:'s3-adminlaw',name:'S3 — Administrative Law'},{slug:'s3-companylaw',name:'S3 — Company Law'},
  {slug:'s3-labourlaw1',name:'S3 — Labour Law I'},
  {slug:'s4-labourlaw2',name:'S4 — Labour Law II'},{slug:'s4-pil',name:'S4 — Public International Law'},
  {slug:'s4-interpretation',name:'S4 — Interpretation of Statutes'},{slug:'s4-landlaws',name:'S4 — Land Laws'},
  {slug:'s4-ipr',name:'S4 — Intellectual Property Law'},
  {slug:'cpc',name:'S5 — CPC & Limitation'},{slug:'bnss',name:'S5 — BNSS & Juvenile Justice'},
  {slug:'banking',name:'S5 — Banking & NI Act'},{slug:'adr',name:'S5 — ADR'},{slug:'ethics',name:'S5 — Professional Ethics'},
  {slug:'s6-taxlaw',name:'S6 — Law of Taxation'},{slug:'s6-itlaw',name:'S6 — Information Technology Law'},
  {slug:'s6-optional-women',name:'S6 — Optional: Women'},{slug:'s6-optional-humanrights',name:'S6 — Optional: Human Rights'},
  {slug:'s6-optional-investments',name:'S6 — Optional: Investments'},{slug:'s6-drafting',name:'S6 — Drafting & Pleadings'}
];

var params = new URLSearchParams(location.search);
var currentSubject = params.get('subject') || 'cpc';

var select = document.getElementById('subjectSelect');
select.innerHTML = SUBJECTS.map(function(s){
  return '<option value="' + s.slug + '"' + (s.slug === currentSubject ? ' selected' : '') + '>' + s.name + '</option>';
}).join('');
select.onchange = function(){
  currentSubject = select.value;
  history.replaceState(null, '', '?subject=' + currentSubject);
  loadQuestions();
};

function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

document.getElementById('fileInput').onchange = function(){
  var label = document.getElementById('fileLabel');
  if (this.files && this.files[0]) {
    label.innerHTML = '✅ ' + esc(this.files[0].name) + '<input type="file" id="fileInput" accept="application/pdf">';
    document.getElementById('fileInput').onchange = arguments.callee;
  }
};

function doUpload(){
  var year = document.getElementById('yearInput').value;
  var fileInput = document.getElementById('fileInput');
  var status = document.getElementById('uploadStatus');
  var btn = document.getElementById('uploadBtn');

  if (!year) { status.textContent = 'Enter a year first.'; return; }
  if (!fileInput.files || !fileInput.files[0]) { status.textContent = 'Choose a PDF first.'; return; }

  var file = fileInput.files[0];
  btn.disabled = true;
  status.textContent = 'Reading file…';

  var reader = new FileReader();
  reader.onload = function(){
    var base64 = reader.result.split(',')[1];
    status.textContent = 'Extracting questions — this can take up to a minute for a long paper…';

    fetch('https://lawsticker-backend-494996217030.europe-west1.run.app/api/pyq-extract', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({subject: currentSubject, year: year, pdf_base64: base64})
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        btn.disabled = false;
        if (data.ok && !data.skipped) {
          status.textContent = '✅ Extracted ' + data.question_count + ' questions for ' + data.year + '.';
          loadQuestions();
        } else if (data.skipped) {
          status.textContent = 'ℹ️ ' + data.reason;
        } else {
          status.textContent = '❌ ' + (data.error || 'Something went wrong.');
        }
      })
      .catch(function(){
        btn.disabled = false;
        status.textContent = '❌ Could not reach the server — try again.';
      });
  };
  reader.readAsDataURL(file);
}

function loadQuestions(){
  var container = document.getElementById('questionsContainer');
  container.innerHTML = '<div class="empty-msg">Loading…</div>';

  fetch('llb-pyq-' + currentSubject + '.json?t=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('none yet'); return r.json(); })
    .then(function(data){
      var papers = data.papers || {};
      var years = Object.keys(papers).sort(function(a,b){ return b - a; });
      if (!years.length) {
        container.innerHTML = '<div class="empty-msg">No papers uploaded yet for this subject.</div>';
        return;
      }
      container.innerHTML = years.map(function(y){
        var paper = papers[y];
        var qs = paper.questions || [];
        var body = qs.map(function(q){
          var subHtml = (q.sub_parts && q.sub_parts.length)
            ? '<ul class="q-subparts">' + q.sub_parts.map(function(sp){ return '<li>' + esc(sp) + '</li>'; }).join('') + '</ul>'
            : '';
          return '<div class="q-card">' +
            '<div class="q-meta"><span class="q-part">' + esc(q.part) + '</span><span class="q-num">Q' + esc(q.question_number) + '</span>' +
            (q.marks ? '<span class="q-marks">' + esc(q.marks) + ' marks</span>' : '') + '</div>' +
            '<div class="q-text">' + esc(q.question_text) + '</div>' + subHtml +
          '</div>';
        }).join('');
        return '<div class="year-block"><div class="year-hd">' + y + '<span class="year-count">' + qs.length + ' questions</span></div>' + body + '</div>';
      }).join('');
    })
    .catch(function(){
      container.innerHTML = '<div class="empty-msg">No papers uploaded yet for this subject.</div>';
    });
}

loadQuestions();
</script>

</body>
</html>

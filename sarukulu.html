function normalize(s){

/* ---------- the money logic (pure) ---------- */
function activeApps(s){ return APPS.filter(a=>s.apps[a.id]?.on).map(a=>a.id); }
function rec(s,itemId,app){ return s.prices[itemId]?.[app]; }
function unitPrice(s,item,app){ const r=rec(s,item.id,app); return (r&&!r.na&&r.p>0)?r.p:null; }
function feeFor(s,app,sub){
  if(sub<=0) return 0;
  const f=s.apps[app].fees; let fee=(+f.handling||0);
  if(!((+f.freeAbove||0)>0&&sub>=f.freeAbove)) fee+=(+f.delivery||0);
  if((+f.smallBelow||0)>0&&sub<f.smallBelow) fee+=(+f.smallCart||0);
  fee-=(+f.off||0);
  return Math.max(fee,-sub);
}
function combos(arr,k){ const out=[]; const go=(st,acc)=>{ if(acc.length===k){out.push(acc.slice());return;} for(let i=st;i<arr.length;i++){acc.push(arr[i]);go(i+1,acc);acc.pop();} }; go(0,[]); return out; }
function computePlans(s){
  const apps=activeApps(s), items=s.items.filter(i=>i.on);
  const coverable=items.filter(i=>apps.some(a=>unitPrice(s,i,a)!==null));
  const unpriced=items.filter(i=>!coverable.includes(i));
  const singles=apps.map(a=>{
    let sub=0; const missing=[],unchecked=[];
    for(const i of coverable){ const p=unitPrice(s,i,a); if(p===null){(rec(s,i.id,a)?.na?missing:unchecked).push(i);} else sub+=p*i.qty; }
    const fee=feeFor(s,a,sub);
    return {app:a,sub,fee,total:sub+fee,missing,unchecked,complete:!missing.length&&!unchecked.length&&coverable.length>0};
  }).sort((x,y)=>(y.complete-x.complete)||(x.total-y.total));
  const bestBySize={};
  for(let k=1;k<=Math.min(3,apps.length);k++){
    for(const set of combos(apps,k)){
      const by={}; set.forEach(a=>by[a]={items:[],sub:0}); let ok=true;
      for(const i of coverable){
        let best=null; for(const a of set){ const p=unitPrice(s,i,a); if(p!==null&&(best===null||p<best.p)) best={a,p}; }
        if(!best){ok=false;break;}
        by[best.a].items.push({item:i,p:best.p}); by[best.a].sub+=best.p*i.qty;
      }
      if(!ok||set.some(a=>!by[a].items.length)) continue;
      let total=0; set.forEach(a=>{ by[a].fee=feeFor(s,a,by[a].sub); total+=by[a].sub+by[a].fee; });
      if(!bestBySize[k]||total<bestBySize[k].total) bestBySize[k]={apps:set,by,total};
    }
  }
  let chosen=null;
  for(let k=1;k<=3;k++){ const c=bestBySize[k]; if(!c) continue; if(!chosen) chosen=c; else if(c.total+s.splitMin*(k-chosen.apps.length)<=chosen.total) chosen=c; }
  const completeSingles=singles.filter(x=>x.complete);
  const worst=completeSingles.length?completeSingles[completeSingles.length-1]:null;
  const perItem=coverable.map(i=>{ const ps=apps.map(a=>({a,p:unitPrice(s,i,a)})).filter(x=>x.p!==null).sort((x,y)=>x.p-y.p); return {item:i,low:ps[0],high:ps[ps.length-1],n:ps.length}; });
  return {apps,items,coverable,unpriced,singles,chosen,worst,perItem};
}

/* ---------- list parsing (Telugu / Hindi / English) ---------- */
const nonLatin=s=>/[^\x00-\x7F₹×]/.test(s);
function findWord(chunk){
  const low=chunk.toLowerCase(); let best=null;
  for(const w of WORDS){
    for(const k of [w[0]].concat(w.slice(1))){
      const kl=k.toLowerCase();
      const hit=nonLatin(k)?low.includes(kl):new RegExp('(^|[^a-z])'+kl.replace(/ /g,'\\s*')+'($|[^a-z])').test(low);
      if(hit&&(!best||kl.length>best.len)) best={w,len:kl.length};
    }
  }
  return best?best.w:null;
}
function parseChunk(raw){

  else if((m=c.match(/^(\d+)\s*[x×*]\s*(.+)$/i))){ qty=+m[1]; c=m[2]; }
  else if((m=c.match(/^(.+?)\s*[x×*]\s*(\d+)$/i))){ qty=+m[2]; c=m[1]; }
  c=c.replace(/(అర|half|aadha|आधा)\s*(కిలో|కేజీ|kg|kilo|किलो)/i,' 500 g ').replace(/(పావు|quarter|पाव)\s*(కిలో|కేజీ|kg|kilo|किलो)/i,' 250 g ');
  const units=[[/(kgs?|kilos?|kilograms?|కిలోలు|కిలో|కేజీ|किलो)/i,'kg'],[/(ml|మి\.?లీ)/i,'ml'],[/(l|ltrs?|litres?|liters?|లీటర్లు|లీటరు|లీటర్|लीटर)/i,'L'],[/(g|gms?|grams?|గ్రాములు|గ్రాము|ग्राम)/i,'g'],[/(pcs?|pieces?|ముక్కలు|पीस)/i,'pcs']];
  for(const [re,u] of units){ const r=new RegExp(num+'\\s*'+re.source+'(?![a-z])','i'); const mm=c.match(r); if(mm){ size=mm[1]+' '+u; c=c.replace(mm[0],' '); break; } }
  if(!size&&qty===1&&(m=c.match(/(^|\s)(\d+)(\s|$)/))){ qty=+m[2]; c=c.replace(m[0],' '); }
  c=c.replace(/\s+/g,' ').trim();
  const w=findWord(c), english=!nonLatin(c);
  let name;

const API='https://lawsticker-backend-494996217030.europe-west1.run.app';
let auto={ok:false,platforms:[]}, busy=false, progressText='';

function applyCands(it,app,cands){
  const now=Date.now();
  const slim=(cands||[]).slice(0,6).map(c=>({pid:c.pid,name:c.name,qty:c.qty,price:c.price,mrp:c.mrp,available:!!c.available,link:c.link||'',score:c.score||0}));
  state.prices[it.id]=state.prices[it.id]||{};
  const pick=(it.picks||{})[app]; let c=pick?slim.find(x=>x.pid===pick):null; const sure=!!c;
  if(!c) c=slim.find(x=>x.available);
  if(!c||!c.available){ state.prices[it.id][app]={na:true,at:now,src:'auto',cands:slim}; return; }
  state.prices[it.id][app]={p:c.price,at:now,src:'auto',pid:c.pid,pname:c.name,pqty:c.qty,link:c.link,check:!sure&&c.score<0.7,cands:slim};
}
async function fetchAll(){
  if(busy||!auto.ok||!state.loc) return;
  const plats=autoApps(), items=state.items.filter(i=>i.on);
  if(!plats.length||!items.length) return;
  busy=true; render(); let done=0, got=0, lastErr=null;
  setProgress(t('fetching',{a:0,b:items.length}));
  for(let k=0;k<items.length;k+=4){
    const chunk=items.slice(k,k+4);
    try{
      const r=await fetch(API+'/api/sarukulu/fetch',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({lat:state.loc.lat,lon:state.loc.lon,pincode:state.loc.pincode||'',platforms:plats,items:chunk.map(i=>({id:i.id,q:i.search||i.name}))})});
      const d=await r.json();
      if(!d.ok){ lastErr=d.error; if(['daily_cap','no_credits','not_configured','bad_key','too_many_requests'].includes(d.error)) break; }
      else{ if(Object.keys(d.errors||{}).length) lastErr=Object.values(d.errors)[0];
        for(const [iid,byApp] of Object.entries(d.results||{})){ const it=state.items.find(x=>x.id===iid); if(!it) continue; for(const [app,c] of Object.entries(byApp)) applyCands(it,app,c); got++; } }
    }catch(e){ lastErr='network'; }
    done+=chunk.length; setProgress(t('fetching',{a:done,b:items.length}));
  }
  busy=false; if(got){ state.lastFetch=Date.now(); state.example=false; }
  save(); render(); track('sarukulu_autofetch',{items:items.length,got});
  toast(got?t('fetched',{n:got}):errText(lastErr));
}

/* ---------- events ---------- */
document.querySelectorAll('.nav-lang').forEach(b=>b.addEventListener('click',()=>{ lang=b.dataset.lang; try{localStorage.setItem('lsLang',lang);}catch(e){} render(); }));
document.querySelector('nav.tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; state.ui.tab=b.dataset.tab; save(); render(); window.scrollTo(0,0); });
const main=$('#main');
main.addEventListener('click',e=>{
  const tr=e.target.closest('[data-track]'); if(tr) track('sarukulu_'+tr.dataset.track);
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, it=state.items.find(i=>i.id===id);
  switch(act){
    case 'toggle': it.on=!it.on; break;
    case 'inc': it.qty++; break;
    case 'dec': it.qty=Math.max(1,it.qty-1); break;
    case 'del': state.items=state.items.filter(i=>i!==it); delete state.prices[id]; toast(t('removed')+': '+it.name); break;
    case 'allon': state.items.forEach(i=>i.on=true); break;
    case 'alloff': state.items.forEach(i=>i.on=false); break;
    case 'staple': { const W=WORDS[+el.dataset.w]; addItems([{name:el.dataset.name,te:W[1],hi:W[2]}]); break; }
    case 'go': state.ui.tab=el.dataset.to; window.scrollTo(0,0);
      if(el.dataset.to==='prices'&&auto.ok&&state.loc&&(!state.lastFetch||Date.now()-state.lastFetch>2*3600e3)) setTimeout(fetchAll,50);
      break;
    case 'fetch': fetchAll(); return;
    case 'locChange': state.ui.editLoc=true; break;
    case 'cands': { const k=id+'|'+state.ui.app; state.ui.open=state.ui.open===k?null:k; render(); return; }
    case 'pick': { const app=state.ui.app, r=rec(state,id,app), c=r?.cands?.find(x=>x.pid===el.dataset.pid); if(!c) return;
      it.picks=it.picks||{}; it.picks[app]=c.pid;
      state.prices[id][app]={...r, p:c.price, na:!c.available, pid:c.pid, pname:c.name, pqty:c.qty, link:c.link, check:false, at:Date.now()};
      if(!c.available) delete state.prices[id][app].p;
      state.ui.open=null; break; }
    case 'geo': {
      if(!navigator.geolocation){ toast(t('locFail')); return; }
      const pin=(document.getElementById('pinIn')?.value||'').replace(/\D/g,'');
      navigator.geolocation.getCurrentPosition(pos=>setLoc(pos.coords.latitude,pos.coords.longitude,pin.length===6?pin:(state.loc?.pincode||'')),()=>toast(t('locFail')),{timeout:15000,maximumAge:600000,enableHighAccuracy:false});
      return; }
    case 'savePin': {
      const pin=(document.getElementById('pinIn')?.value||'').replace(/\D/g,'');
      if(pin.length!==6){ toast(t('pinBad')); return; }
      if(state.loc&&state.loc.lat){ setLoc(state.loc.lat,state.loc.lon,pin); return; }
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&country=India&postalcode='+pin).then(r=>r.json()).then(a=>{
        if(a&&a[0]) setLoc(a[0].lat,a[0].lon,pin); else toast(t('pinNotFound')); }).catch(()=>toast(t('pinNotFound')));
      return; }
    case 'app': state.ui.app=el.dataset.app; break;
    case 'appon': { const a=state.apps[el.dataset.app]; a.on=!a.on; break; }
    case 'na': { const p=state.prices[id]=state.prices[id]||{}; const cur=state.ui.app; if(p[cur]?.na) delete p[cur]; else p[cur]={na:true,at:Date.now(),src:'you'}; break; }
    case 'fresh': state.items=[]; state.prices={}; APPS.forEach(a=>state.apps[a.id].fees=zeroFees()); state.example=false; state.ui.tab='list'; track('sarukulu_start'); break;
    case 'keepItems': state.prices={}; APPS.forEach(a=>state.apps[a.id].fees=zeroFees()); state.example=false; state.ui.tab='prices'; track('sarukulu_start'); break;
    case 'clearPrices': state.prices={}; toast(t('cleared')); break;
    case 'add': return doAdd();
    default: return;
  }
  save(); render();
});
main.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.name){ const it=state.items.find(i=>i.id===el.dataset.name); const v=el.value.trim(); if(it&&v){ it.name=v; it.search=v.toLowerCase(); save(); } }
  if(el.id==='splitMin'){ state.splitMin=Math.max(0,+el.value||0); save(); render(); }
  if(el.matches('[data-got]')) el.closest('.oline').classList.toggle('got',el.checked);
});
main.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.price){
    const id=el.dataset.price, cur=state.ui.app, v=parseFloat(el.value);
    state.prices[id]=state.prices[id]||{};
    if(v>0) state.prices[id][cur]={p:v,at:Date.now(),src:'you'}; else delete state.prices[id][cur];
    if(state.example){ state.example=false; $('#exPill').hidden=true; }
    save();
    const [d,n]=progress(cur); const tab=main.querySelector(`.apptab[data-app="${cur}"]`); if(tab){ tab.querySelector('small').textContent=d+'/'+n; tab.classList.toggle('done',d===n); }
  }
  if(el.dataset.fee){ state.apps[state.ui.app].fees[el.dataset.fee]=Math.max(0,parseFloat(el.value)||0); save(); }
});
main.addEventListener('keydown',e=>{ if(e.target.id==='addBox'&&e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); doAdd(); } });
function doAdd(){
  const box=$('#addBox'); const text=box.value.trim(); if(!text) return;
  const list=text.split(/[,\n;،]+|\s+(?:and|మరియు|और)\s+/i).map(s=>s.trim()).filter(Boolean).map(parseChunk);
  const n=addItems(list); box.value='';
  render();
  track('sarukulu_add',{count:n});
  toast(list.some(x=>x.local)?t('localWarn'):(n?t('added',{n}):t('already')));
}

render();
</script>
</body>
</html>

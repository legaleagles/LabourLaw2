<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Tool — Eklavya | LawSticker AI</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1117;--ink:#111827;--cream:#FEFCF5;--muted:#6B7280;--gold:#C9A227;--gold-l:#F5D76E;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);}
nav{background:var(--navy);padding:12px 16px;}
.nav-brand{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--gold-l);text-decoration:none;}
.hero{background:linear-gradient(150deg,#0D1117 0%,#1a1030 55%,#241505 100%);padding:26px 20px 22px;text-align:center;}
.hero-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:900;color:#F5D76E;}
.hero-sub{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:8px;line-height:1.6;max-width:440px;margin-left:auto;margin-right:auto;}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 60px;}

.login-box{max-width:340px;margin:60px auto;background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:22px;text-align:center;}
.login-box input{width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:9px;font-size:14px;margin:14px 0;text-align:center;}
.login-box button{width:100%;background:var(--navy);color:var(--gold-l);font-weight:800;padding:12px;border:none;border-radius:9px;cursor:pointer;}
.login-err{color:#DC2626;font-size:11.5px;margin-top:8px;}

.card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:18px;margin-bottom:16px;}
.field-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:block;}
.field{width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13.5px;
font-family:'DM Sans',sans-serif;background:#fff;margin-bottom:14px;}
.mode-toggle{display:flex;gap:8px;margin-bottom:14px;}
.mode-btn{flex:1;background:#F3F4F6;border:1.5px solid #E5E7EB;color:var(--ink);font-size:12px;font-weight:800;
padding:9px;border-radius:9px;cursor:pointer;}
.mode-btn.active{background:var(--navy);color:var(--gold-l);border-color:var(--navy);}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:12.5px;color:var(--ink);}
.go-btn{width:100%;background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;font-weight:800;
font-size:14px;padding:14px;border:none;border-radius:11px;cursor:pointer;}
.go-btn:disabled{opacity:.5;}
.url-preview{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:9px;padding:10px 12px;
font-family:'Courier New',monospace;font-size:10.5px;color:var(--muted);word-break:break-all;margin-bottom:14px;}

.result-box{background:#fff;border:1.5px solid #E5E7EB;border-radius:14px;padding:16px;font-size:12.5px;
line-height:1.7;white-space:pre-wrap;word-break:break-word;font-family:'Courier New',monospace;color:var(--ink);}
.result-box.ok{border-color:#6EE7B7;background:#ECFDF5;}
.result-box.err{border-color:#FCA5A5;background:#FEF2F2;}
.spinner{text-align:center;color:var(--muted);font-size:12.5px;padding:20px;}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TJXHVW6XCL"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-TJXHVW6XCL');
</script>
</head>
<body>

<nav><a class="nav-brand" href="/eklavya.html">⚖️ LawSticker AI</a></nav>

<div id="loginGate">
  <div class="login-box">
    <div class="hero-title" style="color:var(--ink);">🔒 Recovery Tool</div>
    <div class="hero-sub" style="color:var(--muted);">Private — password required</div>
    <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Enter</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <div class="hero">
    <div class="hero-title">🛠️ Eklavya Recovery Tool</div>
    <div class="hero-sub">Pick a subject and an exact day or date to generate just that one lecture — for filling in anything that's still missing, without touching anything else.</div>
  </div>

  <div class="wrap">
    <div class="card">
      <label class="field-label">Subject</label>
      <select class="field" id="subjectSelect"></select>

      <label class="field-label">Target By</label>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeDate" onclick="setMode('date')">📅 Calendar Date</button>
        <button class="mode-btn" id="modeDay" onclick="setMode('day')">🔢 Day Number</button>
      </div>

      <div id="dateField">
        <label class="field-label">Date</label>
        <input type="date" class="field" id="dateInput" onchange="updatePreview()">
      </div>
      <div id="dayField" style="display:none;">
        <label class="field-label">Day Number (1–45)</label>
        <input type="number" class="field" id="dayInput" min="1" max="45" onchange="updatePreview()">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="overwriteCheck" onchange="updatePreview()">
        <label for="overwriteCheck">Overwrite if this day already has content</label>
      </div>

      <div class="url-preview" id="urlPreview"></div>

      <button class="go-btn" id="goBtn" onclick="runRecovery()">🚀 Generate This Day</button>
    </div>

    <div id="resultArea"></div>
  </div>
</div>

<script>
var BACKEND = 'https://lawsticker-backend-494996217030.europe-west1.run.app';
var SUBJECTS = [
  {slug:'s1-contract1',name:'S1 — Law of Contract I'},{slug:'s1-familylaw1',name:'S1 — Family Law I'},
  {slug:'s1-constlaw1',name:'S1 — Constitutional Law I'},{slug:'s1-torts1',name:'S1 — Torts & Consumer Protection'},
  {slug:'s1-envlaw1',name:'S1 — Environmental Law'},
  {slug:'s2-contract2',name:'S2 — Law of Contract II'},{slug:'s2-familylaw2',name:'S2 — Family Law II'},
  {slug:'s2-constlaw2',name:'S2 — Constitutional Law II'},{slug:'s2-crimes1',name:'S2 — Law of Crimes'},
  {slug:'s2-evidence1',name:'S2 — Law of Evidence'},
  {slug:'s3-jurisprudence',name:'S3 — Jurisprudence'},{slug:'s3-property1',name:'S3 — Law of Property'},
  {slug:'s3-adminlaw',name:'S3 — Administrative Law'},{slug:'s3-companylaw',name:'S3 — Company Law'},
  {slug:'s3-labourlaw1',name:'S3 — Labour Law I'},
  {slug:'s4-labourlaw2',name:'S4 — Labour Law II'},{slug:'s4-pil',name:'S4 — Public International Law'},
  {slug:'s4-interpretation',name:'S4 — Interpretation of Statutes'},{slug:'s4-landlaws',name:'S4 — Land Laws'},
  {slug:'s4-ipr',name:'S4 — Intellectual Property Law'},
  {slug:'cpc',name:'S5 — CPC & Limitation'},{slug:'bnss',name:'S5 — BNSS & Juvenile Justice'},
  {slug:'banking',name:'S5 — Banking & NI Act'},{slug:'adr',name:'S5 — ADR'},{slug:'ethics',name:'S5 — Professional Ethics'},
  {slug:'s6-taxlaw',name:'S6 — Law of Taxation'},{slug:'s6-itlaw',name:'S6 — Information Technology Law'},
  {slug:'s6-optional-women',name:'S6 — Optional: Women'},{slug:'s6-optional-humanrights',name:'S6 — Optional: Human Rights'},
  {slug:'s6-optional-investments',name:'S6 — Optional: Investments'},{slug:'s6-drafting',name:'S6 — Drafting & Pleadings'}
];

var pyqPassword = localStorage.getItem('pyqPassword') || '';
var mode = 'date';

function doLogin(){
  var pw = document.getElementById('pwInput').value;
  // Re-use the same password check the PYQ page uses (via a harmless
  // password-only probe call) so there's no separate password to remember.
  fetch(BACKEND + '/api/pyq-extract', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: pw, pdf_base64: ''}) })
    .then(function(r){
      if (r.status === 401) { document.getElementById('loginErr').textContent = 'Incorrect password.'; return; }
      pyqPassword = pw;
      localStorage.setItem('pyqPassword', pw);
      showApp();
    })
    .catch(function(){ document.getElementById('loginErr').textContent = 'Could not reach the server.'; });
}

function showApp(){
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  initApp();
}

function initApp(){
  var select = document.getElementById('subjectSelect');
  select.innerHTML = SUBJECTS.map(function(s){ return '<option value="' + s.slug + '">' + s.name + '</option>'; }).join('');
  select.onchange = updatePreview;
  document.getElementById('dateInput').valueAsDate = new Date();
  updatePreview();
}

function setMode(m){
  mode = m;
  document.getElementById('modeDate').classList.toggle('active', m === 'date');
  document.getElementById('modeDay').classList.toggle('active', m === 'day');
  document.getElementById('dateField').style.display = m === 'date' ? 'block' : 'none';
  document.getElementById('dayField').style.display = m === 'day' ? 'block' : 'none';
  updatePreview();
}

function buildUrl(){
  var subject = document.getElementById('subjectSelect').value;
  var overwrite = document.getElementById('overwriteCheck').checked;
  var url = BACKEND + '/api/llb5-daily-lecture?subject=' + subject;
  if (mode === 'date') {
    var d = document.getElementById('dateInput').value;
    if (d) url += '&date=' + d;
  } else {
    var n = document.getElementById('dayInput').value;
    if (n) url += '&day=' + n;
  }
  if (overwrite) url += '&overwrite=1';
  return url;
}

function updatePreview(){
  document.getElementById('urlPreview').textContent = buildUrl();
}

function runRecovery(){
  var btn = document.getElementById('goBtn');
  var resultArea = document.getElementById('resultArea');
  btn.disabled = true;
  resultArea.innerHTML = '<div class="spinner">⏳ Generating — can take up to a minute…</div>';

  fetch(buildUrl())
    .then(function(r){ return r.json().then(function(data){ return {status:r.status, data:data}; }); })
    .then(function(res){
      btn.disabled = false;
      var cls = res.data.ok ? 'ok' : 'err';
      resultArea.innerHTML = '<div class="result-box ' + cls + '">' + JSON.stringify(res.data, null, 2).replace(/</g,'&lt;') + '</div>';
    })
    .catch(function(){
      btn.disabled = false;
      resultArea.innerHTML = '<div class="result-box err">Could not reach the server — try again.</div>';
    });
}

if (pyqPassword) { showApp(); }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jewellery Feedback | LawSticker AI (Private)</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#0D1117;--gold:#C9A227;--gold-l:#E8C766;--ink:#111827;--muted:#6B7280;--cream:#FEFCF5;--red:#DC2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--ink)}
nav{background:var(--navy);padding:12px 16px;color:var(--gold-l);font-weight:900}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.login{max-width:320px;margin:70px auto;background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:22px;text-align:center}
.login input{width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:9px;margin:14px 0;text-align:center}
.login button,.f button{background:var(--navy);color:var(--gold-l);font-weight:800;padding:10px 14px;border:none;border-radius:9px;cursor:pointer}
.login button{width:100%;padding:12px}
.err{color:var(--red);font-size:12px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.f select{padding:9px;border:1.5px solid #E5E7EB;border-radius:9px;background:#fff}
.item{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.item .s{color:#D4A017;font-size:15px;letter-spacing:1px}
.item p{margin-top:6px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.tag{background:#F3F4F6;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700;color:#374151}
.hidden{display:none}
</style>
</head>
<body>
<nav>Jewellery Suite feedback (Private)</nav>
<div id="login" class="login"><div style="font-weight:900">Private page</div><input type="password" id="pw" placeholder="Password"><button id="go">Enter</button><div class="err" id="err"></div></div>
<div id="app" class="wrap hidden">
  <div class="stats"><div class="stat"><b id="sN">0</b><span>Entries</span></div><div class="stat"><b id="sA">–</b><span>Average</span></div><div class="stat"><b id="sB">0</b><span>Bugs / wrong price</span></div></div>
  <div class="f"><select id="fc"><option value="">All types</option><option value="bug">Bug</option><option value="wrong_price">Wrong price</option><option value="idea">Idea</option><option value="praise">Praise</option><option value="other">Other</option></select>
  <select id="fr"><option value="">All ratings</option><option value="1">1 star</option><option value="2">2 stars</option><option value="3">3 stars</option><option value="4">4 stars</option><option value="5">5 stars</option></select><button id="rf">Refresh</button></div>
  <div id="list"></div>
</div>
<script>
var BACKEND='https://lawsticker-backend-494996217030.europe-west1.run.app',pw='',items=[];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){return fetch(BACKEND+'/api/jewellery-feedback-list',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(function(r){return r.json().then(function(j){j._s=r.status;return j})})}
function paint(){
  var c=$('fc').value,r=$('fr').value;
  var v=items.filter(function(i){return(!c||i.category===c)&&(!r||String(i.rating)===r)});
  $('sN').textContent=items.length;
  $('sA').textContent=items.length?(items.reduce(function(a,i){return a+i.rating},0)/items.length).toFixed(1):'–';
  $('sB').textContent=items.filter(function(i){return i.category==='bug'||i.category==='wrong_price'}).length;
  $('list').innerHTML=v.length?v.map(function(i){return '<div class="item"><div class="h"><span><span class="s">'+'★'.repeat(i.rating)+'☆'.repeat(5-i.rating)+'</span> <span class="tag">'+esc(i.category)+'</span></span><span>'+esc(new Date(i.at).toLocaleString('en-IN'))+' · '+esc(i.metal)+'/'+esc(i.mode)+'/'+esc(i.lang)+'</span></div>'+(i.message?'<p>'+esc(i.message)+'</p>':'')+'</div>'}).join(''):'<div style="color:#6B7280;padding:20px;text-align:center">Nothing here yet.</div>';
}
function enter(v){pw=v;$('err').textContent='';load().then(function(j){
  if(j._s===401||!j.ok){pw='';try{localStorage.removeItem('jfPw')}catch(e){}$('err').textContent=j._s===401?'Incorrect password.':(j.error||'Failed.');$('login').classList.remove('hidden');$('app').classList.add('hidden');return}
  try{localStorage.setItem('jfPw',v)}catch(e){}items=j.items||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');paint()}).catch(function(){$('err').textContent='Network error.'})}
$('go').onclick=function(){enter($('pw').value)};$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')enter($('pw').value)});
$('fc').onchange=paint;$('fr').onchange=paint;$('rf').onclick=function(){enter(pw)};
try{var sp=localStorage.getItem('jfPw');if(sp)enter(sp)}catch(e){}
</script>
</body>
</html>

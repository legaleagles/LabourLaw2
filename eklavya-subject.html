padding:6px 12px;border-radius:8px;cursor:pointer;margin-left:auto;}

  <a class="nav-brand" href="index.html">⚖️ LawSticker AI</a>

</nav>

<div class="hero">
  <div class="hero-eyebrow">🏹 Eklavya (AI-klavya) · Daily Study Plan</div>
  <div class="hero-title" id="subjectTitle">Loading…</div>
  <div class="hero-progress-row">
    <div class="hero-progress-track"><div class="hero-progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="hero-progress-label" id="progressLabel">–</div>
  </div>
  <div class="hero-daterange" id="heroDateRange"></div>
  <a class="notes-download-btn" id="notesLink" href="#">📥 Download Notes So Far</a>
  <a class="exam-btn" id="examLink" href="#" style="display:none;">⏱️ Take the Mock Exam</a>
</div>

<div class="wrap">
  <div class="cal-nav">
    <button class="cal-nav-btn" id="calPrev" onclick="shiftMonth(-1)">←</button>
    <div class="cal-month-label" id="calMonthLabel"></div>
    <button class="cal-nav-btn" id="calNext" onclick="shiftMonth(1)">→</button>
  </div>
  <div class="cal-weekday-row">
    <div class="cal-weekday">Sun</div><div class="cal-weekday">Mon</div><div class="cal-weekday">Tue</div>
    <div class="cal-weekday">Wed</div><div class="cal-weekday">Thu</div><div class="cal-weekday">Fri</div><div class="cal-weekday">Sat</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="lecture-panel" id="lecturePanel">
    <div class="empty-panel">Loading today's topic…</div>
  </div>
</div>

<script>
var params = new URLSearchParams(location.search);
var subject = params.get('subject') || 'cpc';

// Maps Eklavya's subject slugs to the existing mock-exam tool's subject
// params (built earlier for LLB Study Corner, exam.html?subject=X).
// Reused as-is rather than duplicated — only listed where a mock exam
// already exists; anything not in this map simply won't show the button.
var EXAM_SUBJECT_MAP = {
  's1-contract1':'contract1', 's1-familylaw1':'familylaw1', 's1-constlaw1':'constlaw1',
  's1-torts1':'torts1', 's1-envlaw1':'envlaw1',
  's2-contract2':'contract2', 's2-familylaw2':'familylaw2', 's2-constlaw2':'constlaw2',
  's2-crimes1':'crimes1', 's2-evidence1':'evidence1',
  's3-jurisprudence':'jurisprudence', 's3-property1':'property1', 's3-adminlaw':'adminlaw',
  's3-companylaw':'companylaw', 's3-labourlaw1':'labourlaw1',
  's4-labourlaw2':'labour2', 's4-pil':'pil', 's4-interpretation':'ios',
  's4-landlaws':'land', 's4-ipr':'ipr',
  'cpc':'cpc', 'bnss':'bnss', 'banking':'banking', 'adr':'adr', 'ethics':'ethics'
};
var START, TOTAL_DAYS = 45, PLAN_END;
var topicsData = null, lecturesData = null, selectedDay = null;
var viewYear, viewMonth; // 0-indexed month currently shown

function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function todayIndex(){
  var now = new Date();
  var diff = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(START.getFullYear(),START.getMonth(),START.getDate())) / 86400000) + 1;
  return diff;
}

function dateForDay(n){
  var d = new Date(START);
  d.setDate(d.getDate() + (n - 1));
  return d;
}

function dayNumberForDate(y,m,d){
  var target = new Date(y,m,d);
  var diff = Math.floor((target - new Date(START.getFullYear(),START.getMonth(),START.getDate())) / 86400000) + 1;
  return diff;
}

var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function shiftMonth(delta){
  viewMonth += delta;
  if (viewMonth < 0){ viewMonth = 11; viewYear--; }
  if (viewMonth > 11){ viewMonth = 0; viewYear++; }
  renderCalendar();
}

function renderCalendar(){
  var idx = todayIndex();
  document.getElementById('calMonthLabel').textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;

  var firstOfMonth = new Date(viewYear, viewMonth, 1);
  var startWeekday = firstOfMonth.getDay(); // 0=Sun
  var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  var grid = document.getElementById('calGrid');
  var html = '';
  for (var i = 0; i < startWeekday; i++) html += '<div class="cal-day blank"></div>';

  for (var d = 1; d <= daysInMonth; d++){
    var dayNum = dayNumberForDate(viewYear, viewMonth, d);
    var inPlan = dayNum >= 1 && dayNum <= (topicsData.topics.length || TOTAL_DAYS);

    if (!inPlan){
      html += '<div class="cal-day outside-plan"><div class="dn">' + d + '</div></div>';
      continue;
    }

    var unlocked = dayNum <= idx;
    var isToday = dayNum === idx;
    var hasLecture = lecturesData && lecturesData.lectures && lecturesData.lectures[String(dayNum)];
    var cls = 'cal-day';
    if (!unlocked) cls += ' locked';
    else if (isToday) cls += ' today';
    else cls += ' available' + (hasLecture ? ' done' : '');
    if (dayNum === selectedDay) cls += ' selected';
    var star = (hasLecture && unlocked && hasLecture.importance_stars >= 4) ? '<span class="star">⭐</span>' : '';
    html += '<div class="' + cls + '" ' + (unlocked ? 'onclick="selectDay(' + dayNum + ')"' : '') + '>' +
      '<div class="dn">' + d + '</div>' + star +
    '</div>';
  }
  grid.innerHTML = html;
}

function selectDay(day){
  selectedDay = day;
  renderCalendar();
  renderLecture(day);
  document.getElementById('lecturePanel').scrollIntoView({behavior:'smooth', block:'start'});
}

function speakText(text){
  if (!window.speechSynthesis) { alert('Read-aloud is not supported on this browser.'); return; }
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    return; // tap again to stop
  }
  window.speechSynthesis.cancel();
  // Some mobile browsers (notably Chrome/Android) drop the very next
  // speak() call if it's fired in the same tick as cancel() — a small
  // delay makes this reliable.
  setTimeout(function(){
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN';
    u.rate = 0.95;
    u.onerror = function(){ alert('Could not play audio — try again.'); };
    window.speechSynthesis.speak(u);
  }, 80);
}

function switchDepth(tab){
  document.querySelectorAll('.depth-tab').forEach(function(b){ b.classList.toggle('active', b.dataset.depth === tab); });
  document.querySelectorAll('.depth-panel').forEach(function(p){ p.classList.toggle('active', p.dataset.depth === tab); });
}

function renderLecture(day){
  var panel = document.getElementById('lecturePanel');
  var lec = lecturesData && lecturesData.lectures && lecturesData.lectures[String(day)];
  var meta = topicsData.topics.find(function(t){ return t.day === day; });

  if (!lec){
    var idx = todayIndex();
    var msg = (day === idx)
      ? "Today's lecture hasn't generated yet — it runs automatically once a day. Check back in a bit."
      : "This day hasn't been generated yet.";
    panel.innerHTML = '<div class="empty-panel">📖 <strong>' + esc(meta ? meta.topic : '') + '</strong><br><br>' + msg + '</div>';
    return;
  }

  var starsHtml = '⭐'.repeat(lec.importance_stars || 0) + '☆'.repeat(5 - (lec.importance_stars || 0));

  var out = '';
  out += '<div class="lec-unit">' + esc(lec.unit) + ' · Day ' + lec.day + ' · ' + esc(new Date(lec.date + 'T00:00:00').toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long', year:'numeric'})) + '</div>';
  out += '<div class="lec-title">' + esc(lec.lecture_title) + '</div>';

  if (lec.memory_hook){
    out += '<div class="lec-hook"><span class="lec-hook-icon">🧠</span><span class="lec-hook-text">' + esc(lec.memory_hook) + '</span></div>';
  }

  out += '<div class="lec-stars"><span class="lec-stars-icons">' + starsHtml + '</span><span class="lec-stars-reason">' + esc(lec.importance_reason) + '</span></div>';

  // Depth tabs — same content, three exam-ready depths
  out += '<div class="depth-tabs">' +
    '<button class="depth-tab active" data-depth="quick" onclick="switchDepth(\'quick\')">⚡ Quick Answer</button>' +
    '<button class="depth-tab" data-depth="essay" onclick="switchDepth(\'essay\')">📝 Essay Answer</button>' +
    '<button class="depth-tab" data-depth="full" onclick="switchDepth(\'full\')">📘 Full Lecture</button>' +
  '</div>';
  out += '<div class="depth-panel active" data-depth="quick">' + esc(lec.quick_answer) + '</div>';
  out += '<div class="depth-panel" data-depth="essay">' + esc(lec.essay_answer) + '</div>';
  out += '<div class="depth-panel" data-depth="full">' + esc(lec.concept_explanation) +
    '<button class="lec-listen" style="display:block;margin-top:10px;" id="listenBtn">🔊 Listen</button></div>';

  // Quick-nav chips — jump straight to a section instead of scrolling past everything
  out += '<div class="quicknav">' +
    '<a href="#sec-real">🌍 Real World</a>' +
    '<a href="#sec-illus">💡 Illustration</a>' +
    '<a href="#sec-prov">📋 Provisions</a>' +
    '<a href="#sec-cases">⚖️ Cases</a>' +
    '<a href="#sec-exam">✍️ Exam</a>' +
    '<a href="#sec-recap">⚡ Recap</a>' +
  '</div>';

  if (lec.real_world_example){
    out += '<details class="sec-card sec-realworld" id="sec-real" open>' +
      '<summary><span class="sec-icon-badge">🌍</span>Why This Actually Matters</summary>' +
      '<div class="sec-card-body">' + esc(lec.real_world_example) + '</div></details>';
  }

  if (lec.illustration){
    out += '<details class="sec-card sec-illustration" id="sec-illus">' +
      '<summary><span class="sec-icon-badge">💡</span>Worked Illustration</summary>' +
      '<div class="sec-card-body">' + esc(lec.illustration) + '</div></details>';
  }

  if (lec.key_provisions && lec.key_provisions.length){
    var provBody = lec.key_provisions.map(function(p){ return '<div class="provision-item">' + esc(p) + '</div>'; }).join('');
    out += '<details class="sec-card sec-provisions" id="sec-prov">' +
      '<summary><span class="sec-icon-badge">📋</span>Key Provisions</summary>' +
      '<div class="sec-card-body">' + provBody + '</div></details>';
  }

  if (lec.case_laws && lec.case_laws.length){
    var caseBody = lec.case_laws.map(function(c){
      return '<div class="case-item"><div class="case-name">' + esc(c.case_name) + '</div>' +
        (c.citation ? '<div class="case-citation">' + esc(c.citation) + '</div>' : '') +
        '<div class="case-row"><div class="case-row-label">📌 Facts</div><div class="case-row-text">' + esc(c.facts) + '</div></div>' +
        '<div class="case-row"><div class="case-row-label">⚖️ Holding</div><div class="case-row-text">' + esc(c.holding) + '</div></div>' +
        '<div class="case-why"><div class="case-row-label">💡 Why It Matters</div><div class="case-row-text">' + esc(c.why_it_matters) + '</div></div>' +
      '</div>';
    }).join('');
    out += '<details class="sec-card sec-cases" id="sec-cases" open>' +
      '<summary><span class="sec-icon-badge">⚖️</span>Case Laws (' + lec.case_laws.length + ')</summary>' +
      '<div class="sec-card-body">' + caseBody + '</div></details>';
  }

  if (lec.exam_angle){
    out += '<details class="sec-card sec-examangle" id="sec-exam">' +
      '<summary><span class="sec-icon-badge">✍️</span>Exam Angle</summary>' +
      '<div class="sec-card-body">' + esc(lec.exam_angle) + '</div></details>';
  }

  if (lec.quick_recap && lec.quick_recap.length){
    var recapBody = '<ul class="recap-list">' + lec.quick_recap.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    out += '<details class="sec-card sec-recap" id="sec-recap" open>' +
      '<summary><span class="sec-icon-badge">⚡</span>Quick Recap</summary>' +
      '<div class="sec-card-body">' + recapBody + '</div></details>';
  }

  panel.innerHTML = out;

  var listenBtn = document.getElementById('listenBtn');
  if (listenBtn) {
    listenBtn.onclick = function(){ speakText(lec.concept_explanation); };
  }
}

Promise.all([
  fetch('llb5-' + subject + '-topics.json?t=' + Date.now()).then(function(r){ if(!r.ok) throw new Error('topics.json: HTTP ' + r.status); return r.json(); }),
  fetch('llb5-' + subject + '-lectures.json?t=' + Date.now()).then(function(r){ return r.ok ? r.json() : {lectures:{}}; }).catch(function(){ return {lectures:{}}; })
]).then(function(results){
  topicsData = results[0];
  lecturesData = results[1];
  START = new Date(topicsData.start_date + 'T00:00:00');
  document.getElementById('subjectTitle').textContent = topicsData.subject_name;
  document.title = topicsData.subject_name + ' — Eklavya | LawSticker AI';
  document.getElementById('notesLink').href = 'eklavya-notes.html?subject=' + encodeURIComponent(subject);
  if (EXAM_SUBJECT_MAP[subject]) {
    var examLink = document.getElementById('examLink');
    examLink.href = 'https://lawsticker-ai.com/exam.html?subject=' + encodeURIComponent(EXAM_SUBJECT_MAP[subject]);
    examLink.style.display = 'inline-flex';
  }

  var idx = todayIndex();
  var total = topicsData.topics.length;
  var doneCount = Math.max(0, Math.min(idx, total));
  document.getElementById('progressFill').style.width = Math.round((doneCount/total)*100) + '%';
  document.getElementById('progressLabel').textContent = doneCount + '/' + total + ' days';
  var endDate = dateForDay(total);
  document.getElementById('heroDateRange').textContent =
    START.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) + ' → ' +
    endDate.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

  var anchorDate = dateForDay(Math.max(1, Math.min(idx, total)));
  viewYear = anchorDate.getFullYear();
  viewMonth = anchorDate.getMonth();
  renderCalendar();

  var target = Math.max(1, Math.min(idx, total));
  selectDay(target);
})
.catch(function(err){
  document.getElementById('subjectTitle').textContent = 'Not available yet';
  document.getElementById('lecturePanel').innerHTML = '<div class="empty-panel">This subject\'s study plan isn\'t loading.<br><br><strong>Error detail:</strong> ' + esc(err.message) + '<br><br>Please share this with support.</div>';
});
</script>

</body>
</html>

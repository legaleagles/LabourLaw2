<style>
:root{
  --navy:#0D1117;--ink:#1A1208;--ink-soft:#374151;--cream:#FEFCF5;--muted:#6B7486;--light:#E8EDF3;
  --gold:#C9A227;--gold-l:#F5D76E;--gold-pale:#FDF6DC;--gold-deep:#8B6914;
  --ni:#9D174D;--br:#4338CA;--cpc:#059669;--ord:#0F766E;--lim:#B45309;--con:#D97706;--ipc:#DC2626;--crpc:#2563EB;--evi:#7C3AED;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
nav{background:var(--navy);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.nav-back{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;font-weight:600}
.nav-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:var(--gold-l)}
.container{max-width:720px;margin:0 auto;padding:12px 16px 60px}
.search-wrap{position:sticky;top:48px;z-index:50;background:var(--cream);padding:10px 0 6px}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--light);border-radius:14px;padding:0 14px}
.search-box:focus-within{border-color:var(--gold)}
.search-input{flex:1;min-width:0;padding:12px 0;border:none;outline:none;font-family:inherit;font-size:16px;background:transparent;color:var(--ink)}
.search-clear{background:none;border:none;cursor:pointer;padding:4px;color:var(--muted);font-size:18px;display:none}
.search-clear.show{display:block}
.act-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 8px}
.act-tabs::-webkit-scrollbar{display:none}
.act-tab{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1.5px solid var(--light);background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.act-tab small{font-weight:600;color:var(--muted);font-size:11px}
.act-tab.active{color:#fff;border-color:transparent;background:var(--c)}
.act-tab.active small{color:rgba(255,255,255,.8)}
.result-meta{font-size:12.5px;color:var(--muted);font-weight:600}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin:6px 0 12px;background:#fff;border:1px solid var(--light)}
.banner.warn{background:#FEF2F2;border-color:#FCA5A5;color:#7F1D1D}
.banner.sum{background:var(--gold-pale);border-color:#EBD58A;color:#5B4708}
.banner a{color:inherit;font-weight:700}
.section-list{display:flex;flex-direction:column;gap:10px}
.group{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 2px 0}
.sec-card{background:#fff;border-radius:14px;padding:14px;border:1px solid rgba(0,0,0,.07);border-left:4px solid var(--c);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.sec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.sec-ref{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-badge{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:8px;color:#fff;background:var(--c)}
.sec-num{font-size:14px;font-weight:800;color:var(--ink)}
.sec-kind{font-size:10.5px;font-weight:700;color:var(--gold-deep);background:var(--gold-pale);border-radius:6px;padding:2px 6px}
.sec-head{font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
.sec-gist{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-top:6px}
.sec-text{font-size:14px;color:var(--ink-soft);line-height:1.65;margin-top:8px;overflow-wrap:anywhere}
.sec-text p{margin:0 0 7px}
.sec-text.clip{max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{margin-top:6px;background:none;border:none;color:var(--gold-deep);font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;padding:4px 0}
.sec-copy{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;font-size:15px;color:var(--muted);flex-shrink:0}
.hl{background:rgba(201,162,39,.3);border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:38px;margin-bottom:10px}
.empty-text{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--ink-soft)}
.empty-sub{font-size:13px}
.loadmore{display:block;margin:14px auto 0;padding:10px 18px;border-radius:10px;border:1.5px solid var(--light);background:#fff;font:inherit;font-weight:800;cursor:pointer}
footer{text-align:center;padding:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--light);line-height:1.7}
footer a{color:var(--gold-deep);text-decoration:none;font-weight:700}

<div class="container">
  <div class="search-wrap">
    <div class="search-box">
      <span aria-hidden="true">🔍</span>
      <input type="search" class="search-input" id="searchInput" placeholder="Section number or word — e.g. 80, res judicata, injunction" oninput="onSearch()" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="clearBtn" onclick="clearSearch()" aria-label="Clear">✕</button>
    </div>
    <div class="act-tabs" id="actTabs"></div>
    <div class="result-meta" id="resultMeta"></div>
  </div>
  <div id="banner"></div>
  <div class="section-list" id="sectionList"><div class="empty"><div class="empty-icon">⚖️</div><div class="empty-text">Loading…</div></div></div>
</div>

<footer>
  <div id="footCount">📖 Bare Acts</div>
  <div>Full text from public open data of the Acts as published on India Code · summaries written by LawSticker AI. For court work, always check the latest amended text on <a href="https://www.indiacode.nic.in" target="_blank" rel="noopener">indiacode.nic.in</a>.</div>
  <div><a href="cpc-hub.html">🗂️ All CPC material</a> · <a href="eklavya.html">🏹 Eklavya</a> · <a href="calculators.html">Calculators</a> · <a href="index.html">LawSticker AI</a></div>
</footer>

<script>
var ACTS = [
  {id:'cpc', label:'CPC', sub:'Sections', c:'var(--cpc)'},
  {id:'cpc-orders', label:'CPC', sub:'Orders', c:'var(--ord)'},
  {id:'limitation', label:'Limitation Act', sub:'', c:'var(--lim)'},
  {id:'ni', label:'NI Act', sub:'', c:'var(--ni)'},
  {id:'br', label:'BR Act', sub:'', c:'var(--br)'},
  {id:'constitution', label:'Constitution', sub:'', c:'var(--con)'},
  {id:'ipc', label:'IPC', sub:'old', c:'var(--ipc)'},
  {id:'crpc', label:'CrPC', sub:'old', c:'var(--crpc)'},
  {id:'evidence', label:'Evidence Act', sub:'old', c:'var(--evi)'}
];
var DATA = {}, current = 'cpc', searchQ = '', shown = 60, PAGE = 60, list = [];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ev(n, p){ try { gtag('event', n, p || {}); } catch (e) {} }
function act(id){ return ACTS.filter(function(a){ return a.id === id; })[0]; }

function load(id){
  if (DATA[id]) return Promise.resolve(DATA[id]);
  return fetch('downloads/bare-acts/' + id + '.json').then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ DATA[id] = d; return d; });
}

function tabs(){
  $('actTabs').innerHTML = ACTS.map(function(a){ return '<button class="act-tab' + (a.id === current ? ' active' : '') + '" style="--c:' + a.c + '" data-id="' + a.id + '">' + esc(a.label) + (a.sub ? ' <small>' + esc(a.sub) + '</small>' : '') + '</button>'; }).join('')
    + '<button class="act-tab' + (current === 'all' ? ' active' : '') + '" style="--c:var(--navy)" data-id="all">🔎 Search all</button>';
  document.querySelectorAll('.act-tab').forEach(function(b){ b.onclick = function(){ setAct(b.dataset.id); }; });
}

function setAct(id){
  current = id; shown = PAGE; tabs(); syncUrl(); ev('bare_act_tab', { act: id });
  var a = $('actTabs').querySelector('.active'); if (a && a.scrollIntoView) a.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  go();
}

function syncUrl(){ try { var u = new URL(location.href); u.searchParams.set('act', current); if (searchQ) u.searchParams.set('q', searchQ); else u.searchParams.delete('q'); history.replaceState(null, '', u); } catch (e) {} }

function go(){
  $('sectionList').innerHTML = '<div class="empty"><div class="empty-icon">⚖️</div><div class="empty-text">Loading…</div></div>';
  var ids = current === 'all' ? ACTS.map(function(a){ return a.id; }) : [current];
  Promise.all(ids.map(load)).then(render).catch(function(){
    $('sectionList').innerHTML = '<div class="empty"><div class="empty-icon">📡</div><div class="empty-text">Could not load this Act</div><div class="empty-sub">Check your connection and tap the tab again.</div></div>';
  });
}

function banner(){
  if (current === 'all') return '<div class="banner">Searching every Act on this page. Type a section number or a word.</div>';
  var m = DATA[current].meta, h = '';
  if (m.repealed) h += '<div class="banner warn">⚠️ <b>Repealed from 1 July 2024</b> — replaced by the ' + esc(m.repealed) + '. Kept here for old section numbers and older judgments.</div>';
  if (m.kind === 'summary') h += '<div class="banner sum">📝 <b>Plain-English summaries</b> of each provision, written for study — not the official wording. Read the official text on <a href="https://www.indiacode.nic.in" target="_blank" rel="noopener">India Code</a>.' + (m.cover ? ' ' + esc(m.cover) : current === 'cpc-orders' ? ' Covers all 51 Orders and their key rules.' : ' Covers every section and the main Articles of the Schedule.') + '</div>';
  else h += '<div class="banner">📜 <b>' + esc(m.act) + '</b> — full text. Square brackets [ ] mark words inserted by later amendments; * * * marks words omitted.</div>';
  return h;
}

function norm(s){ return String(s).toLowerCase().replace(/^(section|sec|s\.|art\.|article|order|o\.)\s*/, '').replace(/\s+/g, ' ').trim(); }

function render(){
  var ids = current === 'all' ? ACTS.map(function(a){ return a.id; }) : [current];
  var q = searchQ.toLowerCase(), qn = norm(searchQ);
  list = [];
  ids.forEach(function(id){
    (DATA[id].items || []).forEach(function(s){
      if (!q) { list.push({ id: id, s: s, score: 0 }); return; }
      var sec = String(s.sec).toLowerCase(), secn = norm(s.sec), score = -1;
      if (secn === qn || sec === q) score = 100;
      else if (secn.indexOf(qn) === 0 && /\d/.test(qn)) score = 60;
      else if ((s.head || '').toLowerCase().indexOf(q) >= 0) score = 40;
      else if ((s.group || '').toLowerCase().indexOf(q) >= 0) score = 30;
      else if ((s.gist || '').toLowerCase().indexOf(q) >= 0) score = 20;
      else if ((s.text || '').toLowerCase().indexOf(q) >= 0) score = 10;
      if (score >= 0) list.push({ id: id, s: s, score: score });
    });
  });
  if (q) list.sort(function(a, b){ return b.score - a.score; });
  if (current === 'all' && !q) list = [];
  $('banner').innerHTML = banner();
  var a = act(current);
  $('resultMeta').textContent = current === 'all' && !q ? 'Type to search all Acts' : list.length + (list.length === 1 ? ' provision' : ' provisions') + (current !== 'all' ? ' · ' + DATA[current].meta.act : '') + (q ? ' · matching “' + searchQ + '”' : '');
  if (!list.length) {
    $('sectionList').innerHTML = current === 'all' && !q ? '' : '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Nothing found</div><div class="empty-sub">Try a section number, a different word, or “Search all”.</div></div>';
    return;
  }
  draw();
}

function hl(text){
  var t = esc(text); if (!searchQ) return t;
  var e = esc(searchQ).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return t.replace(new RegExp(e, 'gi'), function(m){ return '<span class="hl">' + m + '</span>'; });
}

function card(r, k){
  var a = act(r.id), s = r.s, m = DATA[r.id].meta;
  var label = m.short === 'COI' ? '' : (r.id === 'cpc' || r.id === 'ipc' || r.id === 'crpc' || r.id === 'evidence' || r.id === 'ni' || r.id === 'br' ? 'S.' : '');
  var body = '';
  if (s.gist) body += '<div class="sec-gist">' + hl(s.gist) + '</div>';
  if (s.text) { var long = s.text.length > 320; body += '<div class="sec-text' + (long ? ' clip' : '') + '" id="t' + k + '">' + s.text.split('\n').map(function(p){ return '<p>' + hl(p) + '</p>'; }).join('') + '</div>' + (long ? '<button class="more" data-k="' + k + '">Read full text ▾</button>' : ''); }
  return '<div class="sec-card" style="--c:' + a.c + '"><div class="sec-top"><div class="sec-ref"><span class="sec-badge">' + esc(a.label + (a.sub && a.sub !== 'old' ? ' ' + a.sub : '')) + '</span><span class="sec-num">' + hl(label + s.sec) + '</span>' + (m.kind === 'summary' ? '<span class="sec-kind">summary</span>' : '') + '</div><button class="sec-copy" data-k="' + k + '" title="Copy" aria-label="Copy">📋</button></div><div class="sec-head">' + hl(s.head) + '</div>' + body + '</div>';
}

function draw(){
  var h = '', lastG = null;
  list.slice(0, shown).forEach(function(r, k){
    var g = !searchQ && r.s.group ? r.s.group : null;
    if (g && g !== lastG) { h += '<div class="group">' + esc(g) + '</div>'; lastG = g; }
    h += card(r, k);
  });
  if (list.length > shown) h += '<button class="loadmore" id="loadMore">Show more (' + (list.length - shown) + ' left)</button>';
  $('sectionList').innerHTML = h;
  document.querySelectorAll('.more').forEach(function(b){ b.onclick = function(){ var t = $('t' + b.dataset.k), open = t.classList.toggle('clip'); b.textContent = open ? 'Read full text ▾' : 'Show less ▴'; if (!open) ev('bare_act_read', { act: list[+b.dataset.k].id, sec: list[+b.dataset.k].s.sec }); }; });
  document.querySelectorAll('.sec-copy').forEach(function(b){ b.onclick = function(){ copy(b, list[+b.dataset.k]); }; });
  if ($('loadMore')) $('loadMore').onclick = function(){ shown += PAGE * 2; draw(); };
}

function copy(btn, r){
  var m = DATA[r.id].meta, s = r.s;
  var txt = m.act + ' — ' + s.sec + ': ' + s.head + '\n\n' + (s.gist ? s.gist + '\n\n' : '') + (s.text ? s.text + '\n\n' : '') + 'via LawSticker AI · lawsticker-ai.com/bare-acts.html';
  var done = function(){ btn.textContent = '✓'; setTimeout(function(){ btn.textContent = '📋'; }, 1500); };
  try { navigator.clipboard.writeText(txt).then(done, function(){}); } catch (e) {}
}

var timer = null;
function onSearch(){
  searchQ = $('searchInput').value.trim(); $('clearBtn').classList.toggle('show', searchQ.length > 0);
  clearTimeout(timer); timer = setTimeout(function(){ shown = PAGE; syncUrl(); if (searchQ.length > 2) ev('bare_act_search', { act: current, q: searchQ.slice(0, 40) }); go(); }, 200);
}
function clearSearch(){ $('searchInput').value = ''; searchQ = ''; $('clearBtn').classList.remove('show'); shown = PAGE; syncUrl(); go(); }

(function init(){
  var p = new URLSearchParams(location.search), a = p.get('act'), q = p.get('q');
  if (a && (act(a) || a === 'all')) current = a;
  if (q) { searchQ = q; $('searchInput').value = q; $('clearBtn').classList.add('show'); }
  tabs(); go();
  $('footCount').textContent = '📖 Bare Acts · CPC (sections + all 51 Orders) · Limitation Act · Constitution · IPC · CrPC · Evidence Act';
})();
</script>
</body>

<style>
:root{
  --ink:#0A0E1A; --ink2:#10162A;
  --gold:#C9A227; --gold-l:#E8CD6F; --gold-dim:#7A6420;
  --parchment:#F4ECD8; --parchment-dim:rgba(244,236,216,.55);
  --brass:#8B6F2E;
  --line:rgba(201,162,39,.18);
  --jade:#5EAD8B; --rose:#C9716B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans','Noto Sans Telugu','Noto Sans Devanagari',sans-serif;
  background:var(--ink); color:var(--parchment);
  -webkit-font-smoothing:antialiased;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
.bg-texture{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 700px 500px at 15% 0%, rgba(201,162,39,.06), transparent 60%),radial-gradient(ellipse 600px 500px at 100% 100%, rgba(162,59,59,.05), transparent 55%)}

/* NAV */
nav{
  position:relative; z-index:10; flex-shrink:0;
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-back{color:var(--parchment-dim); text-decoration:none; font-size:13px; font-weight:600}
.nav-back:hover{color:var(--gold-l)}
.nav-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:900;color:var(--gold-l);display:flex;align-items:center;gap:6px}
.nav-langs{display:flex; gap:4px}
.nav-lang{padding:4px 10px; border-radius:14px; border:1px solid rgba(201,162,39,.25); background:transparent; color:rgba(244,236,216,.4); font-family:inherit; font-size:11px; font-weight:600; cursor:pointer; transition:all .2s}
.nav-lang.active{border-color:var(--gold); color:var(--ink); background:var(--gold)}

/* CHAT AREA */
.chat-scroll{
  flex:1; overflow-y:auto; position:relative; z-index:2;
  padding:20px 16px 16px;
}
.chat-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.msg{display:flex; gap:10px; opacity:0; animation:msgIn .45s ease forwards}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  background:linear-gradient(135deg,var(--gold-dim),var(--brass));
}
.msg.user .avatar{background:rgba(201,162,39,.18)}
.bubble{
  background:rgba(244,236,216,.055); border:1px solid rgba(244,236,216,.08);
  border-radius:4px 16px 16px 16px; padding:13px 16px; font-size:14px; line-height:1.65;
  color:var(--parchment-dim); max-width:480px;
}
.msg.user .bubble{
  background:rgba(201,162,39,.12); border-color:rgba(201,162,39,.22);
  border-radius:16px 4px 16px 16px; color:var(--gold-l); font-weight:600;
}
.bubble.typing{padding:14px 18px}
.typing-dots{display:inline-flex;gap:4px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.4;animation:dot 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* INFO CARD (rich bubble) */
.info-card{
  background:linear-gradient(180deg, rgba(201,162,39,.07), rgba(201,162,39,.02));
  border:1px solid rgba(201,162,39,.25); border-radius:4px 16px 16px 16px;
  padding:18px 18px 14px; max-width:520px;
}
.ic-eyebrow{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:6px}
.ic-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--parchment);margin-bottom:10px}
.ic-section{margin-bottom:12px}
.ic-section:last-child{margin-bottom:0}
.ic-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dim);margin-bottom:5px}
.ic-text{font-size:13px;line-height:1.65;color:var(--parchment-dim)}
.ic-divider{height:1px;background:rgba(201,162,39,.15);margin:12px 0}
.ic-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ic-pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;background:rgba(244,236,216,.06);color:var(--parchment-dim);border:1px solid rgba(244,236,216,.1)}
.ic-pill.gold{background:rgba(201,162,39,.15);color:var(--gold-l);border-color:rgba(201,162,39,.3)}
.ic-pill.jade{background:rgba(94,173,139,.15);color:var(--jade);border-color:rgba(94,173,139,.3)}
.ic-pill.rose{background:rgba(201,113,107,.15);color:var(--rose);border-color:rgba(201,113,107,.3)}

/* CHOICE BUBBLES */
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;padding-left:40px}
.choice-btn{
  background:rgba(244,236,216,.04); border:1px solid rgba(201,162,39,.3);
  color:var(--parchment); font-family:inherit; font-size:13px; font-weight:600;
  padding:10px 16px; border-radius:20px; cursor:pointer; transition:all .2s;
  opacity:0; animation:choiceIn .35s ease forwards;
}
.choice-btn:nth-child(1){animation-delay:.05s}
.choice-btn:nth-child(2){animation-delay:.12s}
.choice-btn:nth-child(3){animation-delay:.19s}
.choice-btn:nth-child(4){animation-delay:.26s}
.choice-btn:nth-child(5){animation-delay:.33s}
.choice-btn:nth-child(6){animation-delay:.40s}
@keyframes choiceIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.choice-btn:hover{background:rgba(201,162,39,.15);border-color:var(--gold);transform:translateY(-1px)}
.choice-btn:active{transform:scale(.97)}
.choice-btn.secondary{border-style:dashed;opacity:.7}

/* progress breadcrumb */
.breadcrumb{
  max-width:640px;margin:0 auto 4px;padding:0 0 4px;
  display:flex;gap:6px;flex-wrap:wrap;
}
.crumb{font-size:10px;font-weight:600;color:var(--gold-dim);background:rgba(201,162,39,.08);padding:3px 9px;border-radius:10px;border:1px solid rgba(201,162,39,.15)}

footer{
  position:relative;z-index:5;flex-shrink:0;
  text-align:center;padding:10px;font-size:10px;color:rgba(244,236,216,.25);
  border-top:1px solid var(--line);
}
footer a{color:var(--gold-dim);text-decoration:none}

@media(max-width:420px){
  .choices{padding-left:0}
  .bubble,.info-card{max-width:88vw}
}
</style>

let lang = 'en';

const chatInner = document.getElementById('chatInner');
const chatScroll = document.getElementById('chatScroll');

function scrollDown(){ requestAnimationFrame(()=>{ chatScroll.scrollTop = chatScroll.scrollHeight; }); }

function botMsg(html, delay){
  return new Promise(resolve=>{
    const typingEl = document.createElement('div');
    typingEl.className='msg';
    typingEl.innerHTML = `<div class="avatar">⚖️</div><div class="bubble typing"><span class="typing-dots"><span></span><span></span><span></span></span></div>`;
    chatInner.appendChild(typingEl);
    scrollDown();
    setTimeout(()=>{
      typingEl.remove();
      const el = document.createElement('div');
      el.className='msg';
      el.innerHTML = `<div class="avatar">⚖️</div><div class="bubble">${html}</div>`;
      chatInner.appendChild(el);
      scrollDown();
      resolve();
    }, delay || 700);
  });
}
function botCard(html){
  return new Promise(resolve=>{
    const el = document.createElement('div');
    el.className='msg';
    el.innerHTML = `<div class="avatar">⚖️</div><div class="info-card">${html}</div>`;
    chatInner.appendChild(el);
    scrollDown();
    setTimeout(resolve, 100);
  });
}
function userMsg(text){
  const el = document.createElement('div');
  el.className='msg user';
  el.innerHTML = `<div class="avatar">🎓</div><div class="bubble">${text}</div>`;
  chatInner.appendChild(el);
  scrollDown();
}
function showChoices(options, container){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.className='choices';
    options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn' + (opt.secondary ? ' secondary' : '');
      btn.textContent = opt.label;
      btn.onclick = ()=>{
        wrap.querySelectorAll('button').forEach(b=>b.disabled=true);
        wrap.style.opacity='.35'; wrap.style.pointerEvents='none';
        userMsg(opt.label);
        resolve(opt.value);
      };
      wrap.appendChild(btn);
    });
    chatInner.appendChild(wrap);
    scrollDown();
  });
}
function addCrumb(label){
  history.push(label);
  renderCrumbs();
}
function renderCrumbs(){
  let bc = document.getElementById('breadcrumb');
  if(!bc){
    bc = document.createElement('div');
    bc.className='breadcrumb';
    bc.id='breadcrumb';
    chatInner.parentNode.insertBefore(bc, chatInner);
  }
  bc.innerHTML = history.map(h=>`<span class="crumb">${h}</span>`).join('');
}
function clearChat(){
  chatInner.innerHTML='';
  history=[];
  const bc=document.getElementById('breadcrumb');
  if(bc) bc.remove();
}

function renderPathCard(interestKey, stage){
  const t = T[lang];
  const p = PATHS[lang][interestKey];
  if(!p) return '';
  const elig = p.eligibility(stage);
  return `
    <div class="ic-eyebrow">${p.eyebrow}</div>
    <div class="ic-title">${p.title}</div>
    <div class="ic-section">
      <div class="ic-label">${lang==='te'?'మీ అర్హత స్థితి':lang==='hi'?'आपकी योग्यता स्थिति':'Your Eligibility Right Now'}</div>
      <div class="ic-text">${elig}</div>
    </div>
    <div class="ic-divider"></div>
    <div class="ic-section">
      <div class="ic-label">${lang==='te'?'సాధారణ ప్యాటర్న్':lang==='hi'?'सामान्य पैटर्न':'The General Pattern'}</div>
      <div class="ic-text">${p.pattern}</div>
    </div>
    <div class="ic-divider"></div>
    <div class="ic-section">
      <div class="ic-label">${lang==='te'?'వాస్తవ మాట':lang==='hi'?'सच्ची बात':'A Reality Check'}</div>
      <div class="ic-text">${p.reality}</div>
      <div class="ic-pills">${p.pills.map(pl=>`<span class="ic-pill gold">${pl}</span>`).join('')}</div>
    </div>
    <div class="ic-divider"></div>
    <div class="ic-section">
      <div class="ic-label">${lang==='te'?'తదుపరి అడుగులు':lang==='hi'?'अगले कदम':'Practical Next Steps'}</div>
      <div class="ic-text">${p.nextSteps}</div>
    </div>
  `;
}

// ══════════════════════════════════════════
//  MAIN FLOW
// ══════════════════════════════════════════
let currentStage = null;

async function startFlow(){
  clearChat();
  const t = T[lang];
  await botMsg(t.greet, 600);
  const stageVal = await showChoices(t.stageOpts);
  currentStage = stageVal;
  addCrumb(t.stageCrumb[stageVal]);
  await interestStep();
}

async function interestStep(){
  const t = T[lang];
  await botMsg(t.askInterest, 600);
  const interestVal = await showChoices(t.interestOpts);

  if(interestVal === 'unsure'){
    addCrumb(t.interestCrumb.unsure);
    await showAllSummary();
    return;
  }

  addCrumb(t.interestCrumb[interestVal]);
  await showPathDetail(interestVal);
}

async function showAllSummary(){
  const t = T[lang];
  await botMsg(lang==='te' ? 'పర్వాలేదు — ఇక్కడ అన్ని ఐదు మార్గాల సంక్షిప్త వీక్షణ ఉంది. ఏది మిమ్మల్ని ఆకర్షిస్తుందో గమనించండి, ఆపై లోతుగా వెళ్దాం.' :
    lang==='hi' ? 'कोई बात नहीं — यहां सभी पांच रास्तों का संक्षिप्त विवरण है। देखें कि आपको क्या आकर्षित करता है, फिर हम गहराई में जाएंगे।' :
    'No problem — here\'s a quick look at all five paths. Notice which one pulls at you, then we\'ll go deeper.', 600);

  for(const key of ['judiciary','litigation','corporate','civil','academia']){
    const p = PATHS[lang][key];
    await botCard(`<div class="ic-eyebrow">${p.eyebrow}</div><div class="ic-title">${p.title}</div><div class="ic-text">${p.reality.split('.')[0]}.</div>`);
    await new Promise(r=>setTimeout(r, 200));
  }

  await botMsg(t.bridge, 500);
  const interestVal = await showChoices(T[lang].interestOpts.filter(o=>o.value!=='unsure'));
  addCrumb(T[lang].interestCrumb[interestVal]);
  await showPathDetail(interestVal);
}

async function showPathDetail(interestKey){
  const t = T[lang];
  await new Promise(r=>setTimeout(r, 300));
  await botCard(renderPathCard(interestKey, currentStage));
  await new Promise(r=>setTimeout(r, 400));
  await botMsg(t.afterCard, 500);
  const choice = await showChoices(t.endOpts);

  if(choice === 'restart_interest'){
    await botMsg(t.restartGreet, 500);
    await interestStep();
  } else if(choice === 'restart_all'){
    await startFlow();
  } else if(choice === 'calculators'){
    window.location.href = 'calculators.html';
  }
}

function setLang(l){
  lang = l;
  document.querySelectorAll('.nav-lang').forEach((b,i)=>b.classList.toggle('active', ['en','te','hi'][i]===l));
  document.getElementById('navTitle').textContent = T[l].navTitle;
  document.getElementById('footerTxt').textContent = T[l].footerTxt;
  document.documentElement.lang = l;
  try{ localStorage.setItem('career_lang', l); }catch(e){}
  startFlow();
}

 {icon:'📜',
  title:{en:'Unregistered Association = No Legal Teeth',te:'నమోదుకాని సంఘం = చట్టపరమైన అధికారం లేదు',hi:'अपंजीकृत संघ = कोई कानूनी शक्ति नहीं'},
  meta:{en:'Check registration before obeying penalties',te:'జరిమానాలు పాటించే ముందు నమోదు తనిఖీ చేయండి',hi:'जुर्माना मानने से पहले पंजीकरण जांचें'},
  tag:{en:'KNOW THIS FIRST',te:'ముందుగా ఇది తెలుసుకోండి',hi:'पहले यह जानें'},tagCls:'rtag-e',
  body:{en:'An association must be <strong>registered</strong> (Societies Registration Act / Apartment Ownership Act) with <strong>registered bylaws</strong> to legally: levy enforceable penalties, sue members, or enter contracts. An unregistered body or unregistered bylaws = moral authority at best. You can demand proof of registration and a copy of the registered bylaws — refusing to show them is itself a red flag. Fines and rules that are not in the registered bylaws are not enforceable against you.',
        te:'ఒక సంఘం చట్టపరంగా జరిమానాలు విధించడానికి, సభ్యులపై దావా వేయడానికి <strong>నమోదు</strong> (సొసైటీస్ రిజిస్ట్రేషన్ చట్టం / అపార్ట్‌మెంట్ ఓనర్‌షిప్ చట్టం) మరియు <strong>నమోదిత బైలాస్</strong> ఉండాలి. నమోదుకాని సంస్థ = నైతిక అధికారం మాత్రమే. నమోదు రుజువు మరియు నమోదిత బైలాస్ కాపీ డిమాండ్ చేయవచ్చు. నమోదిత బైలాస్‌లో లేని జరిమానాలు, నియమాలు మీపై అమలు చేయలేరు.',
        hi:'संघ को कानूनी रूप से जुर्माना लगाने, सदस्यों पर मुकदमा करने के लिए <strong>पंजीकृत</strong> (सोसाइटी पंजीकरण अधिनियम / अपार्टमेंट स्वामित्व अधिनियम) होना और <strong>पंजीकृत उपनियम</strong> होना जरूरी है। अपंजीकृत निकाय = केवल नैतिक अधिकार। पंजीकरण प्रमाण और उपनियमों की कॉपी मांग सकते हैं। पंजीकृत उपनियमों में न होने वाले जुर्माने-नियम आप पर लागू नहीं होते।'},
  steps:{en:['Ask the association in writing for: registration certificate + registered bylaws copy.','Verify independently at the District Registrar / Registrar of Societies office (or state portal).','If unregistered — any penalty, interest, or "rule" they impose beyond consent is unenforceable.','Push for registration through the General Body — an unregistered association hurts everyone (no bank account standing, no suits).','If they act coercively while unregistered — civil injunction + police complaint as applicable.'],
         te:['సంఘాన్ని లిఖితంగా అడగండి: నమోదు ధృవీకరణ పత్రం + నమోదిత బైలాస్ కాపీ.','జిల్లా రిజిస్ట్రార్ / సొసైటీల రిజిస్ట్రార్ కార్యాలయంలో స్వతంత్రంగా ధృవీకరించండి.','నమోదుకాకపోతే — వారు విధించే జరిమానా, వడ్డీ, "నియమం" అమలు చేయలేనివి.','జనరల్ బాడీ ద్వారా నమోదు కోసం ఒత్తిడి చేయండి.','నమోదుకాకుండా బలవంతం చేస్తే — సివిల్ నిషేధాజ్ఞ + పోలీసు ఫిర్యాదు.'],
         hi:['संघ से लिखित में मांगें: पंजीकरण प्रमाणपत्र + पंजीकृत उपनियमों की कॉपी।','जिला रजिस्ट्रार / सोसाइटी रजिस्ट्रार कार्यालय में स्वतंत्र रूप से सत्यापित करें।','अपंजीकृत हो — उनका कोई जुर्माना, ब्याज, "नियम" लागू नहीं होता।','जनरल बॉडी के माध्यम से पंजीकरण के लिए दबाव डालें।','अपंजीकृत रहते हुए जबरदस्ती करें — सिविल निषेधाज्ञा + पुलिस शिकायत।']},
  law:{en:'Telangana Societies Registration Act 2001 / AP Societies Registration Act 2001; Telangana Apartments (Promotion of Construction and Ownership) Act 1987; Societies Registration Act 1860',
       te:'తెలంగాణ సొసైటీల రిజిస్ట్రేషన్ చట్టం 2001; తెలంగాణ అపార్ట్‌మెంట్స్ చట్టం 1987; సొసైటీస్ రిజిస్ట్రేషన్ చట్టం 1860',
       hi:'तेलंगाना सोसाइटी पंजीकरण अधिनियम 2001; तेलंगाना अपार्टमेंट अधिनियम 1987; सोसाइटी पंजीकरण अधिनियम 1860'}},

 {icon:'💰',
  title:{en:'Maintenance Charges — Bylaws & General Body, Not Committee Whims',te:'మెయింటెనెన్స్ ఛార్జీలు — బైలాస్ & జనరల్ బాడీ, కమిటీ ఇష్టం కాదు',hi:'मेंटेनेंस शुल्क — उपनियम और जनरल बॉडी, कमेटी की मर्जी नहीं'},
  meta:{en:'Arbitrary hikes · Differential charging · Interest on dues',te:'ఏకపక్ష పెంపులు · వివక్షాపూరిత వసూళ్లు',hi:'मनमानी बढ़ोतरी · भेदभावपूर्ण वसूली'},
  tag:{en:'ENTITLEMENT',te:'హక్కు',hi:'अधिकार'},tagCls:'rtag-e',
  body:{en:'Maintenance rates, penalty interest, and special levies must be <strong>approved by the General Body</strong> per the registered bylaws — a managing committee cannot invent them. Charging method (per sq ft vs per flat) must follow bylaws/GB resolution. You are entitled to an <strong>itemised bill</strong> and to question any levy in the GB. Occupied or vacant, common-area maintenance applies — but arbitrary "non-occupancy charges" beyond what bylaws/state rules permit are challengeable.',
        te:'మెయింటెనెన్స్ రేట్లు, జరిమానా వడ్డీ, ప్రత్యేక వసూళ్లు నమోదిత బైలాస్ ప్రకారం <strong>జనరల్ బాడీ ఆమోదం</strong> పొందాలి — మేనేజింగ్ కమిటీ సొంతంగా సృష్టించలేదు. వసూలు పద్ధతి (చ.అ. లేదా ఫ్లాట్) బైలాస్/GB తీర్మానం ప్రకారం ఉండాలి. <strong>వివరణాత్మక బిల్లు</strong> మీ హక్కు.',
        hi:'मेंटेनेंस दरें, जुर्माना ब्याज, विशेष वसूली पंजीकृत उपनियमों के अनुसार <strong>जनरल बॉडी से अनुमोदित</strong> होनी चाहिए — प्रबंध समिति खुद नहीं बना सकती। वसूली का तरीका (प्रति वर्ग फुट या प्रति फ्लैट) उपनियम/GB प्रस्ताव से हो। <strong>मदवार बिल</strong> आपका अधिकार है।'},
  steps:{en:['Ask for the GB resolution + bylaw clause authorising any new charge or hike — in writing.','Demand itemised bills and the annual budget presented to the GB.','Dispute in writing; pay undisputed portions to avoid the "defaulter" tag while contesting.','Escalate to the Registrar of Societies for bylaw violations by the committee.','Consumer Commission route: maintenance is a service — deficiency complaints have succeeded.'],
         te:['ఏదైనా కొత్త ఛార్జీ లేదా పెంపుకు GB తీర్మానం + బైలా క్లాజ్ లిఖితంగా అడగండి.','వివరణాత్మక బిల్లులు మరియు GBకి సమర్పించిన వార్షిక బడ్జెట్ డిమాండ్ చేయండి.','లిఖితంగా వివాదం చేయండి; వివాదం లేని భాగం చెల్లించండి.','కమిటీ బైలా ఉల్లంఘనలకు సొసైటీల రిజిస్ట్రార్‌కు ఎస్కలేట్ చేయండి.','వినియోగదారు కమిషన్ మార్గం: మెయింటెనెన్స్ ఒక సేవ — లోపం ఫిర్యాదులు విజయవంతమయ్యాయి.'],
         hi:['किसी भी नए शुल्क या बढ़ोतरी के लिए GB प्रस्ताव + उपनियम खंड लिखित में मांगें।','मदवार बिल और GB में पेश वार्षिक बजट मांगें।','लिखित में विवाद करें; निर्विवाद हिस्सा चुकाएं।','कमेटी के उपनियम उल्लंघन पर सोसाइटी रजिस्ट्रार से शिकायत।','उपभोक्ता आयोग: मेंटेनेंस एक सेवा है — कमी की शिकायतें सफल रही हैं।']},
  law:{en:'Registered bylaws + General Body supremacy under Societies/Apartment Acts; Consumer Protection Act 2019 — maintenance is a service; State model bylaws',
       te:'నమోదిత బైలాస్ + జనరల్ బాడీ ఆధిక్యత; వినియోగదారు రక్షణ చట్టం 2019 — మెయింటెనెన్స్ ఒక సేవ',
       hi:'पंजीकृत उपनियम + जनरल बॉडी सर्वोच्चता; उपभोक्ता संरक्षण अधिनियम 2019 — मेंटेनेंस एक सेवा है'}},

 {icon:'📊',
  title:{en:'Right to Accounts, Audit & Records',te:'ఖాతాలు, ఆడిట్ & రికార్డుల హక్కు',hi:'खाते, ऑडिट और रिकॉर्ड का अधिकार'},
  meta:{en:'Where is the corpus? Where did sinking fund go?',te:'కార్పస్ ఎక్కడ? సింకింగ్ ఫండ్ ఎక్కడికి పోయింది?',hi:'कॉर्पस कहां है? सिंकिंग फंड कहां गया?'},
  tag:{en:'ENTITLEMENT',te:'హక్కు',hi:'अधिकार'},tagCls:'rtag-e',
  body:{en:'Every member has the right to inspect: <strong>audited annual accounts, income-expenditure statements, bank statements of society accounts, GB meeting minutes, and the members register</strong>. Annual audit and Annual General Meeting are statutory obligations for registered societies. Committee refusing to show accounts is a violation you can take to the Registrar — who has power to inquire, and even supersede a committee for mismanagement.',
        te:'ప్రతి సభ్యుడికి తనిఖీ హక్కు ఉంది: <strong>ఆడిట్ చేసిన వార్షిక ఖాతాలు, ఆదాయ-వ్యయ నివేదికలు, సొసైటీ బ్యాంక్ స్టేట్‌మెంట్లు, GB సమావేశ మినిట్స్, సభ్యుల రిజిస్టర్</strong>. వార్షిక ఆడిట్ మరియు AGM నమోదిత సొసైటీలకు చట్టబద్ధ బాధ్యతలు. ఖాతాలు చూపడానికి నిరాకరిస్తే రిజిస్ట్రార్‌కు వెళ్ళవచ్చు.',
        hi:'हर सदस्य को निरीक्षण का अधिकार: <strong>ऑडिटेड वार्षिक खाते, आय-व्यय विवरण, सोसाइटी बैंक स्टेटमेंट, GB मीटिंग मिनट्स, सदस्य रजिस्टर</strong>। वार्षिक ऑडिट और AGM पंजीकृत सोसाइटियों के वैधानिक दायित्व हैं। खाते दिखाने से इनकार — रजिस्ट्रार के पास जाएं।'},
  steps:{en:['Request inspection/copies in writing citing your membership right under the bylaws and Societies Act.','If refused — complain to the Registrar of Societies with your written request as proof.','Registrar can call for records, order an inquiry, and act against the committee.','For suspected fund misappropriation — the Registrar inquiry + police complaint (criminal breach of trust, IPC 406) both apply.','Rally 1/3rd of members (check bylaws) to requisition a Special General Body Meeting.'],
         te:['బైలాస్ మరియు సొసైటీల చట్టం కింద మీ సభ్యత్వ హక్కు పేర్కొంటూ లిఖితంగా తనిఖీ/కాపీలు అడగండి.','నిరాకరిస్తే — మీ లిఖిత అభ్యర్థనతో సొసైటీల రిజిస్ట్రార్‌కు ఫిర్యాదు.','రిజిస్ట్రార్ రికార్డులు తెప్పించి, విచారణ ఆదేశించి, కమిటీపై చర్య తీసుకోవచ్చు.','నిధుల దుర్వినియోగ అనుమానం — రిజిస్ట్రార్ విచారణ + పోలీసు ఫిర్యాదు (IPC 406).','ప్రత్యేక జనరల్ బాడీ సమావేశం కోరడానికి 1/3 సభ్యులను సమీకరించండి.'],
         hi:['उपनियमों और सोसाइटी अधिनियम के तहत सदस्यता अधिकार बताते हुए लिखित में निरीक्षण/कॉपी मांगें।','इनकार हो — लिखित अनुरोध के प्रमाण के साथ सोसाइटी रजिस्ट्रार से शिकायत।','रजिस्ट्रार रिकॉर्ड मंगा सकते हैं, जांच का आदेश दे सकते हैं।','फंड गबन का शक — रजिस्ट्रार जांच + पुलिस शिकायत (IPC 406)।','विशेष जनरल बॉडी मीटिंग के लिए 1/3 सदस्य जुटाएं (उपनियम देखें)।']},
  law:{en:'Telangana/AP Societies Registration Act 2001 — member inspection rights, Registrar inquiry powers; IPC 406 — criminal breach of trust; registered bylaws',
       te:'తెలంగాణ/AP సొసైటీల రిజిస్ట్రేషన్ చట్టం 2001 — సభ్యుల తనిఖీ హక్కులు, రిజిస్ట్రార్ విచారణ అధికారాలు; IPC 406',
       hi:'तेलंगाना/AP सोसाइटी पंजीकरण अधिनियम 2001 — सदस्य निरीक्षण अधिकार, रजिस्ट्रार जांच शक्तियां; IPC 406'}},

 {icon:'🚫',
  title:{en:'NOC Extortion, Move-In Charges & Arbitrary Fines',te:'NOC దోపిడీ, మూవ్-ఇన్ ఛార్జీలు & ఏకపక్ష జరిమానాలు',hi:'NOC वसूली, मूव-इन शुल्क और मनमाने जुर्माने'},
  meta:{en:'Selling your flat? Renting it? They cannot hold you hostage',te:'ఫ్లాట్ అమ్ముతున్నారా? అద్దెకిస్తున్నారా? బందీగా ఉంచలేరు',hi:'फ्लैट बेच रहे हैं? किराए पर दे रहे हैं? बंधक नहीं बना सकते'},
  tag:{en:'PROHIBITED',te:'నిషేధం',hi:'निषिद्ध'},tagCls:'rtag-r',
  body:{en:'Your flat is <strong>your property</strong>. The association cannot: demand transfer fees/NOC charges beyond what registered bylaws (and state caps) permit, refuse NOC to pressure you on unrelated disputes, block tenants by category (bachelors, food habits, religion, caste — discriminatory embargoes are not enforceable against an owner\'s right to let), or impose fines that have no basis in registered bylaws. Genuine dues can be settled — but NOC cannot be weaponised.',
        te:'మీ ఫ్లాట్ <strong>మీ ఆస్తి</strong>. సంఘం చేయలేనివి: నమోదిత బైలాస్ మించి బదిలీ రుసుములు/NOC ఛార్జీలు డిమాండ్ చేయడం, సంబంధం లేని వివాదాలపై ఒత్తిడికి NOC నిరాకరించడం, వర్గం ఆధారంగా అద్దెదారులను నిషేధించడం (బ్యాచిలర్లు, ఆహారపు అలవాట్లు, మతం, కులం), నమోదిత బైలాస్‌లో లేని జరిమానాలు విధించడం.',
        hi:'आपका फ्लैट <strong>आपकी संपत्ति</strong> है। संघ नहीं कर सकता: पंजीकृत उपनियमों से अधिक ट्रांसफर फीस/NOC शुल्क मांगना, असंबंधित विवादों के दबाव के लिए NOC रोकना, श्रेणी के आधार पर किरायेदार रोकना (बैचलर, खान-पान, धर्म, जाति), पंजीकृत उपनियमों में न होने वाले जुर्माने लगाना।'},
  steps:{en:['Ask in writing: which bylaw clause authorises this charge/fine? Demand the GB resolution.','Offer to clear genuine, documented dues — separate them from illegal demands.','Record refusals. An unjustified NOC refusal blocking sale/registration → legal notice, then civil suit for damages.','Discriminatory tenant embargo → the owner can proceed; such GB resolutions do not override ownership rights.','Registrar of Societies complaint for ultra-vires (beyond-bylaws) actions of the committee.'],
         te:['లిఖితంగా అడగండి: ఏ బైలా క్లాజ్ ఈ ఛార్జీ/జరిమానాకు అధికారం ఇస్తుంది? GB తీర్మానం డిమాండ్ చేయండి.','నిజమైన, డాక్యుమెంట్ చేసిన బకాయిలు క్లియర్ చేయండి — చట్టవిరుద్ధ డిమాండ్ల నుండి వేరు చేయండి.','నిరాకరణలు రికార్డ్ చేయండి. అన్యాయమైన NOC నిరాకరణ → లీగల్ నోటీసు, తర్వాత నష్టపరిహారం దావా.','వివక్షాపూరిత అద్దెదారు నిషేధం → యజమాని ముందుకు వెళ్ళవచ్చు.','కమిటీ బైలాస్ మించిన చర్యలకు సొసైటీల రిజిస్ట్రార్ ఫిర్యాదు.'],
         hi:['लिखित में पूछें: कौन सा उपनियम खंड इस शुल्क/जुर्माने को अधिकृत करता है? GB प्रस्ताव मांगें।','वास्तविक, दस्तावेजी बकाया चुकाएं — अवैध मांगों से अलग करें।','इनकार रिकॉर्ड करें। अनुचित NOC इनकार → कानूनी नोटिस, फिर हर्जाने का मुकदमा।','भेदभावपूर्ण किरायेदार रोक → मालिक आगे बढ़ सकता है।','कमेटी की उपनियम-बाहर कार्रवाई पर सोसाइटी रजिस्ट्रार से शिकायत।']},
  law:{en:'Transfer of Property Act 1882 — owner\'s right to transfer/let; registered bylaws limits; Article 14/15 principles against discrimination; state society rules capping transfer fees',
       te:'ఆస్తి బదిలీ చట్టం 1882 — యజమాని బదిలీ/అద్దె హక్కు; నమోదిత బైలాస్ పరిమితులు; Article 14/15',
       hi:'संपत्ति हस्तांतरण अधिनियम 1882 — मालिक का हस्तांतरण/किराया अधिकार; पंजीकृत उपनियम सीमाएं; अनुच्छेद 14/15'}},

 {icon:'🗳️',
  title:{en:'Elections, AGM & Committee Accountability',te:'ఎన్నికలు, AGM & కమిటీ జవాబుదారీతనం',hi:'चुनाव, AGM और कमेटी जवाबदेही'},
  meta:{en:'Committee overstaying? AGM never held? Registrar can act',te:'కమిటీ కాలం మించి కొనసాగుతుందా? రిజిస్ట్రార్ చర్య తీసుకోవచ్చు',hi:'कमेटी कार्यकाल से अधिक? रजिस्ट्रार कार्रवाई कर सकते हैं'},
  tag:{en:'ENTITLEMENT',te:'హక్కు',hi:'अधिकार'},tagCls:'rtag-e',
  body:{en:'Registered bylaws fix the committee\'s term and mandate periodic elections and an <strong>Annual General Meeting</strong>. A committee continuing beyond its term without election, or never holding AGM, loses legitimacy. Members can requisition a Special GB Meeting (typically 1/3rd members — check bylaws). The <strong>Registrar of Societies can order elections, appoint an inquiry, or supersede a defaulting committee</strong>. Pets note: general body resolutions banning pets are contrary to AWBI Guidelines 2015 — they cannot ban, only regulate reasonably.',
        te:'నమోదిత బైలాస్ కమిటీ కాలవ్యవధి నిర్ణయించి, క్రమానుగత ఎన్నికలు మరియు <strong>వార్షిక సాధారణ సభ</strong> తప్పనిసరి చేస్తాయి. ఎన్నికలు లేకుండా కాలం మించి కొనసాగే కమిటీ చట్టబద్ధత కోల్పోతుంది. సభ్యులు ప్రత్యేక GB సమావేశం కోరవచ్చు (సాధారణంగా 1/3 సభ్యులు). <strong>రిజిస్ట్రార్ ఎన్నికలు ఆదేశించవచ్చు, విచారణ నియమించవచ్చు, కమిటీని తొలగించవచ్చు</strong>. పెంపుడు జంతువులు: నిషేధించే తీర్మానాలు AWBI మార్గదర్శకాలు 2015కి విరుద్ధం.',
        hi:'पंजीकृत उपनियम कमेटी का कार्यकाल तय करते हैं और आवधिक चुनाव व <strong>वार्षिक आम बैठक</strong> अनिवार्य करते हैं। बिना चुनाव कार्यकाल से अधिक चलने वाली कमेटी वैधता खो देती है। सदस्य विशेष GB बैठक की मांग कर सकते हैं (आमतौर पर 1/3 सदस्य)। <strong>रजिस्ट्रार चुनाव का आदेश दे सकते हैं, जांच बैठा सकते हैं, कमेटी हटा सकते हैं</strong>। पालतू जानवर: प्रतिबंध प्रस्ताव AWBI दिशानिर्देश 2015 के विरुद्ध हैं।'},
  steps:{en:['Check bylaws: committee term, election cycle, AGM deadline, requisition threshold.','Collect the required member signatures and formally requisition a Special GB Meeting.','If the committee ignores it — complain to the Registrar of Societies with the requisition proof.','Ask the Registrar to conduct/order elections and inquire into non-compliance.','For builder still controlling the association years after handover — RERA complaint (association formation + corpus handover are builder obligations).'],
         te:['బైలాస్ తనిఖీ: కమిటీ కాలం, ఎన్నికల చక్రం, AGM గడువు, అభ్యర్థన పరిమితి.','అవసరమైన సభ్యుల సంతకాలు సేకరించి ప్రత్యేక GB సమావేశం అధికారికంగా కోరండి.','కమిటీ పట్టించుకోకపోతే — అభ్యర్థన రుజువుతో రిజిస్ట్రార్‌కు ఫిర్యాదు.','ఎన్నికలు నిర్వహించమని/ఆదేశించమని రిజిస్ట్రార్‌ను కోరండి.','హ్యాండోవర్ తర్వాత కూడా బిల్డర్ సంఘాన్ని నియంత్రిస్తుంటే — RERA ఫిర్యాదు.'],
         hi:['उपनियम जांचें: कमेटी कार्यकाल, चुनाव चक्र, AGM समयसीमा, मांग सीमा।','आवश्यक सदस्य हस्ताक्षर जुटाकर विशेष GB बैठक की औपचारिक मांग करें।','कमेटी अनदेखा करे — मांग के प्रमाण के साथ रजिस्ट्रार से शिकायत।','रजिस्ट्रार से चुनाव कराने/आदेश देने को कहें।','हैंडओवर के बाद भी बिल्डर संघ नियंत्रित करे — RERA शिकायत।']},
  law:{en:'TS/AP Societies Registration Act 2001 — elections, AGM, Registrar powers; RERA 2016 Sections 11, 17 — association formation & handover; AWBI Pet Guidelines 2015',
       te:'TS/AP సొసైటీల రిజిస్ట్రేషన్ చట్టం 2001; RERA 2016 Sections 11, 17; AWBI పెట్ మార్గదర్శకాలు 2015',
       hi:'TS/AP सोसाइटी पंजीकरण अधिनियम 2001; RERA 2016 धारा 11, 17; AWBI पालतू दिशानिर्देश 2015'}},
];

let L='en';
function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}

function render(){
 const U=UI[L];
 ['navBrand','navBack','heroEye','heroTitle','heroSub'].forEach(id=>{
  document.getElementById(id).textContent=U[id];});
 document.getElementById('shareBtn').textContent=U.share;
 document.getElementById('secList').innerHTML=SECS.map((s,i)=>{
  const steps=s.steps[L].map((st,j)=>`<div class="step-row"><div class="step-n">${j+1}</div><div class="step-text">${st}</div></div>`).join('');
  return `<div class="sec-card">
   <div class="sec-header" onclick="toggle(${i})">
    <div class="sec-icon">${s.icon}</div>
    <div class="sec-hdr-body">
      <div class="sec-title">${s.title[L]}</div>
      <div class="sec-meta">${s.meta[L]}</div>
    </div>
    <div class="sec-chev${i===0?' open':''}" id="chev${i}">▼</div>
   </div>
   <div class="sec-body${i===0?' open':''}" id="body${i}">
    <span class="rtag ${s.tagCls}">${s.tag[L]}</span>
    <div class="item-body">${s.body[L]}</div>
    <div class="steps-box"><div class="steps-title">${U.steps}</div>${steps}</div>
    <div class="law-box"><strong>${U.law}</strong> ${s.law[L]}</div>
   </div>
  </div>`;
 }).join('');
}
function toggle(i){document.getElementById('body'+i).classList.toggle('open');
 document.getElementById('chev'+i).classList.toggle('open');}
function shareMsg(){window.open('https://wa.me/?text='+encodeURIComponent(UI[L].shareMsg),'_blank');}
document.addEventListener('DOMContentLoaded',render);
</script>
<script>
/* Language persistence — remembers choice across all pages */
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];
  var btns=document.querySelectorAll('.nav-lang');
  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>
</body>
</html>

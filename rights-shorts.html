// ═══════════════════ STATE ═══════════════════
let currentLang='en', currentType='rights', idx=0;

function pool(){ return currentType==='rights' ? RIGHTS_CARDS : CALC_CARDS; }

// Day-of-year for "daily" rotation
function dayOfYear(){
  const now=new Date(), start=new Date(now.getFullYear(),0,0);
  return Math.floor((now-start)/86400000);
}

// ═══════════════════ CANVAS RENDER ═══════════════════
function wrapText(ctx,text,x,y,maxW,lineH){
  const words=text.split(' ');let line='',yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lineH;}
    else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy;
}

function fontStack(weight,size){
  const f = currentLang==='te' ? "'Noto Sans Telugu'" : currentLang==='hi' ? "'Noto Sans Devanagari'" : "'DM Sans'";
  return `${weight} ${size}px ${f}, 'DM Sans', sans-serif`;
}

function renderCard(){
  const c=document.getElementById('card'),ctx=c.getContext('2d');
  const card=pool()[idx],L=UI[currentLang];
  const W=1080,H=1350;

  // Background — navy with subtle gradient
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0D1117');bg.addColorStop(.55,'#131B29');bg.addColorStop(1,'#0D1117');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Accent bar top
  ctx.fillStyle=card.accent;ctx.fillRect(0,0,W,14);

  // Watermark icon — huge, faint
  ctx.globalAlpha=.05;ctx.font='520px sans-serif';ctx.textAlign='right';
  ctx.fillStyle='#FFFFFF';ctx.fillText(card.icon,W+70,H-140);
  ctx.globalAlpha=1;ctx.textAlign='left';

  // Header: DID YOU KNOW badge
  ctx.fillStyle=card.accent;
  const badge=L.know;
  ctx.font=fontStack(800,34);
  const bw=ctx.measureText(badge).width+70;
  roundRect(ctx,70,90,bw,72,36);ctx.fill();
  ctx.fillStyle='#FFFFFF';ctx.fillText(badge,105,140);

  // Icon
  ctx.font='120px sans-serif';ctx.fillText(card.icon,70,330);

  // Fact — main body
  ctx.fillStyle='#FFFFFF';ctx.font=fontStack(700,56);
  const factEnd=wrapText(ctx,card.fact[currentLang],70,450,W-160,80);

  // Divider
  ctx.strokeStyle='rgba(201,162,39,.4)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(70,factEnd+70);ctx.lineTo(W-70,factEnd+70);ctx.stroke();

  // Legal basis / tool name
  ctx.fillStyle='#C9A227';ctx.font=fontStack(800,30);
  const lbl = currentType==='rights' ? L.law : L.free;
  ctx.fillText(lbl,70,factEnd+135);
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.font=fontStack(600,38);
  const detail = currentType==='rights' ? card.law[currentLang] : card.name[currentLang];
  wrapText(ctx,detail,70,factEnd+190,W-160,54);

  // Footer band
  ctx.fillStyle='rgba(201,162,39,.12)';ctx.fillRect(0,H-190,W,190);
  ctx.fillStyle='#F5D76E';ctx.font=fontStack(900,44);
  ctx.fillText('⚖️ LawSticker AI',70,H-110);
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font=fontStack(600,32);
  ctx.fillText(L.tagline,70,H-55);
  ctx.fillStyle='#F5D76E';ctx.font=fontStack(700,32);ctx.textAlign='right';
  ctx.fillText('lawsticker-ai.com',W-70,H-80);
  ctx.textAlign='left';

  // Update badge
  const d=new Date();
  document.getElementById('dayBadge').textContent=
    L.dayBadge({n:idx+1,total:pool().length,date:d.toLocaleDateString(currentLang==='te'?'te-IN':currentLang==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'short'})});
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

// ═══════════════════ ACTIONS ═══════════════════
function setLang(l,b){currentLang=l;
  document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
  if(b)b.classList.add('active');applyUI();renderCard();}

function setType(t){currentType=t;idx=dayOfYear()%pool().length;
  document.getElementById('ttRights').classList.toggle('active',t==='rights');
  document.getElementById('ttCalcs').classList.toggle('active',t==='calcs');
  renderCard();}

function nextCard(){idx=(idx+1)%pool().length;renderCard();}
function prevCard(){idx=(idx-1+pool().length)%pool().length;renderCard();}

function applyUI(){
  const L=UI[currentLang];
  ['navBrand','prevLbl','nextLbl','dlBtn','waBtn','ttRights','ttCalcs'].forEach(id=>{
    const el=document.getElementById(id);if(el&&typeof L[id]==='string')el.textContent=L[id];});
  document.getElementById('hint').innerHTML=L.hint;
}

function downloadCard(){
  const c=document.getElementById('card');
  const a=document.createElement('a');
  a.download=`lawsticker-${currentType}-card-${idx+1}.png`;
  a.href=c.toDataURL('image/png');
  a.click();
  showToast(UI[currentLang].downloaded);
}

function shareText(){
  const card=pool()[idx],L=UI[currentLang];
  const detail=currentType==='rights'?card.law[currentLang]:card.name[currentLang];
  const msg=`${card.icon} *${L.know}*\n\n${card.fact[currentLang]}\n\n📋 ${detail}\n\n⚖️ ${L.tryIt}: lawsticker-ai.com/${card.url}\n\n_${L.tagline}_`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

// ═══════════════════ INIT ═══════════════════
document.addEventListener('DOMContentLoaded',()=>{
  idx=dayOfYear()%RIGHTS_CARDS.length;   // today's card
  applyUI();
  // Wait for fonts so Telugu/Hindi render correctly on canvas
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(renderCard);}
  setTimeout(renderCard,600); // fallback
  renderCard();
});
</script>

   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>

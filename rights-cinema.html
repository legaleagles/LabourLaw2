const SECS=[{"icon": "🚫", "tagCls": "rtag-e", "title": {"en": "Can They Ban Outside Food? — Yes, And Here's Why", "te": "బయటి ఆహారాన్ని నిషేధించవచ్చా? — అవును, ఎందుకు", "hi": "क्या बाहरी खाना बैन कर सकते हैं? — हाँ, वजह जानें"}, "meta": {"en": "Settled by the Supreme Court, 2023 — this is current law", "te": "సుప్రీంకోర్టు 2023లో స్థిరపరిచింది", "hi": "सुप्रीम कोर्ट ने 2023 में तय किया"}, "tag": {"en": "MOST MISUNDERSTOOD RULE", "te": "అత్యంత అపార్థం చేసుకున్న నియమం", "hi": "सबसे गलत समझा गया नियम"}, "body": {"en": "This is genuinely where most confusion comes from, because <strong>the law actually flipped</strong>: in 2018, the Jammu & Kashmir High Court ruled that banning outside food violated moviegoers' right to choice under Article 21. Cinema owners appealed, and in <strong>January 2023, the Supreme Court overturned that ruling</strong> — settling the matter as it currently stands. The Court's reasoning: movie halls are <strong>private property</strong>, not a public utility. Buying a ticket means agreeing to the hall's terms, the same way a restaurant can enforce a dress code. If you don't like the food on offer, you're free not to buy it — but you can't compel the theatre to let you bring your own. <strong>One clear exception the Court itself carved out:</strong> theatres must allow infant food or a bottle of milk for feeding a baby or young child during the film.", "te": "ఇక్కడే చాలా గందరగోళం వస్తుంది, ఎందుకంటే <strong>చట్టం నిజంగా మారింది</strong>: 2018లో, జమ్మూ & కాశ్మీర్ హైకోర్టు బయటి ఆహారాన్ని నిషేధించడం ఆర్టికల్ 21 కింద ప్రేక్షకుల ఎంపిక హక్కును ఉల్లంఘిస్తుందని తీర్పు ఇచ్చింది. సినిమా యజమానులు అప్పీల్ చేశారు, <strong>జనవరి 2023లో, సుప్రీంకోర్టు ఆ తీర్పును తిరస్కరించింది</strong> — ప్రస్తుతం ఇది స్థిరపడిన విషయం. కోర్టు కారణం: సినిమా హాళ్లు <strong>ప్రైవేట్ ఆస్తి</strong>, ప్రజా సౌకర్యం కాదు. టికెట్ కొనడం అంటే హాల్ నిబంధనలకు అంగీకరించడం. <strong>కోర్టు స్వయంగా చేసిన ఒక స్పష్టమైన మినహాయింపు:</strong> థియేటర్లు శిశువు లేదా చిన్న పిల్లలకు ఆహారం లేదా పాల సీసాను అనుమతించాలి.", "hi": "यहीं से ज़्यादातर भ्रम आता है, क्योंकि <strong>कानून वास्तव में बदल गया</strong>: 2018 में, जम्मू-कश्मीर हाईकोर्ट ने फैसला दिया कि बाहरी खाना बैन करना दर्शकों के अनुच्छेद 21 के तहत पसंद के अधिकार का उल्लंघन करता है। सिनेमा मालिकों ने अपील की, और <strong>जनवरी 2023 में, सुप्रीम कोर्ट ने उस फैसले को पलट दिया</strong> — यह अभी की स्थिति है। कोर्ट का तर्क: सिनेमा हॉल <strong>निजी संपत्ति</strong> हैं, सार्वजनिक सुविधा नहीं। टिकट खरीदना हॉल की शर्तों से सहमत होना है। <strong>कोर्ट ने खुद एक स्पष्ट अपवाद रखा:</strong> थिएटरों को शिशु आहार या दूध की बोतल की अनुमति देनी चाहिए।"}, "steps": {"en": ["Know that the ban itself is legal — arguing it violates your rights won't hold up if challenged.", "If you're carrying a baby, infant food/milk is a protected exception — theatres cannot refuse this.", "If a theatre confiscates or refuses reasonable infant feeding items, that's worth raising with the manager directly, citing this exception.", "Outside these exceptions, plan to buy food inside or eat beforehand — this isn't a fight worth picking at the door."], "te": ["నిషేధం చట్టబద్ధమైనదని తెలుసుకోండి.", "మీరు శిశువును తీసుకువెళ్తుంటే, శిశు ఆహారం/పాలు రక్షిత మినహాయింపు.", "థియేటర్ న్యాయమైన శిశు ఆహార వస్తువులను నిరాకరిస్తే, మేనేజర్‌తో మాట్లాడండి.", "ఈ మినహాయింపుల వెలుపల, లోపల ఆహారం కొనడానికి ప్లాన్ చేయండి."], "hi": ["जानें कि बैन खुद कानूनी है — इसे चुनौती देना काम नहीं करेगा।", "अगर बच्चा साथ है, तो शिशु आहार/दूध एक संरक्षित अपवाद है।", "थिएटर उचित शिशु आहार वस्तुएं मना करे तो मैनेजर से बात करें।", "इन अपवादों के अलावा, अंदर खाना खरीदने की योजना बनाएं।"]}, "law": {"en": "Supreme Court ruling, January 2023 (overturning J&K High Court, 2018); Article 19(1)(g)", "te": "సుప్రీంకోర్టు తీర్పు, జనవరి 2023; ఆర్టికల్ 19(1)(g)", "hi": "सुप्रीम कोर्ट फैसला, जनवरी 2023; अनुच्छेद 19(1)(g)"}}, {"icon": "🎟️", "tagCls": "rtag-e", "title": {"en": "Ticket Pricing, GST & Convenience Fees", "te": "టికెట్ ధరలు, GST & సౌకర్య రుసుములు", "hi": "टिकट कीमत, GST और सुविधा शुल्क"}, "meta": {"en": "No national price cap · GST 18-28% · fees must be disclosed", "te": "జాతీయ ధర పరిమితి లేదు · GST 18-28%", "hi": "कोई राष्ट्रीय मूल्य सीमा नहीं · GST 18-28%"}, "tag": {"en": "REFERENCE", "te": "సూచన", "hi": "संदर्भ"}, "body": {"en": "<strong>There is no national law capping cinema ticket prices.</strong> Cinemas are private businesses and set their own rates under the constitutional freedom to conduct trade (Article 19(1)(g)) — a recliner seat in a premium multiplex legitimately costs more than a morning show in a single-screen hall. Some individual states have experimented with local price-cap rules at various times, but there's no uniform national rule, and these can change — don't assume a rule you heard about in one state applies everywhere or is still in force. What IS consistent nationally: <strong>GST on movie tickets is 18% for tickets priced up to ₹100, and 28% for tickets priced above ₹100</strong> — this should be reflected transparently in your ticket price breakdown. Online booking convenience fees are legal, but should be disclosed clearly before you complete payment, not added as a surprise at the last step.", "te": "<strong>సినిమా టికెట్ ధరలను పరిమితం చేసే జాతీయ చట్టం లేదు.</strong> సినిమాలు ప్రైవేట్ వ్యాపారాలు, వాటి స్వంత రేట్లను నిర్ణయిస్తాయి. కొన్ని రాష్ట్రాలు స్థానిక ధర-పరిమితి నియమాలతో ప్రయోగించాయి, కానీ ఏకరీతి జాతీయ నియమం లేదు. జాతీయంగా స్థిరంగా ఉన్నది: <strong>సినిమా టికెట్లపై GST ₹100 వరకు టికెట్లకు 18%, ₹100 పైన టికెట్లకు 28%</strong>. ఆన్‌లైన్ బుకింగ్ సౌకర్య రుసుములు చట్టబద్ధమైనవి, కానీ చెల్లింపుకు ముందు స్పష్టంగా వెల్లడించాలి.", "hi": "<strong>सिनेमा टिकट कीमतों को सीमित करने वाला कोई राष्ट्रीय कानून नहीं है।</strong> सिनेमा निजी व्यवसाय हैं, अपनी दरें खुद तय करते हैं। कुछ राज्यों ने स्थानीय मूल्य-सीमा नियमों के साथ प्रयोग किया है, लेकिन कोई समान राष्ट्रीय नियम नहीं है। राष्ट्रीय स्तर पर जो स्थिर है: <strong>मूवी टिकट पर GST ₹100 तक के टिकट पर 18%, ₹100 से ऊपर 28%</strong> है। ऑनलाइन बुकिंग सुविधा शुल्क कानूनी हैं, लेकिन भुगतान पूरा करने से पहले स्पष्ट रूप से बताए जाने चाहिए।"}, "steps": {"en": ["Don't assume a ticket-price rule from one state applies nationally — these vary and change.", "Check the GST breakdown on your ticket — 18% up to ₹100, 28% above it.", "If a booking platform adds a convenience fee only at the final payment step without earlier disclosure, that's worth flagging as unfair practice to the platform's grievance channel.", "For premium formats (IMAX, 4DX, recliners), the higher price is legitimate — it's a different product, not overcharging."], "te": ["ఒక రాష్ట్ర టికెట్-ధర నియమం జాతీయంగా వర్తిస్తుందని అనుకోకండి.", "మీ టికెట్‌పై GST వివరాలను తనిఖీ చేయండి.", "బుకింగ్ ప్లాట్‌ఫారమ్ చివరి దశలో మాత్రమే రుసుము జోడిస్తే, దాన్ని ఫిర్యాదు చేయండి.", "ప్రీమియం ఫార్మాట్‌లకు ఎక్కువ ధర చట్టబద్ధమైనది."], "hi": ["एक राज्य का टिकट-मूल्य नियम राष्ट्रीय स्तर पर लागू है यह न मानें।", "अपने टिकट पर GST विवरण जांचें।", "बुकिंग प्लेटफॉर्म अंतिम चरण में ही शुल्क जोड़े तो शिकायत करें।", "प्रीमियम फॉर्मेट के लिए अधिक कीमत वैध है।"]}, "law": {"en": "Constitution of India, Article 19(1)(g); CGST Act 2017 (rates by notification)", "te": "భారత రాజ్యాంగం, ఆర్టికల్ 19(1)(g); CGST చట్టం 2017", "hi": "भारत का संविधान, अनुच्छेद 19(1)(g); CGST अधिनियम 2017"}}, {"icon": "🍿", "tagCls": "rtag-a", "title": {"en": "Snack Pricing & Free Water — Still Being Questioned", "te": "స్నాక్ ధరలు & ఉచిత నీరు — ఇంకా ప్రశ్నించబడుతోంది", "hi": "स्नैक कीमत और मुफ्त पानी — अभी भी सवाल में"}, "meta": {"en": "Not settled like the food ban — an active, evolving area", "te": "ఆహార నిషేధం వలె స్థిరపడలేదు", "hi": "खाना बैन की तरह तय नहीं — सक्रिय विषय"}, "tag": {"en": "EVOLVING — NOT FULLY SETTLED", "te": "అభివృద్ధి చెందుతోంది", "hi": "विकसित हो रहा — पूरी तरह तय नहीं"}, "body": {"en": "Unlike the outside-food question, <strong>this area is genuinely still being actively questioned in courts</strong> — don't treat it as settled either way. Cinemas have, following earlier consumer pressure, generally provided free sanitised drinking water to patrons — but courts have continued to scrutinise cases where this is denied or made difficult to access. Separately, courts have raised real questions about whether charging steep markups on snacks (sold as a captive, no-alternative market once you're inside) crosses from ordinary pricing freedom into unfair trade practice — this hasn't produced a single definitive national ruling the way the food-ban question has. Being honest about this: if someone tells you snack pricing is <em>definitely</em> illegal, or <em>definitely</em> fine no matter how high, neither claim is fully accurate — it's a live, unresolved area.", "te": "బయటి ఆహారం ప్రశ్నకు భిన్నంగా, <strong>ఈ ప్రాంతం నిజంగా ఇంకా కోర్టుల్లో చురుకుగా ప్రశ్నించబడుతోంది</strong>. సినిమాలు సాధారణంగా ఉచిత శుభ్రమైన తాగునీటిని అందిస్తాయి, కానీ ఇది నిరాకరించబడిన సందర్భాలను కోర్టులు పరిశీలిస్తూనే ఉన్నాయి. వేరుగా, స్నాక్స్‌పై అధిక మార్కప్‌లు వసూలు చేయడం న్యాయమైన ధర స్వేచ్ఛ నుండి అన్యాయమైన వాణిజ్య పద్ధతికి దాటుతుందా అనే నిజమైన ప్రశ్నలను కోర్టులు లేవనెత్తాయి — దీనికి ఒకే ఖచ్చితమైన జాతీయ తీర్పు లేదు.", "hi": "बाहरी खाने के सवाल के विपरीत, <strong>यह क्षेत्र वाकई अभी भी कोर्ट में सक्रिय रूप से सवालों के घेरे में है</strong>। सिनेमाघर आमतौर पर मुफ्त शुद्ध पेयजल देते हैं, लेकिन जहाँ यह मना किया जाए वहाँ कोर्ट लगातार जांच करते रहे हैं। अलग से, स्नैक्स पर भारी मार्कअप वसूलना उचित मूल्य स्वतंत्रता से अनुचित व्यापार प्रथा में बदल जाता है या नहीं, इस पर कोर्ट ने वास्तविक सवाल उठाए हैं — इस पर कोई एक निश्चित राष्ट्रीय फैसला नहीं है।"}, "steps": {"en": ["If a theatre denies you free drinking water or makes it deliberately hard to access, that's worth raising with the theatre and, if unresolved, a consumer complaint.", "Keep your snack receipt if the markup feels genuinely extreme — useful if you ever need to file a complaint.", "This is not a settled 'definitely illegal' area — approach it as a genuine grievance to raise, not a guaranteed legal win.", "For anything beyond a minor complaint, the district Consumer Commission (see our Consumer Rights page) is the right venue."], "te": ["థియేటర్ ఉచిత తాగునీటిని నిరాకరిస్తే, థియేటర్‌తో లేవనెత్తండి.", "మార్కప్ నిజంగా తీవ్రంగా అనిపిస్తే మీ స్నాక్ రసీదు ఉంచండి.", "ఇది స్థిరపడిన ప్రాంతం కాదు — వాస్తవ ఫిర్యాదుగా చూడండి.", "చిన్న ఫిర్యాదు కంటే ఎక్కువ ఉంటే, జిల్లా వినియోగదారుల కమిషన్ సరైన వేదిక."], "hi": ["थिएटर मुफ्त पानी देने से मना करे तो थिएटर से बात करें।", "मार्कअप वाकई अत्यधिक लगे तो स्नैक रसीद रखें।", "यह तय क्षेत्र नहीं है — वास्तविक शिकायत के रूप में देखें।", "छोटी शिकायत से बड़ा मामला हो तो जिला उपभोक्ता आयोग सही जगह है।"]}, "law": {"en": "Consumer Protection Act 2019 (unfair trade practice provisions) — application here is not yet settled by a definitive ruling", "te": "వినియోగదారుల రక్షణ చట్టం 2019 — ఇక్కడ దరఖాస్తు ఇంకా స్థిరపడలేదు", "hi": "उपभोक्ता संरक्षण अधिनियम 2019 — यहाँ आवेदन अभी तय नहीं है"}}, {"icon": "♿", "tagCls": "rtag-e", "title": {"en": "Refunds, Cancellations & Accessibility", "te": "వాపసులు, రద్దులు & ప్రాప్యత", "hi": "रिफंड, रद्दीकरण और सुगम्यता"}, "meta": {"en": "Platform-specific windows · wheelchair access is a real right", "te": "ప్లాట్‌ఫారమ్-నిర్దిష్ట విండోలు · వీల్‌చైర్ ప్రాప్యత నిజమైన హక్కు", "hi": "प्लेटफ़ॉर्म-विशिष्ट समय-सीमा · व्हीलचेयर पहुंच वास्तविक अधिकार"}, "tag": {"en": "PRACTICAL", "te": "ప్రాక్టికల్", "hi": "व्यावहारिक"}, "body": {"en": "Refund and cancellation policies for movie tickets are set by the individual booking platform or theatre, not a single national rule — always check the specific cancellation window (commonly a few hours before showtime, but this genuinely varies) before assuming you can cancel freely. <strong>Accessibility is a real, separate right</strong>: under the Rights of Persons with Disabilities Act 2016, public spaces including cinemas are expected to provide reasonable accessibility — wheelchair-accessible seating and entry, for instance. If a theatre has no accessible seating at all, that's a legitimate accessibility grievance, distinct from an ordinary customer-service complaint.", "te": "సినిమా టికెట్ల కోసం వాపసు మరియు రద్దు విధానాలు ఒక్కో బుకింగ్ ప్లాట్‌ఫారమ్ లేదా థియేటర్ ద్వారా నిర్ణయించబడతాయి, ఒకే జాతీయ నియమం కాదు — ఎల్లప్పుడూ నిర్దిష్ట రద్దు విండోను తనిఖీ చేయండి. <strong>ప్రాప్యత నిజమైన, ప్రత్యేక హక్కు</strong>: వికలాంగుల హక్కుల చట్టం 2016 కింద, సినిమాలతో సహా ప్రజా ప్రదేశాలు సహేతుకమైన ప్రాప్యతను అందించాలని ఆశించబడుతుంది.", "hi": "मूवी टिकट के लिए रिफंड और रद्दीकरण नीतियां व्यक्तिगत बुकिंग प्लेटफ़ॉर्म या थिएटर द्वारा तय की जाती हैं, एक भी राष्ट्रीय नियम नहीं — हमेशा विशिष्ट रद्दीकरण समय-सीमा जांचें। <strong>सुगम्यता एक वास्तविक, अलग अधिकार है</strong>: विकलांग व्यक्तियों के अधिकार अधिनियम 2016 के तहत, सिनेमाघरों सहित सार्वजनिक स्थानों को उचित सुगम्यता प्रदान करनी चाहिए।"}, "steps": {"en": ["Check the specific cancellation window on your booking platform before assuming a standard rule applies.", "Screenshot your booking confirmation and cancellation policy at time of purchase, in case of a dispute later.", "If a theatre has no wheelchair-accessible seating or entry, this is a genuine accessibility grievance under the RPWD Act — raise it directly with theatre management.", "For persistent accessibility failures, a complaint to the State Commissioner for Persons with Disabilities is a real, available option."], "te": ["ప్రామాణిక నియమం వర్తిస్తుందని అనుకునే ముందు మీ బుకింగ్ ప్లాట్‌ఫారమ్‌లో నిర్దిష్ట రద్దు విండోను తనిఖీ చేయండి.", "వివాదం ఉంటే మీ బుకింగ్ నిర్ధారణ మరియు రద్దు విధానాన్ని స్క్రీన్‌షాట్ తీయండి.", "వీల్‌చైర్-ప్రాప్యత సీటింగ్ లేకపోతే, ఇది RPWD చట్టం కింద నిజమైన ఫిర్యాదు.", "నిరంతర ప్రాప్యత వైఫల్యాలకు, వికలాంగుల రాష్ట్ర కమిషనర్‌కు ఫిర్యాదు ఒక నిజమైన ఎంపిక."], "hi": ["मानक नियम लागू है यह मानने से पहले अपने बुकिंग प्लेटफ़ॉर्म पर विशिष्ट रद्दीकरण समय-सीमा जांचें।", "विवाद की स्थिति में अपनी बुकिंग पुष्टि और रद्दीकरण नीति का स्क्रीनशॉट लें।", "व्हीलचेयर-सुलभ सीटिंग न हो तो यह RPWD अधिनियम के तहत वास्तविक शिकायत है।", "लगातार सुगम्यता विफलताओं के लिए, विकलांग व्यक्तियों के राज्य आयुक्त को शिकायत एक वास्तविक विकल्प है।"]}, "law": {"en": "Rights of Persons with Disabilities Act, 2016 — Sections 40, 44-46", "te": "వికలాంగుల హక్కుల చట్టం, 2016 — సెక్షన్లు 40, 44-46", "hi": "विकलांग व्यक्तियों के अधिकार अधिनियम, 2016 — धारा 40, 44-46"}}];
const HLS=[{"name": {"en": "National Consumer Helpline", "te": "జాతీయ వినియోగదారుల హెల్ప్‌లైన్", "hi": "राष्ट्रीय उपभोक्ता हेल्पलाइन"}, "sub": "1915", "url": "tel:1915", "num": "1915"}, {"name": {"en": "e-Jagriti (File a Complaint)", "te": "e-Jagriti (ఫిర్యాదు దాఖలు)", "hi": "e-Jagriti (शिकायत दर्ज करें)"}, "sub": "e-jagriti.gov.in", "url": "https://e-jagriti.gov.in", "num": ""}];
let L='en';
function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}
function render(){
 const U=UI[L];
 ['navBrand','navBack','heroEye','heroTitle','heroSub','calcHd'].forEach(id=>{
  const el=document.getElementById(id);if(el&&U[id])el.textContent=U[id];});
 document.getElementById('shareBtn').textContent=U.share;
 document.getElementById('secList').innerHTML=SECS.map((s,i)=>{
  const steps=s.steps[L].map((st,j)=>`<div class="step-row"><div class="step-n">${j+1}</div><div class="step-text">${st}</div></div>`).join('');
  return `<div class="sec-card">
   <div class="sec-header" onclick="toggle(${i})">
    <div class="sec-icon">${s.icon}</div>
    <div class="sec-hdr-body"><div class="sec-title">${s.title[L]}</div><div class="sec-meta">${s.meta[L]}</div></div>
    <div class="sec-chev${i===0?' open':''}" id="chev${i}">▼</div>
   </div>
   <div class="sec-body${i===0?' open':''}" id="body${i}">
    <span class="rtag ${s.tagCls||'rtag-e'}">${s.tag[L]}</span>
    <div class="item-body">${s.body[L]}</div>
    <div class="steps-box"><div class="steps-title">${U.steps}</div>${steps}</div>
    <div class="law-box"><strong>${U.law}</strong> ${s.law[L]}</div>
   </div></div>`;}).join('');
 document.getElementById('hlList').innerHTML=HLS.map(h=>{
  const btn=h.url.startsWith('http')?`<a class="hl-call" href="${h.url}" target="_blank">Open →</a>`:`<a class="hl-call" href="${h.url}">${h.num}</a>`;
  return `<div class="hl-row"><div><div class="hl-name">${h.name[L]}</div><div class="hl-sub">${h.sub}</div></div>${btn}</div>`;}).join('');
}
function toggle(i){document.getElementById('body'+i).classList.toggle('open');
 document.getElementById('chev'+i).classList.toggle('open');}
function shareMsg(){window.open('https://wa.me/?text='+encodeURIComponent(UI[L].shareMsg),'_blank');}
document.addEventListener('DOMContentLoaded',render);
</script>
<script>
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];

  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});

 }catch(e){}

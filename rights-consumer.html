eller/service provider first — 15-day deadline. Keep proof.", "No resolution → file at edaakhil.nic.in with bills, photos, correspondence.", "Claim compensation for harassment + litigation costs, not just the refund.", "Service charge forced? Refuse to pay; complaint at consumerhelpline.gov.in / 1915.", "E-commerce: platform is liable along with the seller under E-Commerce Rules 2020."], "te": ["ముందు విక్రేత/సేవా ప్రదాతకు లిఖిత ఫిర్యాదు — 15 రోజుల గడువు. రుజువు ఉంచుకోండి.", "పరిష్కారం లేదు → బిల్లులు, ఫోటోలు, ఉత్తరప్రత్యుత్తరాలతో edaakhil.nic.in లో దాఖలు.", "రీఫండ్ మాత్రమే కాదు — వేధింపు పరిహారం + వ్యాజ్య ఖర్చులు కూడా క్లెయిమ్ చేయండి.", "సర్వీస్ ఛార్జ్ బలవంతమా? చెల్లించడానికి నిరాకరించండి; consumerhelpline.gov.in / 1915 లో ఫిర్యాదు.", "ఇ-కామర్స్: E-Commerce Rules 2020 కింద విక్రేతతో పాటు ప్లాట్‌ఫారమ్ కూడా బాధ్యత."], "hi": ["पहले विक्रेता/सेवा प्रदाता को लिखित शिकायत — 15 दिन की समयसीमा। प्रमाण रखें।", "हल नहीं → बिल, फोटो, पत्राचार के साथ edaakhil.nic.in पर दाखिल करें।", "सिर्फ रिफंड नहीं — उत्पीड़न मुआवज़ा + मुकदमा खर्च भी मांगें।", "सर्विस चार्ज जबरन? देने से मना करें; consumerhelpline.gov.in / 1915 पर शिकायत।", "ई-कॉमर्स: E-Commerce Rules 2020 में विक्रेता के साथ प्लेटफॉर्म भी जिम्मेदार।"]}, "law": {"en": "CPA 2019, Sections 2(9), 34-39; Consumer Protection (E-Commerce) Rules 2020; CCPA Service Charge Guidelines 2022", "te": "CPA 2019, Sections 2(9), 34-39; E-Commerce Rules 2020; CCPA సర్వీస్ ఛార్జ్ మార్గదర్శకాలు 2022", "hi": "CPA 2019, धारा 2(9), 34-39; E-Commerce नियम 2020; CCPA सर्विस चार्ज दिशानिर्देश 2022"}}, {"icon": "🏥", "tagCls": "rtag-e", "title": {"en": "Insurance Claim Rejected? The Ombudsman Route is Free & Binding", "te": "బీమా క్లెయిమ్ తిరస్కరించారా? అంబుడ్స్‌మన్ మార్గం ఉచితం & తప్పనిసరి", "hi": "बीमा दावा अस्वीकृत? लोकपाल मार्ग मुफ्त और बाध्यकारी"}, "meta": {"en": "Health, life, motor · cioins.co.in · Claims up to ₹50 lakh", "te": "ఆరోగ్యం, జీవితం, మోటార్ · ₹50 లక్షల వరకు", "hi": "स्वास्थ्य, जीवन, मोटर · ₹50 लाख तक"}, "tag": {"en": "ENTITLEMENT", "te": "హక్కు", "hi": "अधिकार"}, "body": {"en": "Insurers reject claims citing \"pre-existing disease\", \"non-disclosure\", or fine print — many rejections do not survive scrutiny. The <strong>Insurance Ombudsman (cioins.co.in) is free, needs no lawyer</strong>, handles claims up to ₹50 lakh, and its award binds the insurer (not you — you can still go to Consumer Commission). Key protections: after <strong>8 years of premium payment (moratorium period), a policy cannot be questioned</strong> on non-disclosure grounds; claim rejection must be in writing with specific reasons.", "te": "బీమా సంస్థలు \"ముందు నుండి ఉన్న వ్యాధి\", \"వెల్లడించకపోవడం\" పేరుతో క్లెయిమ్‌లు తిరస్కరిస్తాయి — చాలా తిరస్కరణలు పరిశీలనలో నిలవవు. <strong>బీమా అంబుడ్స్‌మన్ (cioins.co.in) ఉచితం, న్యాయవాది అవసరం లేదు</strong>, ₹50 లక్షల వరకు క్లెయిమ్‌లు చూస్తుంది, తీర్పు బీమా సంస్థపై తప్పనిసరి (మీపై కాదు — మీరు వినియోగదారు కమిషన్‌కు కూడా వెళ్ళవచ్చు). ముఖ్య రక్షణలు: <strong>8 సంవత్సరాల ప్రీమియం చెల్లింపు తర్వాత (మారటోరియం), వెల్లడించకపోవడం కారణంగా పాలసీని ప్రశ్నించలేరు</strong>; తిరస్కరణ నిర్దిష్ట కారణాలతో లిఖితంగా ఉండాలి.", "hi": "बीमाकर्ता \"पहले से मौजूद बीमारी\", \"जानकारी न देने\" के नाम पर दावे खारिज करते हैं — कई अस्वीकृतियां जांच में नहीं टिकतीं। <strong>बीमा लोकपाल (cioins.co.in) मुफ्त है, वकील नहीं चाहिए</strong>, ₹50 लाख तक के दावे देखता है, फैसला बीमाकर्ता पर बाध्यकारी (आप पर नहीं — आप उपभोक्ता आयोग भी जा सकते हैं)। मुख्य सुरक्षा: <strong>8 साल प्रीमियम भुगतान (मोरेटोरियम) के बाद पॉलिसी पर सवाल नहीं उठ सकता</strong>; अस्वीकृति विशिष्ट कारणों के साथ लिखित हो।"}, "steps": {"en": ["Demand the rejection letter with specific reasons — verbal rejection has no standing.", "Written grievance to the insurer's Grievance Redressal Officer. Wait 30 days.", "File at cioins.co.in (or Bima Bharosa portal) with policy, rejection letter, medical records.", "Ombudsman award unsatisfactory → Consumer Commission within 2 years.", "Health claim cashless denied at hospital → demand written denial; reimbursement route stays open."], "te": ["నిర్దిష్ట కారణాలతో తిరస్కరణ లేఖ డిమాండ్ చేయండి — మౌఖిక తిరస్కరణకు విలువ లేదు.", "బీమా సంస్థ Grievance Redressal Officerకు లిఖిత ఫిర్యాదు. 30 రోజులు వేచి ఉండండి.", "పాలసీ, తిరస్కరణ లేఖ, వైద్య రికార్డులతో cioins.co.in లో దాఖలు.", "అంబుడ్స్‌మన్ తీర్పు సంతృప్తికరం కాకపోతే → 2 సంవత్సరాల్లో వినియోగదారు కమిషన్.", "ఆసుపత్రిలో నగదురహిత నిరాకరణ → లిఖిత నిరాకరణ డిమాండ్; రీయింబర్స్‌మెంట్ మార్గం తెరిచి ఉంటుంది."], "hi": ["विशिष्ट कारणों के साथ अस्वीकृति पत्र मांगें — मौखिक अस्वीकृति की कोई मान्यता नहीं।", "बीमाकर्ता के Grievance Redressal Officer को लिखित शिकायत। 30 दिन रुकें।", "पॉलिसी, अस्वीकृति पत्र, मेडिकल रिकॉर्ड के साथ cioins.co.in पर दाखिल करें।", "लोकपाल फैसला असंतोषजनक → 2 साल में उपभोक्ता आयोग।", "अस्पताल में कैशलेस इनकार → लिखित इनकार मांगें; रीइम्बर्समेंट मार्ग खुला रहता है।"]}, "law": {"en": "Insurance Ombudsman Rules 2017; IRDAI Policyholders' Interest Regulations 2017; Insurance Act Section 45 — 8-yr moratorium (as amended)", "te": "బీమా అంబుడ్స్‌మన్ నియమాలు 2017; IRDAI పాలసీదారుల ప్రయోజన నిబంధనలు 2017; బీమా చట్టం Section 45", "hi": "बीमा लोकपाल नियम 2017; IRDAI पॉलिसीधारक हित विनियम 2017; बीमा अधिनियम धारा 45"}}, {"icon": "💳", "tagCls": "rtag-r", "title": {"en": "Bank Fraud & Unauthorised Transactions — The 3-Day Rule", "te": "బ్యాంక్ మోసం & అనధికార లావాదేవీలు — 3 రోజుల నియమం", "hi": "बैंक धोखाधड़ी और अनधिकृत लेनदेन — 3 दिन का नियम"}, "meta": {"en": "Report in 3 days = zero liability · 10-day shadow credit", "te": "3 రోజుల్లో రిపోర్ట్ = బాధ్యత సున్నా", "hi": "3 दिन में रिपोर्ट = शून्य देनदारी"}, "tag": {"en": "URGENT — 3 DAYS", "te": "అత్యవసరం — 3 రోజులు", "hi": "तत्काल — 3 दिन"}, "body": {"en": "RBI's Zero Liability rule: report an unauthorised transaction <strong>within 3 working days → your liability is ZERO</strong>; days 4-7 → capped liability; beyond 7 days → per bank policy. The bank must give <strong>shadow credit within 10 working days</strong> of your report while it investigates. Also report at 1930 (cyber) in parallel. Bank refuses → RBI Ombudsman at cms.rbi.org.in — free and binding on the bank.", "te": "RBI జీరో లయబిలిటీ నియమం: అనధికార లావాదేవీని <strong>3 పని దినాల్లో రిపోర్ట్ చేస్తే → మీ బాధ్యత సున్నా</strong>; 4-7 రోజులు → పరిమిత బాధ్యత; 7 దాటితే → బ్యాంక్ విధానం ప్రకారం. బ్యాంక్ దర్యాప్తు చేస్తుండగా మీ రిపోర్ట్ తర్వాత <strong>10 పని దినాల్లో షాడో క్రెడిట్</strong> ఇవ్వాలి. సమాంతరంగా 1930 (సైబర్) లో కూడా రిపోర్ట్ చేయండి. బ్యాంక్ నిరాకరిస్తే → cms.rbi.org.in లో RBI అంబుడ్స్‌మన్ — ఉచితం, బ్యాంక్‌పై తప్పనిసరి.", "hi": "RBI का जीरो लायबिलिटी नियम: अनधिकृत लेनदेन <strong>3 कार्य दिवसों में रिपोर्ट करें → आपकी देनदारी शून्य</strong>; 4-7 दिन → सीमित देनदारी; 7 से अधिक → बैंक नीति अनुसार। बैंक को जांच के दौरान रिपोर्ट के <strong>10 कार्य दिवसों में शैडो क्रेडिट</strong> देना होगा। समानांतर में 1930 (साइबर) पर भी रिपोर्ट करें। बैंक मना करे → cms.rbi.org.in पर RBI लोकपाल — मुफ्त और बैंक पर बाध्यकारी।"}, "steps": {"en": ["Unauthorised debit spotted → call the bank helpline IMMEDIATELY; note the complaint reference.", "Simultaneously call 1930 and file at cybercrime.gov.in.", "Follow up in writing (email) so the 3-day reporting is documented.", "No shadow credit in 10 working days → written escalation citing RBI Circular 2017.", "Bank's final reply unsatisfactory / 30 days silent → RBI Ombudsman at cms.rbi.org.in."], "te": ["అనధికార డెబిట్ కనిపించింది → వెంటనే బ్యాంక్ హెల్ప్‌లైన్‌కు కాల్; ఫిర్యాదు రిఫరెన్స్ నోట్ చేసుకోండి.", "అదే సమయంలో 1930కి కాల్ చేసి cybercrime.gov.in లో దాఖలు చేయండి.", "3-రోజుల రిపోర్టింగ్ డాక్యుమెంట్ అయ్యేలా లిఖితంగా (ఇమెయిల్) ఫాలో అప్ చేయండి.", "10 పని దినాల్లో షాడో క్రెడిట్ లేదు → RBI సర్క్యులర్ 2017 పేర్కొంటూ లిఖిత ఎస్కలేషన్.", "బ్యాంక్ తుది సమాధానం సంతృప్తికరం కాదు / 30 రోజులు మౌనం → cms.rbi.org.in లో RBI అంబుడ్స్‌మన్."], "hi": ["अनधिकृत डेबिट दिखा → तुरंत बैंक हेल्पलाइन कॉल करें; शिकायत संदर्भ नोट करें।", "साथ ही 1930 कॉल करें और cybercrime.gov.in पर दर्ज करें।", "3-दिन रिपोर्टिंग दस्तावेज हो इसलिए लिखित (ईमेल) फॉलो-अप करें।", "10 कार्य दिवसों में शैडो क्रेडिट नहीं → RBI सर्कुलर 2017 का हवाला देकर लिखित एस्केलेशन।", "बैंक का अंतिम जवाब असंतोषजनक / 30 दिन चुप्पी → cms.rbi.org.in पर RBI लोकपाल।"]}, "law": {"en": "RBI Circular DBR.No.Leg.BC.78/09.07.005/2017-18 — Zero Liability; RBI Ombudsman Scheme 2021; IT Act 2000", "te": "RBI సర్క్యులర్ 2017 — జీరో లయబిలిటీ; RBI అంబుడ్స్‌మన్ పథకం 2021; IT చట్టం 2000", "hi": "RBI सर्कुलर 2017 — जीरो लायबिलिटी; RBI लोकपाल योजना 2021; IT अधिनियम 2000"}}];
const HLS=[{"name": {"en": "National Consumer Helpline", "te": "జాతీయ వినియోగదారు హెల్ప్‌లైన్", "hi": "राष्ट्रीय उपभोक्ता हेल्पलाइन"}, "sub": "Also try 1915", "url": "tel:18001114000", "num": "1800-11-4000"}, {"name": {"en": "e-Daakhil — File Complaint", "te": "e-Daakhil — ఫిర్యాదు దాఖలు", "hi": "e-Daakhil — शिकायत दर्ज"}, "sub": "edaakhil.nic.in", "url": "https://edaakhil.nic.in", "num": ""}, {"name": {"en": "Insurance Ombudsman", "te": "బీమా అంబుడ్స్‌మన్", "hi": "बीमा लोकपाल"}, "sub": "cioins.co.in", "url": "https://cioins.co.in", "num": ""}, {"name": {"en": "Cyber Fraud Helpline", "te": "సైబర్ మోసం హెల్ప్‌లైన్", "hi": "साइबर धोखाधड़ी हेल्पलाइन"}, "sub": "Bank fraud 24/7", "url": "tel:1930", "num": "1930"}];
let L='en';
function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}
function render(){
 const U=UI[L];
 ['navBrand','navBack','heroEye','heroTitle','heroSub','calcHd'].forEach(id=>{
  const el=document.getElementById(id);if(el&&U[id])el.textContent=U[id];});
 document.getElementById('shareBtn').textContent=U.share;
 document.getElementById('secList').innerHTML=SECS.map((s,i)=>{
  const steps=s.steps[L].map((st,j)=>`<div class="step-row"><div class="step-n">${j+1}</div><div class="step-text">${st}</div></div>`).join('');
  return `<div class="sec-card">
   <div class="sec-header" onclick="toggle(${i})">
    <div class="sec-icon">${s.icon}</div>
    <div class="sec-hdr-body"><div class="sec-title">${s.title[L]}</div><div class="sec-meta">${s.meta[L]}</div></div>
    <div class="sec-chev${i===0?' open':''}" id="chev${i}">▼</div>
   </div>
   <div class="sec-body${i===0?' open':''}" id="body${i}">
    <span class="rtag ${s.tagCls||'rtag-e'}">${s.tag[L]}</span>
    <div class="item-body">${s.body[L]}</div>
    <div class="steps-box"><div class="steps-title">${U.steps}</div>${steps}</div>
    <div class="law-box"><strong>${U.law}</strong> ${s.law[L]}</div>
   </div></div>`;}).join('');
 document.getElementById('hlList').innerHTML=HLS.map(h=>{
  const btn=h.url.startsWith('http')?`<a class="hl-call" href="${h.url}" target="_blank">Open →</a>`:`<a class="hl-call" href="${h.url}">${h.num}</a>`;
  return `<div class="hl-row"><div><div class="hl-name">${h.name[L]}</div><div class="hl-sub">${h.sub}</div></div>${btn}</div>`;}).join('');
}
function toggle(i){document.getElementById('body'+i).classList.toggle('open');
 document.getElementById('chev'+i).classList.toggle('open');}
function shareMsg(){window.open('https://wa.me/?text='+encodeURIComponent(UI[L].shareMsg),'_blank');}
document.addEventListener('DOMContentLoaded',render);
</script>

const SECS=[{"icon": "🧾", "tagCls": "rtag-e", "title": {"en": "Why File — And Who Actually Has To", "te": "ఎందుకు ఫైల్ చేయాలి — నిజంగా ఎవరు చేయాలి", "hi": "क्यों भरें — वास्तव में किसे भरना है"}, "meta": {"en": "Individuals · HUF · AOP/BOI · companies · firms", "te": "వ్యక్తులు · HUF · AOP/BOI · కంపెనీలు", "hi": "व्यक्ति · HUF · AOP/BOI · कंपनियाँ"}, "tag": {"en": "AWARENESS", "te": "అవగాహన", "hi": "जागरूकता"}, "body": {"en": "Income tax funds public services — roads, schools, healthcare, defence — that everyone benefits from. Under the Income Tax Act 1961, several categories of taxpayer exist, each taxed under its own rules: <strong>Individuals</strong>, <strong>Hindu Undivided Families (HUF)</strong> — a separate taxable entity managed by a Karta, filing its own return — <strong>Associations of Persons (AOP)</strong> and <strong>Bodies of Individuals (BOI)</strong>, <strong>partnership firms and LLPs</strong>, and <strong>companies</strong>. Individuals and HUFs must file if income before deductions exceeds the basic exemption limit. <strong>All companies must file regardless of profit or loss</strong>, as must partnership firms, LLPs, and trusts — this is a universal rule for organised business structures, not conditional on how the year went.", "te": "ఆదాయపు పన్ను రోడ్లు, పాఠశాలలు, ఆరోగ్య సంరక్షణ, రక్షణ వంటి ప్రజా సేవలకు నిధులు అందిస్తుంది — వీటి ప్రయోజనం అందరికీ చెందుతుంది. ఆదాయపు పన్ను చట్టం 1961 ప్రకారం, వివిధ పన్ను చెల్లింపుదారుల వర్గాలు ఉన్నాయి, ప్రతి ఒక్కటి దాని స్వంత నియమాల ప్రకారం పన్ను విధించబడుతుంది: <strong>వ్యక్తులు</strong>, <strong>హిందూ అవిభక్త కుటుంబం (HUF)</strong> — కర్త నిర్వహించే ప్రత్యేక పన్ను విధించదగిన సంస్థ, దాని స్వంత రిటర్న్ ఫైల్ చేస్తుంది — <strong>వ్యక్తుల సంఘం (AOP)</strong> మరియు <strong>వ్యక్తుల సముదాయం (BOI)</strong>, <strong>భాగస్వామ్య సంస్థలు మరియు LLPలు</strong>, మరియు <strong>కంపెనీలు</strong>. మినహాయింపు పరిమితిని మించిన ఆదాయం ఉంటే వ్యక్తులు మరియు HUFలు ఫైల్ చేయాలి. <strong>లాభం లేదా నష్టం ఏదైనా అన్ని కంపెనీలు తప్పనిసరిగా ఫైల్ చేయాలి</strong>, భాగస్వామ్య సంస్థలు, LLPలు, ట్రస్టులు కూడా అలాగే చేయాలి.", "hi": "इनकम टैक्स सड़कों, स्कूलों, स्वास्थ्य सेवा, रक्षा जैसी सार्वजनिक सेवाओं को फंड करता है — जिनका लाभ सभी को मिलता है। इनकम टैक्स एक्ट 1961 के तहत, कई तरह के करदाता होते हैं, हर एक अपने नियमों के तहत: <strong>व्यक्ति</strong>, <strong>हिंदू अविभाजित परिवार (HUF)</strong> — कर्ता द्वारा प्रबंधित एक अलग कर योग्य इकाई, जो अपना खुद का रिटर्न भरती है — <strong>व्यक्तियों का संघ (AOP)</strong> और <strong>व्यक्तियों का निकाय (BOI)</strong>, <strong>पार्टनरशिप फर्म और LLP</strong>, और <strong>कंपनियाँ</strong>। यदि कटौतियों से पहले आय बेसिक छूट सीमा से अधिक है तो व्यक्तियों और HUF को रिटर्न भरना ज़रूरी है। <strong>सभी कंपनियों को लाभ हो या हानि, रिटर्न भरना अनिवार्य है</strong>, और यही नियम पार्टनरशिप फर्म, LLP और ट्रस्ट पर भी लागू होता है।"}, "steps": {"en": ["Individuals/HUF: check if income before deductions crosses the exemption limit for the regime you're using.", "Companies, firms, LLPs, trusts: file regardless of profit or loss — no exemption-limit check applies.", "Even below the exemption limit, filing is mandatory if you hold foreign assets, deposited over ₹1 crore in a current account, or meet certain other high-value transaction conditions.", "Get a PAN if you don't have one — it's required for filing, and HUFs need their own separate PAN.", "When in doubt, a return costs nothing to file even if no tax is due — filing late or not at all is the costlier mistake."], "te": ["వ్యక్తులు/HUF: మీరు ఉపయోగిస్తున్న విధానానికి మినహాయింపు పరిమితిని దాటిందో లేదో తనిఖీ చేయండి.", "కంపెనీలు, సంస్థలు, LLPలు, ట్రస్టులు: లాభం లేదా నష్టం ఏదైనా ఫైల్ చేయాలి.", "మినహాయింపు పరిమితి కంటే తక్కువ ఉన్నా, విదేశీ ఆస్తులు ఉంటే లేదా ₹1 కోటి కంటే ఎక్కువ డిపాజిట్ చేసినా ఫైలింగ్ తప్పనిసరి.", "మీకు లేకపోతే PAN పొందండి — ఫైలింగ్‌కు ఇది అవసరం, HUFలకు వేరే PAN అవసరం.", "సందేహం ఉంటే, పన్ను రాకపోయినా రిటర్న్ ఫైల్ చేయడానికి ఖర్చు ఏమీ లేదు."], "hi": ["व्यक्ति/HUF: जांचें कि क्या आपकी आय कटौतियों से पहले छूट सीमा को पार करती है।", "कंपनियाँ, फर्म, LLP, ट्रस्ट: लाभ हो या हानि, रिटर्न भरना ज़रूरी है।", "छूट सीमा से कम होने पर भी, विदेशी संपत्ति है या ₹1 करोड़ से अधिक जमा किया है तो फाइलिंग अनिवार्य है।", "अगर नहीं है तो PAN बनवाएं — फाइलिंग के लिए ज़रूरी है, HUF को अलग PAN चाहिए।", "संदेह होने पर, टैक्स न बनने पर भी रिटर्न भरने में कोई खर्च नहीं है।"]}, "law": {"en": "Income Tax Act, 1961 — Sections 139(1), 2(31)", "te": "ఆదాయపు పన్ను చట్టం, 1961 — సెక్షన్లు 139(1), 2(31)", "hi": "इनकम टैक्स एक्ट, 1961 — धारा 139(1), 2(31)"}}, {"icon": "💰", "tagCls": "rtag-e", "title": {"en": "Exemption Limits & Tax Slabs (FY 2025-26)", "te": "మినహాయింపు పరిమితులు & పన్ను స్లాబ్‌లు (FY 2025-26)", "hi": "छूट सीमा और टैक्स स्लैब (FY 2025-26)"}, "meta": {"en": "New regime ₹4L exemption · Old regime ₹2.5L", "te": "కొత్త విధానం ₹4L · పాత విధానం ₹2.5L", "hi": "नई रिजीम ₹4L · पुरानी रिजीम ₹2.5L"}, "tag": {"en": "REFERENCE — CHANGES YEARLY", "te": "సూచన — ఏటా మారుతుంది", "hi": "संदर्भ — हर साल बदलता है"}, "body": {"en": "For FY 2025-26 (AY 2026-27), the <strong>new tax regime is the default</strong> unless you opt out. <u>New regime:</u> exemption limit ₹4,00,000; standard deduction ₹75,000; Section 87A rebate means income up to ₹12,00,000 pays zero tax (₹12,75,000 for salaried individuals, after the standard deduction). <u>Old regime:</u> exemption limit ₹2,50,000 (₹3,00,000 for senior citizens 60+, ₹5,00,000 for super seniors 80+); standard deduction ₹50,000; slabs are 5% (₹2.5L–5L), 20% (₹5L–10L), 30% (above ₹10L). HUFs get the same limits as individuals. <strong>These figures change with every Union Budget</strong> — this page will not always reflect the current year automatically, so confirm before filing.", "te": "FY 2025-26 (AY 2026-27) కోసం, మీరు వైదొలగకపోతే <strong>కొత్త పన్ను విధానం డిఫాల్ట్</strong>. <u>కొత్త విధానం:</u> మినహాయింపు పరిమితి ₹4,00,000; ప్రామాణిక తగ్గింపు ₹75,000; సెక్షన్ 87A రిబేట్ కారణంగా ₹12,00,000 వరకు ఆదాయం సున్నా పన్ను (జీతం పొందేవారికి ₹12,75,000). <u>పాత విధానం:</u> మినహాయింపు పరిమితి ₹2,50,000 (60+ కు ₹3,00,000, 80+ కు ₹5,00,000); ప్రామాణిక తగ్గింపు ₹50,000; స్లాబ్‌లు 5% (₹2.5L–5L), 20% (₹5L–10L), 30% (₹10L పైన). HUFలకు వ్యక్తులతో సమానమైన పరిమితులు. <strong>ప్రతి కేంద్ర బడ్జెట్‌తో ఈ గణాంకాలు మారతాయి</strong> — ఫైల్ చేయడానికి ముందు నిర్ధారించుకోండి.", "hi": "FY 2025-26 (AY 2026-27) के लिए, यदि आप बाहर नहीं निकलते तो <strong>नई टैक्स रिजीम डिफ़ॉल्ट है</strong>। <u>नई रिजीम:</u> छूट सीमा ₹4,00,000; स्टैंडर्ड डिडक्शन ₹75,000; सेक्शन 87A रिबेट के कारण ₹12,00,000 तक आय पर शून्य टैक्स (वेतनभोगियों के लिए ₹12,75,000)। <u>पुरानी रिजीम:</u> छूट सीमा ₹2,50,000 (60+ के लिए ₹3,00,000, 80+ के लिए ₹5,00,000); स्टैंडर्ड डिडक्शन ₹50,000; स्लैब 5% (₹2.5L–5L), 20% (₹5L–10L), 30% (₹10L से ऊपर)। HUF को व्यक्तियों जैसी सीमाएँ मिलती हैं। <strong>हर केंद्रीय बजट के साथ ये आंकड़े बदलते हैं</strong> — भरने से पहले पुष्टि करें।"}, "steps": {"en": ["Estimate your total income for the year from all sources (salary, business, rent, capital gains, interest).", "Compare what you'd owe under both regimes before choosing — the choice can be made freely each year.", "If you have large deductions to claim (80C, 80D, HRA, home loan interest), the old regime may work out better despite its lower exemption limit.", "If you have few deductions, the new regime's higher exemption and lower rates usually win.", "Use an official calculator on incometax.gov.in to compare precisely rather than guessing."], "te": ["అన్ని మూలాల నుండి మీ మొత్తం వార్షిక ఆదాయాన్ని అంచనా వేయండి.", "ఎంచుకునే ముందు రెండు విధానాల్లో మీరు ఎంత చెల్లించాలో పోల్చండి.", "మీకు పెద్ద తగ్గింపులు ఉంటే (80C, 80D, HRA), పాత విధానం మెరుగ్గా ఉండవచ్చు.", "తగ్గింపులు తక్కువగా ఉంటే, కొత్త విధానం సాధారణంగా గెలుస్తుంది.", "ఖచ్చితంగా పోల్చడానికి incometax.gov.in లో అధికారిక కాలిక్యులేటర్ ఉపయోగించండి."], "hi": ["सभी स्रोतों से अपनी कुल वार्षिक आय का अनुमान लगाएं।", "चुनने से पहले दोनों रिजीम में देय राशि की तुलना करें।", "बड़ी कटौतियाँ हैं (80C, 80D, HRA) तो पुरानी रिजीम बेहतर हो सकती है।", "कटौतियाँ कम हैं तो आमतौर पर नई रिजीम बेहतर रहती है।", "सटीक तुलना के लिए incometax.gov.in पर आधिकारिक कैलकुलेटर उपयोग करें।"]}, "law": {"en": "Income Tax Act, 1961 — Section 115BAC (new regime); Finance Act 2025", "te": "ఆదాయపు పన్ను చట్టం, 1961 — సెక్షన్ 115BAC; ఫైనాన్స్ చట్టం 2025", "hi": "इनकम टैक्स एक्ट, 1961 — धारा 115BAC; वित्त अधिनियम 2025"}}, {"icon": "📋", "tagCls": "rtag-e", "title": {"en": "Common Deductions — What's Actually \"Exempt\"", "te": "సాధారణ తగ్గింపులు — నిజంగా \"మినహాయింపు\" ఏమిటి", "hi": "आम कटौतियाँ — असल में \"छूट\" क्या है"}, "meta": {"en": "80C ₹1.5L · 80D health insurance · HRA — old regime only", "te": "80C ₹1.5L · 80D ఆరోగ్య బీమా · HRA — పాత విధానంలో మాత్రమే", "hi": "80C ₹1.5L · 80D स्वास्थ्य बीमा · HRA — केवल पुरानी रिजीम"}, "tag": {"en": "MOST-ASKED QUESTION", "te": "అత్యధికంగా అడిగే ప్రశ్న", "hi": "सबसे ज़्यादा पूछा गया सवाल"}, "body": {"en": "This is genuinely the most-asked question, so here it is directly: <strong>the new regime (the default) does not allow most of these deductions</strong> — that's the actual trade-off for its lower rates. They remain available <strong>only if you opt for the old regime</strong>. <u>Section 80C</u> — up to ₹1,50,000 combined for PPF, ELSS, life insurance premiums, and similar investments. <u>Section 80D</u> — up to ₹25,000 for health insurance premiums (₹50,000 if insuring senior citizen parents), separate from 80C. <u>HRA</u> (Section 10(13A)) — house rent allowance exemption for salaried tenants. <u>Home loan interest</u> (Section 24(b)) — up to ₹2,00,000 for a self-occupied property. A narrow exception survives even in the new regime: <u>Section 80CCD(2)</u>, your employer's contribution to your NPS account.", "te": "ఇది నిజంగా అత్యధికంగా అడిగే ప్రశ్న, కాబట్టి నేరుగా చెప్తాను: <strong>కొత్త విధానం (డిఫాల్ట్) ఈ తగ్గింపుల్లో చాలా వరకు అనుమతించదు</strong> — దాని తక్కువ రేట్లకు ఇదే అసలైన ట్రేడ్-ఆఫ్. అవి <strong>మీరు పాత విధానాన్ని ఎంచుకుంటేనే</strong> అందుబాటులో ఉంటాయి. <u>సెక్షన్ 80C</u> — PPF, ELSS, జీవిత బీమా ప్రీమియంల కోసం కలిపి ₹1,50,000 వరకు. <u>సెక్షన్ 80D</u> — ఆరోగ్య బీమా ప్రీమియంల కోసం ₹25,000 వరకు (సీనియర్ సిటిజన్ తల్లిదండ్రులకు ₹50,000). <u>HRA</u> — జీతం పొందే అద్దెదారులకు ఇంటి అద్దె భత్యం మినహాయింపు. <u>గృహ రుణ వడ్డీ</u> — స్వీయ-నివాస ఆస్తికి ₹2,00,000 వరకు. కొత్త విధానంలో కూడా మిగిలి ఉండేది: <u>సెక్షన్ 80CCD(2)</u>, మీ యజమాని NPS ఖాతాకు చేసే సహకారం.", "hi": "यह वाकई सबसे ज़्यादा पूछा जाने वाला सवाल है, तो सीधे बताते हैं: <strong>नई रिजीम (डिफ़ॉल्ट) इनमें से ज़्यादातर कटौतियों की अनुमति नहीं देती</strong> — इसकी कम दरों के बदले यही असली समझौता है। ये <strong>केवल पुरानी रिजीम चुनने पर ही</strong> उपलब्ध हैं। <u>सेक्शन 80C</u> — PPF, ELSS, जीवन बीमा प्रीमियम के लिए मिलाकर ₹1,50,000 तक। <u>सेक्शन 80D</u> — स्वास्थ्य बीमा प्रीमियम के लिए ₹25,000 तक (वरिष्ठ नागरिक माता-पिता के लिए ₹50,000)। <u>HRA</u> — वेतनभोगी किरायेदारों के लिए मकान किराया भत्ता छूट। <u>होम लोन ब्याज</u> — स्व-आवासीय संपत्ति के लिए ₹2,00,000 तक। नई रिजीम में भी बचने वाला: <u>सेक्शन 80CCD(2)</u>, आपके नियोक्ता का आपके NPS खाते में योगदान।"}, "steps": {"en": ["Decide your regime first — these deductions only matter if you're in the old regime.", "Keep proof of every claim: insurance premium receipts, PPF passbook, rent receipts for HRA, home loan interest certificate.", "80C and 80D are separate limits — health insurance doesn't eat into your 80C room.", "Complete eligible investments within the financial year (by March 31) to claim them in that year's return.", "If your employer contributes to NPS on your behalf, that deduction survives even in the new regime — check your salary structure."], "te": ["మీ విధానాన్ని మొదట నిర్ణయించుకోండి — ఈ తగ్గింపులు మీరు పాత విధానంలో ఉంటేనే ముఖ్యం.", "ప్రతి క్లెయిమ్‌కు రుజువు ఉంచండి: బీమా ప్రీమియం రసీదులు, PPF పాస్‌బుక్, HRA కోసం అద్దె రసీదులు.", "80C మరియు 80D వేర్వేరు పరిమితులు — ఆరోగ్య బీమా మీ 80C స్థలాన్ని తినదు.", "ఆర్థిక సంవత్సరంలో (మార్చి 31 నాటికి) అర్హత గల పెట్టుబడులను పూర్తి చేయండి.", "మీ యజమాని NPSకి సహకరిస్తే, ఆ తగ్గింపు కొత్త విధానంలో కూడా మిగిలి ఉంటుంది."], "hi": ["पहले अपनी रिजीम तय करें — ये कटौतियाँ केवल पुरानी रिजीम में मायने रखती हैं।", "हर दावे का प्रमाण रखें: बीमा प्रीमियम रसीद, PPF पासबुक, HRA के लिए किराया रसीद।", "80C और 80D अलग सीमाएँ हैं — स्वास्थ्य बीमा आपकी 80C सीमा में शामिल नहीं होता।", "वित्तीय वर्ष के भीतर (31 मार्च तक) योग्य निवेश पूरे करें।", "अगर नियोक्ता NPS में योगदान करता है, वह कटौती नई रिजीम में भी बचती है।"]}, "law": {"en": "Income Tax Act, 1961 — Sections 80C, 80D, 80CCD(2), 24(b), 10(13A)", "te": "ఆదాయపు పన్ను చట్టం, 1961 — సెక్షన్లు 80C, 80D, 80CCD(2), 24(b)", "hi": "इनकम टैक्स एक्ट, 1961 — धारा 80C, 80D, 80CCD(2), 24(b)"}}, {"icon": "⚠️", "tagCls": "rtag-r", "title": {"en": "What Happens If You Skip Filing", "te": "ఫైల్ చేయకపోతే ఏమి జరుగుతుంది", "hi": "रिटर्न न भरने पर क्या होता है"}, "meta": {"en": "Late fee · lost benefits · evasion vs. legal tax-saving", "te": "ఆలస్య రుసుము · కోల్పోయిన ప్రయోజనాలు · ఎగవేత vs చట్టబద్ధమైన ఆదా", "hi": "लेट फीस · खोए फायदे · टैक्स चोरी बनाम वैध बचत"}, "tag": {"en": "READ BEFORE THE DEADLINE", "te": "గడువుకు ముందు చదవండి", "hi": "समय-सीमा से पहले पढ़ें"}, "body": {"en": "Missing the filing deadline (usually July 31 for individuals not requiring an audit, though extensions do happen) brings a <strong>late fee under Section 234F</strong>, plus interest on any tax due, and can mean losing the ability to carry forward certain losses to future years. Many banks also ask for recent ITRs for loan or visa applications, so skipping filing has costs beyond the tax office. <strong>Deliberately hiding income is tax evasion</strong> — illegal, and can lead to prosecution in serious cases. This is genuinely different from <strong>legitimate tax planning</strong> — using deductions like Section 80C or 80D, or choosing whichever regime saves more — which is entirely lawful and how most people reduce their tax bill honestly. The two get confused often; they are not the same thing.", "te": "ఫైలింగ్ గడువును మిస్ అయితే (సాధారణంగా జూలై 31, పొడిగింపులు జరుగుతూ ఉంటాయి) <strong>సెక్షన్ 234F కింద ఆలస్య రుసుము</strong>, చెల్లించాల్సిన పన్నుపై వడ్డీతో పాటు, భవిష్యత్ నష్టాలను క్యారీ ఫార్వర్డ్ చేసే సామర్థ్యాన్ని కోల్పోవచ్చు. లోన్ లేదా వీసా కోసం చాలా బ్యాంకులు ఇటీవలి ITRలను అడుగుతాయి. <strong>ఉద్దేశపూర్వకంగా ఆదాయాన్ని దాచడం పన్ను ఎగవేత</strong> — ఇది చట్టవిరుద్ధం, ప్రాసిక్యూషన్‌కు దారితీయవచ్చు. ఇది <strong>చట్టబద్ధమైన పన్ను ప్రణాళిక</strong> నుండి భిన్నమైనది — 80C లేదా 80D వంటి తగ్గింపులను ఉపయోగించడం పూర్తిగా చట్టబద్ధమైనది.", "hi": "फाइलिंग की समय-सीमा चूकने पर (आमतौर पर 31 जुलाई, हालाँकि विस्तार भी होते हैं) <strong>सेक्शन 234F के तहत लेट फीस</strong> लगती है, साथ ही बकाया टैक्स पर ब्याज, और भविष्य के नुकसान आगे ले जाने की क्षमता भी खत्म हो सकती है। कई बैंक लोन या वीज़ा के लिए हाल की ITR भी माँगते हैं। <strong>जानबूझकर आय छिपाना टैक्स चोरी है</strong> — गैरकानूनी, गंभीर मामलों में मुकदमा भी चल सकता है। यह <strong>वैध टैक्स प्लानिंग</strong> से अलग है — 80C या 80D जैसी कटौतियों का उपयोग पूरी तरह कानूनी है।"}, "steps": {"en": ["Mark the deadline (usually July 31 for non-audit individual cases) and file even if it's a nil return.", "Missed it already? File a belated return — still possible, just with the Section 234F fee attached.", "Found an error after filing? A revised return can correct it within the statutory window.", "Genuinely confused about which deductions or regime apply to you? A chartered accountant's advice is worth the cost for anything beyond a simple salary return.", "Never respond to unsolicited calls/messages claiming to be from the Income Tax Department asking for OTPs or bank details — verify independently via incometax.gov.in."], "te": ["గడువును గుర్తు పెట్టుకోండి (సాధారణంగా జూలై 31) మరియు నిల్ రిటర్న్ అయినా ఫైల్ చేయండి.", "ఇప్పటికే మిస్ అయ్యారా? బిలేటెడ్ రిటర్న్ ఫైల్ చేయండి — ఇప్పటికీ సాధ్యం, సెక్షన్ 234F రుసుముతో.", "ఫైల్ చేసిన తర్వాత తప్పు కనుగొన్నారా? రివైజ్డ్ రిటర్న్ దాన్ని సరిదిద్దగలదు.", "ఏ తగ్గింపులు వర్తిస్తాయో గందరగోళంగా ఉందా? చార్టర్డ్ అకౌంటెంట్ సలహా విలువైనది.", "OTPలు లేదా బ్యాంక్ వివరాలు అడుగుతూ ఆదాయపు పన్ను శాఖ నుండి అని చెప్పే కాల్‌లకు స్పందించవద్దు."], "hi": ["समय-सीमा याद रखें (आमतौर पर 31 जुलाई) और निल रिटर्न भी भरें।", "पहले ही चूक गए? बिलेटेड रिटर्न भरें — अब भी संभव, सेक्शन 234F शुल्क के साथ।", "भरने के बाद गलती मिली? रिवाइज्ड रिटर्न उसे ठीक कर सकता है।", "कौन सी कटौती लागू होती है भ्रम है? चार्टर्ड अकाउंटेंट की सलाह लेना उचित है।", "OTP या बैंक विवरण मांगने वाली इनकम टैक्स विभाग की कॉल/मैसेज का जवाब न दें।"]}, "law": {"en": "Income Tax Act, 1961 — Sections 234F, 139(4), 139(5)", "te": "ఆదాయపు పన్ను చట్టం, 1961 — సెక్షన్లు 234F, 139(4), 139(5)", "hi": "इनकम टैक्स एक्ट, 1961 — धारा 234F, 139(4), 139(5)"}}];
const HLS=[{"name": {"en": "Income Tax e-Filing Portal", "te": "ఆదాయపు పన్ను e-ఫైలింగ్ పోర్టల్", "hi": "इनकम टैक्स ई-फाइलिंग पोर्टल"}, "sub": "incometax.gov.in", "url": "https://www.incometax.gov.in", "num": ""}, {"name": {"en": "Income Tax Helpline", "te": "ఆదాయపు పన్ను హెల్ప్‌లైన్", "hi": "इनकम टैक्स हेल्पलाइन"}, "sub": "1800-103-0025", "url": "tel:18001030025", "num": "1800-103-0025"}, {"name": {"en": "Report Tax Fraud / Scam", "te": "పన్ను మోసం నివేదించండి", "hi": "टैक्स धोखाधड़ी की रिपोर्ट करें"}, "sub": "Cybercrime Helpline", "url": "tel:1930", "num": "1930"}];
let L='en';
function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}
function render(){
 const U=UI[L];
 ['navBrand','navBack','heroEye','heroTitle','heroSub','calcHd'].forEach(id=>{
  const el=document.getElementById(id);if(el&&U[id])el.textContent=U[id];});
 document.getElementById('shareBtn').textContent=U.share;
 document.getElementById('secList').innerHTML=SECS.map((s,i)=>{
  const steps=s.steps[L].map((st,j)=>`<div class="step-row"><div class="step-n">${j+1}</div><div class="step-text">${st}</div></div>`).join('');
  return `<div class="sec-card">
   <div class="sec-header" onclick="toggle(${i})">
    <div class="sec-icon">${s.icon}</div>
    <div class="sec-hdr-body"><div class="sec-title">${s.title[L]}</div><div class="sec-meta">${s.meta[L]}</div></div>
    <div class="sec-chev${i===0?' open':''}" id="chev${i}">▼</div>
   </div>
   <div class="sec-body${i===0?' open':''}" id="body${i}">
    <span class="rtag ${s.tagCls||'rtag-e'}">${s.tag[L]}</span>
    <div class="item-body">${s.body[L]}</div>
    <div class="steps-box"><div class="steps-title">${U.steps}</div>${steps}</div>
    <div class="law-box"><strong>${U.law}</strong> ${s.law[L]}</div>
   </div></div>`;}).join('');
 document.getElementById('hlList').innerHTML=HLS.map(h=>{
  const btn=h.url.startsWith('http')?`<a class="hl-call" href="${h.url}" target="_blank">Open →</a>`:`<a class="hl-call" href="${h.url}">${h.num}</a>`;
  return `<div class="hl-row"><div><div class="hl-name">${h.name[L]}</div><div class="hl-sub">${h.sub}</div></div>${btn}</div>`;}).join('');
}
function toggle(i){document.getElementById('body'+i).classList.toggle('open');
 document.getElementById('chev'+i).classList.toggle('open');}
function shareMsg(){window.open('https://wa.me/?text='+encodeURIComponent(UI[L].shareMsg),'_blank');}
document.addEventListener('DOMContentLoaded',render);
</script>
<script>
/* Language persistence — remembers choice across all pages */
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];
  var btns=document.querySelectorAll('.nav-lang');
  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>

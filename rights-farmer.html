const SECS=[{"icon": "🌧️", "tagCls": "rtag-r", "title": {"en": "PMFBY Crop Insurance — The 72-Hour Rule Decides Everything", "te": "PMFBY పంట బీమా — 72 గంటల నియమం అన్నీ నిర్ణయిస్తుంది", "hi": "PMFBY फसल बीमा — 72 घंटे का नियम सब तय करता है"}, "meta": {"en": "Report in 72 hrs · Settlement in 2 months · 12% interest on delay", "te": "72 గంటల్లో నివేదన · 2 నెలల్లో పరిష్కారం", "hi": "72 घंटे में रिपोर्ट · 2 महीने में निपटान"}, "tag": {"en": "DEADLINE — 72 HOURS", "te": "గడువు — 72 గంటలు", "hi": "समयसीमा — 72 घंटे"}, "body": {"en": "Localised crop loss (hailstorm, flood, landslide) or post-harvest damage must be reported <strong>within 72 hours</strong> — helpline 14447, the PMFBY app, insurer, bank, or agriculture officer. Miss it and the claim can be rejected. Claims must be <strong>settled within 2 months</strong> of loss assessment; delays attract <strong>12% interest payable by the insurer</strong>. Premium is capped: 2% (Kharif), 1.5% (Rabi), 5% (commercial/horticulture).", "te": "స్థానిక పంట నష్టం (వడగళ్ళు, వరద, కొండచరియ) లేదా కోత అనంతర నష్టం <strong>72 గంటల్లో</strong> నివేదించాలి — హెల్ప్‌లైన్ 14447, PMFBY యాప్, బీమా సంస్థ, బ్యాంక్ లేదా వ్యవసాయ అధికారి. తప్పిపోతే క్లెయిమ్ తిరస్కరించబడవచ్చు. నష్ట అంచనా తర్వాత <strong>2 నెలల్లో</strong> క్లెయిమ్‌లు పరిష్కరించాలి; ఆలస్యాలకు <strong>బీమా సంస్థ 12% వడ్డీ</strong> చెల్లించాలి. ప్రీమియం పరిమితి: 2% (ఖరీఫ్), 1.5% (రబీ), 5% (వాణిజ్య/ఉద్యాన).", "hi": "स्थानीय फसल नुकसान (ओलावृष्टि, बाढ़, भूस्खलन) या कटाई बाद नुकसान <strong>72 घंटे में</strong> रिपोर्ट करें — हेल्पलाइन 14447, PMFBY ऐप, बीमाकर्ता, बैंक या कृषि अधिकारी। चूके तो दावा खारिज हो सकता है। नुकसान आकलन के <strong>2 महीने में</strong> दावा निपटान अनिवार्य; देरी पर <strong>बीमाकर्ता 12% ब्याज</strong> देगा। प्रीमियम सीमा: 2% (खरीफ), 1.5% (रबी), 5% (व्यावसायिक/बागवानी)।"}, "steps": {"en": ["Damage occurs → within 72 hrs: call 14447 / PMFBY app / insurer / bank / agriculture officer. Note complaint number.", "Photograph the damaged crop with date/location.", "Cooperate with the loss assessment survey; take the surveyor's report copy.", "No settlement in 2 months → written complaint to insurer citing 12% interest liability.", "Still stuck → District Grievance Committee, then Insurance Ombudsman (cioins.co.in) — free."], "te": ["నష్టం జరిగింది → 72 గంటల్లో: 14447 / PMFBY యాప్ / బీమా సంస్థ / బ్యాంక్ / వ్యవసాయ అధికారికి. ఫిర్యాదు నంబర్ నోట్ చేసుకోండి.", "తేదీ/ప్రదేశంతో దెబ్బతిన్న పంట ఫోటో తీయండి.", "నష్ట అంచనా సర్వేకు సహకరించండి; సర్వేయర్ నివేదిక కాపీ తీసుకోండి.", "2 నెలల్లో పరిష్కారం లేదు → 12% వడ్డీ బాధ్యత పేర్కొంటూ బీమా సంస్థకు లిఖిత ఫిర్యాదు.", "ఇంకా ఆగిపోతే → జిల్లా ఫిర్యాదు కమిటీ, తర్వాత బీమా అంబుడ్స్‌మన్ (cioins.co.in) — ఉచితం."], "hi": ["नुकसान हुआ → 72 घंटे में: 14447 / PMFBY ऐप / बीमाकर्ता / बैंक / कृषि अधिकारी। शिकायत नंबर नोट करें।", "तारीख/स्थान के साथ क्षतिग्रस्त फसल की फोटो लें।", "नुकसान आकलन सर्वे में सहयोग करें; सर्वेयर रिपोर्ट की कॉपी लें।", "2 महीने में निपटान नहीं → 12% ब्याज देनदारी का हवाला देकर बीमाकर्ता को लिखित शिकायत।", "फिर भी अटका → जिला शिकायत समिति, फिर बीमा लोकपाल (cioins.co.in) — मुफ्त।"]}, "law": {"en": "PMFBY Operational Guidelines (rev. 2020) — 72-hr intimation, 2-month settlement, 12% delay interest", "te": "PMFBY కార్యాచరణ మార్గదర్శకాలు (సవరణ 2020) — 72 గంటల సమాచారం, 2 నెలల పరిష్కారం, 12% ఆలస్య వడ్డీ", "hi": "PMFBY परिचालन दिशानिर्देश (संशोधित 2020) — 72 घंटे सूचना, 2 महीने निपटान, 12% विलंब ब्याज"}}, {"icon": "💳", "tagCls": "rtag-e", "title": {"en": "KCC — 4% Effective Interest + Protection from Illegal Lenders", "te": "KCC — 4% ప్రభావవంతమైన వడ్డీ + చట్టవిరుద్ధ రుణదాతల నుండి రక్షణ", "hi": "KCC — 4% प्रभावी ब्याज + अवैध ऋणदाताओं से सुरक्षा"}, "meta": {"en": "Up to ₹3 lakh · No collateral up to ₹1.6 lakh · RBI complaint 14448", "te": "₹3 లక్షల వరకు · ₹1.6 లక్షల వరకు హామీ లేదు", "hi": "₹3 लाख तक · ₹1.6 लाख तक बिना गारंटी"}, "tag": {"en": "ENTITLEMENT", "te": "హక్కు", "hi": "अधिकार"}, "body": {"en": "Kisan Credit Card: crop loans up to <strong>₹3 lakh at 7%, reduced to 4% effective</strong> with prompt repayment (3% subvention). <strong>No collateral up to ₹1.6 lakh</strong>. Banks cannot arbitrarily refuse an eligible farmer — RBI complaint at 14448 / cms.rbi.org.in. Private moneylenders: only <strong>licensed</strong> lenders can lend; state Acts cap their interest; unlicensed lenders <strong>cannot recover through courts</strong>, and coercive recovery (muscle, harassment) is criminal.", "te": "కిసాన్ క్రెడిట్ కార్డ్: <strong>₹3 లక్షల వరకు 7% వద్ద పంట రుణాలు, సకాలంలో చెల్లిస్తే 4% ప్రభావవంతం</strong> (3% సబ్వెన్షన్). <strong>₹1.6 లక్షల వరకు హామీ అవసరం లేదు</strong>. అర్హత ఉన్న రైతును బ్యాంకులు ఏకపక్షంగా నిరాకరించలేవు — RBI ఫిర్యాదు 14448 / cms.rbi.org.in. ప్రైవేట్ వడ్డీ వ్యాపారులు: <strong>లైసెన్స్</strong> ఉన్నవారు మాత్రమే; రాష్ట్ర చట్టాలు వడ్డీ పరిమితం చేస్తాయి; లైసెన్స్ లేని రుణదాతలు <strong>కోర్టుల ద్వారా వసూలు చేయలేరు</strong>, బలవంతపు వసూలు నేరం.", "hi": "किसान क्रेडिट कार्ड: <strong>₹3 लाख तक 7% पर फसल ऋण, समय पर चुकाने पर 4% प्रभावी</strong> (3% सबवेंशन)। <strong>₹1.6 लाख तक बिना गारंटी</strong>। बैंक पात्र किसान को मनमाने ढंग से मना नहीं कर सकते — RBI शिकायत 14448 / cms.rbi.org.in। निजी साहूकार: केवल <strong>लाइसेंसी</strong> ऋण दे सकते हैं; राज्य कानून ब्याज सीमित करते हैं; बिना लाइसेंस ऋणदाता <strong>कोर्ट से वसूली नहीं कर सकते</strong>, जबरन वसूली अपराध है।"}, "steps": {"en": ["Apply for KCC at any bank with land records + ID; PM-Kisan beneficiaries have a simplified route.", "Refused without reason → written complaint to branch manager, then RBI at 14448 / cms.rbi.org.in.", "Repay within the season to lock the 4% effective rate.", "Moneylender charging beyond legal caps → complaint to District Collector/registering authority.", "Coercive recovery → police complaint; unlicensed lender's claim is legally unenforceable."], "te": ["భూమి రికార్డులు + IDతో ఏ బ్యాంకులోనైనా KCC దరఖాస్తు; PM-కిసాన్ లబ్ధిదారులకు సరళీకృత మార్గం.", "కారణం లేకుండా నిరాకరిస్తే → బ్రాంచ్ మేనేజర్‌కు లిఖిత ఫిర్యాదు, తర్వాత RBI 14448.", "4% ప్రభావవంతమైన రేటుకు సీజన్‌లోపు చెల్లించండి.", "చట్టపరమైన పరిమితి మించి వడ్డీ వ్యాపారి వసూలు → జిల్లా కలెక్టర్‌కు ఫిర్యాదు.", "బలవంతపు వసూలు → పోలీసు ఫిర్యాదు; లైసెన్స్ లేని రుణదాత క్లెయిమ్ చట్టపరంగా అమలుకాదు."], "hi": ["भूमि रिकॉर्ड + ID के साथ किसी भी बैंक में KCC आवेदन; PM-किसान लाभार्थियों के लिए सरल मार्ग।", "बिना कारण मना → शाखा प्रबंधक को लिखित शिकायत, फिर RBI 14448।", "4% प्रभावी दर के लिए सीजन में चुकाएं।", "कानूनी सीमा से अधिक ब्याज लेने वाला साहूकार → जिला कलेक्टर को शिकायत।", "जबरन वसूली → पुलिस शिकायत; बिना लाइसेंस ऋणदाता का दावा कानूनन लागू नहीं।"]}, "law": {"en": "KCC Scheme + Interest Subvention Scheme; RBI Master Directions; TS/AP Money Lenders Acts", "te": "KCC పథకం + వడ్డీ సబ్వెన్షన్ పథకం; RBI మాస్టర్ డైరెక్షన్స్; TS/AP వడ్డీ వ్యాపారుల చట్టాలు", "hi": "KCC योजना + ब्याज सबवेंशन योजना; RBI मास्टर निर्देश; TS/AP साहूकार अधिनियम"}}, {"icon": "💰", "tagCls": "rtag-e", "title": {"en": "MSP, Fair Weighment & Market Rights", "te": "MSP, న్యాయమైన తూకం & మార్కెట్ హక్కులు", "hi": "MSP, उचित तौल और बाजार अधिकार"}, "meta": {"en": "Registered procurement centres · Same-day receipt · Payment timelines", "te": "నమోదిత సేకరణ కేంద్రాలు · అదే రోజు రసీదు", "hi": "पंजीकृत खरीद केंद्र · उसी दिन रसीद"}, "tag": {"en": "ENTITLEMENT", "te": "హక్కు", "hi": "अधिकार"}, "body": {"en": "At government procurement centres you have the right to: <strong>sell at the announced MSP</strong> for notified crops, <strong>certified electronic weighment in front of you</strong>, a <strong>same-day purchase receipt</strong>, and payment within the notified timeline (typically 48-72 hours to your bank account). Underpayment vs MSP, weighment fraud, or \"quality deduction\" without written norms are all complaint-worthy — Agriculture Marketing Department + District Collector.", "te": "ప్రభుత్వ సేకరణ కేంద్రాల్లో మీ హక్కులు: నోటిఫై చేసిన పంటలకు <strong>ప్రకటించిన MSPకి అమ్మడం</strong>, <strong>మీ ముందే సర్టిఫైడ్ ఎలక్ట్రానిక్ తూకం</strong>, <strong>అదే రోజు కొనుగోలు రసీదు</strong>, నోటిఫై చేసిన గడువులో చెల్లింపు (సాధారణంగా 48-72 గంటల్లో బ్యాంక్ ఖాతాకు). MSP కంటే తక్కువ చెల్లింపు, తూకం మోసం, లిఖిత ప్రమాణాలు లేకుండా \"నాణ్యత మినహాయింపు\" — అన్నీ ఫిర్యాదుకు అర్హం — వ్యవసాయ మార్కెటింగ్ శాఖ + జిల్లా కలెక్టర్.", "hi": "सरकारी खरीद केंद्रों पर आपके अधिकार: अधिसूचित फसलों के लिए <strong>घोषित MSP पर बिक्री</strong>, <strong>आपके सामने प्रमाणित इलेक्ट्रॉनिक तौल</strong>, <strong>उसी दिन खरीद रसीद</strong>, अधिसूचित समयसीमा में भुगतान (आमतौर पर 48-72 घंटे में बैंक खाते में)। MSP से कम भुगतान, तौल धोखाधड़ी, बिना लिखित मानकों \"गुणवत्ता कटौती\" — सब शिकायत योग्य — कृषि विपणन विभाग + जिला कलेक्टर।"}, "steps": {"en": ["Register on the state procurement portal before season; keep land records + bank details updated.", "At the centre: watch the weighment, collect the receipt before leaving.", "Payment delayed beyond the timeline → written complaint to the procurement agency with receipt copy.", "Weighment fraud → Legal Metrology complaint + District Collector.", "Kisan Call Centre 1800-180-1551 for scheme guidance in Telugu/Hindi."], "te": ["సీజన్ ముందు రాష్ట్ర సేకరణ పోర్టల్‌లో నమోదు; భూమి రికార్డులు + బ్యాంక్ వివరాలు అప్‌డేట్ చేయండి.", "కేంద్రంలో: తూకం చూడండి, వెళ్ళే ముందు రసీదు తీసుకోండి.", "గడువు దాటి చెల్లింపు ఆలస్యం → రసీదు కాపీతో సేకరణ ఏజెన్సీకి లిఖిత ఫిర్యాదు.", "తూకం మోసం → లీగల్ మెట్రాలజీ ఫిర్యాదు + జిల్లా కలెక్టర్.", "తెలుగులో పథక మార్గదర్శకత్వానికి కిసాన్ కాల్ సెంటర్ 1800-180-1551."], "hi": ["सीजन से पहले राज्य खरीद पोर्टल पर पंजीकरण; भूमि रिकॉर्ड + बैंक विवरण अपडेट रखें।", "केंद्र पर: तौल देखें, जाने से पहले रसीद लें।", "समयसीमा से अधिक भुगतान देरी → रसीद कॉपी के साथ खरीद एजेंसी को लिखित शिकायत।", "तौल धोखाधड़ी → विधिक माप विज्ञान शिकायत + जिला कलेक्टर।", "हिंदी में योजना मार्गदर्शन के लिए किसान कॉल सेंटर 1800-180-1551।"]}, "law": {"en": "MSP notifications (CACP); state procurement guidelines; Legal Metrology Act 2009; APMC Acts", "te": "MSP నోటిఫికేషన్లు (CACP); రాష్ట్ర సేకరణ మార్గదర్శకాలు; లీగల్ మెట్రాలజీ చట్టం 2009; APMC చట్టాలు", "hi": "MSP अधिसूचनाएं (CACP); राज्य खरीद दिशानिर्देश; विधिक माप

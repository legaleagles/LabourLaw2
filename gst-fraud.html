let L='en', lastIssues=[], lastLaw='';

// ═══ GSTIN checksum (public algorithm) ═══
const B36='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const GST_STATES={'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli, Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh'};
function gstinCheckChar(g14){let s=0;for(let i=0;i<14;i++){let v=B36.indexOf(g14[i]);if(v<0)return null;
 let m=v*((i%2===0)?1:2);s+=Math.floor(m/36)+(m%36);}return B36[(36-(s%36))%36];}

function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}

 ['navBrand','navBack','heroTitle','heroSub','g1L','gBtn','gHint','gRefT',

  'h1L','h2L','h3L','hBtn','hHint','s1L','s2L','s3L','sBtn','sRefT'].forEach(id=>{
  const el=document.getElementById(id);if(el&&U[id]!==undefined)el.textContent=U[id];});
 ['gRef1','gRef2','gRef3','sRef1','sRef2','sRef3','sRef4'].forEach(id=>{
  const el=document.getElementById(id);if(el&&U[id])el.innerHTML=U[id];});
 for(let i=0;i<5;i++)document.getElementById('tl'+i).textContent=U.tabs[i];
 ['rWA','hWA','sWA'].forEach(id=>document.getElementById(id).textContent=U.wa);
 // complain ladder
 document.getElementById('ladder').innerHTML=U.ladder.map(([ic,t,d,url,act],i)=>`
  <div class="step-card"><div class="step-num">${i+1}</div><div class="step-body">
   <div class="step-t">${ic} ${t}</div><div class="step-d">${d}</div>

  </div></div>`).join('');
}

 document.getElementById('tab'+j).classList.toggle('active',j===i);

function fill(id,tpl,vals){let s=tpl;for(const k in vals)s=s.split('{'+k+'}').join(vals[k]);
 return s;}
function num(id){return parseFloat(document.getElementById(id).value)||0;}
function show(prefix,bad,lines,law){
 const U=UI[L];
 document.getElementById(prefix+'VT').textContent=bad?U.badge.bad:U.badge.good;

function checkGstin(){
 const U=UI[L];
 const g=(document.getElementById('gstin').value||'').toUpperCase().trim();
 const lines=[];let needsVerify=false;
 const fmt=/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
 if(g.length!==15){needsVerify=true;lines.push(fill('',U.gLen,{n:g.length}));}
 else if(!fmt.test(g)){needsVerify=true;lines.push(U.gFmt);}
 else{
  const expect=gstinCheckChar(g.slice(0,14));
  if(expect!==g[14]){needsVerify=true;lines.push(U.gChk);}
  else{
   const st=GST_STATES[g.slice(0,2)];
   lines.push(U.gValid);
   lines.push(fill('',U.gState,{s:st||('code '+g.slice(0,2))}));
   lines.push(fill('',U.gPan,{p:g.slice(2,12)}));
  }
 }
 // Always show the verify-officially reminder, pass or fail — we never make the final call.
 lines.push(U.gVerify);
 document.getElementById('gVT').textContent=needsVerify?U.badge.verify:U.badge.info;
 document.getElementById('gVL').innerHTML=lines.map(l=>`<div class="v-line">• ${l}</div>`).join('');
 document.getElementById('gVLaw').textContent=U.gLaw;
 document.getElementById('gVerdict').className='verdict show '+(needsVerify?'bad':'info');
 // GSTIN check never feeds the "file a complaint" share flow — we don't accuse anyone based on math alone.
 lastIssues=[];lastLaw='';
}

function checkRestaurant(){
 const U=UI[L];
 const type=document.getElementById('rType').value;
 const food=num('rFood'),gst=num('rGst'),sc=num('rSC'),alc=num('rAlc');
 if(food<=0||gst<0){alert(U.fillAll);return;}
 const taxableFood=Math.max(0,food-alc); // alcohol outside GST
 const expected=type==='premium'?18:5;
 const TOL=2; // ₹2 rounding tolerance, independent of base size
 const legalGst=taxableFood*expected/100;
 const pct=taxableFood>0?Math.round(gst/taxableFood*1000)/10:0;
 const lines=[];let bad=false;

 // Check most specific explanations FIRST, before the generic wrong-rate message
 const withSC=(taxableFood+sc)*expected/100;
 const gstOnSC = sc>0 && Math.abs(gst-withSC)<=TOL && Math.abs(gst-legalGst)>TOL;
 const gstOnAlcohol = alc>0 && Math.abs(gst-(food*expected/100))<=TOL && Math.abs(gst-legalGst)>TOL;

 if(gstOnSC){
  bad=true;lines.push(U.rGstOnSC);
 }else if(gstOnAlcohol){
  bad=true;lines.push(fill('',U.rAlc,{a:alc.toLocaleString('en-IN')}));
 }else if(Math.abs(gst-legalGst)>TOL){
  bad=true;
  lines.push(fill('',U.rWrongRate,{p:pct,e:expected,x:(gst-legalGst).toFixed(2)}));
 }else{
  lines.push(fill('',U.rOk,{p:pct}));
  if(type==='premium')lines.push(U.rPremium);
 }
 show('r',bad,lines,U.rLaw);
}

function checkHotel(){
 const U=UI[L];
 const tariff=num('hTariff'),nights=Math.max(1,num('hNights')),gst=num('hGst');
 if(tariff<=0){alert(U.fillAll);return;}
 const expected=tariff<=7500?5:18;
 const base=tariff*nights;
 const legal=base*expected/100;
 const pct=base>0?Math.round(gst/base*1000)/10:0;
 const lines=[];let bad=false;
 if(gst>legal+base*0.006){
  bad=true;
  lines.push(fill('',U.hWrong,{t:tariff.toLocaleString('en-IN'),e:expected,p:pct,x:(gst-legal).toFixed(2)}));
 }else{
  lines.push(fill('',U.hOk,{p:pct}));
 }
 show('h',bad,lines,U.hLaw);
}

function checkShop(){
 const U=UI[L];
 const mrp=num('sMrp'),charged=num('sCharged'),gstAdded=num('sGstAdded');
 if(mrp<=0||charged<=0){alert(U.fillAll);return;}
 const lines=[];let bad=false;
 if(gstAdded>0){bad=true;
  lines.push(fill('',U.sGstOnMrp,{g:gstAdded.toFixed(2)}));}
 const eff=charged+gstAdded;
 if(eff>mrp+0.009){bad=true;
  lines.push(fill('',U.sOverMrp,{c:eff.toFixed(2),m:mrp.toFixed(2),d:(eff-mrp).toFixed(2)}));}
 if(!bad)lines.push(U.sOk);
 show('s',bad,lines,U.sLaw);
}

function shareComplaint(kind){
 if(!lastIssues.length)return;
 const U=UI[L];
 const msg=U.waTpl
  .replace('{date}',new Date().toLocaleDateString('en-IN'))
  .replace('{issues}',lastIssues.map(i=>'• '+i.replace(/<[^>]*>/g,'')).join('\n'))
  .replace('{law}',lastLaw);
 window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

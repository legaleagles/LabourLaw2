hen the **Chief Judicial Magistrate**; above them the **Court of Session**; and above that the **High Court** and **Supreme Court**. Beside the ladder stand **Executive Magistrates** — District Magistrate, Sub-Divisional Magistrate — who keep **public order** but do not try ordinary offences. **s.6 BNSS** lists the classes: Courts of Session, Judicial Magistrates of the first and second class, and Executive Magistrates.", "Each step has a ==ceiling== on the sentence it can give (**ss.22–23**). The **High Court** and the **Sessions Judge / Additional Sessions Judge** may pass **any sentence authorised by law** — but a **death sentence** by a Sessions Court **cannot be executed until the High Court confirms it** (**ss.407–410**, old ss.366–369). The **CJM** may pass any sentence **except death, life, or imprisonment above seven years**. A **Magistrate of the first class**: up to **3 years**, fine up to **₹50,000**, or **community service**. A **Magistrate of the second class**: up to **1 year**, fine up to **₹10,000**, or community service. Memory line: ==7 – 3 – 1, and 50 – 10==", "Why the death-sentence lock? Because in *Bachan Singh* (1980), the Constitution Bench upheld the death penalty but made **life imprisonment the rule and death the exception**, only in the '**rarest of rare**' cases, after weighing **aggravating and mitigating** circumstances, with **special reasons** recorded (now **s.393(3)**). High Court confirmation, signed by at least **two judges** where the Court has two or more, is a second safety check.", "Who sets up these courts? Every State is, or is divided into, **sessions divisions** (**s.7**; the State Government may alter them after consulting the High Court); the **State Government establishes a Court of Session** for each division and the **High Court appoints** Sessions Judges and Additional Sessions Judges (**s.8**) and designates the **CJM** (**s.10**). **Special Judicial Magistrates** may be conferred powers for particular cases or areas (**s.11**).", "Try the old exam problem (2014): 'An in-charge Sessions Judge awarded a death sentence. Can it be executed?' Answer: **No** — not unless the **High Court confirms** it; and you also check whether the judge exercising the power was competent to pass that sentence."]}, {"t": "tree", "title": "Classes of criminal courts", "root": "Criminal courts — s.6 BNSS", "branches": [["Above s.6", ["**Supreme Court**", "**High Courts**", "courts under other laws (special courts)"]], ["Court of Session", ["**Sessions Judge** · **Additional Sessions Judge**", "one for each sessions division [[s.8]]"]], ["Judicial Magistrates", ["**Chief Judicial Magistrate** (and Additional CJM) [[s.10]]", "Judicial Magistrate of the **first class**", "Judicial Magistrate of the **second class**", "Special Judicial Magistrates [[s.11]]"]], ["Executive Magistrates", ["**District Magistrate**, Sub-Divisional Magistrate, others [[s.14]]", "keep public order — not trials of offences"]]]}, {"t": "table", "title": "Sentencing powers — memorise this table", "head": ["Court", "Imprisonment", "Fine", "Other"], "rows": [["High Court", "any sentence authorised by law", "any", "—"], ["Sessions Judge / Addl. Sessions Judge", "any sentence authorised by law", "any", "**death** needs **High Court confirmation**"], ["Chief Judicial Magistrate", "any, except **death, life or more than 7 years**", "any", "—"], ["Judicial Magistrate, first class", "up to **3 years**", "up to **₹50,000**", "or **community service**"], ["Judicial Magistrate, second class", "up to **1 year**", "up to **₹10,000**", "or **community service**"]]}, {"t": "rule", "title": "Death sentence — the safety lock", "cite": "ss.407–410 BNSS (old ss.366–369 CrPC)", "x": "When a Court of Session passes a sentence of death, the proceedings are **submitted to the High Court**, and the sentence **shall not be executed unless confirmed** by the High Court.", "points": ["The High Court may confirm, pass another sentence, annul the conviction, or order a new trial / further inquiry.", "Confirmation is signed by **at least two judges** where the High Court has two or more judges."]}, {"t": "case", "name": "Bachan Singh v. State of Punjab", "year": "1980", "court": "Supreme Court of India (Constitution Bench, 4:1)", "cast": [["🧔", "Bachan Singh (convicted of murder)"], ["⚖️", "Supreme Court"]], "panels": [["🧔", "Bachan Singh", "The death penalty itself violates Articles 14, 19 and 21!"], ["⚖️", "Majority", "It is constitutional — but only in the **rarest of rare** cases, when life imprisonment is unquestionably foreclosed."], ["⚖️", "Majority", "Weigh **aggravating** and **mitigating** circumstances — of the crime and the criminal."], ["⚖️", "Bhagwati J. (dissent)", "I would strike it down."]], "story": ["Bachan Singh was sentenced to death for murder. He challenged the constitutional validity of the death penalty under s.302 IPC and the sentencing procedure in **s.354(3) CrPC** (which requires **special reasons** for a death sentence).", "The Constitution Bench upheld the death penalty but laid down that life imprisonment is the **rule** and death the **exception**, to be imposed only in the '**rarest of rare**' cases, after balancing aggravating and mitigating circumstances."], "held": "Death penalty is **constitutional**; to be awarded only in the **rarest of rare** cases with special reasons recorded.", "link": "Explains why the Code adds layers of safety — **special reasons** in judgment (now s.393(3) BNSS) and **High Court confirmation** (s.407)."}, {"t": "real", "x": "**Exam problem (2014):** 'An in-charge Sessions Judge awarded death sentence. Can it be executed?' — **No**, not until the **High Court confirms** it under s.407 (old s.366); and the judge must have been a Sessions/Additional Sessions Judge competent to pass it."}, {"t": "exam", "q": "Explain the classes of criminal courts and their sentencing powers under the BNSS.", "lines": ["Introduction — hierarchy; separation of judiciary (Art. 50).", "Classes — s.6; constitution — ss.8–11, 14.", "Sentencing powers — ss.22–23 table (7–3–1, 50k–10k, community service).", "Death sentence — confirmation ss.407–410; Bachan Singh; special reasons s.393(3).", "Executive Magistrates — role.", "Conclude."]}, {"t": "check", "items": [["Maximum sentence a CJM can pass?", "Any sentence authorised by law except death, life imprisonment or imprisonment for more than 7 years."], ["Who appoints Sessions Judges?", "The **High Court** (s.8); the State Government establishes a Court of Session for each sessions division (s.7–8)."], ["Do Executive Magistrates try offences?", "Ordinarily no — they handle maintenance of public order (e.g. security proceedings, unlawful assemblies, public nuisance)."]]}, {"t": "hook", "x": "**HC & Sessions: anything (death → HC confirms). CJM: up to 7. First class: 3 yrs / ₹50k. Second class: 1 yr / ₹10k.** '7-3-1, 50-10'."}], "asked": [["2014", "A", "Sessions Judge"], ["2014", "C", "An incharge session Judge awarded death sentence. Whether it can be executed or not."], ["2015", "A", "Chief Judicial Magistrate"], ["2015", "A", "Death Sentence"], ["2015", "C", "A person was arrested on the presumption of being involved in terrorist activities. Later the court came to know that he was not involved and informs him to apply for bail and pay the bond amount. Due to his poverty he c"], ["2015", "C", "Two persons entered into a gold shop, took away the box consisting of twelve gold chains. After going home they came to know that the box was empty. Both were arrested. Whether they had committed any offence, which court"], ["2015", "C", "X, within the period of 1 year committed theft trespass, cheating. Which court has jurisdiction to try the case and what will be the punishment?"], ["2016", "A", "Death sentence"], ["2016", "A", "Sessions court"], ["2016", "C", "A person has committed three offences within a year, one is a compoundable offence and the other two are non-cognizable offences. Which court has the power to punish, what will be the punishment?"], ["2020", "C", "A judge was involved in a corruption case, it was confirmed by the preliminary enquiry and he was arrested by the police. Whether police have powers to arrest the judge. If not how to arrest the judge? Which court is hav"]]}, {"id": "bnss8", "title": "Directorate of Prosecution and public prosecutors", "sub": "ss.18–20 · s.360 withdrawal · the prosecutor's duty of fairness", "blocks": [{"t": "idea", "x": "A **public prosecutor** represents the **State**, not the victim and not the police. His goal is **justice**, not a conviction at any cost."}, {"t": "tale", "x": ["In a murder trial, who argues against the accused? Not the dead man's family, and not the police — it is the **State**, represented by the **Public Prosecutor**. A crime is treated as a wrong against **society**, so the State prosecutes. But the PP is not a hired gun. He is an ==officer of the court== whose duty is to place **all the facts fairly** before the judge — even facts that help the accused.", "In *Shiv Kumar v. Hukam Chand* (1999), a complainant wanted his own private lawyer to run the prosecution in a Sessions trial. The Supreme Court refused: in a Sessions Court only the **PP conducts** the case; a private lawyer may only **assist under the PP's directions** (s.301 CrPC, now **s.338**). The Court said a PP ==is not expected to show a thirst to reach the case in the conviction of the accused somehow or the other irrespective of the true facts== — a prosecution must not become a **persecution**. In a Magistrate's court, the Magistrate may permit a private person to **conduct** the prosecution (**s.339**). And under the **proviso to s.18(8)**, the court may permit the **victim** to engage an advocate to **assist** the prosecution.", "Who are the prosecutors? For the **High Court**, the Central or State Government appoints a PP **after consulting the High Court** (**s.18(1)**). For each **district**, the State appoints PPs from a **panel** prepared by the **District Magistrate in consultation with the Sessions Judge**. Both need **7 years** as an advocate (**s.18(7)**). A **Special Public Prosecutor** for a particular case needs **10 years** (**s.18(8)**). **Assistant Public Prosecutors** work in **Magistrates' courts** (**s.19**). Above them, the State may establish a **Directorate of Prosecution** (**s.20**, old s.25A) headed by a **Director** — an advocate of **15 years** or a **Sessions Judge** — with Deputy and Assistant Directors and district units that monitor cases and advise on appeals.", "The most delicate power is **withdrawal from prosecution** (**s.360**, old s.321). The PP in charge may, **with the court's consent**, withdraw at any time **before judgment** — before charge the accused is **discharged**, after charge **acquitted**. In *Sheonandan Paswan* (1987), a PP withdrew a case against a former Chief Minister; the Constitution Bench (3:2) upheld it, holding that the decision is the **PP's own, made in good faith**, and the court's role is **supervisory**. The BNSS adds a new safeguard: ==the victim must be heard== before the court allows withdrawal."]}, {"t": "table", "title": "Who's who in prosecution", "head": ["Office", "Appointed by / for", "Qualification", "Section"], "rows": [["Public Prosecutor (High Court)", "Central / State Government, **after consultation with the High Court**", "advocate for **7 years** [[s.18(7)]]", "[[s.18(1)]]"], ["Public Prosecutor (District)", "State Government from a **panel** prepared by the **District Magistrate in consultation with the Sessions Judge**", "advocate for **7 years**", "[[s.18(3)–(7)]]"], ["Special Public Prosecutor", "Central / State Government for a case or class of cases", "advocate for **10 years**", "[[s.18(8)]]"], ["Assistant Public Prosecutor", "State Government — for **Magistrates' courts**", "—", "[[s.19]]"], ["Directorate of Prosecution", "State Government — a **Director of Prosecution**, Deputy and Assistant Directors, district units", "Director: advocate for **15 years** or a **Sessions Judge**", "[[s.20]]"]]}, {"t": "tiles", "title": "Directorate of Prosecution — what it does", "items": [["🏛️", "Heads prosecution", "Director works under the **administrative control** of the State Home Department"], ["📊", "Monitors cases", "serious cases tracked by Director / Deputy Directors by punishment range"], ["⏱️", "Expedites", "speedy disposal; examines police reports"], ["📝", "Advises appeals", "opinion on filing appeals"]]}, {"t": "rule", "title": "Victim's advocate and withdrawal from prosecution", "cite": "s.18(8) proviso · s.360", "points": ["The court **may permit the victim** to engage an advocate of choice to **assist the prosecution** [[s.18(8) proviso]].", "In Sessions trials the private advocate acts **under the directions** of the Public Prosecutor; in Magistrates' courts, a private person may be permitted to **conduct** the prosecution [[s.339]].", "**Withdrawal** [[s.360]]: the PP / APP in charge may, **with the consent of the court**, withdraw from prosecution at any time **before judgment** — before charge → discharge; after charge → acquittal.", "**New in BNSS**: no court shall allow withdrawal **without giving the victim an opportunity of being heard**."]}, {"t": "case", "name": "Shiv Kumar v. Hukam Chand", "year": "1999", "court": "Supreme Court of India", "cast": [["🧑", "Complainant's private lawyer"], ["👨‍⚖️", "Public Prosecutor"], ["⚖️", "Supreme Court"]], "panels": [["🧑", "Complainant", "I want my own lawyer to run the whole prosecution in the Sessions Court!"], ["⚖️", "Supreme Court", "No. In a Sessions trial, only the **Public Prosecutor** conducts the case."], ["⚖️", "Supreme Court", "A prosecution ought not to be a persecution. The PP must be fair — even to the accused."]], "story": ["In a Sessions case, the complainant wanted his private counsel to conduct the prosecution. The question was the role of a private lawyer under **s.301 CrPC** (now s.338 BNSS).", "The Court held that in Sessions trials the prosecution must be **conducted by the Public Prosecutor**; a private counsel can only **assist** under the PP's direction. It explained why: a Public Prosecutor is an officer of the court who must be **fair and impartial**; a private lawyer may be driven by vengeance."], "held": "A private counsel cannot be allowed to **conduct** the prosecution in a Sessions Court; he may only assist the PP.", "link": "The core idea of the **PP's role** — a Public Prosecutor ==is not expected to show a thirst to reach the case in the conviction of the accused somehow or the other irrespective of the true facts==."}, {"t": "case", "name": "Sheonandan Paswan v. State of Bihar", "year": "1987", "court": "Supreme Court of India (Constitution Bench, 3:2)", "cast": [["🏛️", "A former Chief Minister (accused)"], ["👨‍⚖️", "Public Prosecutor"], ["🧑", "Sheonandan Paswan (objector)"]], "panels": [["👨‍⚖️", "PP", "I wish to withdraw from this forgery/corruption prosecution. The evidence is weak."], ["🧑", "Paswan", "This is a political favour! The court must not allow it."], ["⚖️", "Majority", "The PP's decision was in good faith on the material; the court's consent was properly given."]], "story": ["A criminal case relating to an alleged co-operative bank fraud was pending against a former Chief Minister of Bihar. The Public Prosecutor applied to withdraw from prosecution under **s.321 CrPC** (now s.360 BNSS); the Magistrate consented. A citizen challenged it.", "The majority held that the decision to withdraw is the **Public Prosecutor's** — he must apply his **independent mind** in good faith, in the interest of justice; the court performs a **supervisory** function and gives consent only after checking that the withdrawal is not improper."], "held": "Withdrawal was upheld; the court's role under s.321 is to see that the **PP's discretion** was exercised properly, not to re-try the case.", "link": "BNSS adds a safeguard the CrPC lacked — the **victim must be heard** before withdrawal is allowed."}, {"t": "exam", "q": "Explain the role, appointment and powers of Public Prosecutors under the BNSS.", "lines": ["Introduction — crime as wrong against society; PP as officer of the court.", "Appointment — s.18 (HC, district, SPP, qualifications), s.19 APP, s.20 Directorate.", "Conduct of prosecution — s.338, s.339, victim's advocate (s.18(8) proviso).", "Withdrawal — s.360; victim hearing; Sheonandan Paswan.", "Duty of fairness — Shiv Kumar v. Hukam Chand.", "Conclude."]}, {"t": "check", "items": [["Minimum practice for a Special Public Prosecutor?", "10 years as an advocate — s.18(8)."], ["Who appoints Assistant Public Prosecutors?", "The State Government, for Magistrates' courts — s.19."], ["What is new about withdrawal under the BNSS?", "The court must give the victim an opportunity of being heard before permitting withdrawal (s.360 proviso)."]]}, {"t": "hook", "x": "**PP: 7 yrs · SPP: 10 yrs · Director: 15 yrs.** PP = officer of justice, **not a persecutor**."}], "asked": [["2019", "A", "Public Prosecuters"]]}, {"id": "bnss9", "title": "Defence lawyer, legal aid and correctional methods", "sub": "Right to counsel · free legal aid · prisons, parole, probation", "blocks": [{"t": "idea", "x": "A trial without a **defence lawyer** is not a fair trial. And punishment today aims at **reform** — prisons are meant to be **correctional homes**, not dungeons."}, {"t": "tale", "x": ["Can there be a fair trial if the accused cannot afford a lawyer and does not even know the law? The Constitution says no. **Art. 22(1)** gives every arrested person the right to **consult and be defended** by a lawyer of his choice. **Art. 39A** directs the State to provide **free legal aid**. The BNSS backs this up: every accused may be defended by an advocate (**s.340**); in a **trial or appeal**, an accused without means gets an advocate **at State expense** (**s.341**); and an arrested person may meet an advocate **during interrogation**, though not throughout it (**s.38**).", "These rights were won through painful stories. In **1979**, newspapers revealed that thousands of **undertrials in Bihar jails** had waited for years — some longer than the **maximum sentence** for their alleged offence. In *Hussainara Khatoon*, the Supreme Court held that a ==speedy trial== and ==free legal aid== are part of **Art. 21**, and ordered mass releases. Two years later, in the **Bhagalpur blinding case** (*Khatri*, 1981), prisoners blinded in police custody had never been told they could get a free lawyer. The Court said the State's duty begins when the accused is **first produced before a Magistrate**, and the Magistrate **must inform** him of it. In *Kasab* (2012) the Court repeated this; it added that failure does not by itself spoil the trial unless it caused **material prejudice**, but the Magistrate faces **departmental action**.", "Punishment, too, has changed its purpose: from **revenge** to **reform**. A first offender may be released on **probation** — good conduct instead of prison — under the **Probation of Offenders Act, 1958** and **s.401 BNSS**. A prisoner may get **parole** for a **specific reason** (a parent's illness, a child's wedding) — it does **not** count towards his sentence. **Furlough**, by contrast, is a periodic break after good conduct, to keep family ties; it **counts** as part of the sentence and is **not an absolute right** (*Asfaq*, 2017; *State of Gujarat v. Narayan*, 2021). **Open prisons**, vocational training and **community service** (a new punishment for petty offences) complete the correctional picture.", "And prisoners do not lose their humanity at the jail gate. In *Sunil Batra* (1978), a death-row prisoner kept in **solitary confinement** before his appeals ended won his case, the Court reaffirming *D.B.M. Patnaik* (1974): ==convicts are not, by mere reason of the conviction, denuded of all fundamental rights==. In 1980, his letter about a warder's torture of another prisoner was treated as a **habeas corpus** petition. *Rama Murthy* (1997) listed **nine major problems** of prisons, and the **Model Prisons Act, 2023** proposes to replace the colonial **Prisons Act, 1894**."]}, {"t": "rule", "title": "Right to a lawyer — the legal chain", "cite": "Art. 22(1) · Art. 39A · BNSS", "points": ["**Art. 22(1)** — an arrested person shall not be denied the right to **consult and be defended** by a legal practitioner of his choice.", "**Art. 39A** — State to provide **free legal aid** so that justice is not denied for economic or other disabilities.", "**s.340** — every accused may be **defended by an advocate** of his choice.", "**s.341** — in a **trial or appeal before a Court**, if the accused has no advocate and lacks means, the court shall assign an advocate **at State expense** (old s.304 CrPC was limited to trials before the Court of Session).", "**s.38** — an arrested person may meet an advocate of his choice **during interrogation**, though **not throughout** it.", "Legal Services Authorities Act, 1987 — NALSA, State and District Legal Services Authorities."]}, {"t": "case", "name": "Hussainara Khatoon v. Home Secretary, State of Bihar", "year": "1979", "court": "Supreme Court of India", "cast": [["📰", "Newspaper reports on Bihar jails"], ["🧑‍⚖️", "An advocate who filed a habeas corpus petition"], ["👥", "Thousands of undertrial prisoners"], ["⚖️", "Supreme Court"]], "panels": [["📰", "Report", "Undertrials in Bihar jails have been waiting for trial for years — longer than the maximum sentence for their offence!"], ["👥", "Undertrials", "We are poor. No lawyer, no bail, no trial."], ["⚖️", "Supreme Court", "**Speedy trial** is part of Article 21. Free legal aid is part of a fair procedure. Release them!"]], "story": ["Newspaper reports in 1979 revealed that thousands of undertrial prisoners in Bihar had been in jail for years — many for periods **longer than the maximum punishment** for the offences they were accused of. A habeas corpus petition was filed on their behalf.", "The Supreme Court (Bhagwati J.) held that the **right to a speedy trial** is implicit in **Art. 21**, and that **free legal aid** to the poor is part of 'reasonable, fair and just' procedure (read with Art. 39A). It ordered the release of large numbers of undertrials, many on personal bond."], "held": "**Speedy trial** and **free legal aid** are part of the fundamental right to life and personal liberty.", "link": "This case is the root of **s.479 BNSS** (undertrial release after half / one-third of the maximum) and of the legal-aid sections."}, {"t": "case", "name": "Khatri v. State of Bihar (Bhagalpur blinding case)", "year": "1981", "court": "Supreme Court of India", "cast": [["👁️", "Undertrial prisoners blinded in police custody"], ["👨‍⚖️", "Magistrates who never told them of legal aid"], ["⚖️", "Supreme Court"]], "panels": [["👁️", "Prisoners", "We were blinded in custody. In court, nobody told us we could get a free lawyer."], ["👨‍⚖️", "Magistrate", "They did not ask for a lawyer."], ["⚖️", "Supreme Court", "The poor do not know to ask. The **Magistrate must tell them** — from the first production."]], "story": ["Undertrial prisoners in Bhagalpur, Bihar, had been **blinded** while in police custody. When their case reached the Supreme Court, it found that they had not been given legal representation when produced before the Magistrates.", "The Court held that the State's duty to provide **free legal aid** starts when the accused is **first produced before the Magistrate** and continues at every remand; the Magistrate must **inform** the accused of this right. The State cannot plead financial constraints."], "held": "Free legal aid is a **constitutional right** of an indigent accused from the stage of **first production**; Magistrates must inform the accused of it.", "link": "**Mohd. Ajmal Amir Kasab v. State of Maharashtra (2012)** repeated it: the right to legal aid arises when the accused is first produced before the Magistrate, who must tell him of it; failure does not by itself vitiate the trial unless it caused **material prejudice**, but the Magistrate is liable to **departmental action**."}, {"t": "tiles", "title": "Correctional methods — from punishment to reform", "items": [["🔓", "Probation", "release of an offender on good conduct instead of prison — Probation of Offenders Act 1958; [[s.401]] BNSS"], ["🚪", "Parole", "temporary release of a convict for a specific reason (illness, family event) — does **not** count towards the sentence"], ["🌿", "Furlough", "periodic release as a matter of good conduct, to keep family ties — not tied to a specific reason"], ["🏕️", "Open prisons", "minimal security; prisoners work and live with families nearby"], ["🧹", "Community service", "new punishment for petty offences under BNS s.4(f); BNSS s.23"], ["📚", "Education & work", "vocational training, wages, remission for good conduct"]]}, {"t": "vs", "title": "Parole vs furlough (Asfaq v. State of Rajasthan, 2017)", "a": ["Parole", ["for a **specific cause** — illness, death, marriage in family", "short-term; does **not** count as part of the sentence", "discretionary"]], "b": ["Furlough", ["**no specific reason** needed — a break after a period of good conduct", "counts as **part of sentence**", "not an absolute right — granted under prison rules (State of Gujarat v. Narayan, 2021)"]]}, {"t": "case", "name": "Sunil Batra v. Delhi Administration", "year": "1978 / 1980", "court": "Supreme Court of India", "cast": [["⛓️", "Sunil Batra (death-row prisoner, Tihar Jail)"], ["✉️", "A fellow prisoner's letter"], ["⚖️", "Supreme Court"]], "panels": [["⛓️", "Batra (1978)", "I am kept in solitary confinement just because I am sentenced to death — before my appeals end!"], ["⚖️", "Supreme Court", "Solitary confinement is not part of the sentence. Prisoners keep their fundamental rights."], ["✉️", "Letter (1980)", "A warder pushed a rod into a prisoner to extort money…"], ["⚖️", "Supreme Court", "We treat this letter as a writ petition. Prison walls do not keep out the Constitution."]], "story": ["In 1978, Sunil Batra, a death-row convict, challenged his **solitary confinement**; the Court held that such confinement before the sentence becomes final is not permitted by the law, and, reaffirming *D.B.M. Patnaik* (1974), that ==convicts are not, by mere reason of the conviction, denuded of all the fundamental rights==.", "In 1980, a letter from Batra about the torture of a fellow prisoner by a warder was treated as a **habeas corpus petition**. The Court laid down guidelines for prison administration, prisoners' grievance redressal and visits by judicial officers."], "held": "Prisoners retain fundamental rights (Arts. 14, 19, 21) consistent with incarceration; courts can intervene against **prison torture**.", "link": "Correctional approach — later **Rama Murthy v. State of Karnataka (1997)** listed **nine major problems** of prisons (overcrowding, delay in trial, torture, health, etc.) and the **Model Prisons Act 2023** (Ministry of Home Affairs) proposed to replace the Prisons Act 1894."}, {"t": "exam", "q": "Explain the right of an accused to legal aid and the correctional methods in prisons.", "lines": ["Constitutional base — Arts. 21, 22(1), 39A; Legal Services Authorities Act 1987.", "BNSS — ss.38, 340, 341.", "Cases — Hussainara Khatoon (1979); Khatri (1981); Kasab (2012).", "Correctional methods — probation (s.401, PO Act 1958), parole vs furlough (Asfaq), open prisons, community service.", "Prisoners' rights — Sunil Batra; Rama Murthy; Model Prisons Act 2023.", "Conclude — reformative theory."]}, {"t": "check", "items": [["From what stage does the right to free legal aid begin?", "From the first production before the Magistrate (Khatri, 1981; Kasab, 2012)."], ["Which BNSS section gives legal aid at State expense in trials and appeals?", "s.341 (old s.304 CrPC)."], ["Parole vs furlough — one difference.", "Parole needs a specific reason and does not count towards the sentence; furlough is a periodic break for good conduct and counts towards the sentence."]]}, {"t": "hook", "x": "**No lawyer, no fair trial.** Hussainara = speedy trial + legal aid. Khatri = from **first production**. Batra = prisoners keep rights."}], "asked": [["2013", "A", "Parole"], ["2013", "C", "Satish killed his wife by giving poison. He committed the crime for first time. Whether he can be released on probation?"], ["2014", "A", "Probation"], ["2014", "B", "What are the salient features of Probation of Offenders Act?"], ["2015", "A", "Probation"], ["2017", "A", "Parole"], ["2018", "A", "Legal aid to an indigent accused."], ["2018", "A", "The Defence Counsel."], ["2018", "B", "Write the salient features of the Probation of Offenders Act, 1958."], ["2019", "C", "X killed his wife by giving poison. He committed the crime for first time. Can be released on probation?"], ["2020", "A", "Parole"]]}, {"id": "bnss10", "title": "Constitution and criminal procedure", "sub": "Arts. 20, 21, 22 · rights of the arrested · fair trial", "blocks": [{"t": "idea", "x": "The **Constitution** is the master key of criminal procedure. Every arrest, search, interrogation and trial must pass the test of **Arts. 20, 21 and 22**."}, {"t": "tale", "x": ["Every police action is tested against the **Constitution**. Let us walk with Arun, a young engineer, from the moment the police knock on his door.", "**The arrest.** In *Joginder Kumar* (1994), a young advocate was 'called for questioning' and then held for five days, his family not told where he was. The Supreme Court said the **power** to arrest is one thing; the **justification** is another — no arrest just because it is lawful. So Arun must be told the **grounds of arrest** (**Art. 22(1)**, **s.47**) and, if the offence is bailable, his right to **bail**. A relative or friend must be **informed** (**s.48**). The police must follow the **D.K. Basu** (1997) rules — visible **name tags**, an **arrest memo** signed by a witness and by Arun, a **medical examination**, and the arrest shown in the police **control room**. Most of these are now in **ss.36–37 and s.53**. A woman may not be arrested after sunset and before sunrise except in exceptional cases, by a woman officer, with a Magistrate's prior permission (**s.43(5)**).", "**The 24 hours.** Arun must be produced before the **nearest Magistrate within 24 hours**, excluding journey time (**Art. 22(2)**, **s.58**). Beyond that, only the Magistrate can order custody (**s.187**).", "**The questioning.** The police hand Arun a long list of questions. Must he answer? In *Nandini Satpathy* (1978), a former Chief Minister of Odisha refused to answer written police questions in an assets case. The Court held that **Art. 20(3)** — no person accused shall be **compelled to be a witness against himself** — reaches the **police station**, not just the courtroom. Arun may stay **silent** on incriminating questions (**s.180(2)**) and may meet a lawyer **during** (not throughout) interrogation (**s.38**). Can he be forced into a **narco-analysis** or **lie-detector** test? *Selvi* (2010) says ==no== — that violates Arts. 20(3) and 21.", "**The trial.** All of this flows from *Maneka Gandhi* (1978), where a passport was impounded without a hearing. The Court held that 'procedure established by law' under **Art. 21** must be ==fair, just and reasonable==, not arbitrary. So Arun is entitled to a **speedy, fair trial** with a lawyer. And if he is tried and **acquitted** or **convicted**, he cannot be tried again for the **same offence** (**s.337**, autrefois acquit / convict). **Art. 20(2)** gives a narrower protection — it applies only where he was **prosecuted and punished**. Finally, **Art. 20(1)**: he cannot be punished under a law made **after** the act, or given a heavier punishment than the law allowed when he acted."]}, {"t": "table", "title": "Constitutional guarantees and their BNSS partners", "head": ["Article", "Guarantee", "BNSS partner"], "rows": [["20(1)", "no **ex post facto** criminal law; no heavier punishment than at the time of offence", "—"], ["20(2)", "no person **prosecuted and punished twice** for the same offence (double jeopardy)", "**s.337** — autrefois acquit / convict"], ["20(3)", "no person accused **compelled to be a witness against himself**", "s.180 (right to stay silent on self-incriminating questions); s.183 (voluntary confessions)"], ["21", "life and personal liberty — only by **fair, just and reasonable** procedure", "whole Code; speedy trial; legal aid; bail"], ["22(1)", "told **grounds of arrest**; right to **consult a lawyer**", "s.47 (grounds & right to bail); s.38 (lawyer during interrogation)"], ["22(2)", "produced before the **nearest Magistrate within 24 hours** (excluding journey time)", "s.58 · s.187"], ["39A", "free legal aid", "s.341"], ["50", "separation of judiciary from executive", "s.6 — Judicial vs Executive Magistrates"]]}, {"t": "tiles", "title": "Rights of an arrested person — asked repeatedly", "items": [["📋", "Grounds of arrest", "told the full particulars of the offence [[s.47]]"], ["💰", "Right to bail", "told he may be released on bail if bailable [[s.47(2)]]"], ["📞", "Inform a friend", "a relative or friend informed of arrest and place of detention [[s.48]]"], ["🧑‍⚖️", "Meet a lawyer", "during interrogation, not throughout [[s.38]]"], ["⏱️", "24 hours", "produced before a Magistrate [[s.58]]"], ["🩺", "Medical exam", "examination by a medical officer [[s.53]]"], ["🚺", "Women", "arrest after sunset and before sunrise only in exceptional cases, by a woman officer, with Magistrate's prior permission [[s.43(5)]]"], ["🆓", "Free legal aid", "Art. 39A; s.341"]]}, {"t": "case", "name": "Maneka Gandhi v. Union of India", "year": "1978", "court": "Supreme Court of India (seven judges)", "cast": [["👩", "Maneka Gandhi (journalist)"], ["🛂", "Passport authority"], ["⚖️", "Supreme Court"]], "panels": [["🛂", "Govt.", "Surrender your passport — 'in public interest'. No reasons will be given."], ["👩", "Maneka", "I was not even heard. Is any procedure enough to take my liberty?"], ["⚖️", "Supreme Court", "'Procedure established by law' must be **fair, just and reasonable** — not arbitrary."]], "story": ["Maneka Gandhi's passport was impounded under the Passports Act 'in public interest', without a hearing and without reasons. She challenged it under Arts. 14, 19 and 21.", "The Court overruled the narrow approach of *A.K. Gopalan*: Arts. 14, 19 and 21 are **interconnected**, and the 'procedure' under Art. 21 must be **right, just and fair**, not arbitrary, fanciful or oppressive — it must include natural justice."], "held": "Any law depriving personal liberty must prescribe a **fair, just and reasonable** procedure.", "link": "Every criminal-procedure right — legal aid, speedy trial, bail, arrest safeguards — flows from this reading of **Art. 21**."}, {"t": "case", "name": "Nandini Satpathy v. P.L. Dani", "year": "1978", "court": "Supreme Court of India (Krishna Iyer J.)", "cast": [["👩", "Nandini Satpathy (former Chief Minister of Odisha)"], ["👮", "Police officer"], ["⚖️", "Supreme Court"]], "panels": [["👮", "Police", "Answer these written questions about your assets — or be prosecuted for refusing!"], ["👩", "Nandini", "Some answers may incriminate me. I will stay silent on those."], ["⚖️", "Supreme Court", "Article 20(3) reaches **police interrogation** too. She may refuse incriminating answers."]], "story": ["In a disproportionate-assets investigation, the police gave Nandini Satpathy a long list of questions under **s.161 CrPC** (now **s.180 BNSS**). She refused to answer, and was prosecuted for refusing.", "The Court held that the protection of **Art. 20(3)** is not limited to the courtroom — it extends to the **police station** and to any person **accused** (including a suspect in an FIR). A person may refuse to answer questions whose answers would tend to incriminate him. The Court also said the accused should be allowed a lawyer during interrogation where possible."], "held": "The **right to silence** against self-incrimination applies at the stage of **police interrogation**.", "link": "BNSS **s.38** (lawyer during interrogation) and **s.180(2)** (need not answer incriminating questions) carry this forward."}, {"t": "case", "name": "D.K. Basu v. State of West Bengal", "year": "1997", "court": "Supreme Court of India", "cast": [["✉️", "D.K. Basu (Executive Chairman, Legal Aid Services, West Bengal)"], ["👮", "Police"], ["⚖️", "Supreme Court"]], "panels": [["✉️", "Letter", "Custodial deaths are being reported in the newspapers again and again. Please act."], ["⚖️", "Supreme Court", "Treated as a writ petition. Here are **eleven requirements** for every arrest."], ["👮", "Police", "Name tags, arrest memo, witness, inform a relative…"], ["⚖️", "Supreme Court", "Break them — and face departmental action and **contempt**."]], "story": ["D.K. Basu wrote to the Chief Justice of India about reports of **deaths in police custody**. The letter was treated as a PIL.", "The Court laid down **11 requirements**: police to wear **visible name tags**; prepare an **arrest memo** attested by a witness and countersigned by the arrestee; inform a **relative or friend**; tell the arrestee of this right; diary entry; **medical examination** every 48 hours; copies of documents to the Magistrate; lawyer during interrogation (not throughout); a **police control room** display of arrests, etc."], "held": "Custodial torture violates **Art. 21**; the 11 guidelines are binding, and the State is liable to pay **compensation**.", "link": "Most of these are now in the Code itself — **s.36** (arrest memo, name tags), **s.48** (inform relative), **s.37** (designated police officer & control room)."}, {"t": "case", "name": "Joginder Kumar v. State of U.P.", "year": "1994", "court": "Supreme Court of India", "cast": [["🧑‍💼", "Joginder Kumar (a young advocate)"], ["👮", "SSP, Ghaziabad"], ["⚖️", "Supreme Court"]], "panels": [["👮", "Police", "Come to the office for some questioning."], ["🧑‍💼", "Joginder", "Five days later — still detained, my family not told where I am."], ["⚖️", "Supreme Court", "The **power** to arrest is one thing; the **justification** is another."]], "story": ["A young advocate was called to a police office and then kept in detention for five days without his family being told where he was or why.", "The Court held that no arrest should be made **only because it is lawful** to do so; there must be a **reasonable justification** — the police must be satisfied that the complaint is genuine and that arrest is necessary. An arrested person has the right to have **someone informed** of the arrest, and must be told of this right."], "held": "Arrest needs **justification**, not merely power; the right to inform a friend/relative is part of Arts. 21 and 22.", "link": "Seed of **s.35** (arrest only when necessary; notice instead of arrest) and **s.48** (inform relative)."}, {"t": "note", "x": "**Selvi v. State of Karnataka (2010)**: **narco-analysis, polygraph and brain-mapping** without consent violate **Arts. 20(3) and 21**. With consent, results are not admissible by themselves, but information discovered as a result may be used."}, {"t": "exam", "q": "Explain the constitutional safeguards available to an accused/arrested person.", "lines": ["Introduction — Art. 21 after Maneka Gandhi: fair, just, reasonable procedure.", "Art. 20(1), (2), (3) — with s.337, s.180; Nandini Satpathy; Selvi.", "Art. 22(1), (2) — grounds, lawyer, 24 hours (ss.47, 38, 58).", "Rights of arrested persons — ss.35–38, 43(5), 47, 48, 53; D.K. Basu; Joginder Kumar.", "Legal aid and speedy trial — Art. 39A; Hussainara.", "Conclude."]}, {"t": "check", "items": [["What is autrefois acquit?", "A person once tried and acquitted (or convicted) by a competent court cannot be tried again for the same offence — s.337 BNSS; Art. 20(2) applies only where the person was both prosecuted **and punished** (autrefois convict); s.337 is wider and also bars retrial after acquittal."], ["Within what time must an arrested person be produced before a Magistrate?", "Within 24 hours, excluding journey time — Art. 22(2), s.58 BNSS."], ["Can the police force a suspect to undergo narco-analysis?", "No — Selvi (2010): it violates Arts. 20(3) and 21."]]}, {"t": "hook", "x": "**20 = no retro, no double, no self-incrimination. 21 = fair procedure. 22 = grounds, lawyer, 24 hours.** Cases: **Maneka · Nandini · D.K. Basu · Joginder · Selvi**."}], "asked": [["2013", "A", "Rights of Arrested person"], ["2013", "B", "Define arrest. How a person is arrested in non-cognizable offence?"], ["2014", "A", "Fair trial"], ["2014", "B", "Explain the constitutional validity of search and seizure."], ["2016", "A", "Fair trial"], ["2017", "A", "Autrofois convict"], ["2017", "A", "Rights of accused"], ["2017", "B", "Elucidate the constitutional validity of search and seizure."], ["2018", "A", "Presumption of innocence."], ["2018", "B", "Explain the concept of 'fair Trial' and enumerate the principle features of fair trial."], ["2018", "B", "What are the rights of arrested persons under the Code of Criminal Procedure?"], ["2018", "C", "'A' was prosecuted for committing theft and acquitted by the court. Again he is prosecuted for the same offence on the ground that some new evidence has been discovered later. Is it legal? Examine."], ["2019", "C", "A is charged before the session court and convicted of the culpable homicide of B. A again was tried on the same facts for the murder of B. Justify."], ["2020", "A", "Rights of arrested person"]]}], "papers": ["2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020"]}, {"id": "banking", "short": "Banking", "name": "Banking Law — Unit I", "course": "LL.B. (3 YDC) · Semester V · Banking Law including Negotiable Instruments", "intro": "Unit I of Banking Law — **history**, the **Banking Regulation Act**, what makes a **bank**, the **kinds of banks** and **IT in banking** — with the landmark cases and real rescues told as stories.", "chapters": [{"id": "bank1", "title": "History and evolution of banking law in India", "sub": "From agency houses to UPI · the Banking Regulation Act, 1949", "blocks": [{"t": "idea", "x": "Indian banking grew from **moneylenders and agency houses**, through **Presidency banks** and **nationalisation**, to **digital banking**. Banking **law** grew each time a crisis showed a gap."}, {"t": "tale", "x": ["Long before any bank building, an Indian village had its **sahukar** or **shroff**. Farmers borrowed from him at sowing time; traders sent money across the country using **hundis** — written orders to pay, very much like today's bills of exchange. These **indigenous bankers** were efficient but unregulated, and interest was often crushing.", "Modern, European-style banking arrived with the **East India Company's** trade. The **Bank of Hindustan** (1770, Calcutta) was among the first; it failed in the 1830s. Then came the three **Presidency Banks** — **Bank of Bengal** (1806, begun as the Bank of Calcutta), **Bank of Bombay** (1840) and **Bank of Madras** (1843) — which merged in **1921** into the **Imperial Bank of India**. Meanwhile the **Swadeshi** spirit produced banks run with Indian capital and management, like **Punjab National Bank** (1894). But many small banks also **failed**, taking ordinary people's savings with them. The lesson was clear: banks need a **regulator** and a **rule-book**.", "The regulator came first — the **Reserve Bank of India**, which began work in **1935** (RBI Act 1934) and was nationalised on **1 January 1949**. The rule-book followed: the **Banking Companies Act, 1949**, in force from **16 March 1949**, renamed the ==Banking Regulation Act== from **1 March 1966** when it was extended to **co-operative banks**. In **1955** the Imperial Bank became the **State Bank of India**.", "Then came the political turning point. On **19 July 1969**, the Government took over **14 banks** with deposits of **₹50 crore or more**. A shareholder and director, **R.C. Cooper**, challenged it. An eleven-judge bench struck the Act down (10:1): it **discriminated** by barring only those banks from future banking, and the **compensation** was not based on relevant principles. Parliament re-enacted the nationalisation in **1970**, and the **25th Amendment (1971)** replaced 'compensation' with '**amount**'. In **1980**, **6 more** banks were nationalised. Nationalisation took banks to villages and to **priority sectors** like agriculture and small industry — but also brought inefficiency and bad loans.", "Reforms followed the **Narasimham Committee** (1991): **new private banks** (1993–94), **SARFAESI** (2002) for recovery, and later **s.35AA** (2017) letting the RBI push banks to start **insolvency** cases. After the **PMC Bank** crisis (2019), the **2020 amendment** brought co-operative banks under stronger RBI control. The **Banking Laws (Amendment) Act, 2025** allowed up to **four nominees** for deposits. And through **UPI** (2016), banking moved from the counter to the phone."]}, {"t": "timeline", "title": "Milestones", "items": [["Ancient & medieval", "**Indigenous bankers** — shroffs, sahukars, chettiars; **hundis** as bills of exchange."], ["1770", "**Bank of Hindustan**, Calcutta (set up by Alexander & Co.) — among the first European-style banks; failed in the 1830s."], ["1806 · 1840 · 1843", "Three **Presidency Banks** — Bank of Bengal (begun as Bank of Calcutta), Bank of Bombay, Bank of Madras."], ["1865 · 1894", "Allahabad Bank (founded by Europeans); **Punjab National Bank** — the first bank run with Indian capital and management (Swadeshi spirit)."], ["1921", "Presidency banks merge into the **Imperial Bank of India**."], ["1935", "**Reserve Bank of India** begins (RBI Act 1934); nationalised on **1 January 1949**."], ["1949", "**Banking Companies Act, 1949** — in force **16 March 1949**; renamed **Banking Regulation Act** from **1 March 1966**, when it was extended to co-operative banks."], ["1955", "Imperial Bank becomes the **State Bank of India** (1 July 1955)."], ["1969 · 1980", "**Nationalisation** — 14 banks (19 July 1969), 6 more (15 April 1980)."], ["1991 onwards", "**Narasimham Committee** reforms; new private banks (1993–94); SARFAESI Act 2002."], ["2016–2025", "UPI (2016); IBC route for bad loans via **s.35AA** (2017); co-operative banks brought under fuller RBI control (2020); **Banking Laws (Amendment) Act 2025**."]]}, {"t": "case", "name": "Rustom Cavasjee Cooper v. Union of India (Bank Nationalisation case)", "year": "1970", "court": "Supreme Court of India (eleven judges, 10:1)", "cast": [["🧑‍💼", "R.C. Cooper (shareholder and director of banks)"], ["🏛️", "Union of India"], ["⚖️", "Supreme Court"]], "panels": [["🏛️", "Union", "By ordinance and then an Act, we take over 14 major banks — 19 July 1969."], ["🧑‍💼", "Cooper", "These 14 alone are barred from banking ever again — others are not! And the compensation ignores real value."], ["⚖️", "Supreme Court", "Hostile discrimination and compensation on irrelevant principles. The Act is void."], ["🏛️", "Parliament", "We re-enact it in 1970 — and amend the Constitution in 1971 to say 'amount', not 'compensation'."]], "story": ["On 19 July 1969 the Government took over **14 banks** with deposits of ₹50 crore or more, first by **ordinance** and then by the **Banking Companies (Acquisition and Transfer of Undertakings) Act, 1969**. R.C. Cooper, a shareholder, challenged it.", "The Court held that a **shareholder could maintain** the petition when the action affected his rights. The Act was struck down because (1) it **prohibited** the named banks from carrying on banking in future while other banks (including foreign banks) could — **hostile discrimination** under Art. 14; and (2) the compensation was not based on **relevant principles** as Art. 31(2) then required. The Court also rejected the narrow *A.K. Gopalan* approach: the **effect** of a law on fundamental rights matters, not just its object."], "held": "The 1969 Act was **void**. Parliament re-nationalised the banks through the **1970 Act**, and the **25th Amendment (1971)** replaced 'compensation' with '**amount**' in Art. 31(2).", "link": "The **nationalisation** chapter of banking history — and a leading constitutional case. Use it for 'effects of nationalisation' answers: rural branches, priority-sector lending, mass banking."}, {"t": "tiles", "title": "Effects of nationalisation — asked in 2013", "items": [["🏘️", "Branch expansion", "lead bank scheme; rural and semi-urban branches"], ["🌾", "Priority sector", "credit to agriculture, small industry, weaker sections"], ["🔒", "Public confidence", "deposits backed by the State"], ["⚠️", "Downsides", "political interference, inefficiency, NPAs — leading to 1990s reforms"]]}, {"t": "exam", "q": "Trace the history of banking in India and the evolution of the Banking Regulation Act.", "lines": ["Indigenous banking — shroffs, hundis.", "Colonial phase — Bank of Hindustan, Presidency banks, Imperial Bank, Swadeshi banks; failures.", "Regulation — RBI 1935/1949; BC Act 1949 → BR Act 1966; SBI 1955.", "Nationalisation — 1969, 1980; R.C. Cooper (1970); 25th Amendment.", "Reforms — Narasimham, private banks, SARFAESI, s.35AA, 2020 and 2025 amendments; digital.", "Importance today. Conclude."]}, {"t": "check", "items": [["When did the Banking Companies Act come into force and when was it renamed?", "16 March 1949; renamed Banking Regulation Act from 1 March 1966."], ["How many banks were nationalised in 1969 and 1980?", "14 in 1969; 6 in 1980."], ["Why was the 1969 nationalisation Act struck down?", "Hostile discrimination (Art. 14) and compensation on irrelevant principles (Art. 31(2)) — R.C. Cooper, 1970."]]}, {"t": "hook", "x": "**1770 · 1921 · 1935 · 1949 · 1955 · 1969 · 1980 · 1991 · 2016.** 'Hindustan → Imperial → RBI → BR Act → SBI → Nationalise ×2 → Reform → UPI.'"}], "asked": [["2013", "B", "Evaluate the effects of Nationalization of Banks of the Society."], ["2019", "B", "Trace the history of banking system in India and its importance in modern times."]]}, {"id": "bank2", "title": "Salient features of the Banking Regulation Act, 1949", "sub": "Licensing · capital · reserves · RBI's control · crisis powers", "blocks": [{"t": "idea", "x": "The **BR Act** is the rule-book that decides **who may be a bank**, **what it may do**, and **how the RBI watches over it** — from birth (licence) to rescue (moratorium, amalgamation)."}, {"t": "tale", "x": ["Suppose a group of friends wants to start 'Sunrise Bank Ltd.'. The **Banking Regulation Act, 1949** will follow this bank through its whole life — from birth to rescue — like a strict but caring guardian.", "**Birth.** Sunrise cannot open its doors without a ==licence from the RBI== (**s.22**). It must have the **minimum capital** (**s.11**), follow rules on **capital and voting rights** (**s.12**), and use the word 'bank', 'banker' or 'banking' in its name — words that, subject to narrow exceptions, no other company may use (**s.7**). Its board must have a majority of directors with **special knowledge** (accountancy, agriculture, banking, law, etc.) (**s.10A**).", "**Daily life.** Sunrise may do only the businesses listed in **s.6** — lending, bills, guarantees, agency work and the like — and **nothing else**. It ==cannot trade in goods== (**s.8**): no buying and selling rice or cloth, except while realising a security. If it gets land from a defaulting borrower, it must sell it within **7 years** (**s.9**). Before paying dividends it must move at least **20% of profits** to a **reserve fund** (**s.17**). It must keep a **cash reserve** (s.18 for non-scheduled banks; scheduled banks keep CRR under s.42 of the RBI Act) and hold **liquid assets** — cash, gold, approved securities — the **SLR** (**s.24**, ceiling 40%). It needs RBI permission to open or shift **branches** (**s.23**), and faces limits on loans to its own **directors** (**s.20**).", "**Watch.** Sunrise files **returns** (**s.27**) and audited **balance sheets** (**ss.29–31**). The RBI can **inspect** it (**s.35**) and issue binding **directions** in the public interest or to protect depositors (**s.35A**).", "**Rescue.** If Sunrise gets into trouble, the RBI can **remove** managers (**s.36AA**), **supersede the board** (**s.36ACA**), and ask the Central Government for a ==moratorium== while it prepares a scheme of **reconstruction or amalgamation** (**s.45**). This is exactly what happened to **Yes Bank** in March 2020 (board superseded, withdrawals capped at ₹50,000, SBI-led reconstruction, moratorium lifted within two weeks) and **Lakshmi Vilas Bank** in November 2020 (merged with **DBS Bank India**). For **co-operative banks**, **s.56** applies the Act with modifications — strengthened in **2020** after the **PMC Bank** crisis."]}, {"t": "table", "title": "The sections you must quote", "head": ["Section", "What it says"], "rows": [["[[s.5(b)]]", "**Banking** — accepting deposits from the public for lending or investment, repayable on demand or otherwise, withdrawable by cheque, draft, order or otherwise."], ["[[s.5(c)]]", "**Banking company** — any company which transacts the business of banking in India."], ["[[s.6]]", "**Forms of business** a bank may carry on (lending, bills, guarantees, agency, safe deposit…); no other business [[s.6(2)]]."], ["[[s.7]]", "Use of the words **'bank', 'banker', 'banking'** — only by banking companies (narrow exceptions); a banking company must use at least one in its name."], ["[[s.8]]", "**No trading** — no buying, selling or bartering of goods, except in realising security."], ["[[s.9]]", "**Non-banking assets** — immovable property acquired in satisfaction of claims to be disposed of within **7 years** (extendable by RBI)."], ["[[s.10A]]", "Board composition — majority of directors with **special knowledge** (accountancy, agriculture, banking, law, etc.)."], ["[[s.11]] · [[s.12]]", "**Minimum capital** and reserves; regulation of capital and **voting rights**."], ["[[s.17]]", "**Reserve fund** — at least **20% of profit** transferred before declaring dividend."], ["[[s.18]] · [[s.24]]", "**Cash reserve** (s.18 — non-scheduled banks only; scheduled banks keep CRR under s.42 RBI Act) and **liquid assets (SLR)** [[s.24]] — cash, gold, unencumbered approved securities; SLR ceiling 40%."], ["[[s.20]]", "Restrictions on loans to **directors** and their concerns."], ["[[s.21]] · [[s.35A]]", "RBI may control **advances** and issue binding **directions** in public interest / depositors' interest."], ["[[s.22]]", "**Licence** from RBI is compulsory to carry on banking in India."], ["[[s.23]]", "RBI permission to open **new branches** or shift existing ones."], ["[[s.29]] · [[s.30]] · [[s.35]]", "Accounts and balance sheet; **audit**; **inspection** by RBI."], ["[[s.35AA]]", "(2017) Central Government may authorise RBI to direct banks to start **insolvency proceedings** (IBC) against defaulters."], ["[[s.36AA]] · [[s.36ACA]]", "RBI may **remove** managerial persons and **supersede the board** of a banking company."], ["[[s.45]]", "RBI may seek a **moratorium** from the Central Government and prepare a scheme of **reconstruction or amalgamation**."], ["[[s.45ZA]]", "**Nomination** for deposits — the 2025 amendment allows up to **four nominees**."], ["[[s.56]]", "Application of the Act to **co-operative banks** with modifications (strengthened in 2020)."]]}, {"t": "tree", "title": "The life-cycle control of a bank", "root": "RBI under the BR Act", "branches": [["Birth", ["licence [[s.22]]", "capital [[s.11]]", "name [[s.7]]"]], ["Daily life", ["business allowed [[s.6]] · no trading [[s.8]]", "CRR / SLR [[s.18]], [[s.24]]", "reserve fund [[s.17]]", "branches [[s.23]]"]], ["Watch", ["returns [[s.27]] · accounts & audit [[s.29]]–[[s.31]]", "inspection [[s.35]]", "directions [[s.35A]]"]], ["Rescue / exit", ["remove managers [[s.36AA]]", "supersede board [[s.36ACA]]", "moratorium & amalgamation [[s.45]]", "winding up (Part III)"]]]}, {"t": "case", "name": "Yes Bank and Lakshmi Vilas Bank — two rescues", "year": "2020", "court": "RBI and Central Government under s.45", "cast": [["🏦", "Yes Bank (private bank in distress)"], ["🏦", "Lakshmi Vilas Bank"], ["🏛️", "RBI"], ["💼", "Depositors"]], "panels": [["🏛️", "RBI (5 March 2020)", "Yes Bank's board is superseded. Moratorium — withdrawals capped at ₹50,000."], ["💼", "Depositors", "Will we lose our money?"], ["🏛️", "Govt. & RBI", "Reconstruction scheme — SBI and other banks invest. Moratorium lifted on 18 March 2020."], ["🏛️", "RBI (Nov 2020)", "Lakshmi Vilas Bank: moratorium, then amalgamated with DBS Bank India."]], "story": ["**Yes Bank (March 2020)**: after its financial position worsened, the RBI **superseded its board** and an **administrator** was appointed; the Central Government imposed a **moratorium under s.45** with a withdrawal limit. A **reconstruction scheme** was notified in which **SBI** took a large stake; the moratorium ended within about two weeks.", "**Lakshmi Vilas Bank (November 2020)**: a moratorium under **s.45** was followed by **amalgamation** with **DBS Bank India Ltd.**, a subsidiary of a foreign bank — depositors' money was protected."], "held": "The BR Act's **crisis powers** — supersession of the board, moratorium and compulsory reconstruction or amalgamation under **s.45** — protect depositors without a disorderly collapse.", "link": "When writing 'salient features', add **s.45** with a real example — examiners like it."}, {"t": "note", "x": "**PMC Bank crisis (2019)**: losses hidden through loans to one real-estate group led the RBI to issue directions (s.35A read with **s.56**) restricting withdrawals. It pushed the **2020 amendment** bringing co-operative banks under stronger RBI control; PMC was later taken over by **Unity Small Finance Bank** (2022)."}, {"t": "exam", "q": "Discuss the salient features of the Banking Regulation Act, 1949.", "lines": ["Introduction — history (1949, 1966), object: protect depositors, regulate banks.", "Definitions — s.5(b), 5(c).", "Birth — s.22, 11, 12, 7, 10A.", "Business — s.6, 8, 9, 17, 18/24, 20, 23.", "RBI control — ss.27, 29–31, 35, 35A, 35AA, 36AA, 36ACA, 45; co-operative banks s.56.", "Examples — Yes Bank, Lakshmi Vilas, PMC. Conclude."]}, {"t": "check", "items": [["Can a company carry on banking without an RBI licence?", "No — s.22."], ["How much profit must be moved to the reserve fund?", "At least 20%, before any dividend — s.17."], ["Can a bank run a cloth business?", "No — s.8 prohibits trading in goods except in realising security."]]}, {"t": "hook", "x": "**'Bank' licence: s.22 · Name: s.7 · No trade: s.8 · 20% reserve: s.17 · SLR: s.24 · Directions: s.35A · Rescue: s.45 · Co-ops: s.56.**"}], "asked": [["2012", "B", "Explain the salient features of Banking Regulation Act."], ["2013", "B", "Explain salient features of Banking Companies Regulation Act."], ["2014", "B", "Explain the salient features of the Banking Regulation Act."], ["2017", "B", "Explain the concept of banking and discuss the objectives, salient features of the Banking Regulation Act."], ["2018", "B", "Discuss the salient features of the Banking Regulation Act."], ["2020", "B", "Discuss the various provisions of Banking Regulation Act."]]}, {"id": "bank3", "title": "Concept of banking business — who is a banker?", "sub": "Deposits + lending + cheques · statutory and judicial tests", "blocks": [{"t": "idea", "x": "Not everyone who lends money is a **bank**. The hallmark of banking is **accepting public deposits, repayable on demand, and withdrawable by cheque**, and using them to **lend or invest**."}, {"t": "tale", "x": ["Mohan, a rich trader, lends money to his relatives. Is he a **banker**? No. Shanti's tailoring company takes deposits from the public only to run its own tailoring business. Is it a **bank**? Also no. Then what makes a bank a bank?", "The **Banking Regulation Act** answers in **s.5(b)**: banking is ==accepting, for the purpose of lending or investment, deposits of money from the public, repayable on demand or otherwise, and withdrawable by cheque, draft, order or otherwise==. Break it into five pieces: (1) **accepting deposits**, (2) **from the public**, (3) **for lending or investment**, (4) **repayable** on demand or after a time, (5) **withdrawable** by cheque, draft or order. Mohan fails (1) and (2). A **banking company** is any company that transacts this business in India (**s.5(c)**) — but its **Explanation** excludes a manufacturing or trading company that accepts deposits **only to finance its own business**, like Shanti's.", "Courts and writers added practical tests. **Sir John Paget** said no one can be a banker who does not take **deposit accounts**, take **current accounts**, issue and pay **cheques**, and **collect cheques** for customers. In *United Dominions Trust v. Kirkwood* (1966), a finance house sued Kirkwood, a managing director who had **indorsed** his company's bills. He argued UDT was an unregistered **moneylender**, so it could not sue. **Lord Denning** listed the usual characteristics of banking — **collecting cheques** for customers, **paying cheques** drawn by them, and keeping **current accounts** — and added that where these are not clear, the firm's **reputation** amongst ordinary intelligent commercial men helps (here, bankers treated UDT as a bank). By a 2:1 majority (Harman L.J. dissenting), UDT was held to be a bank.", "An Australian judge, **Isaacs J.**, in *State Savings Bank of Victoria v. Permewan Wright* (1914), went to the root: the essence of banking is **collecting money by receiving deposits** and **using it by lending** again. Cheques and current accounts were, in his words, merely 'accidental and auxiliary'.", "Why does the definition matter? Because only a bank gets a **licence**, uses the word 'bank', and enjoys the protections of banking law. Companies that take deposits **without** being banks — like the residuary non-banking company in *Peerless v. RBI* (1992) — are regulated separately under **Chapter IIIB of the RBI Act**; there, the Supreme Court upheld RBI directions requiring such companies to invest deposits safely to **protect small depositors**."]}, {"t": "rule", "title": "The statutory definition", "cite": "s.5(b) BR Act", "x": "'**Banking**' means the **accepting**, for the purpose of **lending or investment**, of **deposits of money from the public**, **repayable on demand or otherwise**, and **withdrawable by cheque, draft, order or otherwise**.", "points": ["**Accepting deposits** — the starting point.", "**From the public** — not just friends or employees.", "**For lending or investment** — deposits taken to run one's own trade are not banking.", "**Repayable** on demand or after a fixed time.", "**Withdrawable** by cheque, draft, order or otherwise."], "exceptions": ["**Explanation to s.5(c)**: a company engaged in **manufacture or trade** which accepts deposits **only to finance its own business** is **not** a banking company.", "**NBFCs** may accept certain deposits under the RBI Act, but they **cannot issue cheques** drawn on themselves — they are not banks."]}, {"t": "tiles", "title": "Paget's four tests of a banker", "items": [["🏦", "Takes deposit accounts", ""], ["💳", "Takes current accounts", ""], ["🧾", "Issues and pays cheques", ""], ["📥", "Collects cheques", "crossed and uncrossed, for customers"]]}, {"t": "case", "name": "United Dominions Trust Ltd. v. Kirkwood", "year": "1966", "court": "Court of Appeal, England (Lord Denning M.R. and Diplock L.J.; Harman L.J. dissenting)", "cast": [["🏢", "United Dominions Trust (a finance house)"], ["🧑‍💼", "Kirkwood (managing director who indorsed the company's bills)"], ["⚖️", "Court of Appeal"]], "panels": [["🏢", "UDT", "Kirkwood indorsed the bills your company gave us. Pay up!"], ["🧑‍💼", "Kirkwood", "You are an unregistered moneylender — the loan is unenforceable!"], ["🏢", "UDT", "We are not moneylenders. We are **bankers**!"], ["⚖️", "Lord Denning", "Bankers usually: (1) collect cheques, (2) pay cheques, (3) keep current accounts. And reputation counts."]], "story": ["UDT lent money to a garage company; Kirkwood, its managing director, had indorsed bills of exchange given to UDT as security. When UDT sued, Kirkwood argued that UDT was an **unregistered moneylender**, so the loan could not be enforced. UDT replied that it was **'bona fide carrying on the business of banking'** and therefore exempt.", "Lord Denning said that the usual characteristics of banking are: (1) **accepting money from customers and collecting cheques** for them, placing the money to their credit; (2) **honouring cheques or orders** drawn on them by customers; and (3) **keeping current accounts** in which debits and credits are entered. Where these are not clearly present, the **reputation** of the firm among bankers can help decide."], "held": "UDT was held to be carrying on the business of banking — largely on the evidence of its **reputation** in the banking community.", "link": "Use **UDT v. Kirkwood** with **s.5(b)** in any 'define a bank / banking business' answer — statutory definition + judicial tests."}, {"t": "note", "x": "**Commissioners of the State Savings Bank of Victoria v. Permewan, Wright & Co. (1914, High Court of Australia)** — Isaacs J.: the essential characteristics of banking are the **collection of money by receiving deposits** repayable when and as agreed, and **using that money by lending it again**. Cheques, current accounts and similar methods are, in his words, merely 'accidental and auxiliary' — not essentials."}, {"t": "case", "name": "Peerless General Finance & Investment Co. v. Reserve Bank of India", "year": "1992", "court": "Supreme Court of India", "cast": [["🏢", "Peerless (a residuary non-banking company)"], ["🏛️", "RBI"], ["⚖️", "Supreme Court"]], "panels": [["🏢", "Peerless", "We collect small savings from lakhs of people. RBI cannot tell us how to invest!"], ["🏛️", "RBI", "You take public deposits. Depositors need protection — invest a safe portion in approved securities."], ["⚖️", "Supreme Court", "The RBI's directions are valid — protecting depositors is in public interest."]], "story": ["Peerless was a **residuary non-banking company (RNBC)** that collected deposits from small savers across the country. The RBI issued directions requiring such companies to invest a large share of deposits in **safe, approved securities**. Peerless challenged them.", "The Supreme Court upheld the RBI's power under **Chapter IIIB of the RBI Act** to regulate deposit-taking by non-banking companies in the interest of depositors and the monetary system."], "held": "RBI directions regulating **deposit acceptance** by non-banking companies are **valid**.", "link": "Shows the line between **banks** (BR Act) and **non-banks** that take deposits (RBI Act, Chapter IIIB) — both regulated, but differently."}, {"t": "exam", "q": "Define a bank. Explain the law relating to banking business.", "lines": ["Introduction — importance of banks.", "Statutory definition — s.5(b) (five elements), s.5(c) with Explanation; s.6 forms of business; s.7.", "Judicial and academic tests — Paget; UDT v. Kirkwood; Permewan Wright.", "Distinguish banks vs NBFCs — Peerless (1992).", "Importance in modern times. Conclude."]}, {"t": "check", "items": [["Name the five elements of 'banking' in s.5(b).", "Accepting deposits · from the public · for lending or investment · repayable on demand or otherwise · withdrawable by cheque, draft, order or otherwise."], ["A textile mill accepts deposits from the public to fund its mill. Is it a bank?", "No — Explanation to s.5(c): deposits only to finance its own business."], ["Lord Denning's three characteristics?", "Collect cheques for customers; pay cheques drawn by customers; keep current accounts (UDT v. Kirkwood)."]]}, {"t": "hook", "x": "**Banking = Deposit + Lend + Cheque.** s.5(b): **A-P-L-R-W** — Accept, Public, Lend, Repay, Withdraw."}], "asked": [["2016", "B", "Define a Bank. Discuss the law relating to Banking Business and its importance in modern times."], ["2017", "B", "Explain the concept of banking and discuss the objectives, salient features of the Banking Regulation Act."]]}, {"id": "bank4", "title": "Kinds of banking and classification of banks", "sub": "Central, commercial, co-operative, development, payment and small finance banks", "blocks": [{"t": "idea", "x": "Banks are like a **family**: the **RBI** is the parent; **commercial, co-operative, rural and specialised** banks are the children — each with its own job and its own rules."}, {"t": "tale", "x": ["Think of Indian banking as one big **family**. At the top sits the parent — the **Reserve Bank of India**. It issues currency, is **banker to the Government**, the **banker's bank** (keeping banks' reserves and lending to them), the **lender of last resort**, and the **regulator** of the whole family.", "The working children are the **commercial banks**. **Public sector banks** — SBI and the nationalised banks (**12** after the 2020 mergers, as of 2026) — are majority Government-owned. **Private banks** (old ones like Karur Vysya, new ones from the 1990s) and **foreign banks** follow. **Regional Rural Banks** (RRB Act 1976) serve farmers and rural people. Since 2015–17, two new 'differentiated' cousins have joined: **payment banks**, which accept small demand deposits (up to **₹2 lakh** per customer) and handle payments but ==cannot lend==, and **small finance banks**, which **lend** to small businesses and farmers and must give **60%** of their credit (ANBC) to the priority sector (75% until 2024-25).", "Then there are **co-operative banks** — owned by their members. Urban co-operative banks serve towns; in villages there is a three-tier structure — **State co-operative banks**, **district central co-operative banks**, and **primary agricultural credit societies** at the base (PACS are **not 'banks'** under the BR Act — s.3). Co-operative banks live under **dual control**: the RBI for **banking**, the State's Registrar of Co-operative Societies for **management** (the 2020 amendment shifted much management control to the RBI too). In *Pandurang Ganpati Chaugule* (2020), a borrower argued that co-operative banks, being a State subject, could not use the central **SARFAESI Act** against him. The Constitution Bench held that their **banking** activity falls under **Entry 45, List I** (Parliament's field), so they are 'banks' for SARFAESI.", "Specialist relatives finance particular sectors: **NABARD** (1982) for agriculture and rural development, **SIDBI** (1990) for small industries, **EXIM Bank** (1982) for exports, and **NHB** (1988) for housing finance.", "Banks are also grouped by **status**: a **scheduled bank** is one listed in the **Second Schedule of the RBI Act** (s.42(6)); others are **non-scheduled**. And by **function**: **retail** banking for individuals, **wholesale** for big companies, **mixed banking** (commercial banking plus industrial investment), **universal banking** (one group offering banking, insurance and investments), **unit vs branch** banking, and the old **indigenous bankers**. For every family member, the **DICGC** insures deposits up to ==₹5 lakh per depositor per bank=="]}, {"t": "tree", "title": "The Indian banking family", "root": "Banks in India", "branches": [["Central bank", ["**RBI** — issues currency, banker to Government, banker's bank, lender of last resort, regulator"]], ["Scheduled commercial banks", ["**public sector** — SBI and nationalised banks (12 PSBs after the 2020 mergers)", "**private sector** — old and new private banks", "**foreign banks** — branches or wholly owned subsidiaries", "**Regional Rural Banks** (RRB Act 1976)", "**small finance banks** · **payment banks** (in-principle approval 2015; operating from 2016–17)"]], ["Co-operative banks", ["**urban** co-operative banks", "**rural** — State co-operative banks, district central co-operative banks (PACS at the base are not 'banks' — s.3 BR Act)", "regulated by RBI (banking functions) under **s.56 BR Act**, and by co-operative societies laws (management)"]], ["Development / specialised institutions", ["**NABARD** (1982) — agriculture & rural development", "**SIDBI** (1990) — small industries", "**EXIM Bank** (1982) — exports", "**NHB** (1988) — housing finance"]]]}, {"t": "vs", "title": "Scheduled vs non-scheduled banks", "a": ["Scheduled", ["included in the **Second Schedule** of the RBI Act (s.42(6))", "paid-up capital and reserves above the prescribed level; affairs not harmful to depositors", "can borrow from RBI; keep CRR with RBI"]], "b": ["Non-scheduled", ["**not** in the Second Schedule", "keep cash reserve with themselves or in a current account with the RBI [[s.18 BR Act]]", "few in number today"]]}, {"t": "table", "title": "Differentiated banks (approved 2015)", "head": ["Point", "Payment bank", "Small finance bank"], "rows": [["Purpose", "payments and small savings for migrants, low-income households", "credit to small businesses, farmers, unorganised sector"], ["Deposits", "only demand deposits — up to **₹2 lakh** per customer", "all types of deposits"], ["Lending", "**cannot lend**", "can lend — **60%** of ANBC to priority sector (75% until FY 2024-25)"], ["Examples", "India Post Payments Bank, Airtel Payments Bank", "Equitas, Ujjivan, Jana"]]}, {"t": "tiles", "title": "Kinds of banking by function", "items": [["🏪", "Retail / branch banking", "deposits and loans for individuals through a branch network"], ["🏢", "Wholesale / corporate", "large loans to companies and governments"], ["🔀", "Mixed banking", "commercial banking + investment in industry (shares, long-term finance) — asked in 2017"], ["🧩", "Universal banking", "one group offers banking, insurance, mutual funds, investment banking"], ["👥", "Unit vs branch banking", "single office (unit) vs many branches under one bank"], ["📜", "Indi   $("#done").onclick = () => { let d = store.get(doneKey(S.id), []); d = d.includes(c.id) ? d.filter(x => x !== c.id) : d.concat(c.id); store.set(doneKey(S.id), d); chapter(i); };
  if (prev) $("#pv").onclick = () => { location.hash = S.id + "-" + i; };

}
function route() {
  const h = (location.hash || "").slice(1);
  const m = h.match(/^([a-z]+)(?:-(\d+))?$/);
  const id = m ? m[1] : store.get("sl-subj", SUBJ[0].id);
  setSubj(id); store.set("sl-subj", S.id);
  if (m && m[2]) chapter(+m[2] - 1); else home();
}
// text size and reading mode
let fs = store.get("sl-fs", 18);
const applyFs = () => { document.documentElement.style.setProperty("--fs", fs + "px"); store.set("sl-fs", fs); };
$("#fsm").onclick = () => { fs = Math.max(15, fs - 1); applyFs(); };
$("#fsp").onclick = () => { fs = Math.min(24, fs + 1); applyFs(); };
const MODES = ["auto", "day", "sepia", "night"], LBL = { auto: "Auto", day: "Day", sepia: "Sepia", night: "Night" };
let mode = store.get("sl-mode", "auto");
const applyMode = () => { if (mode === "auto") delete document.documentElement.dataset.read; else document.documentElement.dataset.read = mode; $("#mode").textContent = LBL[mode]; store.set("sl-mode", mode); };
$("#mode").onclick = () => { mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length]; applyMode(); };
applyFs(); applyMode();
window.addEventListener("hashchange", route); route();
</script>

er · Same parties · Same title · Competent court · Heard & finally decided.** 'Might and ought' = **constructive** RJ. Foreign judgment — **'J-M-L-N-F-B'** exceptions."}], "asked": [["2014", "B", "Discuss the meaning, principle, policy and effect of the doctrine of res judicata u/s 11 of C.P.C."], ["2015", "B", "Explain the doctrine of Res Judicata with suitable illustrations."], ["2017", "A", "Foreign Judgments"], ["2018", "A", "Doctrine of Sub Judice and Resjudicata."]]}, {"id": "cpc9", "title": "Place of suing — territorial jurisdiction (ss.15–21)", "sub": "Which court? · property suits · wrongs · contract suits · objections", "blocks": [{"t": "idea", "x": "Every suit must be filed in the **lowest competent court** at the **right place** — where the **property** is, where the **wrong** was done, or where the **defendant lives or the cause of action arose**."}, {"t": "tale", "x": ["After deciding **what** to claim, the plaintiff must decide **where** to file. Think of it as three filters. First, **s.15** — file in the court of the **lowest grade** competent to try it. A small money claim goes to the lowest competent court, not the High Court.", "Second, if the suit is about **immovable property** — recovery of land, partition, mortgage, any right in or compensation for wrong to it — **s.16** says file ==where the property is==. If Anil owns a flat in **Gurgaon**, a suit about the flat goes to Gurgaon, even if both parties live in Delhi. If the land spreads across two courts' areas, either court will do (**s.17**). There is one door in the **proviso to s.16**: where the relief can be obtained entirely through the defendant's **personal obedience** (for example, where the defendant holds the property and the plaintiff only wants an order the defendant can personally carry out, such as rendering accounts of rents he collected from it), the suit may also be filed where the defendant lives or works.", "*Harshad Chiman Lal Modi* (2005) shows the limit. A buyer sued DLF in **Delhi** for specific performance and **possession** of a Gurgaon plot, relying on a clause choosing Delhi courts. The Supreme Court said possession of land cannot be given by personal obedience alone, so s.16 applied — and ==parties cannot by agreement confer jurisdiction on a court that has none==.", "Third, for **wrongs** to a person or movable property (**s.19**) — like an assault — the plaintiff may choose: where the wrong was done, **or** where the defendant resides. For **all other suits** (**s.20**) — contracts, money claims — sue where the **defendant resides or carries on business**, or where the **cause of action arose wholly or in part**. A **company** is deemed to carry on business at its **principal office**, or, for a cause of action arising at a place where it has a **subordinate office**, **at that place** (Explanation). In *Patel Roadways* (1991), cardamom handed to the carrier's Bodinayakanur branch was destroyed; the consignor's suit in Tamil Nadu was valid, and a clause choosing **Bombay** (the principal office) could not oust it.", "Where two or more courts **already** have jurisdiction, parties may agree to choose one of them — *Swastik Gases* (2013) even read 'subject to Kolkata jurisdiction' as excluding the others. And any objection to the place of suing must be taken in the **first court at the earliest** — **s.21**; an appeal court will interfere only if there was a **failure of justice**, and **s.21A** bars a separate suit to set aside a decree on that ground alone."]}, {"t": "flow", "title": "Choosing the court — ask in this order", "steps": [["Pecuniary: lowest grade competent", "file in the court of the lowest grade that can try it [[s.15]]"], ["Immovable property suit?", "where the property is situated [[s.16]]; property in two courts' areas → either [[s.17]]"], ["Wrong to person or movables?", "where the wrong was done **or** where the defendant resides — plaintiff's choice [[s.19]]"], ["Any other suit", "where the defendant resides / carries on business / works for gain, **or** where the cause of action arises wholly or in part [[s.20]]"]]}, {"t": "rule", "title": "Key rules and limits", "cite": "ss.16–21", "points": ["**s.16 suits**: recovery of immovable property; partition; foreclosure, sale or redemption of a mortgage; determination of any right in immovable property; compensation for wrong to it; recovery of movables under distraint or attachment.", "**Proviso to s.16**: if the relief can be obtained entirely through the defendant's **personal obedience**, the suit may also be filed where the defendant resides or works.", "**Corporations** [[s.20 Expl.]]: deemed to carry on business at the **sole or principal office**, or — for a cause of action arising where it has a **subordinate office** — at that place.", "**Objections** to place of suing must be raised in the **first court at the earliest** (before issues are settled); an appeal court will interfere only if there has been a **failure of justice** [[s.21]]. A suit to set aside a decree on that objection alone is barred [[s.21A]]."], "exceptions": ["Parties **cannot confer** jurisdiction on a court that has none — consent does not cure lack of jurisdiction (Harshad Chiman Lal Modi).", "But where **two or more courts** have jurisdiction, parties may agree to sue in **one of them** (Swastik Gases; Patel Roadways)."]}, {"t": "case", "name": "Harshad Chiman Lal Modi v. DLF Universal Ltd.", "year": "2005", "court": "Supreme Court of India", "cast": [["🧑", "Harshad Modi (buyer)"], ["🏢", "DLF (developer)"], ["⚖️", "Supreme Court"]], "panels": [["🧑", "Buyer", "DLF agreed to sell me a plot in Gurgaon. I sue in Delhi for specific performance — our agreement says Delhi courts."], ["🏢", "DLF", "The plot is in Haryana. Section 16!"], ["⚖️", "Supreme Court", "A suit about land goes where the land is. Parties cannot give Delhi a jurisdiction it does not have."]], "story": ["Harshad Modi agreed to buy a plot in **Gurgaon (Haryana)** from DLF. The agreement said Delhi courts would have jurisdiction. He sued in the **Delhi High Court** for specific performance and possession.", "The relief involved the **land itself**, so the case fell under **s.16**: suits for determination of rights in immovable property must be filed where the property is. The proviso did not help — possession cannot be given just by the defendant's personal obedience. A clause cannot confer jurisdiction on a court that has none."], "held": "The Delhi court had **no jurisdiction**; the plaint had to be returned for presentation at the proper court (Gurgaon).", "link": "**s.16 + proviso** — and the rule that consent cannot create jurisdiction."}, {"t": "case", "name": "Patel Roadways Ltd. v. Prasad Trading Co.", "year": "1991", "court": "Supreme Court of India", "cast": [["🚚", "Patel Roadways (carrier; head office Bombay)"], ["📦", "Prasad Trading (consignor)"], ["⚖️", "Supreme Court"]], "panels": [["📦", "Consignor", "Our cardamom was destroyed in the carrier's custody. We sue at Periakulam, where its Bodinayakanur branch took the goods."], ["🚚", "Carrier", "Our consignment note says only Bombay courts!"], ["⚖️", "Supreme Court", "Where the cause arose at a branch, the company is deemed to do business there — and only there."]], "story": ["Prasad Trading handed cardamom to the carrier's **branch at Bodinayakanur** (Tamil Nadu) for delivery at Delhi; the goods were **destroyed by fire** in the carrier's Delhi godown. It sued at **Periakulam** (Tamil Nadu), where that branch was and where the cause of action arose in part. The carrier relied on a clause choosing Bombay courts, where its **principal office** was.", "Under the **Explanation to s.20**, where the cause of action arises at a place where the corporation has a **subordinate office**, it is deemed to carry on business **at that place** — not at its principal office. So the Bombay court had no jurisdiction for this cause, and a clause cannot confer jurisdiction."], "held": "The Tamil Nadu court had jurisdiction; the clause choosing Bombay could not take it away.", "link": "Read the **Explanation to s.20** with this story — principal office **or** branch where the cause arose."}, {"t": "note", "x": "**Swastik Gases v. Indian Oil Corporation (2013)**: a clause saying disputes are 'subject to the jurisdiction of courts at Kolkata' shows an intention to **exclude** other competent courts, even without words like 'only' or 'exclusive'."}, {"t": "exam", "q": "Explain the rules relating to place of suing under the CPC.", "lines": ["Introduction — kinds of jurisdiction; s.15 lowest grade.", "Immovable property — s.16 with proviso; s.17; s.18.", "Wrongs — s.19 (choice of plaintiff).", "Other suits — s.20 with Explanation for corporations.", "Agreements on jurisdiction — Harshad Chiman Lal Modi; Patel Roadways; Swastik Gases.", "Objections — s.21, s.21A. Conclude."]}, {"t": "check", "items": [["Where is a partition suit filed?", "Where the property is situated (s.16); if in different courts' areas, in any of them (s.17)."], ["A assaults B in Hyderabad and goes home to Pune — where can B sue for damages?", "Either Hyderabad (wrong done) or Pune (defendant resides) — plaintiff's choice, s.19."], ["Can parties by agreement confer jurisdiction on any court?", "No. They can only choose among courts which already have jurisdiction."]]}, {"t": "hook", "x": "**Land → where the land is. Injury → where it happened or where he lives. Everything else → where he lives or where it happened.** Object **early** (s.21)."}], "asked": [["2016", "A", "Territorial Jurisdiction"], ["2017", "A", "Pecuniary Jurisdiction"], ["2019", "A", "Pecuniary Jurisdiction"], ["2020", "A", "Place of suing"]]}, {"id": "cpc10", "title": "Transfer of suits (ss.22–25)", "sub": "Moving a case to another court — who can, and why", "blocks": [{"t": "idea", "x": "A case can be **moved** from one court to another when the **ends of justice** require — for convenience, fairness or to avoid conflicting decisions."}, {"t": "tale", "x": ["Sometimes a case is in the **right court** on paper but the **wrong court** in practice. Imagine Neha, living with her small child in Hyderabad, whose husband files a matrimonial case against her in Delhi. Every hearing means a two-day journey and expenses she cannot bear. Or two connected suits about the same property are running in two different towns and may produce conflicting decisions. The CPC allows a case to be **moved** — ==transferred== — when justice requires.", "There are **four** sections. **s.22**: where a suit **could have been filed in two or more courts** and the plaintiff chose one, the **defendant** may ask (at the **earliest opportunity**, after notice to the other side) for transfer to another of those courts. **s.23** tells him **which court** to apply to — the common appellate court, or the High Court. **s.24** is the general power: the **High Court or District Court** may, **on application or on its own**, at **any stage**, transfer or withdraw any suit, appeal or proceeding pending in a court **subordinate** to it.", "But a High Court can only move cases **within its own State**. To move Neha's case from **Delhi to Hyderabad**, only the **Supreme Court** can act — under **s.25** (substituted in 1976), if it is 'expedient for the **ends of justice**'.", "How does the Supreme Court decide? In *Sumita Singh v. Kumar Sanjay* (2001), it transferred a husband's matrimonial case to the wife's city, saying the **wife's convenience** must be looked at. But later, in *Anindita Das v. Srijit Das* (2006), it noticed that transfer petitions by wives had become routine; it **refused** the transfer and instead ordered the husband to pay the wife's **travel and stay expenses**. The lesson: transfer is **discretionary**. Courts weigh **convenience** of parties and witnesses, a **reasonable apprehension of bias** (real, not imaginary), and the need to try **connected cases** together — always asking what the ends of justice demand."]}, {"t": "table", "title": "Four transfer sections", "head": ["Section", "Who transfers", "When"], "rows": [["[[s.22]]", "court to which appeal lies, on the **defendant's** application", "suit could be filed in more than one court; apply at earliest opportunity"], ["[[s.23]]", "— (procedure)", "which court hears the s.22 application: common appellate court / High Court"], ["[[s.24]]", "**High Court or District Court**, on application or **on its own**", "at **any stage** — transfer or withdraw a suit, appeal or proceeding within its control"], ["[[s.25]]", "**Supreme Court**", "from a court in **one State to a court in another State**, if 'expedient for the ends of justice' (substituted 1976)"]]}, {"t": "tiles", "title": "Grounds courts usually accept", "items": [["🚌", "Convenience", "of parties and witnesses; distance and cost"], ["👩", "Wife's convenience", "in matrimonial cases — weighed carefully"], ["⚖️", "Reasonable apprehension", "of bias — real, not imaginary"], ["🔗", "Connected cases", "avoid conflicting decisions; try together"]]}, {"t": "case", "name": "Matrimonial transfer petitions — Sumita Singh v. Kumar Sanjay (2001) and Anindita Das v. Srijit Das (2006)", "year": "2001 / 2006", "court": "Supreme Court of India", "cast": [["👩", "Wife (respondent in husband's divorce case)"], ["🧔", "Husband (petitioner)"], ["⚖️", "Supreme Court"]], "panels": [["👩", "Wife", "He filed for divorce in a far-away city. I live with my child elsewhere and cannot travel each time."], ["⚖️", "Supreme Court (2001)", "In such cases the wife's convenience weighs heavily. Transfer allowed."], ["🧔", "Another husband (2006)", "Now every wife asks for transfer as a matter of course!"], ["⚖️", "Supreme Court (2006)", "Not automatic. Pay her travel costs; the case stays."]], "story": ["In **Sumita Singh**, the Supreme Court transferred the husband's matrimonial case to the place where the wife lived, observing that in such proceedings it is the **wife's convenience** that must be looked at.", "Later, in **Anindita Das**, the Court noticed that transfer petitions by wives were being filed routinely. It refused transfer and instead directed the husband to pay the wife's **travel and stay expenses** for each hearing."], "held": "Transfer under **s.25** is discretionary and turns on the **ends of justice** — convenience is weighed, but transfer is not automatic.", "link": "**s.25** is about justice between the parties — not a fixed rule in favour of either side."}, {"t": "exam", "q": "Explain the provisions of the CPC relating to transfer of suits.", "lines": ["Introduction — object: ends of justice, convenience, avoiding conflicting decisions.", "s.22 — defendant's application; s.23 — to which court.", "s.24 — general power of HC/District Court, suo motu, any stage.", "s.25 — Supreme Court, inter-State transfer.", "Grounds and cases — Sumita Singh (2001); Anindita Das (2006).", "Conclude."]}, {"t": "check", "items": [["Which court can transfer a suit from Telangana to Karnataka?", "Only the **Supreme Court**, under s.25."], ["Can a High Court transfer a case on its own motion?", "Yes — s.24 allows transfer on application **or suo motu**, at any stage."], ["Who applies under s.22?", "The **defendant**, where the suit could have been instituted in two or more courts — at the earliest opportunity."]]}, {"t": "hook", "x": "**22 = defendant's choice of forum · 24 = HC/District Court, any stage · 25 = Supreme Court, across States.**"}], "asked": []}, {"id": "cpc11", "title": "Summons and service — including foreign summons", "sub": "s.27–29 · Order V · from a bailiff's visit to e-mail and WhatsApp", "blocks": [{"t": "idea", "x": "**No one can be condemned unheard.** A summons is the court's formal call to the defendant to come and answer — proper service is the gateway to a fair trial."}, {"t": "tale", "x": ["The rule of natural justice is ==no one shall be condemned unheard==. So when Pooja files a suit against Vikram, the court must first **tell** Vikram that a case has been filed against him and **call** him to answer. That formal call is the **summons**. **s.27** says once a suit is instituted, summons may be issued to the defendant to appear and answer — and it should be served within **30 days** of institution.", "The summons (under **O.V r.1**) asks Vikram to appear and file his **written statement within 30 days**. The court can extend this for recorded reasons up to **90 days** — a limit that is **directory** in ordinary suits (*Kailash v. Nanhku*, 2005) but **strict at 120 days** in commercial suits.", "How does the summons reach Vikram? Imagine a ladder. First, the court sends it through its own officer or by **registered post, speed post, approved courier, fax or e-mail** (**O.V r.9**), or lets Pooja serve it herself (**r.9A**). Wherever practicable it is served on Vikram **personally** or on his authorised agent (**r.12**). If he is away and has no agent, it may be served on an **adult member of his family** living with him — ==but never on a servant== (**r.15**). If he **refuses** or cannot be found, the serving officer **affixes** it on the outer door of his house (**r.17**). And if the court is satisfied that Vikram is **keeping out of the way**, it orders **substituted service** — affixing in the courthouse, or a **newspaper** advertisement (**r.20**).", "Some defendants need special routes: a **prisoner** through the jail officer (**r.24**); a defendant **abroad** with no agent here by post, courier, fax or e-mail (**r.25**); a **public officer** through the head of his office (**r.27**); a **soldier, sailor or airman** through his commanding officer (**r.28**). If Vikram lives in **another State**, the summons is sent to that State's court to be served (**s.28**). And a **foreign summons** from a notified foreign court can be served in India as if issued by an Indian court (**s.29**).", "Technology has now joined the ladder. During the 2020 lockdown, when post offices shut, the Supreme Court allowed service of notices and summons by **e-mail, fax and messaging apps like WhatsApp**, with the safeguard that the same document must also go by **e-mail on the same day**; the Bench remarked that two blue ticks would show the message was **seen**. This builds on the 2002 amendments to O.V, upheld in the *Salem Advocate Bar Association* cases."]}, {"t": "rule", "title": "The sections", "cite": "ss.27–29", "points": ["**s.27** — when a suit is instituted, summons may be issued to the defendant to appear and answer the claim, served within **30 days** of institution.", "**s.28** — service where the defendant resides in **another State**: sent to that State's court to be served.", "**s.29** — **foreign summons**: summons issued by civil or revenue courts of foreign territories notified by the Central Government may be sent to Indian courts and **served as if issued by them**.", "**O.V r.1** — the summons directs the defendant to appear and file a **written statement within 30 days** (court may extend, for reasons, up to **90 days** — directory in ordinary suits, *Kailash v. Nanhku*, 2005; in commercial suits **120 days**, mandatory)."]}, {"t": "flow", "title": "Modes of service — the ladder in Order V", "steps": [["By the court", "through its officer, or by **registered post AD, speed post, approved courier, fax or e-mail** [[r.9]]"], ["By the plaintiff", "court may permit the plaintiff to serve [[r.9A]]"], ["Personal service", "on the defendant himself or his authorised agent, wherever practicable [[r.12]]"], ["Adult family member", "if the defendant is absent and has no agent — an adult member of the family residing with him, **not a servant** [[r.15]]"], ["Affixing", "if he refuses or cannot be found — on the outer door or a conspicuous part of the house [[r.17]]"], ["Substituted service", "court satisfied he is keeping out of the way — affix in the courthouse and house, or **newspaper** publication [[r.20]]"]]}, {"t": "table", "title": "Special defendants", "head": ["Defendant", "Served through", "Rule"], "rows": [["In prison", "officer in charge of the prison", "[[O.V r.24]]"], ["Residing outside India, no agent in India", "post, courier, fax, e-mail", "[[O.V r.25]]"], ["Public officer", "the head of his office", "[[O.V r.27]]"], ["Soldier, sailor, airman", "his commanding officer", "[[O.V r.28]]"]]}, {"t": "case", "name": "Service by e-mail and WhatsApp — In re: Cognizance for Extension of Limitation", "year": "2020", "court": "Supreme Court of India (suo motu)", "cast": [["🦠", "COVID-19 lockdown"], ["📮", "Post offices closed"], ["⚖️", "Supreme Court"]], "panels": [["📮", "Court staff", "Post offices are shut. How do we serve notices and summons?"], ["⚖️", "Supreme Court", "Use e-mail, fax — and instant messaging like WhatsApp."], ["📱", "Lawyer", "And proof?"], ["⚖️", "Supreme Court", "Two blue ticks show it was seen. Serve the same day by e-mail too."]], "story": ["During the 2020 lockdown, physical service of notices and summons became almost impossible. In its suo motu case on extension of limitation, the Supreme Court (10 July 2020) permitted service of notices, summons and pleadings through **e-mail, fax and instant messaging services such as WhatsApp**.", "It added a safeguard: a party serving through a messaging app must also serve the same document **by e-mail on the same date**. The Bench also remarked orally that two blue ticks would show the recipient had seen it."], "held": "Electronic modes are valid ways to effect service when ordered, with safeguards for proof.", "link": "This is the modern face of **O.V r.9**, which since 2002 already allowed **fax and e-mail**, and of the Salem Advocate Bar Association cases (2002, 2005) which upheld those amendments and the court rules framed for them."}, {"t": "exam", "q": "What is summons? Explain the modes of service of summons.", "lines": ["Meaning and object — audi alteram partem; s.27; O.V r.1 (written statement in 30 days).", "Modes — court (r.9), plaintiff (r.9A), personal (r.12), family member (r.15), affixing (r.17), substituted (r.20).", "Special cases — r.24, 25, 27, 28; s.28 (other State); s.29 (foreign summons).", "Electronic service — 2020 SC suo motu order; Salem Advocate Bar Association.", "Conclude — proper service is the foundation of a fair trial."]}, {"t": "check", "items": [["Can a summons be served on the defendant's servant?", "No — O.V r.15 allows service on an **adult family member** residing with him, not a servant."], ["When is substituted service ordered?", "When the court is satisfied the defendant is keeping out of the way or cannot be served in the ordinary way — O.V r.20 (affixing, newspaper)."], ["What is a 'foreign summons' under s.29?", "A summons from a court in a foreign territory notified by the Central Government, sent to an Indian court and served as if it were its own."]]}, {"t": "hook", "x": "**Court → Plaintiff → Person → Family (not servant) → Door → Newspaper.** 30 days to file the written statement; up to 90 with reasons."}], "asked": [["2014", "B", "Discuss about the provisions relating to summons after institution of suits."], ["2015", "C", "A Civil court issued summons to a party to a civil suit. The party residing in his house started evading the receipts of summons by locking his house whenever the bailiff visited the house. How can the summons be served "], ["2020", "C", "'X' want the presence of the president of India, as witness in a Civil Suit. Can the court issue summons to the President of India? Give reasons."]]}], "papers": ["2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020"]}, {"id": "bnss", "short": "BNSS", "name": "Criminal Procedure (BNSS 2023) — Unit I", "course": "LL.B. (3 YDC) · Semester V · Bharatiya Nagarik Suraksha Sanhita (formerly CrPC)", "intro": "Unit I of criminal procedure — the **new BNSS sections with the old CrPC numbers beside them**, every key definition, and the **landmark cases as stories** so the rules stay with you.", "chapters": [{"id": "bnss1", "title": "Object and background — from CrPC to BNSS", "sub": "1861 → 1898 → 1973 → 2023 · why criminal procedure exists", "blocks": [{"t": "idea", "x": "Criminal law (BNS) says **what** a crime is. Criminal procedure (BNSS) says **how** the State investigates, arrests, tries and punishes — **fairly**. It is the shield of the citizen as much as the sword of the State."}, {"t": "tale", "x": ["Think of criminal justice as a three-part machine. The **Bharatiya Nyaya Sanhita (BNS)** is the list of **what** is a crime and its punishment. The **Bharatiya Sakshya Adhiniyam (BSA)** says **how** facts are proved. And the **Bharatiya Nagarik Suraksha Sanhita (BNSS)** is the **engine** that makes the other two work — it tells the police how to register a case, arrest, search and investigate, and tells courts how to grant bail, frame charges, try, sentence and hear appeals.", "Why does this engine matter so much? Because a criminal case is the most powerful thing a State can do to a citizen — it can take away his **liberty**, even his life. So procedure must be a ==shield for the citizen as much as a sword for the State==. A fair procedure means the accused is **presumed innocent**, is told why he is arrested, can get a lawyer and bail, and gets a **speedy and fair trial**; the victim is informed and heard; and society gets the guilty punished.", "The history is a story of slow improvement. The first Code came in **1861**; the long-lasting **1898 Code** ruled for 75 years. The **41st Law Commission Report (1969)** reviewed it fully, leading to the **CrPC 1973**, in force from **1 April 1974**. Its biggest change was **separating the judiciary from the executive** (Art. 50): **Judicial Magistrates** try cases, while **Executive Magistrates** (Collectors, SDMs) maintain public order. Later reports such as the **Malimath Committee (2003)** pushed for speed and victims' rights, and many amendments followed.", "In December 2023 Parliament passed the BNSS; it received assent on **25 December 2023** and came into force on **1 July 2024**, with **531 sections in 39 chapters**. It applies throughout India — except that, apart from Chapters IX, XI and XII, it does not apply to **Nagaland and tribal areas** unless the State notifies it (**s.1(2)**). Offences under the BNS are dealt with under the BNSS, and offences under other laws too, **subject to** any special procedure those laws lay down (**s.4**). Cases already pending on 1 July 2024 continue under the **old CrPC** (**s.531**).", "A smart exam habit: since most landmark judgments were decided under the CrPC, always write ==both numbers== — 'FIR under **s.173 BNSS (old s.154 CrPC)**'. It shows the examiner you know the old law and the new."]}, {"t": "timeline", "title": "The long road to BNSS", "items": [["1861", "First Code of Criminal Procedure (Act XXV of 1861) for the mofussil; revised 1872 and 1882."], ["1898", "**Code of Criminal Procedure, 1898** (Act V of 1898) — ran for 75 years."], ["1969", "**41st Report of the Law Commission** — a full review of the 1898 Code."], ["1973", "**CrPC, 1973** (Act 2 of 1974), in force **1 April 1974**. Key change: **separation of the judiciary from the executive** (Art. 50) — Judicial Magistrates try cases; Executive Magistrates keep order."], ["2003", "**Malimath Committee** on Reforms of the Criminal Justice System — speed, victims, investigation."], ["2005 · 2008 · 2013 · 2018", "Major CrPC amendments — plea bargaining (2005), s.41A notice & victim's appeal (2008/09), offences against women (2013, 2018)."], ["Dec 2023", "**BNSS, 2023** passed by Parliament; Presidential assent **25 December 2023**."], ["1 July 2024", "**BNSS in force**, along with the BNS (replacing IPC) and the Bharatiya Sakshya Adhiniyam (replacing the Evidence Act). **531 sections, 39 chapters.**"]]}, {"t": "tiles", "title": "Objects of criminal procedure", "items": [["🔎", "Investigate", "find the truth through police machinery"], ["⚖️", "Fair trial", "accused heard; presumed innocent until proved guilty"], ["⏱️", "Speed", "justice delayed is justice denied — timelines"], ["🛡️", "Protect liberty", "limits on arrest and detention (Arts. 21, 22)"], ["🧑‍🤝‍🧑", "Victim's voice", "information, hearing, compensation, appeal"], ["🕊️", "Public order", "preventive provisions — security for peace, nuisance"]]}, {"t": "vs", "title": "Substantive vs procedural criminal law", "a": ["Substantive (BNS 2023)", ["defines offences", "fixes punishments", "e.g. theft, murder, cheating"]], "b": ["Procedural (BNSS 2023)", ["machinery to enforce BNS", "FIR, arrest, bail, investigation, trial, appeal", "also applies to offences under other laws, unless they provide otherwise"]]}, {"t": "rule", "title": "Where the BNSS applies and when it does not", "cite": "ss.1, 4, 5", "points": ["Applies throughout India, but — except Chapters IX, XI and XII — **not to Nagaland and tribal areas** unless the State Government notifies [[s.1(2)]].", "Offences under the **BNS** are investigated, inquired into and tried under the BNSS [[s.4(1)]].", "Offences under **other laws** — also under the BNSS, **subject to** any special procedure in that law [[s.4(2)]].", "Nothing in the BNSS affects a **special or local law** or special jurisdiction, unless specifically provided [[s.5]]."], "exceptions": ["**Pending matters**: appeals, inquiries, trials and investigations pending on 1 July 2024 continue under the **old CrPC** [[s.531(2)(a)]].", "Special Acts (e.g. NDPS Act, PMLA, UAPA) have **their own** procedure on bail, arrest, etc., which prevails where inconsistent."]}, {"t": "note", "x": "**Exam tip:** the CrPC section numbers you see in older textbooks still matter — cases decided under the CrPC are still good law for the matching BNSS section. Write both: **'s.173 BNSS (old s.154 CrPC)'**."}, {"t": "exam", "q": "Explain the object, background and scheme of the Bharatiya Nagarik Suraksha Sanhita, 2023.", "lines": ["Introduction — substantive vs procedural criminal law; BNS, BSA, BNSS.", "History — 1861, 1898, 41st LC Report, CrPC 1973 (separation of judiciary), Malimath, BNSS 2023 (dates, 531 sections).", "Objects — fair investigation, fair trial, speed, liberty, victims, public order.", "Scheme and application — ss.1, 4, 5, 531.", "Constitutional basis — Arts. 14, 20, 21, 22, 39A, 50.", "Conclude."]}, {"t": "check", "items": [["When did the BNSS come into force?", "1 July 2024. Assent was given on 25 December 2023."], ["How many sections does the BNSS have?", "531 sections in 39 chapters (the CrPC had 484 sections)."], ["What did the CrPC 1973 change most importantly?", "It separated the judiciary from the executive in criminal courts (Art. 50) — trials by Judicial Magistrates; Executive Magistrates for maintenance of order."]]}, {"t": "hook", "x": "**1861 · 1898 · 1973 · 2023.** BNS = *what* is a crime; BNSS = *how* to deal with it; BSA = *how* to prove it."}], "asked": []}, {"id": "bnss2", "title": "BNSS vs CrPC — what is new", "sub": "Zero FIR · e-FIR · timelines · technology · victims", "blocks": [{"t": "idea", "x": "The BNSS keeps the **skeleton of the CrPC** but adds **technology, time-limits and victims' rights**. Learn the changes in pairs: old section → new section."}, {"t": "tale", "x": ["Imagine Shreya, a college student from Hyderabad, whose phone is snatched while she is travelling in Pune. Under the old practice she might have been told 'go to the station where it happened'. Under the BNSS she can give information at **any police station** — a ==Zero FIR== — or even **electronically** (an **e-FIR**), which she must sign within **three days** (**s.173(1)**). The station registers it and transfers it to the station with jurisdiction. She gets a **free copy**, and within **90 days** the police must tell her how the investigation is progressing (**s.193(3)**).", "That one story captures the BNSS's three big themes: **technology**, **time-limits** and **victims**. Searches and seizures must be **audio-video recorded** and sent to the Magistrate (**s.105**). For offences punishable with **seven years or more**, a **forensic team** must visit the crime scene (**s.176(3)**). Summons, evidence and even trials may be held in **electronic mode** (**s.530**).", "Time-limits push cases forward: the **charge** should be framed within **60 days** of the first hearing on charge (**s.251**); **judgment** within **30 days** of the end of arguments, extendable to **45** (**s.258**). An accused who is a **proclaimed offender** and absconds can be **tried in absentia** (**s.356**), so a trial need not wait forever.", "For offences punishable with **3 to 7 years**, the BNSS introduces a **statutory preliminary enquiry**: with a **DSP's permission**, the officer may check within **14 days** whether a prima facie case exists before investigating (**s.173(3)**). For petty offences, Magistrates can award **community service** (**s.23**). The **Directorate of Prosecution** is expanded with State and District Directorates (**s.20**, old s.25A). **Metropolitan Magistrates** disappear as a separate class. Property that is **proceeds of crime** can be attached (**s.107**), and **handcuffs** may be used for listed serious offenders (**s.43(3)**).", "The best way to learn the BNSS is in **pairs**: old section → new section. FIR **154 → 173**; investigation order **156(3) → 175(3)**; remand **167 → 187**; charge-sheet **173 → 193**; bail **436–439 → 478–483**; undertrial detention **436A → 479**; withdrawal **321 → 360**."]}, {"t": "table", "title": "Section map — old to new", "head": ["Topic", "CrPC 1973", "BNSS 2023"], "rows": [["Definitions", "s.2", "s.2(1)"], ["Classes of criminal courts", "s.6", "s.6"], ["Arrest without warrant", "s.41, 41A", "s.35"], ["FIR — cognizable cases", "s.154", "s.173"], ["Non-cognizable information", "s.155", "s.174"], ["Police power to investigate · Magistrate's order", "s.156(1), 156(3)", "s.175(1), 175(3)"], ["Remand / police custody", "s.167", "s.187"], ["Police report (charge-sheet)", "s.173", "s.193"], ["Withdrawal from prosecution", "s.321", "s.360"], ["Bail: bailable · non-bailable · anticipatory · HC/Sessions", "ss.436, 437, 438, 439", "ss.478, 480, 482, 483"], ["Maximum detention of undertrials", "s.436A", "s.479"], ["Victim's appeal against acquittal", "s.372 proviso", "s.413 proviso"]]}, {"t": "tiles", "title": "Headline changes in the BNSS", "items": [["0️⃣", "Zero FIR & e-FIR", "information may be given at any station, regardless of area, or electronically; signed within 3 days [[s.173(1)]]"], ["🔍", "Preliminary enquiry", "for offences of 3–7 years, with a DSP's permission, within 14 days [[s.173(3)]]"], ["🎥", "Video of search & seizure", "audio-video recording of search and seizure, sent to the Magistrate [[s.105]]"], ["🧪", "Forensics", "forensic team to visit the scene in offences punishable with 7 years or more [[s.176(3)]]"], ["🧑‍⚖️", "Trial in absentia", "of proclaimed offenders who abscond [[s.356]]"], ["⏳", "Timelines", "charge within 60 days of first hearing on charge [[s.251]]; judgment within 30 days of arguments, extendable to 45 [[s.258]]"], ["📣", "Victim updates", "police to inform the victim of progress within 90 days [[s.193(3)]]"], ["💻", "E-proceedings", "summons, evidence and trials may be in electronic mode [[s.530]]"], ["🧹", "Community service", "a new punishment Magistrates may award for petty offences [[s.23]]"]]}, {"t": "vs", "title": "What disappeared, what appeared", "a": ["Dropped", ["**Metropolitan Magistrates** as a separate class", "the term 'lunatic' (now 'person of unsound mind' / 'intellectual disability')"]], "b": ["Added", ["**Directorate of Prosecution** expanded — State and District Directorates with defined functions [[s.20]] (old s.25A CrPC)", "property attachment of **proceeds of crime** [[s.107]]", "**handcuffing** permitted for listed serious offenders [[s.43(3)]]"]]}, {"t": "exam", "q": "What are the important changes introduced by the BNSS, 2023 over the CrPC, 1973?", "lines": ["Introduction — BNSS in force 1 July 2024; 531 sections.", "Technology — e-FIR, video of search (s.105), forensics (s.176(3)), e-proceedings (s.530).", "Speed — s.173(3) preliminary enquiry, s.251, s.258, s.356 trial in absentia, s.193 timelines.", "Victims — free FIR copy, progress update in 90 days, hearing before withdrawal (s.360).", "Others — community service (s.23), Directorate (s.20), Metropolitan Magistrates dropped, s.107, s.43(3), s.479.", "Conclude with a short comparison table."]}, {"t": "check", "items": [["What is a Zero FIR?", "An FIR registered at any police station irrespective of where the offence occurred; the station then transfers it to the station with jurisdiction — now in s.173(1) BNSS."], ["Which BNSS section corresponds to s.154 CrPC?", "s.173."], ["Within how many days must judgment be pronounced after arguments?", "30 days, extendable to 45 days for reasons recorded — s.258."]]}, {"t": "hook", "x": "**Z-E-P-V-F-T**: Zero FIR · E-FIR · Preliminary enquiry · Video of search · Forensics · Timelines."}], "asked": []}, {"id": "bnss3", "title": "Important definitions", "sub": "s.2(1) BNSS — bail, offences, complaint, investigation, inquiry, trial, victim", "blocks": [{"t": "idea", "x": "Definitions are the **alphabet** of criminal procedure. Each word decides **who acts** — police or Magistrate — and **what rights** the accused gets."}, {"t": "tale", "x": ["Every chapter of criminal procedure turns on a few words. Let us follow one imaginary case to see them in action. Ganesh's shop is burgled at night. He rushes to the police station and tells the officer what happened — that is **information** recorded as an **FIR**. Burglary (house-breaking with theft) is a ==cognizable offence== (**s.2(1)(g)**): a police officer may **arrest without warrant**. Had someone merely defamed Ganesh, that would be **non-cognizable** (**s.2(1)(o)**) — no arrest without a warrant, no police investigation without a Magistrate's order.", "The police now start an ==investigation== (**s.2(1)(l)**) — **all proceedings for collection of evidence** by a police officer (or a person authorised by a Magistrate, but **never a Magistrate himself**). They visit the shop, lift fingerprints, record statements, and arrest a suspect, Raju. Raju's lawyer applies for **bail** — under **s.2(1)(b)**, the release of a person accused or suspected of an offence **from the custody of law**, on conditions, on executing a **bond** (without surety) or a **bail bond** (with surety). Whether bail is a **right** depends on whether the offence is **bailable** (**s.2(1)(c)**) — as shown in the **First Schedule**.", "Now suppose Ganesh had gone straight to a **Magistrate** with a written allegation. That is a ==complaint== (**s.2(1)(h)**): an allegation, oral or written, **to a Magistrate**, with a view to his taking action, that **some person — known or unknown —** has committed an offence. A **police report is not a complaint** — except that a police report in a **non-cognizable** case is **deemed** a complaint. When the Magistrate examines Ganesh and witnesses to see whether to issue process, that is an ==inquiry== — every inquiry **other than a trial**, conducted by a **Magistrate or court**. The **trial** itself (not defined) is the stage where guilt is decided.", "Is Raju's case a **warrant-case** or a **summons-case**? Burglary is punishable with **more than two years**, so it is a **warrant-case**; any case punishable up to two years is a **summons-case**. The type decides the trial procedure. And who is the ==victim==? Ganesh — a person who suffered **loss or injury** because of the accused's act — and the definition **includes his guardian or legal heir**. This matters: in *Mallikarjun Kodagali* (2018) the Supreme Court held that a victim can **appeal against acquittal as of right**, without leave (proviso to s.372 CrPC, now **s.413 BNSS**).", "One more twist. In *Mohd. Yousuf v. Afaq Jahan* (2006), a complainant's forgery complaint was sent by the CJM to the police under **s.156(3) CrPC (now s.175(3) BNSS)** before taking cognizance. The High Court thought a Magistrate could not order an FIR. The Supreme Court disagreed: ordering investigation is a **pre-cognizance** step, and the police must **register an FIR** and investigate."]}, {"t": "terms", "items": [["Bail", "**release** of a person accused or suspected of an offence **from the custody of law**, on conditions imposed by an officer or court, on executing a **bond or bail bond**.", "s.2(1)(b)", "Released after signing a bond for ₹20,000 with one surety."], ["Bail bond / Bond", "**bail bond** = undertaking for release **with surety**; **bond** = personal bond or undertaking **without surety**.", "s.2(1)(d) · (e)", ""], ["Bailable offence", "an offence shown as **bailable in the First Schedule** or made bailable by any other law; every other offence is **non-bailable**.", "s.2(1)(c)", "Simple hurt — bail is a right."], ["Cognizable offence / case", "an offence for which a **police officer may arrest without warrant**, under the First Schedule or any other law.", "s.2(1)(g)", "Murder, robbery, rape, dowry death."], ["Non-cognizable offence", "an offence for which a police officer has **no authority to arrest without warrant**.", "s.2(1)(o)", "Defamation, simple public nuisance."], ["Complaint", "any allegation, **oral or written, to a Magistrate**, with a view to his taking action, that **some person (known or unknown)** has committed an offence — **not a police report**.", "s.2(1)(h)", "A cheque-bounce complaint filed directly before the Magistrate."], ["Investigation", "all proceedings for the **collection of evidence** by a **police officer** or any person (other than a Magistrate) authorised by a Magistrate.", "s.2(1)(l)", "Visiting the scene, recording statements, seizing the weapon."], ["Inquiry", "every inquiry, **other than a trial**, conducted by a **Magistrate or court**.", "s.2(1)", "Inquiry into a complaint before issuing process; inquiry for maintenance."], ["Trial", "**not defined**; it is the judicial stage after charge / accusation where guilt is decided — ends in **acquittal or conviction**.", "—", ""], ["Warrant-case / Summons-case", "**warrant-case**: offence punishable with **death, life imprisonment or imprisonment for more than two years**; **summons-case**: any other case.", "s.2(1)", "Theft (up to 3 years) — warrant-case; public nuisance — summons-case."], ["Victim", "a person who has suffered **loss or injury** because of the act or omission of the accused — **includes guardian or legal heir**.", "s.2(1)", ""], ["Police report", "the report by a police officer to a Magistrate under s.193(3) — commonly called the **charge-sheet** (or final report).", "s.2(1)", ""]]}, {"t": "vs", "title": "Complaint vs FIR — asked in 2019", "a": ["Complaint", ["made to a **Magistrate**", "any offence — cognizable or not", "oral or written", "Magistrate examines complainant on oath [[s.223]]"]], "b": ["FIR", ["given to the **officer in charge of a police station**", "only **cognizable** offences", "reduced to writing / e-FIR, signed, copy free to informant", "sets the criminal law in motion through the police"]]}, {"t": "case", "name": "Mohd. Yousuf v. Afaq Jahan", "year": "2006", "court": "Supreme Court of India", "cast": [["🧔", "Mohd. Yousuf (complainant)"], ["👩", "Afaq Jahan (accused)"], ["👨‍⚖️", "Magistrate"]], "panels": [["🧔", "Complainant", "My signature as a loan guarantor was forged. The CJM sent my complaint to the police under s.156(3)."], ["👩", "Accused", "A Magistrate has no power to order the police to register an FIR! (The High Court agreed and quashed the charge-sheet.)"], ["⚖️", "Supreme Court", "Wrong. Before taking cognizance, a Magistrate may order investigation under s.156(3) — a **pre-cognizance** step."], ["⚖️", "Supreme Court", "Nothing illegal in directing registration of an FIR. The police register it and investigate in the ordinary way."]], "story": ["Mohd. Yousuf complained to the Chief Judicial Magistrate that his signature had been **forged** to show him as a loan guarantor. The CJM did **not take cognizance** but directed the police to register and investigate under **s.156(3) CrPC** (now **s.175(3) BNSS**). An FIR was registered and a charge-sheet filed. The accused, Afaq Jahan, moved the High Court, which **quashed** the charge-sheet, holding that the Magistrate had no power to order registration of a case.", "The Supreme Court explained the difference between two routes: a Magistrate may **take cognizance** and proceed with the complaint himself (examination of complainant, inquiry), **or** before taking cognizance send it to the police for investigation. The second is not cognizance."], "held": "A direction to investigate under s.156(3) is a **pre-cognizance** order; the police must **register an FIR** and investigate.", "link": "It shows how **complaint**, **investigation** and **inquiry** are separate ideas — and that the Magistrate has two doors to choose from."}, {"t": "case", "name": "Mallikarjun Kodagali (dead) v. State of Karnataka", "year": "2018", "court": "Supreme Court of India (three judges)", "cast": [["👨‍👩‍👦", "Victim's family"], ["🧔", "Accused (acquitted)"], ["⚖️", "Supreme Court"]], "panels": [["👨‍👩‍👦", "Victim", "The accused were acquitted. We want to appeal."], ["🧔", "Accused", "Only the State can appeal against acquittal — and only with leave!"], ["⚖️", "Supreme Court", "The 2009 proviso gives the victim a **right** to appeal — no leave needed."]], "story": ["After an acquittal, the victim wanted to appeal. The question was whether a victim needs **leave** of the High Court, like the State does, and whether a victim can appeal when the offence was committed before the proviso came into force (31 December 2009).", "The Court read the **proviso to s.372 CrPC** (added in 2009, now proviso to **s.413 BNSS**) with the definition of 'victim': the victim has a **statutory right of appeal** against acquittal, conviction for a lesser offence or inadequate compensation, and does **not** need leave. The right applies to acquittals ordered after 31 December 2009, even if the offence was earlier. (Deepak Gupta J. dissented on the leave point.)"], "held": "A **victim may appeal as of right** without seeking leave (majority 2:1); the date of the **acquittal order**, not of the offence, decides whether the proviso applies. (That a legal heir may continue the appeal was settled later in *Khem Singh v. State of Uttarakhand*, 2025.)", "link": "The definition of **victim** (including guardian or legal heir) has real teeth — it decides who may appeal."}, {"t": "exam", "q": "Define and explain: (a) complaint, (b) investigation, (c) inquiry, (d) cognizable offence, (e) bail.", "lines": ["Each term: definition with clause (s.2(1)(h), (l), (k), (g), (b)); key words underlined.", "One example for each.", "Contrast pairs — complaint vs FIR; cognizable vs non-cognizable; bail bond vs bond; investigation vs inquiry vs trial.", "Cases — Mohd. Yousuf (2006); Mallikarjun Kodagali (2018) for 'victim'.", "Conclude."]}, {"t": "check", "items": [["Bail bond vs bond?", "Bail bond — with surety. Bond — personal bond, without surety (s.2(1)(d), (e))."], ["Is a police report a 'complaint'?", "No — the definition excludes it. (But a police report in a non-cognizable case after investigation is deemed a complaint — Explanation to the definition.)"], ["Theft is punishable up to 3 years. Is it a summons-case or a warrant-case?", "A **warrant-case** — the punishment exceeds two years."]]}, {"t": "hook", "x": "**Investigation = police. Inquiry = Magistrate, not a trial. Trial = guilt decided.** Warrant-case = **more than 2 years**."}], "asked": [["2014", "A", "Complaint"], ["2014", "A", "Inquiry"], ["2014", "A", "Summons case"], ["2016", "A", "Complaint"], ["2017", "A", "Victim"], ["2019", "A", "Inquiry"], ["2019", "A", "Victim"], ["2019", "B", "Explain the difference between 'complaint' and 'First Information Report'."]]}, {"id": "bnss4", "title": "Cognizable and non-cognizable offences · FIR", "sub": "Who can arrest without warrant · how the police start a case", "blocks": [{"t": "idea", "x": "**Cognizable** = serious enough that the police may **arrest without a warrant and investigate on their own**. **Non-cognizable** = police need the **Magistrate's order** to investigate."}, {"t": "tale", "x": ["Two calls come to the same police station on one evening. First, Seema reports that a man **snatched her chain** and ran. Second, Anand says his neighbour **insulted him** in front of guests. The officer handles them very differently — because the first is **cognizable** and the second **non-cognizable**.", "For Seema's case, the officer **must** record an **FIR** under **s.173 BNSS (old s.154 CrPC)**. Oral information is **reduced to writing**, read over, and signed; information can also be given **electronically**, to be signed within three days. Seema gets a **free copy**. If the victim of certain sexual offences is a woman, a **woman officer** records it; if she is temporarily or permanently disabled, it may be recorded **at her residence**, with an interpreter, and **video-recorded**. The police then **investigate without waiting** for any Magistrate (**s.175**), and may arrest the snatcher **without warrant**.", "For Anand's insult (non-cognizable), the officer only **enters the substance** in the station diary and **refers him to the Magistrate** (**s.174(1)**). The police **cannot investigate** without a Magistrate's order (**s.174(2)**).", "What if the officer refuses to register Seema's FIR? In *Lalita Kumari* (2014), a father whose minor daughter was missing was turned away. The Constitution Bench held that **'shall' means shall**: if the information discloses a cognizable offence, ==registration of an FIR is mandatory==. A **preliminary inquiry** was allowed only to see **whether** a cognizable offence is disclosed — in categories like matrimonial disputes, commercial offences, medical negligence, corruption and abnormal delay — within **15 days** generally (six weeks in exceptional cases) — as modified by a later 2014 order (originally 7 days). The BNSS has now written its own version into **s.173(3)**: for offences of **3 to 7 years**, with a **DSP's permission**, a preliminary enquiry within **14 days**.", "If the police still refuse, Seema can send the information to the **Superintendent of Police** (**s.173(4)**), and then apply to the **Magistrate** under **s.175(3)** with an **affidavit** — exactly the path *Sakiri Vasu* (2008) pointed to. A handy tool for answers: the **First Schedule, Part II** classifies offences under other laws — **death, life or more than 7 years**: cognizable, non-bailable, Sessions; **3 years and upwards but not more than 7 years**: cognizable, non-bailable, Magistrate first class; **below 3 years or fine**: non-cognizable, bailable, any Magistrate."]}, {"t": "table", "title": "How the First Schedule (Part II) classifies offences under other laws", "head": ["Punishment", "Cognizable?", "Bailable?", "Triable by"], "rows": [["Death, life or more than 7 years", "Cognizable", "Non-bailable", "Court of Session"], ["3 years and up to 7 years", "Cognizable", "Non-bailable", "Magistrate of the first class"], ["Less than 3 years or fine only", "Non-cognizable", "Bailable", "Any Magistrate"]]}, {"t": "vs", "title": "Cognizable vs non-cognizable — asked in 2020", "a": ["Cognizable", ["arrest **without warrant**", "FIR under **s.173**", "police investigate **without** Magistrate's order", "usually serious — murder, rape, robbery, dowry death"]], "b": ["Non-cognizable", ["arrest only **with warrant**", "entry in the station diary; informant referred to the Magistrate [[s.174(1)]]", "investigation only with **Magistrate's order** [[s.174(2)]]", "less serious — defamation, simple hurt"]]}, {"t": "flow", "title": "The FIR journey under s.173", "steps": [["Information", "oral, written or **electronic** — at any police station (Zero FIR)"], ["Recorded", "oral information reduced to writing and read over; e-information signed within 3 days"], ["Copy", "a copy given **free of cost** to the informant or victim [[s.173(2)]]"], ["Women victims", "for listed sexual offences, recorded by a **woman officer**; for a disabled victim, at her residence with an interpreter, video-recorded"], ["Investigation", "police proceed under s.175/176; send report to the Magistrate"], ["If police refuse", "send the substance to the **Superintendent of Police** [[s.173(4)]]; then apply to the **Magistrate** under [[s.175(3)]]"]]}, {"t": "rule", "title": "Preliminary enquiry — the BNSS twist", "cite": "s.173(3)", "x": "For a cognizable offence punishable with **3 years or more but less than 7 years**, the officer in charge may, with the **prior permission of a DSP-rank officer**, either:", "points": ["hold a **preliminary enquiry** to see if a **prima facie case** exists — completed within **14 days**; or", "proceed with **investigation** straight away."], "exceptions": ["For offences of **7 years or more**, or below 3 years, the ordinary rule of **Lalita Kumari** applies — register the FIR if the information discloses a cognizable offence."]}, {"t": "case", "name": "Lalita Kumari v. Government of Uttar Pradesh", "year": "2014", "court": "Supreme Court of India (Constitution Bench)", "cast": [["👨", "Father of a missing minor girl"], ["👮", "Police station officer"], ["⚖️", "Supreme Court"]], "panels": [["👨", "Father", "My daughter has been taken away. Please register my complaint!"], ["👮", "Officer", "Let us first 'look into' it…"], ["👨", "Father", "Days pass. No FIR. No search."], ["⚖️", "Supreme Court", "If the information discloses a cognizable offence, registering the FIR is **mandatory**. 'Shall' means shall."]], "story": ["A minor girl, Lalita Kumari, was missing. Her father went to the police, but no FIR was registered and no action was taken. He moved the Supreme Court under Art. 32. Conflicting judgments existed on whether police could first verify information before registering an FIR.", "The Constitution Bench held that **s.154 CrPC** (now s.173 BNSS) uses the word '**shall**'; the officer has **no discretion** if the information discloses a cognizable offence. A **preliminary inquiry** is permitted only to check **whether** a cognizable offence is disclosed — in categories such as matrimonial/family disputes, commercial offences, medical negligence, corruption, and cases of abnormal delay — and must be finished within **15 days** generally (six weeks in exceptional cases, for recorded reasons — the original 7 days was enlarged by the Court in March 2014). Officers who do not register FIRs face action."], "held": "**Registration of an FIR is mandatory** where the information discloses a cognizable offence; a limited preliminary inquiry is allowed only in specified categories.", "link": "Learn **s.173** through this case — and note that the BNSS has now written a **statutory preliminary enquiry** (3–7 years, 14 days, DSP's permission) into s.173(3)."}, {"t": "real", "x": "An informant e-mails the police at 11 p.m. that his scooter was stolen in another city. Under the BNSS, the station records it as an **e-FIR / Zero FIR**, he signs it within **3 days**, gets a **free copy**, and the FIR is transferred to the station where the theft happened."}, {"t": "exam", "q": "Distinguish between cognizable and non-cognizable offences. Explain the law relating to FIR.", "lines": ["Definitions — s.2(1)(g), (o); First Schedule classification table.", "FIR — s.173: who, how, e-FIR, Zero FIR, free copy, women victims.", "Non-cognizable — s.174.", "Refusal to register — s.173(4), s.175(3); preliminary enquiry s.173(3).", "Cases — Lalita Kumari (2014); Sakiri Vasu (2008).", "Evidentiary value of FIR (corroboration/contradiction, not substantive). Conclude."]}, {"t": "check", "items": [["Who decides whether an offence is cognizable?", "The **First Schedule** of the BNSS (for BNS offences) and, for other laws, the law itself or Part II of the First Schedule."], ["What can an informant do if police refuse to register an FIR?", "Send the information to the SP (s.173(4)); then apply to the Magistrate under s.175(3) (Sakiri Vasu)."], ["Can police investigate a non-cognizable case?", "Only with the order of a Magistrate having power to try it — s.174(2)."]]}, {"t": "hook", "x": "**Cognizable = Cop can act alone. Non-cognizable = Needs a Court's nod.** FIR: 'shall' register (Lalita Kumari)."}], "asked": [["2013", "A", "Cognizable offence"], ["2013", "B", "Define arrest. How a person is arrested in non-cognizable offence?"], ["2013", "B", "Explain the Law relating to FIR."], ["2015", "B", "Write a brief note on First Information Report."], ["2016", "A", "Cognizable offence"], ["2016", "C", "A person has committed three offences within a year, one is a compoundable offence and the other two are non-cognizable offences. Which court has the power to punish, what will be the punishment?"], ["2017", "A", "Arrest without warrant"], ["2017", "A", "Non-Cognizable offence"], ["2017", "B", "Write a brief note on FIR."], ["2018", "A", "Cognizable offence."], ["2018", "C", "After receiving the First Information Report (FIR), the station house officer decided not to investigate the case on the ground that the case is not of a serious nature. What is the remedy available to the person aggriev"], ["2018", "C", "If a Magistrate who is not empowered, erroneously and in good faith, orders the police to investigate into a non- cognizable case. What would be the consequences of this illegality on the validity of the proceedings?"], ["2019", "B", "Explain the difference between 'complaint' and 'First Information Report'."], ["2020", "B", "Differentiate between cognizable and non-cognizable offences with suitable examples."]]}, {"id": "bnss5", "title": "Bailable and non-bailable offences · bail", "sub": "Bail is the rule, jail the exception", "blocks": [{"t": "idea", "x": "**Bail** balances two things: the accused's **liberty** (he is presumed innocent) and society's need that he **appears for trial** and does not tamper with evidence."}, {"t": "tale", "x": ["Raju is arrested on suspicion of stealing a motorbike. He has not been tried; the law **presumes him innocent**. Yet if he is freed, will he run away, threaten witnesses, or steal again? **Bail** is the law's answer to this tension: release from custody on a **promise** (bond) — sometimes with **sureties** — that he will appear whenever required.", "The first question is always: **bailable or non-bailable?** If the offence is **bailable**, bail is Raju's ==right==. The police officer or court **must** release him on bail (**s.478**). And if he is too poor to arrange a surety **within a week** of arrest, he is **presumed indigent** and released on a **personal bond**. This rule grew from *Moti Ram* (1978): a poor mason got bail from the Supreme Court, but the CJM demanded a ₹10,000 surety and rejected his brother because his property was in another district — the Supreme Court said such bail is **no bail** for the poor.", "If the offence is **non-bailable**, bail is the court's ==discretion== (**s.480**). The court weighs the **gravity** of the accusation, the **evidence**, the risk of **fleeing**, of **tampering** with evidence or **threatening** witnesses, and the accused's **antecedents**. There are special restrictions for offences punishable with **death or life imprisonment**, and leniency for **women, children, the sick or infirm**. The **High Court and Sessions Court** have wider powers (**s.483**). Justice Krishna Iyer's line in *Balchand* (1977) is the heart of every bail answer: ==the basic rule is bail, not jail== — unless there is a risk of fleeing, thwarting justice or repeating offences.", "What if Raju **fears** arrest before it happens? He can apply for **anticipatory bail** to the **High Court or Sessions Court** (**s.482**). In *Gurbaksh Singh Sibbia* (1980), the Constitution Bench refused to cut this power down with rigid conditions; and in *Sushila Aggarwal* (2020) a five-judge bench held that it **need not ordinarily be time-limited**.", "Two safety valves protect against endless custody. If the police do not file a charge-sheet within **60 days** (or **90 days** for offences punishable with death, life or ten years or more), the accused gets **default bail** as of right if he applies (**s.187(3)**). And an **undertrial** who has spent **half** the maximum sentence in custody — **one-third** for a **first-time** offender — must be released by the court **on bail** (a first-time offender **on bond**) (**s.479**); this does not apply to offences punishable with death or life, or where cases for more than one offence are pending. Add *Arnesh Kumar* (2014) — no automatic arrest for offences up to **7 years** — and *Satender Kumar Antil* (2022), which called for a separate **Bail Act**."]}, {"t": "vs", "title": "Bailable vs non-bailable — asked in 2014", "a": ["Bailable", ["bail is a **right** of the accused", "police officer or court **must** release on bail [[s.478]]", "poor accused unable to give surety within a week — presumed indigent; release on **personal bond**"]], "b": ["Non-bailable", ["bail is the court's **discretion** [[s.480]]", "restrictions for offences punishable with **death or life**", "special leniency for a woman, a child, sick or infirm persons", "High Court / Sessions Court have wider powers [[s.483]]"]]}, {"t": "table", "title": "Kinds of bail", "head": ["Kind", "When", "Section"], "rows": [["Regular bail (bailable)", "after arrest, offence is bailable — as of right", "[[s.478]]"], ["Regular bail (non-bailable)", "after arrest — discretion of the court", "[[s.480]] · [[s.483]]"], ["Anticipatory bail", "**before arrest**, apprehending arrest for a non-bailable offence — High Court or Sessions Court only", "[[s.482]]"], ["Default ('statutory') bail", "charge-sheet not filed within **60 / 90 days** — indefeasible right if he applies", "[[s.187(3)]]"], ["Undertrial release", "detained for **half** the maximum sentence (or **one-third** for a first-time offender) — released on bail (first-time offender on bond)", "[[s.479]]"], ["Interim bail", "temporary, pending decision on the main application", "court's discretion"]]}, {"t": "rule", "title": "Factors for granting bail in non-bailable offences", "cite": "s.480 · case law", "points": ["**Nature and gravity** of the accusation and the punishment.", "**Prima facie** evidence against the accused.", "Danger of **absconding** or fleeing from justice.", "Likelihood of **tampering** with evidence or **threatening** witnesses.", "**Antecedents** — repeat offender?", "Period already spent in custody; delay in trial."], "exceptions": ["s.479 (undertrial release) does **not** apply to offences punishable with **death or life imprisonment**, or where investigation/trial is pending in **more than one offence**.", "Special laws (NDPS s.37, UAPA s.43D(5), PMLA s.45) add **stricter twin conditions**."]}, {"t": "case", "name": "State of Rajasthan v. Balchand", "year": "1977", "court": "Supreme Court of India (Krishna Iyer J.)", "cast": [["🧔", "Balchand (accused)"], ["🏛️", "State of Rajasthan"], ["⚖️", "Krishna Iyer J."]], "panels": [["🏛️", "State", "The High Court acquitted him, but we have appealed. Keep him in jail!"], ["🧔", "Balchand", "I have surrendered as ordered. I won't run away. Please release me on bail."], ["⚖️", "Krishna Iyer J.", "The basic rule is **bail, not jail** — unless he may flee, tamper with justice or repeat the offence."]], "story": ["The High Court had **acquitted** Balchand. The State appealed to the Supreme Court. Balchand surrendered and asked to be released on bail while the appeal was pending.", "Justice Krishna Iyer used the famous words: ==the basic rule may perhaps be tersely put as bail, not jail, except where there are circumstances suggestive of fleeing from justice or thwarting the course of justice or creating other troubles== such as repeating offences or intimidating witnesses."], "held": "Bail was granted — the rule is **bail**; refusal is the exception, needing real reasons.", "link": "Quote this line in **every** bail answer, then list the factors (gravity, flight, tampering, repetition)."}, {"t": "case", "name": "Moti Ram v. State of Madhya Pradesh", "year": "1978", "court": "Supreme Court of India", "cast": [["👷", "Moti Ram (a poor mason)"], ["👨‍⚖️", "Chief Judicial Magistrate"], ["⚖️", "Supreme Court"]], "panels": [["👨‍⚖️", "CJM", "The Supreme Court has granted you bail. I fix a surety of ₹10,000 — and your brother won't do; his assets are in another district."], ["👷", "Moti Ram", "I am a poor mason from another district. Who will stand surety for me here?"], ["⚖️", "Supreme Court", "Bail that a poor man cannot use is no bail at all. Release him on his **personal bond**."]], "story": ["The Supreme Court granted Moti Ram, a poor mason, bail **to the satisfaction of the CJM**. The CJM fixed a **surety of ₹10,000** and refused his brother as surety because the brother's assets were in **another district**. Unable to meet it, he stayed in jail.", "The Supreme Court (Krishna Iyer J.) said that demanding sureties beyond a person's means denies liberty to the poor; courts may release the accused on a **personal bond** without sureties, and must not insist on local sureties."], "held": "Bail conditions must be **reasonable**; the accused can be released on **personal bond**, and sureties cannot be refused because they come from another district.", "link": "Now written into the law: a person unable to furnish bail **within a week** of arrest is presumed indigent and may be released on personal bond (Explanation to s.478(1))."}, {"t": "case", "name": "Gurbaksh Singh Sibbia v. State of Punjab", "year": "1980", "court": "Supreme Court of India (Constitution Bench)", "cast": [["🧑‍💼", "Gurbaksh Singh Sibbia (a former Punjab minister)"], ["🏛️", "Punjab & Haryana High Court"], ["⚖️", "Supreme Court"]], "panels": [["🧑‍💼", "Sibbia", "I fear arrest on political accusations of corruption. I ask for anticipatory bail."], ["🏛️", "High Court", "Only in exceptional cases — and with these eight strict conditions."], ["⚖️", "Supreme Court", "Do not shrink a wide power with rigid rules. Discretion must stay wide — and fair."]], "story": ["Corruption accusations were made against Gurbaksh Singh Sibbia, then a minister in Punjab. He sought **anticipatory bail** under s.438 CrPC (now **s.482 BNSS**). The High Court laid down rigid conditions — e.g. that it should be given only in exceptional cases.", "The Constitution Bench (Chandrachud C.J.) held that s.438 confers a **wide discretion**, which should not be cut down by judge-made restrictions. The applicant must show **reasonable grounds** for believing he may be arrested; a **blanket** order covering any future offence should not be passed; conditions may be imposed."], "held": "Anticipatory bail is a valuable safeguard of **personal liberty** under Art. 21; the High Court's restrictive rules were set aside.", "link": "**Sushila Aggarwal v. State (NCT of Delhi), 2020** (five judges) later confirmed: anticipatory bail need **not ordinarily be limited in time** and can last till the end of trial."}, {"t": "note", "x": "**Satender Kumar Antil v. CBI (2022)**: the Supreme Court classified offences into categories, gave bail guidelines, stressed compliance with **s.41/41A CrPC** (now s.35 BNSS) and recommended a separate **Bail Act**. **Arnesh Kumar v. State of Bihar (2014)**: no automatic arrest for offences punishable up to **7 years** — the police must justify arrest with a checklist; issue a **notice of appearance** instead."}, {"t": "exam", "q": "Explain the provisions relating to bail under the BNSS. Distinguish bailable and non-bailable offences.", "lines": ["Meaning — s.2(1)(b), bond and bail bond; Art. 21 and presumption of innocence.", "Bailable — s.478, right; indigent presumption; Moti Ram.", "Non-bailable — s.480 discretion; factors; s.483.", "Anticipatory bail — s.482; Gurbaksh Singh Sibbia; Sushila Aggarwal.", "Default bail s.187(3); undertrial release s.479; cancellation.", "Balchand quote; Arnesh Kumar; Satender Kumar Antil. Conclude."]}, {"t": "check", "items": [["Who can grant anticipatory bail?", "Only the **High Court or Court of Session** — s.482 BNSS."], ["What is default bail?", "Bail as of right if the charge-sheet is not filed within 60 days (or 90 days for offences punishable with death, life or 10+ years) — s.187(3)."], ["A person is on bail and commits another offence. Can bail be cancelled?", "Yes — the court that granted bail (or HC/Sessions Court) may cancel it and direct arrest (s.480(5), s.483(3)); repeating offences is a classic ground (Balchand)."]]}, {"t": "hook", "x": "**Bail, not jail.** Bailable → **right**. Non-bailable → **discretion**. Before arrest → **anticipatory** (HC / Sessions). No charge-sheet in 60/90 → **default bail**."}], "asked": [["2013", "A", "Bail"], ["2013", "C", "Mr. A was released on bail. While he is on bail, he again committed an offence. State whether bail is going to be continued or not."], ["2014", "A", "Non-bailable offence"], ["2014", "B", "Differentiate between bailable and non-bailable offences."], ["2014", "C", "A person was arrested presuming that he is a terrorist. Whether he can be released on bail. Discuss."], ["2014", "C", "Laxmi was an under trial prisoner for last 6 months and at last court granted bail, but she couldnot fulfill the conditions. What is the remedy for her? Suggest."], ["2015", "A", "Non-bailable offence"], ["2015", "C", "A person was arrested on the presumption of being involved in terrorist activities. Later the court came to know that he was not involved and informs him to apply for bail and pay the bond amount. Due to his poverty he c"], ["2018", "A", "Anticipatory Bail."], ["2019", "B", "Discuss the provision as to bail and bonds."]]}, {"id": "bnss6", "title": "Investigation, inquiry and trial", "sub": "Three stages · who does what · charge-sheet", "blocks": [{"t": "idea", "x": "**Police investigate** (collect evidence) → **Magistrate inquires** (checks if a case exists) → **court tries** (decides guilt). Three stages, three actors."}, {"t": "tale", "x": ["A body is found near a lake. Who does what next? Three different actors, three different stages — and examiners love asking you to tell them apart.", "**Stage one: investigation, by the police.** In *H.N. Rishbud* (1955), the Supreme Court described its steps: (1) **proceed to the spot**; (2) **ascertain the facts** and circumstances; (3) **discover and arrest** the suspected offender; (4) **collect evidence** — examine persons (**s.180**), search places and seize things (**s.185**); and (5) **form an opinion** whether there is a case to place before a Magistrate, and **submit a police report** (**s.193**). In Rishbud's own case, much of a corruption investigation was done by officers below the required rank. The investigation was **illegal** — but the Court said a defective investigation **does not automatically spoil the trial**; it matters only if it caused a **miscarriage of justice**.", "The police report — popularly the **charge-sheet** (or a **closure report** if no case is found) — goes to the Magistrate. Investigation must finish **without unnecessary delay**; for listed sexual offences against women and children, within **two months**. The informant or victim must be told of progress within **90 days**. Even after a report, police may carry out **further investigation**; if this happens **during the trial**, it needs the court's **permission** and must ordinarily be completed within **90 days** (**s.193(9)**).", "**Stage two: inquiry, by a Magistrate.** An inquiry is **every inquiry other than a trial** conducted by a Magistrate or court — for example, when a Magistrate examines a complainant and witnesses to decide whether to issue process, or decides whether to commit a case to the Sessions Court. Note that a Magistrate **never investigates** — but he can **order** investigation. In *Sakiri Vasu* (2008), a father unhappy with the probe into his Army-officer son's death went to the High Court and then the Supreme Court; the Court said his remedy lay first with the police hierarchy and the **Magistrate under s.156(3) CrPC (now s.175(3))**, who can order an FIR, direct a proper investigation and **monitor** it.", "**Stage three: trial, by a court.** The trial is where the **charge** is framed (or accusation stated), evidence is led, the accused is heard, and the court decides **guilt or innocence** — ending in **acquittal or conviction**. 'Trial' is **not defined** in the Code, but its end-point makes it easy to remember. Memory line: ==Police investigate, Magistrates inquire, courts try=="]}, {"t": "table", "title": "Investigation vs inquiry vs trial", "head": ["Point", "Investigation", "Inquiry", "Trial"], "rows": [["By", "**police** (or a person authorised by Magistrate, not a Magistrate)", "**Magistrate or court**", "**Magistrate or Sessions Court**"], ["Purpose", "collect evidence", "find whether to proceed — any proceeding other than trial", "decide guilt or innocence"], ["Nature", "administrative", "judicial / non-judicial", "judicial"], ["Ends in", "police report (charge-sheet / closure report)", "order, e.g. dismissal of complaint, committal", "acquittal or conviction"], ["Section", "s.2(1)(l)", "s.2(1)", "not defined"]]}, {"t": "flow", "title": "Steps of investigation (H.N. Rishbud)", "steps": [["Proceed to the spot", "visit the scene"], ["Ascertain facts", "and circumstances of the case"], ["Discover & arrest", "find and arrest the suspected offender"], ["Collect evidence", "examine persons [[s.180]], search and seize [[s.185]], record statements"], ["Form an opinion", "is there a case for trial? Submit police report to Magistrate [[s.193]]"]]}, {"t": "case", "name": "H.N. Rishbud v. State of Delhi", "year": "1955", "court": "Supreme Court of India", "cast": [["🧑‍💼", "H.N. Rishbud (a government official)"], ["👮", "Investigating officer (below the required rank)"], ["⚖️", "Supreme Court"]], "panels": [["🧑‍💼", "Rishbud", "Under the anti-corruption law, only a DSP or above could investigate. An inspector did most of it!"], ["⚖️", "Supreme Court", "Right — the investigation was illegal. The court should have ordered re-investigation."], ["⚖️", "Supreme Court", "But an illegal investigation does not automatically void a trial — only if it caused a miscarriage of justice."]], "story": ["H.N. Rishbud was charged under the Prevention of Corruption Act, which required investigation by an officer of at least the rank of **Deputy Superintendent of Police** unless a Magistrate permitted otherwise. Much of the investigation was done by lower-rank officers.", "The Supreme Court described **what investigation consists of** (the five steps above) and held that the requirement was mandatory, so the investigation was illegal; if this is noticed early, the court should order **re-investigation**. But a defect in investigation does **not** by itself vitiate the cognizance or the trial — it matters only if it has caused **prejudice / miscarriage of justice**."], "held": "Investigation in breach of mandatory provisions is illegal, but the resulting trial is void only if a **miscarriage of justice** is shown.", "link": "This case **defines investigation** in practice — quote the five steps."}, {"t": "case", "name": "Sakiri Vasu v. State of Uttar Pradesh", "year": "2008", "court": "Supreme Court of India", "cast": [["👨", "Sakiri Vasu (father of an Army officer found dead)"], ["🪖", "Army inquiry"], ["⚖️", "Supreme Court"]], "panels": [["👨", "Father", "My son, a Major, was found dead near a railway track. Police and the Army say accident/suicide. I want a CBI probe."], ["⚖️", "Supreme Court", "If you are not satisfied with the police, go to the **Magistrate** under s.156(3)."], ["⚖️", "Supreme Court", "He can order an FIR, a proper investigation — and **monitor** it."]], "story": ["A father, unhappy with the investigation into his son's death, filed a writ petition in the Allahabad High Court seeking a CBI inquiry; when it was dismissed, he appealed to the Supreme Court.", "The Court held that the remedy lies first with the **police hierarchy** (SP) and then the **Magistrate under s.156(3) CrPC** (now **s.175(3) BNSS**). The Magistrate has wide powers — to order registration of an FIR, a proper investigation, and to **monitor** it. Writ petitions should not be the first stop."], "held": "Magistrates have power to direct and **monitor** investigation; High Courts should not ordinarily entertain such writs when the alternative remedy exists.", "link": "BNSS s.175(3) now requires an **application supported by an affidavit**, and that the applicant first approached the SP (s.173(4))."}, {"t": "rule", "title": "Police report / charge-sheet", "cite": "s.193", "points": ["Investigation must be completed **without unnecessary delay**; in listed sexual offences against women and children, within **two months** from recording of information [[s.193(2)]].", "Report to the Magistrate in prescribed form: names, nature of information, persons who appear acquainted, whether offence committed, whether accused arrested/released [[s.193(3)]].", "Police must inform the **victim / informant** of progress within **90 days** — including by electronic means.", "**Further investigation** can be done even after the report [[s.193(9)]]; further investigation **during the trial** needs the trial court's permission and must be completed within **90 days**, extendable with the court's permission (proviso)."]}, {"t": "exam", "q": "Distinguish between investigation, inquiry and trial.", "lines": ["Introduction — three stages of a criminal case.", "Investigation — s.2(1)(l); steps (H.N. Rishbud); police report s.193; further investigation.", "Inquiry — definition; examples; Magistrate's power to order investigation (s.175(3), Sakiri Vasu).", "Trial — not defined; stages; ends in acquittal/conviction.", "Comparison table (by whom, purpose, nature, ends in).", "Conclude."]}, {"t": "check", "items": [["Who conducts an inquiry?", "A Magistrate or court — never the police."], ["Does a defective investigation make the trial void?", "Not by itself — only if it caused a miscarriage of justice (H.N. Rishbud)."], ["What is a closure report?", "A police report under s.193 saying no offence is made out or no evidence; the Magistrate may accept it, order further investigation, or take cognizance — after notice to the informant."]]}, {"t": "hook", "x": "**Police → Investigate. Magistrate → Inquire. Court → Try.** Rishbud's five steps: **Spot, Facts, Arrest, Evidence, Opinion**."}], "asked": [["2014", "A", "Charge sheet"], ["2014", "A", "Inquiry"], ["2014", "B", "Explain the law relating to trial under Cr.P.C."], ["2015", "A", "Charge Sheet"], ["2017", "A", "Trial"], ["2018", "C", "After receiving the First Information Report (FIR), the station house officer decided not to investigate the case on the ground that the case is not of a serious nature. What is the remedy available to the person aggriev"], ["2018", "C", "If a Magistrate who is not empowered, erroneously and in good faith, orders the police to investigate into a non- cognizable case. What would be the consequences of this illegality on the validity of the proceedings?"], ["2019", "A", "Inquest"], ["2019", "A", "Inquiry"], ["2020", "A", "Charge Sheet"]]}, {"id": "bnss7", "title": "Classes of criminal courts and their powers", "sub": "s.6 · ss.8–14 · sentencing powers ss.22–23", "blocks": [{"t": "idea", "x": "Courts are arranged like a **ladder**: the more serious the offence, the higher the court. Each step has a **ceiling** on the sentence it can pass."}, {"t": "tale", "x": ["Picture the criminal courts as a **ladder**. At the bottom are **Judicial Magistrates of the second class**, then **first class**, t

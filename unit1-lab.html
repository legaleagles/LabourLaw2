<script>
const SUBJ = [{"id": "cpc", "short": "CPC", "name": "Code of Civil Procedure — Unit I", "course": "LL.B. (3 YDC) · Semester V · Civil Procedure Code & Limitation", "intro": "Everything in Unit I, explained for reading on your phone: the **words**, the **sections**, the **exceptions** — and the **landmark cases told as stories** so that the rule sticks.", "chapters": [{"id": "cpc1", "title": "Codification, features and key definitions", "sub": "Why a procedure code · structure of the CPC · decree, judgment, order", "blocks": [{"t": "idea", "x": "Substantive law gives you a **right**; the Civil Procedure Code tells you **how to go to court and get it**. Procedure is the road; the right is the destination."}, {"t": "tale", "x": ["Ravi lends ₹5 lakh to his friend Suresh. The **Contract Act** gives Ravi a **right** to get the money back. But Suresh does not pay. A right sitting in a book does not put money in Ravi's pocket — he needs a **road** to reach it. That road is the **Code of Civil Procedure, 1908**. It tells Ravi which court to go to, how to write his case, how Suresh is called to court, how evidence is taken, how the judge decides, and how the decision is finally enforced.", "Ravi's lawyer files a **plaint**. Over the next months the judge passes many small decisions — granting an adjournment, allowing a document to be filed, ordering Suresh not to sell his car till the case ends. Each of these is an ==order== under **s.2(14)**: a formal decision of a civil court **that is not a decree**.", "At the end, the judge writes twenty pages explaining why Ravi's evidence is believable. Those reasons are the ==judgment== — **s.2(9)**, the statement of the **grounds** of the decision. Then one short document is drawn up: 'Suit decreed; defendant shall pay ₹5 lakh with interest and costs.' That is the ==decree== — **s.2(2)**, the formal expression of an adjudication that **conclusively determines the rights** of the parties in the **suit**. Ravi is now the **decree-holder**; Suresh, the **judgment-debtor**.", "Now a second story. Meena and her two brothers own a farm together. In her **partition suit**, the court first declares 'each gets one-third' — a **preliminary decree**, because work remains. Later a commissioner measures the land and the court allots the actual plots — the **final decree**. Meanwhile, a cousin who had wrongly occupied part of the farm collected the harvest for three years. He must pay **mesne profits** (**s.2(12)**) — what he actually got or could have got with ordinary care — **but not** for the borewell he dug himself, because profits due to **his own improvements** are excluded.", "If Suresh had died during Ravi's case, his son who took over the shop and its debts would be brought in as his **legal representative** (**s.2(11)**) — even a person who simply **intermeddles** with the estate counts. Remember also the **two exclusions** from 'decree': an **appealable order**, and a **dismissal for default**. A plaint thrown out under O.VII r.11 is, surprisingly, a decree.", "Finally, the shape of the Code: **158 sections** hold the principles (jurisdiction, res judicata, appeals, execution) and the **First Schedule's 51 Orders** hold the practical rules. High Courts can amend the rules for their territory (**s.122**). And the spirit of the whole Code, as the Supreme Court said in *Sangram Singh*, is that procedure exists ==to help justice, not to trip people up==."]}, {"t": "timeline", "title": "How India got one civil procedure", "items": [["Before 1859", "Different Regulations for the Company's courts; the Supreme Courts in the Presidency towns followed their own Charters and English practice."], ["1859", "First uniform **Code of Civil Procedure** (Act VIII of 1859) for the mofussil courts."], ["1877 · 1882", "Revised Codes; the 1882 Code applied more widely."], ["1908", "Present **Code of Civil Procedure, 1908** (Act V of 1908), in force **1 January 1909**."], ["1976", "Major amendment — e.g. s.25 substituted (Supreme Court transfer), proviso to O.I r.9 (necessary party)."], ["1999 / 2002", "Amendments in force **1 July 2002** — s.89 ADR, time limits for written statement, affidavit with plaint (s.26(2)), new modes of service."], ["2015", "Commercial Courts Act modifies the CPC for commercial suits."]]}, {"t": "tree", "title": "Structure of the Code", "root": "CPC, 1908", "branches": [["Body — 158 sections", ["**substantive-procedural principles**: jurisdiction, res judicata, appeals, execution", "amended only by the **legislature** — Parliament, or a State Legislature for its State (Concurrent List, Entry 13)"]], ["First Schedule — 51 Orders", ["the **rules** — the day-to-day 'how'", "Orders → rules; e.g. O.VII r.11", "High Courts may **amend/add** rules [[s.122]]"]], ["Appendices A–H", ["**forms** — pleadings, process, decrees, execution, appeals"]]]}, {"t": "tiles", "title": "Principal features of the CPC", "items": [["⚖️", "Procedural, not penal", "it facilitates justice; it does not create rights"], ["🧭", "Sections + rules", "principles in sections, details in Orders"], ["🪜", "Whole journey of a suit", "institution → pleadings → trial → decree → appeal → execution"], ["🧩", "Flexibility", "inherent powers [[s.151]]; amendment of pleadings"], ["🚫", "Finality", "res judicata [[s.11]], O.II r.2 — no endless suits"], ["🕊️", "ADR built in", "[[s.89]] — settle outside court"]]}, {"t": "terms", "items": [["Decree", "the **formal expression of an adjudication** which, so far as the court is concerned, **conclusively determines the rights** of the parties on all or any matters in controversy **in the suit**. May be **preliminary** (more proceedings needed), **final** (disposes of the suit) or partly both. **Includes** rejection of a plaint and s.144 restitution decisions; **excludes** appealable orders and **dismissal for default**.", "s.2(2)", "A partition suit: the preliminary decree declares each sharer's share; the final decree divides the land by metes and bounds."], ["Judgment", "the **statement given by the judge on the grounds** of a decree or order — the reasons.", "s.2(9)", "The 20 pages of reasoning; the decree is the one-paragraph result drawn up after it."], ["Order", "the **formal expression of any decision** of a civil court **which is not a decree**.", "s.2(14)", "An order granting a temporary injunction or rejecting an adjournment."], ["Decree-holder / Judgment-debtor", "the person **in whose favour** a decree or executable order is passed / the person **against whom** it is passed.", "s.2(3) · s.2(10)", ""], ["Legal representative", "a person who **in law represents the estate of a deceased** person — includes one who **intermeddles** with the estate.", "s.2(11)", "A son who takes over his late father's shop and its debts."], ["Mesne profits", "profits a person in **wrongful possession actually received or might with ordinary diligence have received**, with interest — **but not** profits due to improvements made by that person.", "s.2(12)", "Rent a trespasser collected from a house he had no right to occupy."], ["Foreign court / foreign judgment", "a court **outside India** not established or continued by the Central Government / the **judgment of a foreign court**.", "s.2(5) · s.2(6)", "A Missouri (USA) divorce decree."]]}, {"t": "table", "title": "Decree vs order — the most-asked pair", "head": ["Point", "Decree", "Order"], "rows": [["Arises in", "only a **suit** (plaint)", "suit, application or petition"], ["Decides", "**rights** of parties conclusively", "may be procedural or interim"], ["Kinds", "preliminary, final, partly both", "appealable and non-appealable"], ["Appeal", "first appeal lies [[s.96]]; second appeal [[s.100]]", "only listed orders [[s.104]], [[O.XLIII]]"], ["Number", "usually one final decree in a suit", "many orders in one suit"]]}, {"t": "case", "name": "Sangram Singh v. Election Tribunal, Kotah", "year": "1955", "court": "Supreme Court of India", "cast": [["🧔", "Sangram Singh (respondent in an election petition)"], ["👨‍⚖️", "Election Tribunal"], ["⚖️", "Supreme Court"]], "panels": [["🧔", "Sangram Singh", "My lawyer could not appear on one hearing date. Now the tribunal says it will go on without me — for the whole case!"], ["👨‍⚖️", "Tribunal", "You were absent once. We proceed ex parte. You are shut out."], ["🧔", "Sangram Singh", "But I am here now. Can't I take part from the next hearing?"], ["⚖️", "Supreme Court", "Procedure is meant to help justice, not to trip people up. Let him in from the stage the case has reached."]], "story": ["An election petition was pending against Sangram Singh. On one date his side did not appear, and the Tribunal decided to hear the case **ex parte**. When he later asked to participate, the Tribunal took the view that once a case goes ex parte, the absent party is shut out for good.", "Justice Vivian Bose wrote the famous lines: a code of procedure is ==designed to facilitate justice and further its ends: not a penal enactment for punishment and penalties; not a thing designed to trip people up==. Proceeding ex parte on one date does not bar the defendant from appearing at a later hearing — he only cannot undo what was done in his absence unless he shows good cause."], "held": "An ex parte order does not permanently exclude the defendant; he may join the proceedings at the stage they have reached. Procedural rules must be read to **advance justice**.", "link": "This is the **philosophy of the whole CPC**: read every section and rule — summons (O.V), ex parte (O.IX), amendment (O.VI r.17) — so that a party gets a fair hearing, not so that a technical slip ends the case."}, {"t": "exam", "q": "Define decree. Distinguish between decree, judgment and order.", "lines": ["Introduction — CPC is adjective law; decisions of a civil court take three forms.", "Decree, s.2(2) — essentials: (i) adjudication, (ii) in a suit, (iii) rights of parties on matters in controversy, (iv) conclusive determination, (v) formal expression. Kinds: preliminary, final, partly both; deemed decrees (rejection of plaint, s.144). Exclusions: appealable orders, dismissal for default.", "Judgment, s.2(9) — grounds of a decree or order; contents (O.XX r.4–5).", "Order, s.2(14) — any formal decision not a decree; appealable orders s.104 and O.XLIII.", "Comparison table — arises in, decides, kinds, appeal, number.", "Case: Sangram Singh (1955) — procedure serves justice. Conclude."]}, {"t": "check", "items": [["Is dismissal of a suit for default a 'decree'?", "No. s.2(2) expressly **excludes** any order of dismissal for default. The remedy is restoration under O.IX r.9."], ["Is rejection of a plaint under O.VII r.11 a decree?", "Yes — s.2(2) says 'decree' **includes** rejection of a plaint. So a first appeal lies."], ["Who can amend the sections of the CPC, and who can amend the rules?", "Sections — only the **legislature** (Parliament; a State Legislature for its own State). Rules in the First Schedule — Parliament, and **High Courts** under s.122 for their territory."], ["Why are improvements excluded from mesne profits?", "Because the wrongful possessor should pay for what the property itself yielded, not for extra value created by his own investment — s.2(12)."]]}, {"t": "hook", "x": "**Judgment = reasons · Decree = result in a suit · Order = every other decision.** CPC = 158 sections (principles) + 51 Orders (practice)."}], "asked": [["2016", "A", "Judgment and Decree"], ["2018", "A", "Judgment and Decree."]]}, {"id": "cpc2", "title": "Suits — meaning, essentials and kinds", "sub": "What a suit is · four essentials · special kinds of suits", "blocks": [{"t": "idea", "x": "A **suit** is the civil case itself — a proceeding that **starts with a plaint**. The CPC never defines it; courts do."}, {"t": "tale", "x": ["Lakshmi's neighbour builds a wall that eats two feet into her plot. She can complain to friends, write to the newspaper, or go to the panchayat — none of these is a **suit**. The moment her lawyer **presents a plaint** in the civil court, a suit is born. The CPC never defines 'suit'; the Privy Council in *Hansraj Gupta* described it as a civil proceeding **instituted by the presentation of a plaint**, and **s.26** says every suit is instituted that way.", "Every suit, like Lakshmi's, has **four essentials** — think of them as the four legs of a table. ==Opposing parties== (Lakshmi v. the neighbour), a ==cause of action== (her ownership, the encroachment, his refusal to remove it), a ==subject-matter== (the two-foot strip) and a ==relief== (removal of the wall, an injunction, damages). Take away any one leg and the table falls.", "Some suits are special because of **who** sues or **how many** sue. If a whole colony of fifty families is affected by a blocked road, three of them may sue **for all** with the court's permission — a **representative suit** under **O.I r.8**. If Lakshmi wants to sue the **Government** about the wall built by the PWD, she must first give **two months' notice** under **s.80** — so that the Government can settle without litigation.", "If Lakshmi were too poor to pay the court fee, she could sue as an **indigent person** under **O.XXXIII**; even a company can do this (*Union Bank v. Khader International*). If she were a minor, she would sue through a **next friend** (O.XXXII). If a bank holds ₹10 lakh claimed by two rival heirs and itself claims nothing, it files an **interpleader suit** (s.88, O.XXXV) and lets the heirs fight it out. And a creditor holding a dishonoured cheque or written contract can choose a fast-track **summary suit** (O.XXXVII), where the defendant must first get **leave to defend**."]}, {"t": "terms", "items": [["Suit", "a **civil proceeding instituted by the presentation of a plaint** (Privy Council, *Hansraj Gupta v. Official Liquidators, Dehra Dun-Mussoorie Electric Tramway Co.*). Not defined in the Code.", "s.26", "A neighbour's case for removal of an encroaching wall."], ["Plaint", "the written statement of the **plaintiff's claim** — the document that starts a suit.", "O.VII", ""], ["Plaintiff / Defendant", "the person who **sues** / the person **sued**.", "", ""], ["Cause of action", "the **bundle of facts** the plaintiff must prove to get a decree.", "O.VII r.1(e)", "Ownership + encroachment + refusal to remove."]]}, {"t": "tiles", "title": "Four essentials of every suit", "items": [["👥", "Opposing parties", "at least one plaintiff and one defendant"], ["📌", "Cause of action", "facts giving the right to sue"], ["🏠", "Subject-matter", "the property, money or right in dispute"], ["🎯", "Relief", "what the plaintiff asks the court to grant"]]}, {"t": "table", "title": "Special kinds of suits — where to find them", "head": ["Kind", "What it is", "Where"], "rows": [["Representative suit", "one or more persons sue/defend **for many** with the same interest, with court's permission and public notice", "[[O.I r.8]]"], ["By or against Government", "two months' **notice** before suing the Government or a public officer", "[[s.79]]–[[s.82]] · [[s.80]]"], ["Indigent persons", "a person **unable to pay court fee** may sue without paying it first", "[[O.XXXIII]]"], ["Minors & persons of unsound mind", "sue through a **next friend**; defended by a **guardian ad litem**", "[[O.XXXII]]"], ["Interpleader suit", "a stakeholder who claims nothing asks rival claimants to fight it out among themselves", "[[s.88]] · [[O.XXXV]]"], ["Summary suit", "quick trial for debts on negotiable instruments, written contracts; defendant needs **leave to defend**", "[[O.XXXVII]]"], ["Suits by aliens / against foreign States", "aliens of friendly countries may sue; foreign State sued only with Central Government consent", "[[s.83]]–[[s.86]]"], ["Commercial suit", "commercial disputes of specified value — stricter timelines", "Commercial Courts Act 2015"]]}, {"t": "case", "name": "Union Bank of India v. Khader International Construction", "year": "2001", "court": "Supreme Court of India", "cast": [["🏗️", "Khader International (a company)"], ["🏦", "Union Bank of India"], ["⚖️", "Supreme Court"]], "panels": [["🏗️", "Company", "We have a big claim against the bank, but we cannot even pay the court fee."], ["🏦", "Bank", "O.XXXIII is for poor **persons**. A company is not a pauper!"], ["🏗️", "Company", "A company is a legal person. Why should poverty shut its door to court?"], ["⚖️", "Supreme Court", "'Person' here includes a company. Access to justice is for all."]], "story": ["Khader International, a company, wanted to sue Union Bank of India but could not pay the heavy court fee. It applied to sue as an **indigent person** under Order XXXIII. The bank objected: the rule speaks of a 'person' who is poor, which, it said, means only a human being.", "The Supreme Court read the word with the purpose of the rule in mind: the aim is that **no one is denied justice only because of poverty**. A company is a legal person and can be just as unable to pay."], "held": "The word **'person' in Order XXXIII includes a juristic person** such as a company; it may sue as an indigent person if it satisfies the conditions.", "link": "An indigent suit is still a **suit** with all four essentials — the only special thing is that court fee is postponed; if the plaintiff wins, the fee is recovered from the losing side (O.XXXIII r.10–11)."}, {"t": "exam", "q": "What is a suit? Explain its essentials and the special kinds of suits under the CPC.", "lines": ["Meaning — not defined; Hansraj Gupta; s.26 — instituted by plaint.", "Four essentials — parties, cause of action, subject-matter, relief (with an example).", "Special suits — representative (O.I r.8), Government (s.79–80), indigent (O.XXXIII), minors (O.XXXII), interpleader (s.88, O.XXXV), summary (O.XXXVII), aliens/foreign States (ss.83–86).", "Case — Union Bank v. Khader International (2001): 'person' in O.XXXIII includes a company.", "Conclude — every suit, ordinary or special, needs the four essentials."]}, {"t": "check", "items": [["Is 'suit' defined in the CPC?", "No. It is understood as a civil proceeding instituted by presentation of a plaint (Hansraj Gupta, Privy Council)."], ["Name the four essentials of a suit.", "Opposing parties, cause of action, subject-matter, relief."], ["What must be done before suing the Government?", "Serve two months' written notice under s.80 (urgent relief possible with leave of court under s.80(2))."]]}, {"t": "hook", "x": "**Suit = P-C-S-R** — Parties, Cause of action, Subject-matter, Relief. No plaint, no suit."}], "asked": [["2013", "A", "Interpleader suit"], ["2014", "A", "Representative suits"], ["2015", "A", "Indigent Suits"], ["2016", "A", "Interpleader suits"], ["2017", "C", "X is an indigent person He wants to file a suit against 'X' for recovery of Rs one lakh based on a promissory note What is the procedure that he should follow?"], ["2020", "B", "What is the procedure to be followed in suits by indigent persons?"]]}, {"id": "cpc3", "title": "Parties to a suit — joinder, misjoinder, non-joinder", "sub": "Order I · necessary and proper parties · representative suits", "blocks": [{"t": "idea", "x": "**Who** should be in the case? Order I answers it: put in everyone **needed for an effective decree**, and no one who is just a stranger to the dispute."}, {"t": "tale", "x": ["Arjun, Farida and Kiran bought a building together. A tenant stops paying rent and damages the walls. Can the three owners file **one suit** together? **O.I r.1** says yes — plaintiffs may join if their right to relief arises from the **same act or transaction** and a **common question** of law or fact arises. The same two tests, in **r.3**, decide whether several **defendants** can be sued together.", "Now suppose the owners forget to include Kiran. Is the suit dead? Usually not: **O.I r.9** says ==no suit fails for misjoinder or non-joinder== — the court will simply **add** Kiran under **r.10(2)**, at any stage, even on its own. But there is one trap. If the missing person is a **necessary party** — someone without whom **no effective decree** can be passed at all — the **proviso to r.9** (added in 1976) makes the omission **fatal** unless he is brought in.", "How do you know who is necessary? The Supreme Court in *Kasturi v. Iyyamperumal* gave two questions: (1) is there a **right to some relief** against him in respect of the controversy? (2) can an **effective decree** be passed **without** him? If both point to him, he is necessary. A **proper party** is different — his presence is not essential, but helps the court decide everything **completely**. In a partition suit, every co-owner is necessary; a tenant on the land may be a proper party.", "Kasturi's own case shows the limit. He sued only to enforce an **agreement to sell**. Strangers claiming the land by an **independent title** wanted to join. The Court said no — that would turn a simple **contract suit** into a **title suit**. The plaintiff is ==dominus litis==, master of his suit; the court adds people only when they are needed to decide **this** dispute.", "Two more rules complete the picture. When a **large group** shares the same interest, a few may sue or defend for all under **r.8**, with the court's permission and a **public notice**, and the decree binds everyone. And objections about wrong parties must be raised at the **earliest opportunity** — **r.13** — or they are treated as **waived**."]}, {"t": "terms", "items": [["Necessary party", "a person **without whom no effective decree** can be passed at all.", "O.I r.9 proviso", "In a partition suit, every co-sharer."], ["Proper party", "a person whose presence is **not essential**, but helps the court decide the matter **completely and effectively**.", "O.I r.10(2)", "A tenant of the property in a title dispute between two owners."], ["Misjoinder", "joining someone who **should not** be a party, or joining plaintiffs/defendants whose claims are not connected.", "O.I r.9", ""], ["Non-joinder", "**leaving out** someone who should have been a party.", "O.I r.9", ""], ["Dominus litis", "the plaintiff is the **master of the suit** — he chooses whom to sue (subject to the court's power to add parties).", "", ""]]}, {"t": "rule", "title": "The rules of Order I", "cite": "Order I", "points": ["**Joinder of plaintiffs** [[r.1]] — when the right to relief arises from the **same act or transaction** (or series) and a **common question** of law or fact would arise.", "**Joinder of defendants** [[r.3]] — on the same two tests.", "**Representative suit** [[r.8]] — numerous persons with the **same interest**: one or more may sue or defend for all, with the **court's permission**; notice to all by public advertisement; the **decree binds everyone** represented.", "**No suit fails** for misjoinder or non-joinder [[r.9]] …", "Court may **strike out or add** parties at any stage, on application or on its own [[r.10(2)]]; may substitute the right plaintiff where suit was filed in the wrong name by bona fide mistake [[r.10(1)]].", "Objections to misjoinder/non-joinder must be taken at the **earliest opportunity**, else deemed waived [[r.13]]."], "exceptions": ["**Proviso to r.9** (added 1976): non-joinder of a **necessary party** IS fatal — the suit will fail if that party is not brought in.", "A person cannot be added just because he has **some interest** in the outcome — he must be needed for deciding the controversy in the suit (Kasturi)."]}, {"t": "vs", "title": "Necessary vs proper party", "a": ["Necessary party", ["no effective decree without him", "non-joinder → suit fails (r.9 proviso)", "e.g. all co-owners in partition"]], "b": ["Proper party", ["presence useful, not essential", "non-joinder → not fatal", "e.g. a person in possession under the defendant"]]}, {"t": "case", "name": "Kasturi v. Iyyamperumal", "year": "2005", "court": "Supreme Court of India (three judges)", "cast": [["🧑‍🌾", "Kasturi (buyer under an agreement)"], ["👴", "The vendor & his power-of-attorney holder (defendants)"], ["🧍", "Iyyamperumal & others (third parties claiming the land)"], ["⚖️", "Supreme Court"]], "panels": [["🧑‍🌾", "Kasturi", "The owners agreed to sell me the land. I sue them for specific performance."], ["🧍", "Strangers", "Add us as defendants! We say we own the land and are in possession."], ["🧑‍🌾", "Kasturi", "My suit is only about our contract. Their title is a different fight."], ["⚖️", "Supreme Court", "A contract suit cannot become a title suit. Strangers stay out."]], "story": ["Kasturi filed a suit for **specific performance** of an agreement under which the owners had agreed to sell him land. Some outsiders applied under O.I r.10(2) to be added as defendants, saying they had an **independent title** and were in possession.", "The Supreme Court asked two questions to test a **necessary party**: (1) is there a right to some relief against him in respect of the controversy? (2) can an effective decree be passed without him? In a suit to enforce a contract, the parties to the contract (and those who later got title from the seller) are relevant — **not** strangers claiming a title of their own."], "held": "Persons claiming an **independent title** adverse to the vendor are **neither necessary nor proper** parties to a suit for specific performance. Adding them would change the nature of the suit into a title dispute.", "link": "Remember the twin test for a **necessary party** and the purpose test for a **proper party** under O.I r.10(2): the presence must be needed to decide **the questions in this suit**, not some other dispute."}, {"t": "real", "x": "Fifty flat-owners in a colony want to stop a builder from closing a common road. Instead of 50 separate suits, three owners sue **for all** under O.I r.8 with the court's permission; a public notice goes out; the decree binds every owner."}, {"t": "exam", "q": "Who are necessary and proper parties? What is the effect of misjoinder and non-joinder?", "lines": ["Introduction — Order I; plaintiff as dominus litis.", "Joinder of plaintiffs (r.1) and defendants (r.3) — same transaction + common question.", "Necessary party — two tests (Kasturi); proper party — r.10(2); table of differences.", "Effect — r.9: no suit defeated; proviso: necessary party's non-joinder fatal; r.10 power to add/strike out; r.13 early objection.", "Representative suits — r.8.", "Case — Kasturi v. Iyyamperumal (2005). Conclude."]}, {"t": "check", "items": [["Is non-joinder of a party always fatal?", "No — O.I r.9: no suit is defeated by misjoinder or non-joinder, **except** non-joinder of a **necessary party** (proviso)."], ["Two tests for a necessary party?", "(1) A right to relief against him on the matters in controversy; (2) no effective decree can be passed in his absence."], ["When must objections about parties be raised?", "At the earliest possible opportunity, ordinarily before settlement of issues — O.I r.13; otherwise waived."]]}, {"t": "hook", "x": "**Necessary = can't decide without him. Proper = better to decide with him.** Only missing a **necessary** party sinks the suit."}], "asked": [["2014", "A", "Non-Joinder and Mis Joinder of Parties"], ["2014", "A", "Representative suits"], ["2016", "A", "Parties to suit"], ["2016", "C", "'X' failed to include a necessary party, in the pleadings and what is the effect of non-joinder of a necessary party in a Civil Suit."], ["2017", "B", "Who are the parties to suit? Explain \"Necessary parties and proper parties\"."], ["2019", "C", "What is the effect of non-joining of a necessary party in a suit?"]]}, {"id": "cpc4", "title": "Frame of suit and cause of action", "sub": "Order II · the whole claim rule · splitting of claims", "blocks": [{"t": "idea", "x": "**Bring your whole claim in one suit.** If you split it or leave out a part without leave, the law will not let you come back for the rest."}, {"t": "tale", "x": ["Meena rents her shop to Prakash for ₹20,000 a month. Prakash stops paying rent for six months. Meena is angry but cautious — she files a suit only for **three months' rent**, thinking she will 'see later' about the rest. This is exactly the mistake **Order II** is designed to stop.", "**O.II r.2(1)** says the plaint must include **the whole of the claim** the plaintiff is entitled to make **on that cause of action**. Under **r.2(2)**, if Meena **omits or relinquishes** part of the claim — the other three months' rent — she ==can never sue for it later==. Under **r.2(3)**, if she was entitled to **more than one relief** on the same cause of action (an injunction and damages for the same trespass, say) and leaves one out **without the court's leave**, that relief too is lost forever. The idea is simple: ==one cause of action, one suit==. A defendant should not be dragged to court again and again on the same facts.", "So what exactly is a **cause of action**? Lord Esher's famous answer in *Read v. Brown* (1888): every fact which the plaintiff would have to prove, **if traversed**, to get judgment. It is the **bundle of facts**, not the evidence and not the law. For Meena: the lease, the rent agreed, the months it fell due, and Prakash's failure to pay.", "But the bar is strict and technical, so courts insist it be proved. In *Gurbux Singh v. Bhooralal*, Bhooralal first sued only for **mesne profits**, then later for **possession**. Gurbux Singh cried 'Order II rule 2!' — but he never produced the **earlier plaint**. The Constitution Bench held the bar was **not proved**: you cannot know whether the causes of action are the same without reading the first pleadings. In contrast, in *Virgo Industries* the buyer first sued only for an **injunction** stopping the sale to others, though it already feared the seller would not perform — specific performance was available, was omitted without leave, and the later suit was **barred**.", "Order II also lets a plaintiff **join several causes of action** against the same defendant in one suit (**r.3**). With a suit for **recovery of immovable property**, only certain claims may be joined without leave — **mesne profits, arrears of rent, and damages for breach of the contract under which the property is held** (**r.4**). And if joinder makes the trial clumsy, the court may order **separate trials** (**r.6**)."]}, {"t": "terms", "items": [["Cause of action", "every fact which it would be necessary for the plaintiff to prove, if traversed, to support his right to judgment (Lord Esher in *Read v. Brown*, 1888). It is the **bundle of facts**, not the evidence and not the law.", "O.VII r.1(e)", "For a loan suit: the loan, the promise to repay, the due date, and non-payment."], ["Relinquishment", "giving up part of a claim — if done (or omitted) in a suit, that part **cannot be sued for later**.", "O.II r.2(2)", ""], ["Leave of court", "permission to sue later for a relief omitted now.", "O.II r.2(3)", ""]]}, {"t": "rule", "title": "Order II in five rules", "cite": "Order II", "points": ["**Frame the suit** so as to give a ground for **final decision** and to **prevent further litigation** [[r.1]].", "**Whole claim** arising from the cause of action must be included [[r.2(1)]].", "Part of a claim **omitted or relinquished** → cannot be sued for afterwards [[r.2(2)]].", "A person entitled to **more than one relief** on the same cause of action who omits one **without leave** → cannot sue for it later [[r.2(3)]].", "Several **causes of action** against the same defendant may be **joined** in one suit [[r.3]]; with recovery of immovable property only some claims may be joined without leave — mesne profits, arrears of rent, damages for breach of the contract under which property is held [[r.4]]; court may order **separate trials** if joinder is inconvenient [[r.6]]."], "exceptions": ["The bar applies only where the **cause of action in both suits is the same** — different causes, different suits.", "Leave of the court under r.2(3) saves an omitted **relief**; it cannot revive a **relinquished** part of the claim.", "The defendant must **plead** the bar and **prove** identity of causes by producing the earlier **plaint** (Gurbux Singh)."]}, {"t": "flow", "title": "Is the second suit barred by O.II r.2?", "steps": [["Same cause of action?", "compare the earlier plaint with the new one"], ["Was the new claim/relief available then?", "could it have been claimed in the first suit?"], ["Was it omitted or relinquished?", "not claimed in the first suit"], ["Was leave obtained?", "for a separate relief under r.2(3)"], ["If no leave → barred", "the second suit fails"]]}, {"t": "case", "name": "Gurbux Singh v. Bhooralal", "year": "1964", "court": "Supreme Court of India (Constitution Bench)", "cast": [["🧔", "Bhooralal (plaintiff)"], ["👳", "Gurbux Singh (defendant)"], ["⚖️", "Supreme Court"]], "panels": [["🧔", "Bhooralal", "First I sued only for mesne profits from my property. Now I sue for possession of it."], ["👳", "Gurbux Singh", "Barred! You should have asked for possession the first time. Order II rule 2!"], ["⚖️", "Supreme Court", "Show us the first plaint. How do we know the causes of action are the same?"], ["👳", "Gurbux Singh", "Er… the plaint is not on the record."]], "story": ["Bhooralal first filed a suit only for **mesne profits** against Gurbux Singh for the period he was in wrongful possession. Later he filed a second suit for **possession** of the same property. Gurbux Singh pleaded the bar of O.II r.2(3): possession was a relief that should have been sought in the first suit.", "The Supreme Court explained that the plea is technical and must be strictly proved: the defendant must show (1) the second suit is on the **same cause of action** as the first, (2) the plaintiff was entitled to more than one relief on it, and (3) he omitted the relief now claimed **without leave**. Identity of cause of action can be judged only by **reading the pleadings of the earlier suit** — and the earlier plaint had not been produced."], "held": "The plea of O.II r.2 **failed** because the defendant did not prove identity of the causes of action; a plea of bar must be established by producing the earlier pleadings.", "link": "Learn the three ingredients of r.2(3) from this case — **same cause, more than one relief, omission without leave** — and that the bar is **not presumed**."}, {"t": "case", "name": "Virgo Industries (Eng.) Pvt. Ltd. v. Venturetech Solutions Pvt. Ltd.", "year": "2013", "court": "Supreme Court of India", "cast": [["🏢", "Venturetech (buyer)"], ["🏭", "Virgo (seller)"]], "panels": [["🏢", "Venturetech", "Stop Virgo from selling the property to anyone else! (suit for injunction)"], ["🏢", "Venturetech", "…and now, a new suit: enforce the sale to us (specific performance)."], ["🏭", "Virgo", "You already feared we would break the deal — you could have asked for specific performance then!"], ["⚖️", "Supreme Court", "Correct. Same cause of action, relief omitted without leave → barred."]], "story": ["Venturetech had agreements to buy properties from Virgo. Fearing that Virgo would sell to others, it first filed suits for **permanent injunction** restraining alienation. Later it filed suits for **specific performance** of the same agreements.", "Since the first suits were based on the apprehension that Virgo would not honour the agreements, the relief of specific performance was **available** then. Venturetech neither claimed it nor obtained leave."], "held": "The later suits for specific performance were **barred by O.II r.2(3)**.", "link": "O.II r.2 protects defendants from being dragged to court again and again on the **same set of facts**."}, {"t": "exam", "q": "Explain the rule against splitting of claims under Order II Rule 2 CPC.", "lines": ["Introduction — O.II r.1: frame suit to avoid further litigation.", "Cause of action — meaning (Read v. Brown).", "r.2(1) whole claim; r.2(2) omitted/relinquished part barred; r.2(3) relief omitted without leave barred.", "Conditions for the bar — same cause of action, relief available, omitted without leave; defendant must plead and prove by producing earlier plaint.", "Cases — Gurbux Singh v. Bhooralal (1964); Virgo Industries (2013).", "Joinder of causes — r.3, r.4, r.6. Conclude: rule protects defendants from multiplicity."]}, {"t": "check", "items": [["What is a cause of action?", "Every fact the plaintiff must prove, if traversed, to get a decree — the bundle of facts (Read v. Brown)."], ["Difference between r.2(2) and r.2(3)?", "r.2(2): part of a **claim** omitted/relinquished — cannot be sued later. r.2(3): one of several **reliefs** omitted without leave — cannot be sued later; leave saves it."], ["Who must prove the bar, and how?", "The defendant, by producing the pleadings of the earlier suit to show identity of cause of action (Gurbux Singh)."]]}, {"t": "hook", "x": "**One cause, one suit, whole claim.** Want to split? Take **leave** first — or lose it forever."}], "asked": [["2013", "A", "Cause of Action"], ["2014", "A", "Cause of Action"], ["2015", "A", "Cause of action"], ["2016", "C", "A plaintiff, who wants to file a suit in the lower court and whose cause of action is time barred, files a condone relay petition in the same court. Is that petition is maintainable."]]}, {"id": "cpc5", "title": "Institution of suits — plaint, return and rejection", "sub": "s.26 · Order IV · Order VII rr.10–11", "blocks": [{"t": "idea", "x": "A suit is born when a **plaint** (with an affidavit) is presented to the court. A plaint that discloses no case can be **rejected** at the threshold."}, {"t": "tale", "x": ["Kiran wants to sue a builder who took his advance and never delivered the flat. His lawyer drafts a **plaint** with the particulars listed in **O.VII r.1** — the court's name, the parties' names and addresses, the **facts constituting the cause of action and when it arose**, the facts showing the court's **jurisdiction**, the **relief**, and the **valuation** for jurisdiction and court fee. The plaint is **verified** (O.VI r.15) and, since 2002, its facts must be supported by an **affidavit** (**s.26(2)**). It is presented **in duplicate** to the court (**O.IV r.1**) — and the suit was **instituted** the moment the plaint was presented; registration in the **register of civil suits** under **O.IV r.2** only records it.", "Before summons goes to the builder, the court looks at the plaint carefully. Two things can go wrong. If Kiran filed in the **wrong court** — say he seeks delivery of a flat in Hyderabad but filed in Warangal, or the claim is beyond the court's money limit — the plaint is ==returned== under **O.VII r.10**, to be presented in the **proper court**. The case is not over; it just moves.", "But if the defect is in the plaint **itself**, the plaint is ==rejected== under **O.VII r.11**: (a) it discloses **no cause of action**; (b) the relief is **undervalued** and not corrected; (c) the **stamp** is insufficient and not made good; (d) the suit is **barred by any law** — limitation, for example; (e) it is not filed in **duplicate**; (f) the plaintiff did not comply with **r.9** (copies for service). For this test the court reads **only the plaint and its documents**, not the builder's defence.", "Two stories show why this power matters. In *T. Arivandandam* (1977), after a tenant lost eviction proceedings at every level, his son (a partner in the tenant's firm) filed suit after suit with cleverly drafted plaints just to delay eviction. Justice Krishna Iyer told trial courts to read the plaint **meaningfully, not formally**, and if clever drafting has created only an **illusion** of a cause of action, to ==nip it in the bud==. In *Dahiben* (2020), sellers sued in 2014 to cancel a 2009 sale deed, saying part of the price was unpaid. Their own plaint showed they had signed the deed and received cheques in 2009 — the suit was **time-barred**, and the plaint was rejected under **r.11(a) and (d)**, which can be done **at any stage**.", "One more point students forget: rejection of a plaint is a **deemed decree** under s.2(2), so a **first appeal** lies. And under **r.13**, rejection does **not** by itself stop the plaintiff from presenting a **fresh plaint** on the same cause of action."]}, {"t": "flow", "title": "From plaint to registered suit", "steps": [["Draft the plaint", "particulars under O.VII r.1; verification under O.VI r.15"], ["Affidavit", "facts in the plaint supported by affidavit [[s.26(2)]]"], ["Present in duplicate", "to the court or its officer [[O.IV r.1]]"], ["Scrutiny", "jurisdiction, court fee, valuation, limitation, cause of action"], ["Registered", "entered in the register of civil suits [[O.IV r.2]]; summons issued"]]}, {"t": "rule", "title": "Return vs rejection of plaint", "cite": "O.VII rr.10–11", "points": ["**Return** [[r.10]] — the court has **no jurisdiction** (territorial, pecuniary or subject-matter); the plaint is returned to be presented in the **proper court**.", "**Rejection** [[r.11]] — (a) **no cause of action** disclosed; (b) relief **undervalued** and not corrected within time; (c) **insufficient stamp** and not made good; (d) suit appears from the plaint to be **barred by any law** (e.g. limitation); (e) not filed in **duplicate**; (f) non-compliance with **r.9** (copies for service).", "Court looks **only at the plaint and documents** filed with it — not the defence.", "Rejection is a **decree** (s.2(2)) → appealable; a **fresh plaint** on the same cause of action is not barred merely by rejection [[r.13]]."], "exceptions": ["Clever drafting that creates an **illusion** of a cause of action does not save a vexatious plaint (Arivandandam).", "Rejection can be ordered **at any stage** of the suit (Dahiben, 2020)."]}, {"t": "vs", "title": "Return vs rejection", "a": ["Return (r.10)", ["wrong court", "plaint goes back to be filed in the right court", "not a decree; appealable order"]], "b": ["Rejection (r.11)", ["defect in the plaint itself", "suit ends here", "a decree — appeal lies; fresh plaint may be filed"]]}, {"t": "case", "name": "T. Arivandandam v. T.V. Satyapal", "year": "1977", "court": "Supreme Court of India (Krishna Iyer J.)", "cast": [["🏠", "Landlord's side"], ["🧑", "Occupant filing suit after suit"], ["⚖️", "Supreme Court"]], "panels": [["🧑", "Occupant", "I lost the eviction case everywhere. But here is a fresh suit with a new story!"], ["🏠", "Landlord", "This is just to stop the eviction again."], ["⚖️", "Krishna Iyer J.", "Read the plaint meaningfully, not formally. If it is vexatious — nip it in the bud."], ["⚖️", "Krishna Iyer J.", "And the lawyer who drafted it owes a duty to the court too."]], "story": ["After eviction proceedings had been fought and lost through every level, a fresh civil suit was filed with a cleverly drafted plaint, plainly to delay the eviction once more.", "Justice Krishna Iyer told trial courts: on a **meaningful — not formal — reading** of the plaint, if it is **manifestly vexatious and without merit**, use the power under O.VII r.11; ==if clever drafting has created the illusion of a cause of action, nip it in the bud at the first hearing==."], "held": "Trial courts must reject plaints that disclose no real cause of action and abuse the process of court; frivolous litigation must be stopped at the start.", "link": "This is the spirit of **O.VII r.11(a)** — 'no cause of action' means no **real** cause, not just whatever the drafting shows."}, {"t": "case", "name": "Dahiben v. Arvindbhai Kalyanji Bhanusali", "year": "2020", "court": "Supreme Court of India", "cast": [["👵", "Sellers (plaintiffs)"], ["🧑‍💼", "Buyers (defendants)"]], "panels": [["👵", "Sellers", "We sold land by a registered deed in 2009 but were not fully paid. Cancel it! (suit in 2014)"], ["🧑‍💼", "Buyers", "Your own plaint shows you knew of the sale in 2009. Time-barred!"], ["⚖️", "Supreme Court", "From the plaint itself, the suit is barred by limitation. Rejected under O.VII r.11(d)."]], "story": ["The plaintiffs sued in December 2014 to cancel a 2009 registered sale deed, alleging part of the price was unpaid. Their own plaint showed they had signed the deed and received the cheques in 2009.", "The Court said the power under O.VII r.11 can be exercised **at any stage** of the suit, by looking at the averments in the plaint and the documents with it; non-payment of part of the price does not by itself make a sale void — the remedy was to sue for the balance."], "held": "The plaint was **rejected** under O.VII r.11(a) (no real cause of action) and r.11(d) (barred by limitation).", "link": "r.11(d) — 'barred by any law' — includes the **Limitation Act**."}, {"t": "exam", "q": "Distinguish between return and rejection of plaint.", "lines": ["Introduction — institution by plaint (s.26, O.IV); particulars (O.VII r.1).", "Return — O.VII r.10: lack of jurisdiction; procedure (r.10A); appealable order.", "Rejection — O.VII r.11 grounds (a)–(f); court looks only at plaint.", "Effect — rejection is a decree (appeal); fresh plaint allowed (r.13).", "Cases — T. Arivandandam (1977); Dahiben (2020).", "Comparison table and conclusion."]}, {"t": "check", "items": [["What document must accompany the plaint since 2002?", "An **affidavit** supporting the facts — s.26(2)."], ["Lack of territorial jurisdiction — return or rejection?", "**Return** under O.VII r.10."], ["Is rejection of a plaint appealable?", "Yes — it is a deemed decree under s.2(2); and a fresh plaint is not barred by the rejection itself (O.VII r.13)."]]}, {"t": "hook", "x": "**Wrong court → return. Bad plaint → reject.** Reject for: no **c**ause, **u**ndervalued, **s**tamp short, **b**arred, **d**uplicate missing, r.**9** ignored — 'CUSB-D-9'."}], "asked": [["2013", "B", "Explain plaint and rules that are governing pleadings"], ["2014", "A", "Plaint"], ["2014", "B", "Discuss about the provisions relating to summons after institution of suits."], ["2016", "A", "Essentials of Plaint"], ["2016", "B", "What is the difference between return of the plaint and rejection of the plaint?"], ["2018", "A", "Essentials of Plaint."], ["2018", "B", "What is the difference between Return of Plaint and Rejection of Plaint?"], ["2020", "C", "'A' want to file a suit, against 'B' for recovery of Rs. 10,000/- based on a negotiable instrument. Draft a plaint accordingly."]]}, {"id": "cpc6", "title": "Bar of suits — jurisdiction of civil courts (s.9)", "sub": "Suits of a civil nature · express and implied bars", "blocks": [{"t": "idea", "x": "**Every civil dispute can go to a civil court — unless a law expressly or impliedly takes it away.** Jurisdiction is the rule; exclusion is the exception."}, {"t": "tale", "x": ["Picture the civil court as a big **public hospital**. **Section 9** is the sign at its gate: ==all suits of a civil nature are admitted — unless a law expressly or impliedly sends them elsewhere==. The patient (plaintiff) does not need special permission; the burden is on whoever says 'not here' to show the bar.", "What makes a dispute 'civil'? It must be about **private rights and obligations** — property, money, contract, status, an office. Suppose Venkat is removed as the hereditary priest of a village temple and loses the **land and offerings** attached to the post. Even though the dispute involves **religious rites**, **Explanation I** makes it civil because it is about a right to **property and an office**. **Explanation II** adds that it does not matter whether the office carries **fees** or is tied to a particular **place**. But if two groups merely argue about the correct ritual, with no property or office involved, that is **not** a civil suit.", "The *Malankara Church* case (*P.M.A. Metropolitan*, 1995) shows this on a grand scale. Two factions fought over control of churches, properties and the office of church heads. One side said 'religion — courts stay out!' The Supreme Court said the word ==shall== and the phrase 'all suits' in s.9 give civil courts jurisdiction over **every** civil dispute unless barred — and rights to office and property are civil, even if religious questions must be examined to decide them.", "Now the exceptions. An **express bar** is written in a statute: election disputes go only by **election petition** (Art. 329(b) and the Representation of the People Act); civil courts cannot interfere with **SARFAESI** action (s.34) or **RERA** matters (s.79). An **implied bar** arises when a law creates a **new right** and its **own forum** — like rights under the Industrial Disputes Act (*Premier Automobiles*, 1975).", "But even a bar has limits. In *Dhulabhai* (1968), tobacco dealers paid sales tax under a provision that discriminated against goods from outside the State — later held unconstitutional. The Act said its assessments could not be questioned in civil courts. Chief Justice Hidayatullah laid down the famous principles: a tribunal **cannot declare its own Act unconstitutional**; tax collected under an unconstitutional provision can be recovered by a **civil suit for refund**; civil courts may still step in where the authority ignored the Act's provisions or **fundamental principles of judicial procedure**; and ==exclusion of civil courts is not readily inferred==. As *Ganga Bai* (1974) puts it, every person has an **inherent right** to bring a civil suit unless a statute bars it."]}, {"t": "rule", "title": "Section 9 in plain words", "cite": "s.9", "x": "Civil courts shall have jurisdiction to try **all suits of a civil nature**, except suits whose cognizance is **expressly or impliedly barred**.", "points": ["**Civil nature** = a dispute about **private rights and obligations** — property, money, contracts, status, office.", "**Explanation I** — a suit about a right to **property or an office** is civil even if it depends on questions of **religious rites or ceremonies**.", "**Explanation II** — it does not matter whether any **fees** are attached to the office or whether it is tied to a particular **place**."], "exceptions": ["**Express bar** — a statute says so: e.g. election disputes (Art. 329(b) and the Representation of the People Act), Income-tax Act, 2025 s.526 (earlier s.293 of the 1961 Act), SARFAESI Act s.34, RERA s.79.", "**Implied bar** — a statute creates a **new right** and provides its **own special forum** (Premier Automobiles v. Wadke, 1975 — rights under the Industrial Disputes Act); or public policy.", "Even where barred, civil courts can examine cases where the authority acted **without jurisdiction**, violated **natural justice**, or the provision is **unconstitutional** (Dhulabhai)."]}, {"t": "vs", "title": "Civil or not?", "a": ["Civil nature ✔", ["right to property", "right to a religious office with its emoluments", "right to worship in a temple", "recovery of money, damages"]], "b": ["Not civil ✘", ["purely religious rites or caste questions (no property/office involved)", "mere dignity or honour", "political questions", "right to vote or contest an election (statutory — election petition only)", "matters exclusively for special tribunals"]]}, {"t": "case", "name": "Dhulabhai v. State of Madhya Pradesh", "year": "1968", "court": "Supreme Court of India (Constitution Bench, Hidayatullah C.J.)", "cast": [["🧑‍💼", "Dhulabhai & tobacco dealers"], ["🏛️", "State of M.P."], ["⚖️", "Supreme Court"]], "panels": [["🧑‍💼", "Dealers", "The sales-tax law taxed our imported tobacco unfairly. It is unconstitutional — refund our money!"], ["🏛️", "State", "The Sales Tax Act says civil courts cannot question assessments. Suit barred!"], ["⚖️", "Supreme Court", "A tax tribunal cannot declare its own Act unconstitutional. For that, the civil court remains open."], ["🧑‍💼", "Dealers", "So our refund suit can go on!"]], "story": ["Tobacco dealers in the old Madhya Bharat area paid sales tax under provisions that discriminated against goods brought from outside the State. Those provisions had been held unconstitutional. The dealers filed suits for **refund**. The State relied on a section of the Sales Tax Act which barred civil courts from questioning assessments.", "Chief Justice Hidayatullah laid down the famous **principles on exclusion of civil court jurisdiction**: (1) where a statute gives finality to the orders of special tribunals, the civil court's jurisdiction is excluded **if there is an adequate remedy** there — but civil courts can still look at cases where the provisions were not followed or fundamental principles of judicial procedure were violated; (2) where the provision itself is challenged as **unconstitutional**, the suit lies, because the tribunal cannot decide that; (3) where a tax is collected under a provision declared unconstitutional, a **suit for refund** lies; (4) exclusion of civil courts is **not to be readily inferred**."], "held": "The suits for refund were **maintainable**; the bar in the Sales Tax Act did not cover tax levied under unconstitutional provisions.", "link": "This case is the **map of s.9's exceptions** — express bar, implied bar, and when the civil court still steps in."}, {"t": "case", "name": "Most Rev. P.M.A. Metropolitan v. Moran Mar Marthoma", "year": "1995", "court": "Supreme Court of India", "cast": [["⛪", "Two factions of the Malankara Church"], ["⚖️", "Supreme Court"]], "panels": [["⛪", "Faction A", "Who is the rightful head of our church and its properties? Only the civil court can settle it."], ["⛪", "Faction B", "This is a religious matter. Civil courts cannot interfere!"], ["⚖️", "Supreme Court", "Rights to an office and property are civil — even if they turn on religious questions. Explanation I to s.9."]], "story": ["Two groups in the Malankara Orthodox Syrian Church fought over **control of churches, properties and the office** of church heads. One side argued that disputes about religion were outside the civil courts.", "The Supreme Court read s.9 widely: the words 'shall' and 'all suits of a civil nature' show that civil courts have **jurisdiction over every civil dispute** unless barred. A dispute about **an office and property** is civil, even if deciding it requires looking into religious practice."], "held": "The suits were **civil in nature** and maintainable under s.9 read with Explanation I.", "link": "**Explanation I** in action — religion is the background; **property and office** make it civil."}, {"t": "note", "x": "Quote to remember (Ganga Bai v. Vijay Kumar, 1974): ==There is an inherent right in every person to bring a suit of a civil nature, and unless the suit is barred by statute one may, at one's peril, bring a suit of one's choice.=="}, {"t": "exam", "q": "Explain the jurisdiction of civil courts under Section 9 CPC. When is it barred?", "lines": ["Introduction — s.9 text; 'shall' and 'all suits'.", "Suit of a civil nature — meaning; Explanations I and II with example.", "Express bar — examples; implied bar — Premier Automobiles.", "Dhulabhai principles — adequacy of remedy, unconstitutionality, refund, not readily inferred.", "Cases — PMA Metropolitan (1995); Ganga Bai (1974).", "Conclude — jurisdiction is the rule, exclusion the exception."]}, {"t": "check", "items": [["What does 'civil nature' mean?", "A dispute about private rights and obligations — property, money, contract, status, office — as opposed to purely religious, social, political or criminal matters."], ["Give two express bars.", "Election disputes (Art. 329(b), RP Act); s.34 SARFAESI Act; s.79 RERA; s.526 Income-tax Act, 2025 (earlier s.293 of the 1961 Act)."], ["Can a civil court entertain a suit despite a bar clause?", "Yes, where the authority acted without jurisdiction, violated natural justice, or the provision is unconstitutional (Dhulabhai)."]]}, {"t": "hook", "x": "**s.9 = 'All civil suits — unless barred.'** Bar must be **express or clearly implied** — never lightly inferred (Dhulabhai)."}], "asked": [["2013", "C", "In a suit for specific performance of sale agreement of agricultural land by 'A' to 'B', Court decides to frame incidental issue 'whether 'B' is a farmer or not'. Whether court has jurisdiction to decide such issue? Disc"], ["2019", "B", "What are various kinds of jurisdiction of civil court, under CPC."]]}, {"id": "cpc7", "title": "Res sub judice — stay of suit (s.10)", "sub": "Two suits on the same matter · stay the later one", "blocks": [{"t": "idea", "x": "If the **same matter** is already being fought in an **earlier suit**, the later suit's **trial waits**. Two courts should not race to opposite answers."}, {"t": "tale", "x": ["Rahul sues his cousin Ajay in Hyderabad, claiming a house as his by inheritance. While that suit is going on, Ajay files his own suit in another civil court in Hyderabad claiming the **same house** against Rahul on the **same title dispute**. If both courts go ahead, one may say 'Rahul owns it' and the other 'Ajay owns it' — chaos. **Section 10** prevents that race: the court of the **later suit** must ==stay the trial== until the earlier suit is decided.", "The conditions are like a checklist: (1) **two suits**, one earlier, one later; (2) the **matter in issue** in the later suit is **directly and substantially in issue** in the earlier one; (3) **same parties** or those claiming under them; (4) litigating under the **same title**; (5) the earlier suit is **pending** in a **competent** court in India (or the Supreme Court). Tick all five, and the second trial waits.", "Notice the exact words: s.10 stops the **trial**, not the **filing**. Ajay's suit can still be registered, and the court may grant **interim orders** like a temporary injunction. In *Indian Bank v. Maharashtra State Co-op. Marketing Federation* (1998), the Supreme Court explained that in a **summary suit** the 'trial' begins only after leave to defend, so the court could still decide the leave application.", "How do we test 'directly and substantially in issue'? *Aspi Jal* (2013) gives the answer. Landlords filed two eviction suits in 2004 — one for bona fide need and one for **non-user** over earlier years — and a third in 2010 for non-user during the **six months just before it**. The tenant asked to stay the third suit, and the trial court and High Court agreed. The Supreme Court set the stay aside: s.10 applies only when the **whole subject-matter** is the same, so that the decision in the first suit would operate as **res judicata** in the second. Non-use in a different period is a different fact.", "Two last points. The **Explanation** says a suit pending in a **foreign court** does not stop an Indian court. And a decree passed in breach of s.10 is **not a nullity** — s.10 is a rule of procedure. Where s.10 does not strictly apply but justice needs it, the court may still stay or consolidate suits using its **inherent power** under **s.151**."]}, {"t": "rule", "title": "Section 10 — conditions", "cite": "s.10", "points": ["**Two suits** — one instituted earlier, one later.", "The **matter in issue** in the later suit is **directly and substantially** in issue in the earlier suit.", "**Same parties**, or parties under whom they claim.", "Litigating under the **same title**.", "The earlier suit is **pending** in a court in India (or a court beyond India set up by the Central Government, or the Supreme Court) **competent** to grant the relief."], "exceptions": ["**Explanation**: a suit pending in a **foreign court** does not stop an Indian court from trying the same matter.", "s.10 stays the **trial**, not the **institution** — the later suit can be filed and interim orders can be passed.", "A decree passed in breach of s.10 is **not a nullity**.", "Where s.10 does not strictly apply, the court may still stay or **consolidate** suits under its inherent power [[s.151]]."]}, {"t": "table", "title": "Res sub judice vs res judicata", "head": ["Point", "Sub judice (s.10)", "Res judicata (s.11)"], "rows": [["Earlier matter is", "**pending**", "**decided**"], ["Bars", "**trial** of the later suit", "**trial** of the later suit/issue altogether"], ["Purpose", "avoid conflicting decisions running in parallel", "end litigation; no second trial"], ["Foreign court", "pending foreign suit — no bar", "foreign judgment may be conclusive (s.13)"]]}, {"t": "case", "name": "Aspi Jal v. Khushroo Rustom Dadyburjor", "year": "2013", "court": "Supreme Court of India", "cast": [["🏠", "Landlords (Aspi Jal & another)"], ["🧑‍💼", "Tenant (Khushroo Rustom Dadyburjor)"], ["⚖️", "Supreme Court"]], "panels": [["🏠", "Landlords", "2004: two suits — we need the flat, and he has not used it for years."], ["🏠", "Landlords", "2010: a third suit — non-use in the six months before this suit."], ["🧑‍💼", "Tenant", "Stay the third suit under s.10! Same ground — non-user."], ["⚖️", "Supreme Court", "Different period = different facts. No stay."]], "story": ["In 2004 the landlords filed two eviction suits in the Small Causes Court, Mumbai — one for **bona fide requirement** and one for **non-user** over earlier years. In 2010 they filed a third suit for non-user during the **six months immediately before it**. The tenant asked for the third suit to be stayed under s.10.", "The Supreme Court held that s.10 applies only when the **whole subject-matter in controversy** in the two suits is the same, so that the decision in the earlier suit would operate as **res judicata** in the later one. Here, non-user in different periods raised different facts; a decision in the first suit would not decide the others."], "held": "Section 10 was **not attracted**; the third suit could proceed.", "link": "The test for 'directly and substantially in issue' — **would the first decision be res judicata in the second?** If not, no s.10 stay."}, {"t": "note", "x": "Also remember **Indian Bank v. Maharashtra State Co-op. Marketing Federation (1998)**: s.10 bars the **trial**, which in a summary suit (O.XXXVII) begins only after leave to defend — so the court can still hear the leave application."}, {"t": "exam", "q": "Explain the doctrine of res sub judice. Distinguish it from res judicata.", "lines": ["Meaning — 'under judgment'; s.10 text; object: avoid conflicting decisions, multiplicity.", "Five conditions.", "Effect — trial stayed, not institution; interim orders possible; foreign suit no bar; decree not a nullity; s.151.", "Cases — Indian Bank (1998); Aspi Jal (2013).", "Comparison table — sub judice vs res judicata.", "Conclusion."]}, {"t": "check", "items": [["Does s.10 bar filing of the second suit?", "No — only its trial; the suit can be instituted and interim relief given."], ["Is a suit pending in London a bar to an Indian suit?", "No — Explanation to s.10."], ["What if the matters overlap only partly?", "s.10 does not apply; the court may still stay or consolidate under its inherent power, s.151, if justice requires (in Aspi Jal the parties were left free to ask the trial court to hear the suits together)."]]}, {"t": "hook", "x": "**Sub judice = 'still under the judge'.** Same matter, same parties, same title, earlier suit pending → **later trial waits**."}], "asked": [["2016", "B", "Narrate the distinction between doctrines of \"Sub Judice\" and \"Rest Judicata\"."], ["2018", "A", "Doctrine of Sub Judice and Resjudicata."]]}, {"id": "cpc8", "title": "Res judicata (s.11) and foreign judgments (ss.13–14)", "sub": "A matter once decided is decided forever", "blocks": [{"t": "idea", "x": "**Once a competent court has heard and finally decided a matter between the same parties, it cannot be reopened.** One fight, one finish."}, {"t": "tale", "x": ["Sunita sues her neighbour Ramesh, claiming a strip of land is hers. After a full trial, the court decides it belongs to **Ramesh**. Sunita does not appeal. Five years later she files a fresh suit claiming the same strip. Should Ramesh have to fight all over again? **Section 11** says ==no==. A matter **heard and finally decided** between the same parties by a competent court is **res judicata** — a thing already judged.", "Three old maxims stand behind this rule: no one should be **vexed twice** for the same cause; it is in the **public interest** that litigation should end; and a judicial decision must be **accepted as correct**. Together they give society **finality**.", "For the bar to apply, five things must line up: the matter is **directly and substantially in issue** in both suits; the **same parties** (or those claiming under them); the **same title**; the former court was **competent**; and the matter was **heard and finally decided**. If Sunita's first suit had been dismissed only for **default** or **withdrawn**, there was no decision on merits — so s.11 does not apply (though a fresh suit may still be barred by **O.IX r.9** or, if withdrawn without leave, **O.XXIII r.1(4)**). If the first decree was obtained by **fraud** or passed **without jurisdiction**, it does not bind either.", "The eight Explanations add depth. The most famous is **Explanation IV — constructive res judicata**. Suppose in the first suit Sunita relied only on a sale deed, though she also had a **gift deed** she could have pleaded. She cannot now file a new suit based on the gift deed: any ground that **might and ought** to have been raised is treated as raised and decided. **Explanation V** adds that a relief claimed but **not expressly granted** is deemed **refused**; **Explanation VI** makes a **representative** suit bind all interested persons — but only if the earlier case was **bona fide** (*Forward Construction*, 1986, where a petition set up by a rival builder did not bind the residents).", "The principle travels beyond suits. *Satyadhyan Ghosal* (1960) applied it between **two stages of the same case** — while allowing an unappealed **interlocutory order** to be challenged in the appeal from the final order (there, the landlords won). *Daryao* (1961) applied it to **writ petitions**: after losing an Art. 226 petition on merits in the High Court, the petitioners could not file the same case under Art. 32. But *Ghulam Sarwar* (1967) said it does **not** apply to successive **habeas corpus** petitions — liberty comes first.", "Finally, **foreign judgments**. A Tirupati couple married under Hindu law; the husband obtained a divorce in **Missouri, USA**, on 'irretrievable breakdown', without the wife's submission to that court. In *Y. Narasimha Rao* (1991), the Supreme Court refused to recognise it under **s.13**: the court was not competent, the ground was not one known to the law under which they married, and the wife was not fairly heard. A foreign judgment is conclusive **except** in the six cases of **s.13(a)–(f)**; under **s.14**, the court presumes the foreign court's competence when a certified copy is produced, unless the contrary is shown."]}, {"t": "tiles", "title": "Three Latin roots of res judicata", "items": [["🛑", "Nemo debet bis vexari pro una et eadem causa", "no one should be troubled twice for the same cause"], ["🏛️", "Interest reipublicae ut sit finis litium", "it is in the public interest that litigation should end"], ["✅", "Res judicata pro veritate accipitur", "a judicial decision must be accepted as correct"]]}, {"t": "rule", "title": "Section 11 — five conditions", "cite": "s.11", "points": ["The matter is **directly and substantially in issue** in the later suit, and was so in the **former suit**.", "Between the **same parties** or parties under whom they claim.", "Litigating under the **same title**.", "The former court was **competent** to try the later suit (or the issue — see Expl. VIII).", "The matter was **heard and finally decided** by that court."], "exceptions": ["No res judicata where the earlier decision was **without jurisdiction** (a nullity), obtained by **fraud or collusion**, or the suit was dismissed on a **technical ground** (default, withdrawal) without a decision on merits.", "A pure **question of law** decided wrongly may not bind when the **law later changes**.", "Does **not** apply to successive **habeas corpus** petitions (Ghulam Sarwar, 1967) — personal liberty comes first."]}, {"t": "table", "title": "The eight Explanations — in one line each", "head": ["Expl.", "What it says"], "rows": [["I", "'Former suit' = suit **decided earlier**, whether or not instituted earlier."], ["II", "Competence is judged **without regard to appeal** provisions."], ["III", "The matter must have been **alleged by one party and denied or admitted** by the other."], ["IV", "**Constructive res judicata** — anything that **might and ought** to have been made a ground of attack or defence is deemed to have been in issue."], ["V", "Relief claimed but **not expressly granted** is deemed **refused**."], ["VI", "**Representative suits** about a public or common private right bind all persons interested."], ["VII", "Applies to **execution** proceedings too."], ["VIII", "A decision of a court of **limited jurisdiction**, competent to decide that issue, binds even if it could not try the later suit."]]}, {"t": "vs", "title": "Res judicata vs estoppel", "a": ["Res judicata", ["a **court's decision** binds", "bars the **trial** of a suit/issue", "public policy — end of litigation", "s.11 CPC"]], "b": ["Estoppel", ["a **party's own conduct/statement** binds", "a rule of **evidence**", "equity — fairness between parties", "Bharatiya Sakshya Adhiniyam (earlier Evidence Act s.115)"]]}, {"t": "case", "name": "Satyadhyan Ghosal v. Deorajin Debi", "year": "1960", "court": "Supreme Court of India", "cast": [["👨‍👦", "The Ghosals (landlords)"], ["👵", "Deorajin Debi (tenant)"], ["⚖️", "Supreme Court"]], "panels": [["👨‍👦", "Landlords", "We got an ejectment decree back in 1949."], ["👵", "Tenant", "The new Thika Tenancy Act protects me — set the decree aside! (The High Court agrees and remands.)"], ["👵", "Tenant", "You never appealed that remand order. It is res judicata now!"], ["⚖️", "Supreme Court", "Res judicata works between stages of one case — but an unappealed interlocutory order can still be attacked in the appeal from the final order."]], "story": ["The landlords obtained an **ejectment decree in 1949**. Relying on the new **Calcutta Thika Tenancy Act**, the tenants applied under its s.28 to rescind it; the High Court, in revision, held s.28 applied and **remanded**, and the decree was rescinded. In the Supreme Court the tenants argued that the landlords, not having appealed the remand order, were **barred by res judicata**.", "The Supreme Court explained that the principle of res judicata applies not only between two suits but also **between two stages of the same litigation**: a court that has decided an issue at an earlier stage cannot re-decide it at a later stage. But an **interlocutory order** (like a remand order) that was not appealed can still be challenged in an appeal against the **final order** (compare s.105 CPC)."], "held": "Res judicata applies between stages of the same litigation, but an **interlocutory order** that was not appealed can still be challenged in an appeal from the final order; the **landlords' appeal was allowed**.", "link": "Shows that s.11 is a **principle**, not just a section: it governs suits, stages of a suit, and (by general principles) writ petitions."}, {"t": "case", "name": "Daryao v. State of U.P.", "year": "1961", "court": "Supreme Court of India (Constitution Bench)", "cast": [["🧑‍🌾", "Daryao & others (petitioners)"], ["🏛️", "Allahabad High Court"], ["⚖️", "Supreme Court"]], "panels": [["🧑‍🌾", "Petitioners", "We lost our writ petition in the High Court after a full hearing."], ["🧑‍🌾", "Petitioners", "Instead of appealing, we now file the same case under Article 32 in the Supreme Court!"], ["⚖️", "Supreme Court", "Article 32 is a fundamental right — but the High Court has already decided this on merits."], ["⚖️", "Supreme Court", "Res judicata applies to writs too."]], "story": ["The petitioners' writ petitions under **Article 226** had been heard and dismissed **on merits** by the Allahabad High Court. They then filed fresh petitions under **Article 32** before the Supreme Court on the same facts.", "The Court held that the rule of res judicata rests on **public policy**, so it applies to writ proceedings as well. A decision on merits by a High Court under Art. 226 binds the parties and bars a fresh Art. 32 petition on the same matter. It would be different if the High Court petition had been dismissed **in limine** without a speaking order, or on laches, or because an alternative remedy existed."], "held": "General principles of **res judicata apply to writ petitions**; a High Court's decision on merits bars a later Article 32 petition on the same facts.", "link": "Res judicata is broader than s.11 — the **principle** reaches beyond suits."}, {"t": "case", "name": "Forward Construction Co. v. Prabhat Mandal (Regd.), Andheri", "year": "1986", "court": "Supreme Court of India", "cast": [["🏗️", "Builders"], ["🏘️", "Residents' association (Prabhat Mandal)"], ["⚖️", "Supreme Court"]], "panels": [["🏘️", "Residents", "This plot was reserved for a bus depot. Permission for commercial buildings is illegal!"], ["🏗️", "Builders", "A ratepayer already challenged this and lost. Res judicata!"], ["⚖️", "Supreme Court", "A PIL decision binds the public — but only if the earlier case was **bona fide**."], ["⚖️", "Supreme Court", "That earlier petition was set up by a rival builder. It does not bar you. (On merits, though, the builders win.)"]], "story": ["Residents challenged permission for two commercial buildings on an Andheri (Bombay) plot reserved for a **BEST bus depot**. An earlier ratepayer's petition on the same subject had been dismissed.", "The Court held that **Explanation VI** (representative litigation about a public right binds all interested persons) applies to public interest litigation — **only if the earlier case was bona fide** — and **Explanation IV** bars grounds that **might and ought** to have been raised. Here the earlier petition had been **set up by a rival builder**, so it did not bar the residents. The builders nevertheless won **on the merits**."], "held": "Res judicata, including **constructive res judicata**, applies to public interest litigation — but only where the earlier litigation was **bona fide** (Expl. VI).", "link": "**Explanation IV + VI** in one case — and the bona fide condition for representative litigation."}, {"t": "rule", "title": "Foreign judgments — when are they conclusive?", "cite": "ss.13–14", "x": "A foreign judgment is **conclusive** on any matter it directly decides between the same parties **except** where:", "points": ["(a) it was not pronounced by a court of **competent jurisdiction**;", "(b) it was **not given on the merits**;", "(c) it is founded on an incorrect view of **international law** or refuses to recognise **Indian law** where applicable;", "(d) the proceedings were opposed to **natural justice**;", "(e) it was obtained by **fraud**;", "(f) it sustains a claim founded on a **breach of any law in force in India**.", "**s.14** — on production of a certified copy, the court **presumes** the foreign court was competent, unless the contrary is shown. Decrees of **reciprocating territories** can be executed directly [[s.44A]]."]}, {"t": "case", "name": "Y. Narasimha Rao v. Y. Venkata Lakshmi", "year": "1991", "court": "Supreme Court of India", "cast": [["🤵", "Husband (moved to the USA)"], ["👰", "Wife (stayed in India)"], ["🇺🇸", "Missouri court"], ["⚖️", "Supreme Court"]], "panels": [["🤵", "Husband", "We married in Tirupati under Hindu law. I got a divorce from a Missouri court, USA."], ["👰", "Wife", "I never went there, never agreed to that court. And he has married again!"], ["🇺🇸", "Missouri court", "Marriage irretrievably broken. Divorce granted."], ["⚖️", "Supreme Court", "Not recognised in India. Wrong court, wrong law, no submission."]], "story": ["The couple married at **Tirupati** under the Hindu Marriage Act. The husband went to the USA, claimed a short period of residence in **Missouri**, and obtained a divorce on the ground of **irretrievable breakdown** — a ground not available under the Hindu Marriage Act. The wife did not submit to that court. The husband remarried, and the wife prosecuted him for **bigamy**.", "The Supreme Court tested the decree under **s.13**: the Missouri court was not competent by Indian standards (residence was not genuine and the wife never submitted), the ground was not one recognised by the law under which the parties married, and the proceedings were not fair to the wife."], "held": "The foreign divorce decree was **not conclusive** under s.13 and could not be recognised. The Court laid down that a matrimonial decree should be recognised only if given on a ground available under the law under which the parties married, by a court where the respondent resided or voluntarily submitted.", "link": "Learn s.13's clauses through this story — **(a) jurisdiction, (b) merits, (c) Indian law, (d) natural justice**."}, {"t": "exam", "q": "Explain the doctrine of res judicata with its conditions and exceptions.", "lines": ["Meaning and maxims; object — finality.", "s.11 conditions (five) with an example.", "Explanations — especially IV (constructive), V, VI, VIII.", "Scope — between stages (Satyadhyan Ghosal), writs (Daryao), not habeas corpus (Ghulam Sarwar), PIL (Forward Construction).", "Exceptions — no jurisdiction, fraud, not on merits, change in law.", "Distinguish from sub judice and estoppel; foreign judgments s.13–14 (Y. Narasimha Rao). Conclude."]}, {"t": "check", "items": [["What is constructive res judicata?", "Explanation IV to s.11 — a matter which **might and ought** to have been raised as a ground of attack or defence in the former suit is deemed to have been directly and substantially in issue."], ["Does res judicata apply to writ petitions?", "Yes, on general principles of public policy (Daryao, 1961) — but not to habeas corpus (Ghulam Sarwar)."], ["Give two grounds on which a foreign judgment is not conclusive.", "Any two of s.13(a)–(f): no competent jurisdiction; not on merits; against natural justice; fraud; refuses Indian law; breach of Indian law."]]}, {"t": "hook", "x": "**RJ = Same matt

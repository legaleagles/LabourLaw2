rong>, धमका नहीं सकते, फोटो शेयर नहीं कर सकते, सुबह 8 से पहले/शाम 7 के बाद कॉल नहीं — RBI डिजिटल लेंडिंग दिशानिर्देश 2022। कई इंस्टेंट लोन ऐप बिना लाइसेंस हैं। जबरन वसूली के लिए डीपफेक/मॉर्फ्ड फोटो → IT अधिनियम 66E/67 — प्लेटफॉर्म <strong>24 घंटे</strong> में हटाएं।"}, "steps": {"en": ["Screenshot every threat, call log, and anything sent to your contacts.", "File at cybercrime.gov.in → cyber stalking/financial fraud.", "Report the app to RBI: sachet.rbi.org.in — unlicensed apps get shut.", "FIR: IPC 503/506 criminal intimidation; 66C/66E IT Act as applicable.", "Report the app to Google Play / App Store for policy violation."], "te": ["ప్రతి బెదిరింపు, కాల్ లాగ్ స్క్రీన్‌షాట్ తీయండి.", "cybercrime.gov.in లో దాఖలు.", "యాప్‌ను RBIకి రిపోర్ట్: sachet.rbi.org.in.", "FIR: IPC 503/506 నేరపూరిత బెదిరింపు.", "Google Play / App Storeకి యాప్ రిపోర్ట్ చేయండి."], "hi": ["हर धमकी, कॉल लॉग का स्क्रीनशॉट लें।", "cybercrime.gov.in पर दर्ज करें।", "ऐप को RBI को रिपोर्ट करें: sachet.rbi.org.in।", "FIR: IPC 503/506 आपराधिक धमकी।", "Google Play / App Store को ऐप रिपोर्ट करें।"]}, "law": {"en": "RBI Digital Lending Guidelines 2022; IPC 503, 506; IT Act 66C, 66E, 67; IT Rules 2021 — 24-hr takedown", "te": "RBI డిజిటల్ లెండింగ్ మార్గదర్శకాలు 2022; IPC 503, 506; IT Act 66C, 66E, 67; IT Rules 2021", "hi": "RBI डिजिटल लेंडिंग दिशानिर्देश 2022; IPC 503, 506; IT अधिनियम 66C, 66E, 67; IT नियम 2021"}}, {"icon": "🔒", "tagCls": "rtag-e", "title": {"en": "Your Data Rights — DPDP Act 2023 & Dark Patterns", "te": "మీ డేటా హక్కులు — DPDP చట్టం 2023 & డార్క్ ప్యాటర్న్‌లు", "hi": "आपके डेटा अधिकार — DPDP 2023 और डार्क पैटर्न"}, "meta": {"en": "Access · Correct · Erase · ₹250 crore penalties · Refunds for tricks", "te": "యాక్సెస్ · సవరణ · తొలగింపు · ₹250 కోట్ల జరిమానాలు", "hi": "एक्सेस · सुधार · मिटाना · ₹250 करोड़ जुर्माना"}, "tag": {"en": "NEW LAW", "te": "కొత్త చట్టం", "hi": "नया कानून"}, "body": {"en": "The <strong>DPDP Act 2023</strong> gives you: right to know what data is collected, right to <strong>correction and erasure</strong>, right to grievance redressal. Companies must appoint a Data Protection Officer; breaches attract penalties up to <strong>₹250 crore</strong>. Also — <strong>dark patterns</strong> (hidden charges, impossible-to-cancel subscriptions, fake urgency) are illegal under CCPA Guidelines 2023; you can claim refunds for amounts charged through such tricks.", "te": "<strong>DPDP చట్టం 2023</strong> ఇచ్చే హక్కులు: ఏ డేటా సేకరిస్తున్నారో తెలుసుకునే హక్కు, <strong>సవరణ మరియు తొలగింపు</strong> హక్కు, ఫిర్యాదు పరిష్కార హక్కు. కంపెనీలు Data Protection Officer నియమించాలి; ఉల్లంఘనలకు <strong>₹250 కోట్ల వరకు</strong> జరిమానా. అలాగే — <strong>డార్క్ ప్యాటర్న్‌లు</strong> (దాచిన ఛార్జీలు, రద్దు చేయలేని సబ్‌స్క్రిప్షన్‌లు) CCPA మార్గదర్శకాలు 2023 కింద చట్టవిరుద్ధం; రీఫండ్ క్లెయిమ్ చేయవచ్చు.", "hi": "<strong>DPDP अधिनियम 2023</strong> के अधिकार: कौन सा डेटा एकत्र हो रहा है जानने का अधिकार, <strong>सुधार और मिटाने</strong> का अधिकार, शिकायत निवारण। कंपनियों को Data Protection Officer रखना होगा; उल्लंघन पर <strong>₹250 करोड़ तक</strong> जुर्माना। साथ ही — <strong>डार्क पैटर्न</strong> (छिपे शुल्क, रद्द न होने वाली सदस्यता) CCPA दिशानिर्देश 2023 में अवैध; रिफंड का दावा कर सकते हैं।"}, "steps": {"en": ["Write to the company's DPO: \"Under DPDP Act 2023 I request access to / correction / erasure of my personal data.\"", "No response → Data Protection Board complaint (when notified); meanwhile consumer complaint works.", "Dark pattern charged you? Screenshot the deceptive UI with date.", "File at consumerhelpline.gov.in → \"Dark Patterns\"; initiate bank chargeback for unauthorised recurring charges.", "Aadhaar-specific misuse → uidai.gov.in / 1947."], "te": ["కంపెనీ DPOకి రాయండి: \"DPDP చట్టం 2023 కింద నా డేటా యాక్సెస్/సవరణ/తొలగింపు కోరుతున్నాను.\"", "స్పందన లేదు → వినియోగదారు ఫిర్యాదు.", "డార్క్ ప్యాటర్న్ వసూలు చేసిందా? మోసపూరిత UI స్క్రీన్‌షాట్ తీయండి.", "consumerhelpline.gov.in లో దాఖలు; బ్యాంక్ ఛార్జ్‌బ్యాక్ ప్రారంభించండి.", "ఆధార్ దుర్వినియోగం → uidai.gov.in / 1947."], "hi": ["कंपनी के DPO को लिखें: \"DPDP 2023 के तहत डेटा एक्सेस/सुधार/मिटाने की मांग करता हूं।\"", "जवाब नहीं → उपभोक्ता शिकायत।", "डार्क पैटर्न से वसूली? भ्रामक UI का स्क्रीनशॉट लें।", "consumerhelpline.gov.in पर दर्ज करें; बैंक चार्जबैक शुरू करें।", "आधार दुरुपयोग → uidai.gov.in / 1947।"]}, "law": {"en": "DPDP Act 2023, Sections 11-14; CCPA Dark Patterns Guidelines 2023; CPA 2019; IT Act Section 43A", "te": "DPDP చట్టం 2023, Sections 11-14; CCPA డార్క్ ప్యాటర్న్ మార్గదర్శకాలు 2023; CPA 2019", "hi": "DPDP अधिनियम 2023, धारा 11-14; CCPA डार्क पैटर्न दिशानिर्देश 2023; CPA 2019"}}];
const HLS=[{"name": {"en": "Cyber Crime Helpline", "te": "సైబర్ క్రైమ్ హెల్ప్‌లైన్", "hi": "साइबर क्राइम हेल्पलाइन"}, "sub": "24/7", "url": "tel:1930", "num": "1930"}, {"name": {"en": "Cyber Crime Portal", "te": "సైబర్ క్రైమ్ పోర్టల్", "hi": "साइबर क्राइम पोर्टल"}, "sub": "cybercrime.gov.in", "url": "https://cybercrime.gov.in", "num": ""}, {"name": {"en": "RBI Sachet — Loan Apps", "te": "RBI Sachet — లోన్ యాప్‌లు", "hi": "RBI Sachet — लोन ऐप"}, "sub": "sachet.rbi.org.in", "url": "https://sachet.rbi.org.in", "num": ""}, {"name": {"en": "NCW Cyber Cell (Women)", "te": "NCW సైబర్ సెల్ (మహిళలు)", "hi": "NCW साइबर सेल (महिला)"}, "sub": "ncwapps.nic.in", "url": "https://ncwapps.nic.in", "num": ""}];
let L='en';
function setLang(l,b){L=l;document.querySelectorAll('.nav-lang').forEach(x=>x.classList.remove('active'));
 if(b)b.classList.add('active');render();}
function render(){
 const U=UI[L];
 ['navBrand','navBack','heroEye','heroTitle','heroSub','calcHd'].forEach(id=>{
  const el=document.getElementById(id);if(el&&U[id])el.textContent=U[id];});
 document.getElementById('shareBtn').textContent=U.share;
 document.getElementById('secList').innerHTML=SECS.map((s,i)=>{
  const steps=s.steps[L].map((st,j)=>`<div class="step-row"><div class="step-n">${j+1}</div><div class="step-text">${st}</div></div>`).join('');
  return `<div class="sec-card">
   <div class="sec-header" onclick="toggle(${i})">
    <div class="sec-icon">${s.icon}</div>
    <div class="sec-hdr-body"><div class="sec-title">${s.title[L]}</div><div class="sec-meta">${s.meta[L]}</div></div>
    <div class="sec-chev${i===0?' open':''}" id="chev${i}">▼</div>
   </div>
   <div class="sec-body${i===0?' open':''}" id="body${i}">
    <span class="rtag ${s.tagCls||'rtag-e'}">${s.tag[L]}</span>
    <div class="item-body">${s.body[L]}</div>
    <div class="steps-box"><div class="steps-title">${U.steps}</div>${steps}</div>
    <div class="law-box"><strong>${U.law}</strong> ${s.law[L]}</div>
   </div></div>`;}).join('');
 document.getElementById('hlList').innerHTML=HLS.map(h=>{
  const btn=h.url.startsWith('http')?`<a class="hl-call" href="${h.url}" target="_blank">Open →</a>`:`<a class="hl-call" href="${h.url}">${h.num}</a>`;
  return `<div class="hl-row"><div><div class="hl-name">${h.name[L]}</div><div class="hl-sub">${h.sub}</div></div>${btn}</div>`;}).join('');
}
function toggle(i){document.getElementById('body'+i).classList.toggle('open');
 document.getElementById('chev'+i).classList.toggle('open');}
function shareMsg(){window.open('https://wa.me/?text='+encodeURIComponent(UI[L].shareMsg),'_blank');}
document.addEventListener('DOMContentLoaded',render);
</script>
<script>
/* Language persistence — remembers choice across all pages */
document.addEventListener('DOMContentLoaded',function(){
 try{
  var langs=['en','te','hi'];
  var btns=document.querySelectorAll('.nav-lang');
  btns.forEach(function(b,i){
   b.addEventListener('click',function(){try{localStorage.setItem('lsLang',langs[i]);}catch(e){}});
  });
  var s=localStorage.getItem('lsLang');
  if(s&&typeof setLang==='function'){
   var i=langs.indexOf(s);
   if(i>0&&btns[i])setLang(s,btns[i]);
  }
 }catch(e){}
});
</script>
